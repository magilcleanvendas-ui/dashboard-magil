<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Comercial Magil Clean</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
:root{--p:#1a237e;--a:#00bcd4;--bg:#f0f2f5;--m:#6c757d;--r:12px;--s:0 2px 12px rgba(0,0,0,.08);--sbw:240px}
body{background:var(--bg);color:#1a1a2e}
#ls{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a237e,#00bcd4)}
.lc{background:#fff;padding:40px 32px;border-radius:16px;box-shadow:0 12px 48px rgba(0,0,0,.25);width:420px;max-width:92%}
.lc h1{color:var(--p);font-size:1.5rem;text-align:center;margin-bottom:4px}
.lc p{text-align:center;color:var(--m);font-size:.85rem;margin-bottom:24px}
.lc select,.lc input{width:100%;padding:14px;margin-bottom:14px;border:2px solid #e0e0e0;border-radius:10px;font-size:1rem;outline:none;background:#fff}
.lc select:focus,.lc input:focus{border-color:var(--a)}
.lc button{width:100%;padding:14px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:1.05rem;font-weight:600;cursor:pointer}
.lc button:hover{background:#0d1452}
.lc .hint{text-align:center;font-size:.72rem;color:var(--m);margin-top:10px;padding:8px;background:#f8f9fa;border-radius:8px}
#app{display:none}
#hd{background:var(--p);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
#hd h2{font-size:1.2rem}
#hd .hr{display:flex;align-items:center;gap:12px}
.badge{background:var(--a);padding:4px 14px;border-radius:20px;font-size:.78rem;font-weight:600;text-transform:uppercase}
.badge.mg{background:#ffd54f;color:var(--p)}
.bl{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.82rem}
#main{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:var(--sbw);background:#fff;border-right:1px solid #e8e8e8;padding:16px 0;overflow-y:auto;position:sticky;top:56px;height:calc(100vh - 56px);flex-shrink:0}
.sidebar .nav-item{padding:12px 20px;cursor:pointer;font-size:.88rem;color:var(--m);border-left:3px solid transparent;font-weight:500;transition:.2s;display:flex;align-items:center;gap:10px}
.sidebar .nav-item.act{color:var(--p);border-left-color:var(--a);font-weight:600;background:#f0f7ff}
.sidebar .nav-item:hover{color:var(--p);background:#f8f9fa}
.sidebar .nav-ico{font-size:1.1rem;width:20px;text-align:center}
.sidebar .nav-sep{height:1px;background:#e8e8e8;margin:8px 16px}
.sidebar .nav-title{padding:8px 20px;font-size:.72rem;color:var(--m);text-transform:uppercase;font-weight:600}
.content{flex:1;padding:24px;overflow-x:auto}
.tc{display:none}.tc.act{display:block}
.card{background:#fff;border-radius:var(--r);padding:24px;box-shadow:var(--s);margin-bottom:20px}
.card h3{color:var(--p);font-size:1.1rem;margin-bottom:16px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.sc{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--s);border-left:4px solid var(--a)}
.sc .lb{font-size:.78rem;color:var(--m);margin-bottom:6px;text-transform:uppercase}
.sc .vl{font-size:1.7rem;font-weight:700;color:var(--p)}
.sc .sb{font-size:.72rem;color:var(--m);margin-top:4px}
.sc.w{border-left-color:#ffb300}.sc.d{border-left-color:#e53935}.sc.s{border-left-color:#43a047}
.pw{margin-bottom:14px}
.pw .pl{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:5px}
.pw .pl span:first-child{color:var(--m)}.pw .pl span:last-child{font-weight:600}
.pb{height:20px;background:#e8e8e8;border-radius:10px;overflow:hidden}
.pf{height:100%;border-radius:10px;transition:width .8s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:.72rem;color:#fff;font-weight:600;min-width:30px}
.pf.lo{background:linear-gradient(90deg,#e53935,#ef5350)}.pf.mi{background:linear-gradient(90deg,#ff8f00,#ffb300)}.pf.hi{background:linear-gradient(90deg,#2e7d32,#43a047)}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.vc{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--s)}
.vc .vh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #f0f0f0}
.vc .vn{font-weight:600;color:var(--p)}
.vlv{font-size:.68rem;padding:3px 10px;border-radius:12px;color:#fff;font-weight:600;text-transform:uppercase}
.vlv.junior{background:#78909c}.vlv.pleno{background:var(--a)}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.fg label{display:block;font-size:.78rem;color:var(--m);margin-bottom:5px;font-weight:500}
.fg input,.fg select,.fg textarea{width:100%;padding:11px;border:2px solid #e0e0e0;border-radius:8px;font-size:.9rem;outline:none;background:#fff}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--a)}
.btn{padding:12px 24px;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:#0d1452}
.btn-a{background:var(--a);color:#fff}.btn-a:hover{background:#00838f}
.btn-d{background:#e53935;color:#fff}.btn-d:hover{background:#c62828}
.btn-f{width:100%;justify-content:center}
.btn-s{padding:8px 16px;font-size:.82rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{background:var(--p);color:#fff;padding:12px;text-align:left;font-weight:600;font-size:.8rem}
td{padding:10px 12px;border-bottom:1px solid #f0f0f0}
tr:hover{background:#f8f9fa}
.tcr{text-align:right}.tcc{text-align:center}
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.tm{padding:14px 20px;border-radius:8px;color:#fff;font-size:.88rem;box-shadow:0 4px 24px rgba(0,0,0,.12);display:flex;align-items:center;gap:10px;max-width:360px}
.tm.success{background:#2e7d32}.tm.error{background:#c62828}.tm.info{background:var(--p)}
.cr{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border:2px solid #43a047;border-radius:12px;padding:24px;margin-top:16px;text-align:center}
.cr .am{font-size:2.2rem;font-weight:700;color:#2e7d32;margin:8px 0}
.cr .dt{font-size:.85rem;color:#555}
.cc{position:relative;height:300px;margin-top:16px}
.cc2{position:relative;height:400px;margin-top:16px}
.pc{display:flex;align-items:center;justify-content:space-between;padding:16px;background:#fff;border-radius:10px;box-shadow:var(--s);margin-bottom:12px;gap:8px;flex-wrap:wrap}
.pc .pi{display:flex;align-items:center;gap:12px}
.pe{display:grid;grid-template-columns:1fr 80px 120px 40px;gap:8px;align-items:center;padding:10px;background:#f8f9fa;border-radius:8px;margin-bottom:8px}
.pe select,.pe input{padding:8px;border:1px solid #ddd;border-radius:6px;font-size:.85rem;width:100%}
.pe .rb{background:#e53935;color:#fff;border:none;border-radius:6px;cursor:pointer;padding:8px;font-size:1rem}
.st{background:var(--p);color:#fff;padding:16px;border-radius:10px;text-align:center;font-size:1.1rem;font-weight:600;margin-top:12px}
.es{text-align:center;padding:40px;color:var(--m)}.es .ic{font-size:2.5rem;margin-bottom:12px;opacity:.3}
.st2{font-size:1.3rem;color:var(--p);margin-bottom:20px;font-weight:700}
.dv{height:1px;background:#e0e0e0;margin:20px 0}
.del-btn{background:#e53935;color:#fff;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:.78rem;font-weight:600}
.del-btn:hover{background:#c62828}
.edit-btn{background:var(--a);color:#fff;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:.78rem;font-weight:600}
.edit-btn:hover{background:#00838f}
.transfer-btn{background:#ff8f00;color:#fff;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:.78rem;font-weight:600}
.transfer-btn:hover{background:#ef6c00}
.inp-sm{padding:8px;border:1px solid #ddd;border-radius:6px;font-size:.85rem}
.filtros{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:flex-end}
.filtros .fg{min-width:160px}
.pct-bar{height:8px;background:#e8e8e8;border-radius:4px;overflow:hidden;margin-top:4px}
.pct-fill{height:100%;border-radius:4px;background:var(--a)}
.search-box{display:flex;gap:10px;margin-bottom:16px;align-items:center}
.search-box input{padding:10px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:.9rem;flex:1;max-width:300px;outline:none}
.search-box input:focus{border-color:var(--a)}
.accordion{border:1px solid #e0e0e0;border-radius:8px;margin-bottom:8px;overflow:hidden}
.accordion-hd{padding:12px 16px;background:#f0f7ff;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--p);font-size:.9rem}
.accordion-hd:hover{background:#e3f2fd}
.accordion-bd{display:none;padding:16px;background:#fff}
.accordion-bd.open{display:block}
.accordion-ico{transition:transform .2s}
.accordion-ico.open{transform:rotate(90deg)}
.action-btns{display:flex;gap:6px;flex-wrap:wrap}
.mp-row{display:grid;grid-template-columns:1fr 100px 40px;gap:8px;align-items:center;padding:8px;background:#f8f9fa;border-radius:8px;margin-bottom:8px}
.mp-row select,.mp-row input{padding:8px;border:1px solid #ddd;border-radius:6px;font-size:.85rem;width:100%}
.mp-row .rb{background:#e53935;color:#fff;border:none;border-radius:6px;cursor:pointer;padding:8px}
.export-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.owner-tag{display:inline-block;background:#e3f2fd;color:var(--p);padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:600;margin-left:6px}
@media(max-width:768px){.sidebar{display:none}.content{padding:16px}.sg{grid-template-columns:repeat(2,1fr)}.vg{grid-template-columns:1fr}.fr{grid-template-columns:1fr}.pe{grid-template-columns:1fr;gap:6px}.pc{flex-direction:column;gap:10px;align-items:stretch}.filtros{flex-direction:column}}
@media print{.sidebar{display:none}.content{padding:0}.card{box-shadow:none;border:1px solid #ddd}.export-row{display:none}.bl{display:none}}
</style>
</head>
<body>
<div id="ls"><div class="lc">
<h1>Dashboard Comercial</h1><p>Magil Clean</p>
<select id="lu"><option value="">Selecione...</option>
<option value="gerente">Mariane (Gerente)</option>
<option value="v1">Vendedor 1</option><option value="v2">Vendedor 2</option>

</div></div>

</div>
<div id="toast"></div>
<script>
var API_URL='https://script.google.com/macros/s/AKfycbywvatUVVPja7YyQKh1hchzy9DHT7Ay1SiPYvfjnqUS8DgtekcQpW7AwYIn5IUhnjZk/exec';
var USU=[{id:'gerente',nome:'Mariane',nivel:'Gerente',isM:true},{id:'v1',nome:'Vendedor 1',nivel:'Junior',isM:false},{id:'v2',nome:'Vendedor 2',nivel:'Junior',isM:false},{id:'v3',nome:'Vendedor 3',nivel:'Junior',isM:false},{id:'v4',nome:'Vendedor 4',nivel:'Pleno',isM:false},{id:'v5',nome:'Vendedor 5',nivel:'Pleno',isM:false},{id:'v6',nome:'Vendedor 6',nivel:'Junior',isM:false},{id:'v7',nome:'Vendedor 7',nivel:'Pleno',isM:false},{id:'v8',nome:'Vendedor 8',nivel:'Junior',isM:false},{id:'v9',nome:'Vendedor 9',nivel:'Pleno',isM:false},{id:'v10',nome:'Vendedor 10',nivel:'Junior',isM:false}];
var PROD=[{cod:'27',nome:'Ultra Limpador Autoclean 12x1,15L',un:'Caixa',linha:'Auto Clean',preco:322.80},{cod:'30',nome:'Ultra Limpador Autoclean 4x5L',un:'Caixa',linha:'Auto Clean',preco:331.60},{cod:'28',nome:'Ultra Limpador Autoclean 20L',un:'Bombona',linha:'Auto Clean',preco:289.90},{cod:'29',nome:'Ultra Limpador Autoclean 50L',un:'Bombona',linha:'Auto Clean',preco:684.90},{cod:'44',nome:'Ultra Limpador Autoclean 200L',un:'Bombona',linha:'Auto Clean',preco:2990.00},{cod:'15',nome:'Foam Gloss Lava Auto 12x1L',un:'Caixa',linha:'Auto Clean',preco:358.80},{cod:'16',nome:'Foam Gloss Lava Auto 6x3L',un:'Caixa',linha:'Auto Clean',preco:473.40},{cod:'79',nome:'Foam Gloss Lava Auto 4x5L',un:'Caixa',linha:'Auto Clean',preco:439.60},{cod:'77',nome:'Foam Gloss Lava Auto 20L',un:'Bombona',linha:'Auto Clean',preco:414.90},{cod:'59',nome:'Foam Gloss Lava Auto 50L',un:'Bombona',linha:'Auto Clean',preco:960.90},{cod:'80',nome:'Black Berry Pneu Pretinho 12x500ml',un:'Caixa',linha:'Auto Clean',preco:466.80},{cod:'8',nome:'Clean-CAP Desincrustante Acido 20L',un:'Bombona',linha:'Snow Clean',preco:74.90},{cod:'9',nome:'Clean-CAP Desincrustante Acido 50L',un:'Bombona',linha:'Snow Clean',preco:161.90},{cod:'10',nome:'Clean-CAP Desincrustante Acido 4x5L',un:'Caixa',linha:'Snow Clean',preco:127.60},{cod:'11',nome:'Clean-DEX Desengraxante Alcalino 20L',un:'Bombona',linha:'Snow Clean',preco:69.90},{cod:'12',nome:'Clean-DEX Desengraxante Alcalino 50L',un:'Bombona',linha:'Snow Clean',preco:153.90},{cod:'13',nome:'Clean-DEX Desengraxante Alcalino 4x5L',un:'Caixa',linha:'Snow Clean',preco:119.60},{cod:'18',nome:'Lava Auto Cremoso 20L',un:'Bombona',linha:'Snow Clean',preco:88.90},{cod:'19',nome:'Lava Auto Cremoso 50L',un:'Bombona',linha:'Snow Clean',preco:197.90},{cod:'20',nome:'Lava Auto Cremoso 4x5L',un:'Caixa',linha:'Snow Clean',preco:135.60},{cod:'21',nome:'Pasta Desengraxante 8x2,5kg',un:'Caixa',linha:'Snow Clean',preco:319.20},{cod:'23',nome:'Pneu Pretinho Semi Gel 20L',un:'Bombona',linha:'Snow Clean',preco:145.90},{cod:'24',nome:'Pneu Pretinho Semi Gel 50L',un:'Bombona',linha:'Snow Clean',preco:309.90},{cod:'25',nome:'Pneu Pretinho Semi Gel 4x5L',un:'Caixa',linha:'Snow Clean',preco:203.60},{cod:'35',nome:'Super Clean-CAP 4x5L',un:'Caixa',linha:'Snow Clean',preco:459.60},{cod:'36',nome:'Super Clean-CAP 20L',un:'Bombona',linha:'Snow Clean',preco:428.90},{cod:'37',nome:'Super Clean-CAP 50L',un:'Bombona',linha:'Snow Clean',preco:1033.90},{cod:'39',nome:'Super Clean-DEX 4x5L',un:'Caixa',linha:'Snow Clean',preco:315.60},{cod:'40',nome:'Super Clean-DEX 20L',un:'Bombona',linha:'Snow Clean',preco:282.90},{cod:'41',nome:'Super Clean-DEX 50L',un:'Bombona',linha:'Snow Clean',preco:662.00}];
var MARCAS=[{nome:'Ultra Autoclean',cods:['27','30','28','29','44']},{nome:'Foam Gloss',cods:['15','16','79','77','59']},{nome:'Black Berry',cods:['80']},{nome:'Clean-CAP',cods:['8','9','10']},{nome:'Clean-DEX',cods:['11','12','13']},{nome:'Lava Auto Cremoso',cods:['18','19','20']},{nome:'Pasta Desengraxante',cods:['21']},{nome:'Pneu Pretinho',cods:['23','24','25']},{nome:'Super Clean-CAP',cods:['35','36','37']},{nome:'Super Clean-DEX',cods:['39','40','41']}];
var COM={'Junior':[{min:0,max:50000,taxa:0.20},{min:50001,max:100000,taxa:0.25},{min:100001,max:150000,taxa:0.30},{min:150001,max:999999999,taxa:0.35}],'Pleno':[{min:0,max:200000,taxa:0.40},{min:200001,max:300000,taxa:0.45},{min:300001,max:400000,taxa:0.50},{min:400001,max:500000,taxa:0.56},{min:500001,max:999999999,taxa:0.70}]};
var MESES=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var SEGMENTOS=['E-commerce','Lojista','Agro','Auto Pecas','Loja de Tintas','Distribuidor','Industria','Outros'];
var CORES=['#00bcd4','#1a237e','#43a047','#ff8f00','#e53935','#78909c','#7b1fa2','#00838f','#c62828','#fbc02d','#5e35b1','#00897b','#6d4c41','#455a64','#ad1457','#283593','#2e7d32','#ef6c00','#c62828','#1565c0','#795548','#00695c','#827717','#bf360c','#37474f','#004d40','#26418f'];
var UFS=['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
var currentUser=null;var charts={};var editingMetaIdx=-1;
var cacheDados={};var cacheExpira={};var CACHE_TEMPO=30000;
function loadData(k){if(cacheDados[k]&&Date.now()-cacheExpira[k]<CACHE_TEMPO){return cacheDados[k]}var local=JSON.parse(localStorage.getItem('mc_'+k)||'[]');sincronizar(k);return local}
function sincronizar(k){fetch(API_URL+'?action=read&sheet='+k).then(function(r){return r.json()}).then(function(data){if(Array.isArray(data)){cacheDados[k]=data;cacheExpira[k]=Date.now();localStorage.setItem('mc_'+k,JSON.stringify(data));var active=document.querySelector('.tc.act');if(active)renderTab(active.id.replace('tc-',''))}}).catch(function(){})}
function saveData(k,d){localStorage.setItem('mc_'+k,JSON.stringify(d));if(k==='vendas'||k==='clientes'||k==='metas'||k==='atividades'){var ultimo=d[d.length-1];if(ultimo){fetch(API_URL+'?action=write&sheet='+k+'&data='+encodeURIComponent(JSON.stringify(ultimo))).then(function(r){return r.json()}).then(function(res){if(res.success){toast('Sincronizado com a nuvem!','success');sincronizar(k)}}).catch(function(){toast('Salvo local. Sincronizara online.','info')})}}}
function loadSenhas(){var s=JSON.parse(localStorage.getItem('mc_senhas')||'{}');USU.forEach(function(u){if(!s[u.id])s[u.id]='magil2026'});return s}
function saveSenhas(s){localStorage.setItem('mc_senhas',JSON.stringify(s))}
function loadNiveis(){var n=JSON.parse(localStorage.getItem('mc_niveis')||'{}');USU.forEach(function(u){if(n[u.id])u.nivel=n[u.id]});return n}
function saveNiveis(n){localStorage.setItem('mc_niveis',JSON.stringify(n))}
function loadNomes(){var n=JSON.parse(localStorage.getItem('mc_nomes')||'{}');USU.forEach(function(u){if(n[u.id])u.nome=n[u.id]});return n}
function saveNomes(n){localStorage.setItem('mc_nomes',JSON.stringify(n))}
function loadNovosVend(){return JSON.parse(localStorage.getItem('mc_novosVend')||'[]')}
function saveNovosVend(v){localStorage.setItem('mc_novosVend',JSON.stringify(v))}
function getNivel(id){var n=loadNiveis();var u=USU.find(function(x){return x.id===id});return n[id]||(u?u.nivel:'Junior')}
function getNome(id){var n=loadNomes();var u=USU.find(function(x){return x.id===id});return n[id]||(u?u.nome:id)}
function getVendedores(){var base=USU.filter(function(u){return !u.isM});var novos=loadNovosVend();return base.concat(novos)}
function fmtBRL(v){return parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function getMesNum(data){if(!data)return -1;return parseInt(data.split('-')[1])-1}
function getClienteByCod(cod){var clientes=loadData('clientes');var codStr=String(cod).trim();return clientes.find(function(c){return String(c.cod).trim()===codStr})}
function getEstadoFromVenda(v){if(v.estado&&v.estado!=='--')return v.estado;var m=v.cliente.match(/\/([A-Z]{2})\)/);if(m)return m[1];return '--'}
function getSegmentoFromVenda(v){if(v.segmento&&v.segmento!=='Outros')return v.segmento;var m=v.cliente.match(/COD\s+(\S+)/);if(m){var c=getClienteByCod(m[1]);if(c)return c.segmento||'Outros'}return 'Outros'}
function getMarcaByCod(cod){for(var i=0;i<MARCAS.length;i++){if(MARCAS[i].cods.indexOf(String(cod))>=0)return MARCAS[i].nome}return null}
function getMeusClientes(){var clientes=loadData('clientes');if(currentUser.isM)return clientes;return clientes.filter(function(c){return c.vendedorId===currentUser.id})}
function toast(msg,type){var t=document.createElement('div');t.className='tm '+(type||'info');t.textContent=(type==='success'?'OK: ':type==='error'?'ERRO: ':'INFO: ')+msg;document.getElementById('toast').appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(100%)';setTimeout(function(){t.remove()},300)},3500)}
function progressBar(label,atual,meta,pct){var cls=pct>=80?'hi':pct>=50?'mi':'lo';var fa=parseFloat(atual||0);var fm=parseFloat(meta||0);var da=fa>100?'R$ '+fmtBRL(fa):fa;var dm=fm>100?'R$ '+fmtBRL(fm):fm;return '<div class="pw"><div class="pl"><span>'+label+'</span><span>'+da+' / '+dm+' ('+Math.round(pct)+'%)</span></div><div class="pb"><div class="pf '+cls+'" style="width:'+Math.max(2,Math.min(100,pct))+'%">'+Math.round(pct)+'%</div></div></div>'}
function exportChartPNG(canvasId,filename){var c=document.getElementById(canvasId);if(!c){toast('Grafico nao encontrado','error');return}var url=c.toDataURL('image/png');var a=document.createElement('a');a.href=url;a.download=filename+'.png';a.click();toast('Imagem PNG exportada!','success')}
function exportPDF(){window.print();toast('Use Ctrl+P para salvar como PDF','info')}
function updateLoginNomes(){var sel=document.getElementById('lu');if(!sel)return;sel.innerHTML='<option value="">Selecione...</option>';USU.forEach(function(u){var nm=getNome(u.id);var opt=document.createElement('option');opt.value=u.id;opt.textContent=u.isM?nm+' (Gerente)':nm;sel.appendChild(opt)})}
function doLogin(){var sel=document.getElementById('lu').value;var pwd=document.getElementById('lp').value;if(!sel){toast('Selecione um perfil','error');return}if(!pwd){toast('Digite a senha','error');return}loadNiveis();loadNomes();var senhas=loadSenhas();if(senhas[sel]!==pwd){toast('Senha incorreta!','error');return}var user=USU.find(function(u){return u.id===sel});if(!user){var nv=loadNovosVend().find(function(u){return u.id===sel});if(!nv){toast('Perfil nao encontrado','error');return}user=nv}currentUser=user;localStorage.setItem('mc_user',JSON.stringify(user));document.getElementById('ls').style.display='none';document.getElementById('app').style.display='block';var b=document.getElementById('ub');b.textContent=getNome(user.id)+' - '+getNivel(user.id);b.className='badge'+(user.isM?' mg':'');initSidebar();toast('Bem-vindo, '+getNome(user.id)+'!','success')}
function doLogout(){currentUser=null;localStorage.removeItem('mc_user');location.reload()}
function initSidebar(){var sb=document.getElementById('sb');var mc=document.getElementById('mc');sb.innerHTML='';mc.innerHTML='';var items;if(currentUser.isM){items=[{sep:'GESTAO'},{id:'overview',label:'Visao Geral',ico:'📊'},{id:'metas',label:'Definir Metas',ico:'🎯'},{sep:'CADASTROS'},{id:'vendedores',label:'Gerenciar Vendedores',ico:'👥'},{id:'clientes',label:'Clientes',ico:'🏢'},{id:'vendas',label:'Vendas',ico:'💰'},{sep:'ANALISE'},{id:'vendvend',label:'Vend. por Vendedor',ico:'📈'},{id:'vendestado',label:'Vend. por Estado',ico:'🗺'},{id:'vendseg',label:'Vend. por Segmento',ico:'📦'},{id:'cruzamentos',label:'Cruzamentos',ico:'🔍'},{sep:'RELATORIOS'},{id:'relatividades',label:'Rel. Atividades',ico:'📋'},{id:'relatorios',label:'Relatorios Gerais',ico:'📑'},{sep:'CONFIG'},{id:'comissao',label:'Comissao',ico:'🧮'},{id:'catalogo',label:'Catalogo',ico:'📚'}]}else{items=[{id:'minhas',label:'Minhas Metas',ico:'🎯'},{id:'venda',label:'Registrar Venda',ico:'💰'},{id:'atividades',label:'Atividades',ico:'📋'},{id:'comissao',label:'Comissao',ico:'🧮'},{id:'meuscli',label:'Meus Clientes',ico:'🏢'}]}
var firstId='';items.forEach(function(it){if(it.sep){var title=document.createElement('div');title.className='nav-title';title.textContent=it.sep;sb.appendChild(title);return}if(!firstId)firstId=it.id;var el=document.createElement('div');el.className='nav-item'+(it.id===firstId?' act':'');el.innerHTML='<span class="nav-ico">'+(it.ico||'')+'</span> '+it.label;el.onclick=function(){document.querySelectorAll('.nav-item').forEach(function(x){x.classList.remove('act')});document.querySelectorAll('.tc').forEach(function(x){x.classList.remove('act')});el.classList.add('act');document.getElementById('tc-'+it.id).classList.add('act');renderTab(it.id)};sb.appendChild(el);var tc=document.createElement('div');tc.className='tc'+(it.id===firstId?' act':'');tc.id='tc-'+it.id;mc.appendChild(tc)});
if(firstId)renderTab(firstId)}
function renderTab(id){var c=document.getElementById('tc-'+id);if(!c)return;if(id==='overview'){c.innerHTML=renderOverview();setTimeout(initOverviewChart,50)}else if(id==='metas'){c.innerHTML=renderMetas()}else if(id==='vendedores'){c.innerHTML=renderVendedores()}else if(id==='clientes'){c.innerHTML=renderClientes(true)}else if(id==='meuscli'){c.innerHTML=renderClientes(false)}else if(id==='vendas'){c.innerHTML=renderVendasGer()}else if(id==='relatividades'){c.innerHTML=renderRelAtividades()}else if(id==='vendvend'){c.innerHTML=renderVendVendedor();setTimeout(initVendVendedorChart,50)}else if(id==='vendestado'){c.innerHTML=renderVendEstado();setTimeout(initVendEstadoChart,50)}else if(id==='vendseg'){c.innerHTML=renderVendSegmento();setTimeout(initVendSegmentoChart,50)}else if(id==='cruzamentos'){c.innerHTML=renderCruzamentos();setTimeout(initCruzamentos,50)}else if(id==='comissao'){c.innerHTML=renderComissao(currentUser.isM);setTimeout(function(){renderCompContent(currentUser.id)},50)}else if(id==='catalogo'){c.innerHTML=renderCatalogo()}else if(id==='relatorios'){c.innerHTML=renderRelatorios()}else if(id==='minhas'){c.innerHTML=renderMinhas()}else if(id==='venda'){c.innerHTML=renderVenda()}else if(id==='atividades'){c.innerHTML=renderAtividades()}}
function renderOverview(){var vendas=loadData('vendas');var metas=loadData('metas');var atividades=loadData('atividades');var vAtivos=getVendedores();var tV=0,tL=0,tP=0,tPr=0;var cards=vAtivos.map(function(v){var vV=vendas.filter(function(x){return x.vendedor===v.id});var vA=atividades.filter(function(x){return x.vendedor===v.id});var vM=metas.filter(function(x){return x.vendedor===v.id});var vTotV=vV.reduce(function(s,x){return s+(parseFloat(x.total)||0)},0);var vL=vA.filter(function(x){return x.tipo==='ligacao'}).reduce(function(s,x){return s+(parseInt(x.qtd)||0)},0);var vP=vA.filter(function(x){return x.tipo==='prospeccao'}).reduce(function(s,x){return s+(parseInt(x.qtd)||0)},0);var vPr=vV.reduce(function(s,x){return s+(parseInt(x.qtdProdutos)||0)},0);tV+=vTotV;tL+=vL;tP+=vP;tPr+=vPr;var m=vM[vM.length-1]||{};var pV=m.valorVenda?Math.min(100,(vTotV/m.valorVenda)*100):0;var pL=m.ligacoes?Math.min(100,(vL/m.ligacoes)*100):0;var pP=m.prospeccao?Math.min(100,(vP/m.prospeccao)*100):0;var pPr=m.produtos?Math.min(100,(vPr/m.produtos)*100):0;var nv=getNivel(v.id);return '<div class="vc"><div class="vh"><span class="vn">'+getNome(v.id)+'</span><span class="vlv '+nv.toLowerCase()+'">'+nv+'</span></div>'+progressBar('Vendas (R$)',vTotV,m.valorVenda||0,pV)+progressBar('Ligacoes',vL,m.ligacoes||0,pL)+progressBar('Prospeccao',vP,m.prospeccao||0,pP)+progressBar('Produtos',vPr,m.produtos||0,pPr)+'</div>'}).join('');return '<h2 class="st2">Visao Geral</h2><div class="sg"><div class="sc '+(tV>0?'s':'')+'"><div class="lb">Faturamento</div><div class="vl">R$ '+fmtBRL(tV)+'</div><div class="sb">'+vendas.length+' vendas</div></div><div class="sc"><div class="lb">Ligacoes</div><div class="vl">'+tL+'</div></div><div class="sc"><div class="lb">Prospeccao</div><div class="vl">'+tP+'</div></div><div class="sc"><div class="lb">Produtos</div><div class="vl">'+tPr+'</div></div></div><div class="card"><h3>Performance</h3><div class="cc"><canvas id="chOv"></canvas></div></div><div class="vg">'+cards+'</div>'}
function initOverviewChart(){var vendas=loadData('vendas');var ctx=document.getElementById('chOv');if(!ctx)return;var vAtivos=getVendedores();if(charts.ov)charts.ov.destroy();charts.ov=new Chart(ctx,{type:'bar',data:{labels:vAtivos.map(function(v){return getNome(v.id)}),datasets:[{label:'Vendas',data:vAtivos.map(function(v){return vendas.filter(function(x){return x.vendedor===v.id}).reduce(function(s,x){return s+(parseFloat(x.total)||0)},0)}),backgroundColor:'#00bcd4',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})}
function renderMetas(){var metas=loadData('metas');var vAtivos=getVendedores();var opts=vAtivos.map(function(v){return '<option value="'+v.id+'">'+getNome(v.id)+' ('+getNivel(v.id)+')</option>'}).join('');var mesOpts=MESES.map(function(m,i){return '<option value="'+m+'"'+(i===7?' selected':'')+'>'+m+'</option>'}).join('');var marcaOpts=MARCAS.map(function(m){return '<option value="'+m.nome+'">'+m.nome+'</option>'}).join('');var btnLabel=editingMetaIdx>=0?'Atualizar Meta':'Salvar Meta';var list=metas.length?'<div class="card"><h3>Metas Cadastradas</h3><table><thead><tr><th>Vendedor</th><th>Ano</th><th>Mes</th><th>Sem</th><th>Lig</th><th>Pros</th><th>Prod</th><th>Marcas</th><th>Valor</th><th>Acoes</th></tr></thead><tbody>'+metas.map(function(m,i){var detStr=(m.marcasDetalhe&&m.marcasDetalhe.length)?m.marcasDetalhe.map(function(d){return d.qtd+'x '+d.nome}).join(', '):'--';return '<tr><td>'+getNome(m.vendedor)+'</td><td>'+m.ano+'</td><td>'+m.mes+'</td><td class="tcc">'+m.semana+'</td><td class="tcc">'+m.ligacoes+'</td><td class="tcc">'+m.prospeccao+'</td><td class="tcc">'+m.produtos+'</td><td style="font-size:.78rem">'+detStr+'</td><td class="tcr">R$ '+fmtBRL(m.valorVenda)+'</td><td><div class="action-btns"><button class="edit-btn" onclick="editMeta('+i+')">Editar</button><button class="del-btn" onclick="delMeta('+i+')">Excluir</button></div></td></tr>'}).join('')+'</tbody></table></div>':'<div class="card"><div class="es"><div class="ic">LISTA</div><p>Nenhuma meta.</p></div></div>';var formHtml='<div class="card"><h3>'+(editingMetaIdx>=0?'Editar Meta':'Definir Meta')+'</h3><div class="fr"><div class="fg"><label>Vendedor</label><select id="m-vend">'+opts+'</select></div><div class="fg"><label>Ano</label><select id="m-ano"><option>2025</option><option selected>2026</option><option>2027</option></select></div><div class="fg"><label>Mes</label><select id="m-mes">'+mesOpts+'</select></div><div class="fg"><label>Semana</label><select id="m-sem"><option value="1">Semana 1</option><option value="2">Semana 2</option><option value="3">Semana 3</option><option value="4">Semana 4</option></select></div></div><div class="fr"><div class="fg"><label>Ligacoes</label><input type="number" id="m-lig" value="50"></div><div class="fg"><label>Prospeccao</label><input type="number" id="m-pros" value="10"></div><div class="fg"><label>Produtos (Total)</label><input type="number" id="m-prod" value="30" oninput="somaProdMeta()"></div><div class="fg"><label>Valor (R$)</label><input type="number" id="m-val" value="50000"></div></div><div class="dv"></div><h3>Marcas Discriminadas</h3><p style="font-size:.82rem;color:var(--m);margin-bottom:10px">Defina as marcas. A soma deve bater com o total acima.</p><div id="m-prods-list"></div><button class="btn btn-a btn-s" onclick="addMetaMarca()">+ Adicionar Marca</button><div class="st" style="margin-top:10px">Soma: <span id="m-prod-soma">0</span> / <span id="m-prod-total">30</span></div><div class="dv"></div><button class="btn btn-p" onclick="saveMeta()">'+btnLabel+'</button>'+(editingMetaIdx>=0?' <button class="btn btn-d" onclick="cancelEditMeta()">Cancelar</button>':'')+'</div>';if(editingMetaIdx>=0){var mm=metas[editingMetaIdx];formHtml+='<script>document.getElementById("m-vend").value="'+mm.vendedor+'";document.getElementById("m-ano").value="'+mm.ano+'";document.getElementById("m-mes").value="'+mm.mes+'";document.getElementById("m-sem").value="'+mm.semana+'";document.getElementById("m-lig").value='+mm.ligacoes+';document.getElementById("m-pros").value='+mm.prospeccao+';document.getElementById("m-prod").value='+mm.produtos+';document.getElementById("m-val").value='+mm.valorVenda+';<\/script>';if(mm.marcasDetalhe&&mm.marcasDetalhe.length){formHtml+='<script>var md='+JSON.stringify(mm.marcasDetalhe)+';md.forEach(function(d){addMetaMarcaPre(d.nome,d.qtd)});somaProdMeta();<\/script>'}}return '<h2 class="st2">Definir Metas</h2>'+formHtml+list}
function addMetaMarca(){var div=document.createElement('div');div.className='mp-row';var marcaOpts=MARCAS.map(function(m){return '<option value="'+m.nome+'">'+m.nome+'</option>'}).join('');div.innerHTML='<select class="mp-prod" onchange="somaProdMeta()">'+marcaOpts+'</select><input type="number" class="mp-qtd" placeholder="Qtd" oninput="somaProdMeta()" min="1" value="1"><button class="rb" onclick="this.parentElement.remove();somaProdMeta()">x</button>';document.getElementById('m-prods-list').appendChild(div);somaProdMeta()}
function addMetaMarcaPre(nome,qtd){var div=document.createElement('div');div.className='mp-row';var marcaOpts=MARCAS.map(function(m){return '<option value="'+m.nome+'"'+(m.nome===nome?' selected':'')+'>'+m.nome+'</option>'}).join('');div.innerHTML='<select class="mp-prod" onchange="somaProdMeta()">'+marcaOpts+'</select><input type="number" class="mp-qtd" placeholder="Qtd" oninput="somaProdMeta()" min="1" value="'+qtd+'"><button class="rb" onclick="this.parentElement.remove();somaProdMeta()">x</button>';document.getElementById('m-prods-list').appendChild(div);somaProdMeta()}
function somaProdMeta(){var soma=0;document.querySelectorAll('.mp-row').forEach(function(row){var q=parseInt(row.querySelector('.mp-qtd').value)||0;soma+=q});var total=parseInt(document.getElementById('m-prod').value)||0;var te=document.getElementById('m-prod-total');if(te)te.textContent=total;var se=document.getElementById('m-prod-soma');if(se)se.textContent=soma}
function saveMeta(){var m={vendedor:document.getElementById('m-vend').value,ano:document.getElementById('m-ano').value,mes:document.getElementById('m-mes').value,semana:document.getElementById('m-sem').value,ligacoes:parseInt(document.getElementById('m-lig').value)||0,prospeccao:parseInt(document.getElementById('m-pros').value)||0,produtos:parseInt(document.getElementById('m-prod').value)||0,valorVenda:parseFloat(document.getElementById('m-val').value)||0,marcasDetalhe:[]};document.querySelectorAll('.mp-row').forEach(function(row){var n=row.querySelector('.mp-prod').value;var q=parseInt(row.querySelector('.mp-qtd').value)||0;if(n&&q)m.marcasDetalhe.push({nome:n,qtd:q})});var metas=loadData('metas');if(editingMetaIdx>=0){metas[editingMetaIdx]=m;toast('Meta atualizada!','success')}else{metas.push(m);toast('Meta salva para '+getNome(m.vendedor),'success')}saveData('metas',metas);editingMetaIdx=-1;renderTab('metas')}
function editMeta(i){editingMetaIdx=i;renderTab('metas')}
function cancelEditMeta(){editingMetaIdx=-1;renderTab('metas')}
function delMeta(i){if(!confirm('Excluir esta meta?'))return;var metas=loadData('metas');metas.splice(i,1);saveData('metas',metas);toast('Meta excluida','success');renderTab('metas')}
function renderVendedores(){var vAtivos=getVendedores();var niveis=loadNiveis();var nomes=loadNomes();var senhas=loadSenhas();var cards=vAtivos.map(function(v){var nv=niveis[v.id]||v.nivel;var nm=nomes[v.id]||v.nome;var sn=senhas[v.id]||'magil2026';return '<div class="pc"><div class="pi"><input type="text" id="nm-'+v.id+'" value="'+nm+'" class="inp-sm" style="width:160px"><span class="vlv '+nv.toLowerCase()+'">'+nv+'</span></div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><input type="text" id="sn-'+v.id+'" value="'+sn+'" class="inp-sm" style="width:110px"><button class="btn btn-a btn-s" onclick="saveSenha(\''+v.id+'\')">Senha</button><button class="btn btn-p btn-s" onclick="saveNome(\''+v.id+'\')">Nome</button><button class="btn btn-s" style="background:'+(nv==='Junior'?'#00838f':'#78909c')+';color:#fff" onclick="toggleNivel(\''+v.id+'\')">'+(nv==='Junior'?'-> Pleno':'-> Junior')+'</button></div></div>'}).join('');var addForm='<div class="card"><h3>Adicionar Novo Vendedor</h3><div class="fr"><div class="fg"><label>Nome</label><input type="text" id="nv-nome" placeholder="Ex: Joao"></div><div class="fg"><label>Nivel</label><select id="nv-nivel"><option value="Junior">Junior</option><option value="Pleno">Pleno</option></select></div><div class="fg"><label>Senha</label><input type="text" id="nv-senha" value="magil2026"></div></div><button class="btn btn-a" onclick="addVendedor()">+ Adicionar</button></div>';return '<h2 class="st2">Gerenciar Vendedores</h2><div class="card"><h3>Renomear, Promover e Senhas</h3>'+cards+'</div>'+addForm}
function saveSenha(id){var val=document.getElementById('sn-'+id).value;if(!val){toast('Digite uma senha','error');return}var s=loadSenhas();s[id]=val;saveSenhas(s);toast('Senha atualizada: '+getNome(id),'success')}
function saveNome(id){var val=document.getElementById('nm-'+id).value;if(!val){toast('Digite um nome','error');return}var n=loadNomes();n[id]=val;saveNomes(n);var u=USU.find(function(x){return x.id===id});if(u)u.nome=val;updateLoginNomes();toast('Nome: '+val,'success')}
function toggleNivel(id){var n=loadNiveis();var u=USU.find(function(x){return x.id===id});if(!u)return;var atual=n[id]||u.nivel;n[id]=atual==='Junior'?'Pleno':'Junior';saveNiveis(n);u.nivel=n[id];toast('Nivel: '+getNome(id)+' -> '+n[id],'success');renderTab('vendedores')}
function addVendedor(){var nome=document.getElementById('nv-nome').value.trim();var nivel=document.getElementById('nv-nivel').value;var senha=document.getElementById('nv-senha').value;if(!nome){toast('Digite o nome','error');return}var novos=loadNovosVend();var id='v'+Date.now();novos.push({id:id,nome:nome,nivel:nivel,isM:false});saveNovosVend(novos);USU.push({id:id,nome:nome,nivel:nivel,isM:false});var s=loadSenhas();s[id]=senha;saveSenhas(s);updateLoginNomes();toast('Vendedor: '+nome,'success');renderTab('vendedores')}function renderClientes(canDelete){var clientes=loadData('clientes');var vAtivos=getVendedores();var segOpts=SEGMENTOS.map(function(s){return '<option value="'+s+'">'+s+'</option>'}).join('');var ufOpts=UFS.map(function(u){return '<option value="'+u+'">'+u+'</option>'}).join('');var vendOpts=vAtivos.map(function(v){return '<option value="'+v.id+'">'+getNome(v.id)+'</option>'}).join('');var searchBox='<div class="search-box"><input type="text" id="cli-search" placeholder="Buscar por codigo..." oninput="filtrarClientes()"><button class="btn btn-s btn-p" onclick="filtrarClientes()">Buscar</button></div>';var list=clientes.length?'<div class="card"><h3>Clientes ('+clientes.length+')</h3>'+searchBox+'<table id="cli-table"><thead><tr><th>Codigo</th><th>Razao</th><th>Cidade</th><th>UF</th><th>Segmento</th><th>Responsavel</th>'+(canDelete?'<th>Acoes</th>':'')+'</tr></thead><tbody>'+clientes.map(function(c,i){var dono=c.vendedorId?getNome(c.vendedorId):'--';return '<tr data-cod="'+c.cod+'"><td><strong>COD '+c.cod+'</strong></td><td>'+c.razao+'</td><td>'+c.cidade+'</td><td class="tcc">'+c.estado+'</td><td class="tcc">'+(c.segmento||'--')+'</td><td class="tcc"><span class="owner-tag">'+dono+'</span></td>'+(canDelete?'<td><div class="action-btns"><button class="edit-btn" onclick="editCliente('+i+')">Editar</button><button class="transfer-btn" onclick="transferCliente('+i+')">Transferir</button><button class="del-btn" onclick="delCliente('+i+')">Excluir</button></div></td>':'')+'</tr>'}).join('')+'</tbody></table></div>':'<div class="card"><div class="es"><div class="ic">CLI</div><p>Nenhum cliente.</p></div></div>';var donoField=currentUser.isM?'<div class="fg"><label>Responsavel (Vendedor)</label><select id="c-vend"><option value="">Sem dono</option>'+vendOpts+'</select></div>':'';return '<h2 class="st2">Clientes</h2><div class="card"><h3>Cadastrar Cliente</h3><div class="fr"><div class="fg"><label>Codigo</label><input type="text" id="c-cod" placeholder="Ex: 4652"></div><div class="fg"><label>Razao Social</label><input type="text" id="c-raz" placeholder="Ex: CARLOS"></div><div class="fg"><label>Cidade</label><input type="text" id="c-cid" placeholder="Ex: CURITIBA"></div><div class="fg"><label>UF</label><select id="c-est">'+ufOpts+'</select></div><div class="fg"><label>Segmento</label><select id="c-seg">'+segOpts+'</select></div>'+donoField+'</div><button class="btn btn-p" onclick="saveCliente()">Cadastrar</button></div>'+list}
function filtrarClientes(){var q=document.getElementById('cli-search').value.toLowerCase().trim();document.querySelectorAll('#cli-table tbody tr').forEach(function(r){var cod=r.getAttribute('data-cod').toLowerCase();r.style.display=(!q||cod.indexOf(q)>=0)?'':'none'})}
function saveCliente(){var cod=document.getElementById('c-cod').value.trim();var c={cod:cod,razao:document.getElementById('c-raz').value.trim(),cidade:document.getElementById('c-cid').value.trim(),estado:document.getElementById('c-est').value,segmento:document.getElementById('c-seg').value,vendedorId:currentUser.isM?(document.getElementById('c-vend')?document.getElementById('c-vend').value:''):currentUser.id};if(!c.cod||!c.razao){toast('Preencha codigo e razao','error');return}var clientes=loadData('clientes');if(clientes.find(function(x){return String(x.cod).trim()===String(c.cod).trim()})){toast('Codigo '+c.cod+' ja existe!','error');return}clientes.push(c);saveData('clientes',clientes);toast('Cliente COD '+c.cod+' cadastrado!','success');if(currentUser.isM){renderTab('clientes')}else{renderTab('meuscli')}}

function renderCruzamentos(){var vendas=loadData('vendas');var vAtivos=getVendedores();if(!vendas.length)return '<h2 class="st2">Cruzamentos</h2><div class="card"><div class="es"><div class="ic">FILTRO</div><p>Nenhuma venda.</p></div></div>';var vendOpts='<option value="">Todos</option>'+vAtivos.map(function(v){return '<option value="'+v.id+'">'+getNome(v.id)+'</option>'}).join('');var estados=[];vendas.forEach(function(v){var uf=getEstadoFromVenda(v);if(estados.indexOf(uf)<0)estados.push(uf)});estados.sort();var estOpts='<option value="">Todos</option>'+estados.map(function(e){return '<option value="'+e+'">'+e+'</option>'}).join('');var segOpts='<option value="">Todos</option>'+SEGMENTOS.map(function(s){return '<option value="'+s+'">'+s+'</option>'}).join('');var mesOpts='<option value="">Todos</option>'+MESES.map(function(m,i){return '<option value="'+i+'">'+m+'</option>'}).join('');return '<h2 class="st2">Cruzamentos</h2><div class="card"><h3>Filtros</h3><div class="filtros"><div class="fg"><label>Vendedor</label><select id="cr-vend">'+vendOpts+'</select></div><div class="fg"><label>Estado</label><select id="cr-est">'+estOpts+'</select></div><div class="fg"><label>Segmento</label><select id="cr-seg">'+segOpts+'</select></div><div class="fg"><label>Mes</label><select id="cr-mes">'+mesOpts+'</select></div><div class="fg"><button class="btn btn-p" onclick="filtrarCruzamentos()">Aplicar</button></div></div></div><div id="cr-result"></div>'}
function initCruzamentos(){filtrarCruzamentos()}
function filtrarCruzamentos(){var vendas=loadData('vendas');var fV=document.getElementById('cr-vend').value;var fE=document.getElementById('cr-est').value;var fS=document.getElementById('cr-seg').value;var fM=document.getElementById('cr-mes').value;var ff=vendas.filter(function(v){if(fV&&v.vendedor!==fV)return false;if(fE&&getEstadoFromVenda(v)!==fE)return false;if(fS&&getSegmentoFromVenda(v)!==fS)return false;if(fM!==''&&getMesNum(v.data)!==parseInt(fM))return false;return true});var tg=ff.reduce(function(s,x){return s+(parseFloat(x.total)||0)},0);var h='<div class="card"><h3>Resultado ('+ff.length+' vendas)</h3><div class="sg"><div class="sc s"><div class="lb">Faturamento</div><div class="vl">R$ '+fmtBRL(tg)+'</div></div><div class="sc"><div class="lb">Vendas</div><div class="vl">'+ff.length+'</div></div><div class="sc"><div class="lb">Produtos</div><div class="vl">'+ff.reduce(function(s,x){return s+(parseInt(x.qtdProdutos)||0)},0)+'</div></div></div>';if(ff.length){h+='<div class="cc2"><canvas id="chCR"></canvas></div><table><thead><tr><th>Data</th><th>Vendedor</th><th>Cliente</th><th>UF</th><th>Seg</th><th class="tcc">Qtd</th><th class="tcr">Total</th></tr></thead><tbody>'+ff.map(function(v){return '<tr><td>'+v.data+'</td><td>'+getNome(v.vendedor)+'</td><td>'+v.cliente+'</td><td class="tcc">'+getEstadoFromVenda(v)+'</td><td class="tcc">'+getSegmentoFromVenda(v)+'</td><td class="tcc">'+v.qtdProdutos+'</td><td class="tcr">R$ '+fmtBRL(v.total)+'</td></tr>'}).join('')+'</tbody></table>'}else{h+='<div class="es"><p>Nenhum resultado.</p></div>'}h+='</div>';var el=document.getElementById('cr-result');if(el)el.innerHTML=h;if(ff.length&&document.getElementById('chCR')){var ctx=document.getElementById('chCR');var p={};ff.forEach(function(v){var n=getNome(v.vendedor);if(!p[n])p[n]=0;p[n]+=parseFloat(v.total)||0});var lb=Object.keys(p);var dt=lb.map(function(k){return p[k]});if(charts.cr)charts.cr.destroy();charts.cr=new Chart(ctx,{type:'bar',data:{labels:lb,datasets:[{label:'Faturamento',data:dt,backgroundColor:CORES,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})}}
function renderCatalogo(){var ac=PROD.filter(function(p){return p.linha==='Auto Clean'});var sc=PROD.filter(function(p){return p.linha==='Snow Clean'});function tbl(p){return '<table><thead><tr><th>COD</th><th>Produto</th><th>Un</th><th class="tcr">Preco</th></tr></thead><tbody>'+p.map(function(x){return '<tr><td><strong>'+x.cod+'</strong></td><td>'+x.nome+'</td><td class="tcc">'+x.un+'</td><td class="tcr">R$ '+fmtBRL(x.preco)+'</td></tr>'}).join('')+'</tbody></table>'}return '<h2 class="st2">Catalogo</h2><div class="card"><h3>Auto Clean ('+ac.length+')</h3>'+tbl(ac)+'</div><div class="card"><h3>Snow Clean ('+sc.length+')</h3>'+tbl(sc)+'</div>'}
function renderRelatorios(){var vendas=loadData('vendas');var atividades=loadData('atividades');var vAtivos=getVendedores();var rows=vAtivos.map(function(v){var vV=vendas.filter(function(x){return x.vendedor===v.id});var tot=vV.reduce(function(s,x){return s+(parseFloat(x.total)||0)},0);var qtd=vV.reduce(function(s,x){return s+(parseInt(x.qtdProdutos)||0)},0);var vL=atividades.filter(function(x){return x.vendedor===v.id&&x.tipo==='ligacao'}).reduce(function(s,x){return s+(parseInt(x.qtd)||0)},0);var vP=atividades.filter(function(x){return x.vendedor===v.id&&x.tipo==='prospeccao'}).reduce(function(s,x){return s+(parseInt(x.qtd)||0)},0);return '<tr><td>'+getNome(v.id)+'</td><td class="tcc">'+getNivel(v.id)+'</td><td class="tcc">'+vL+'</td><td class="tcc">'+vP+'</td><td class="tcc">'+vV.length+'</td><td class="tcc">'+qtd+'</td><td class="tcr">R$ '+fmtBRL(tot)+'</td></tr>'}).join('');var tg=vendas.reduce(function(s,x){return s+(parseFloat(x.total)||0)},0);var tL=atividades.filter(function(a){return a.tipo==='ligacao'}).reduce(function(s,x){return s+(parseInt(x.qtd)||0)},0);var tP=atividades.filter(function(a){return a.tipo==='prospeccao'}).reduce(function(s,x){return s+(parseInt(x.qtd)||0)},0);return '<h2 class="st2">Relatorios</h2><div class="card"><h3>Resumo Geral</h3><table><thead><tr><th>Vendedor</th><th class="tcc">Nivel</th><th class="tcc">Lig</th><th class="tcc">Pros</th><th class="tcc">Vendas</th><th class="tcc">Prod</th><th class="tcr">Total</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr style="font-weight:700;background:#e8eaf6"><td colspan="2">TOTAL</td><td class="tcc">'+tL+'</td><td class="tcc">'+tP+'</td><td class="tcc">'+vendas.length+'</td><td></td><td class="tcr">R$ '+fmtBRL(tg)+'</td></tr></tfoot></table></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-p" onclick="exportCSV()">Exportar Vendas CSV</button><button class="btn btn-a" onclick="exportAtivCSV()">Exportar Atividades CSV</button><button class="btn btn-d" onclick="exportPDF()">Exportar PDF</button></div>'}
function exportCSV(){var vendas=loadData('vendas');var csv='Vendedor;Cliente;Data;Total;QtdProdutos;Estado;Segmento\n';vendas.forEach(function(v){csv+=getNome(v.vendedor)+';'+v.cliente+';'+v.data+';'+v.total+';'+(v.qtdProdutos||0)+';'+getEstadoFromVenda(v)+';'+getSegmentoFromVenda(v)+'\n'});var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='vendas.csv';a.click();toast('Exportado!','success')}
function renderMinhas(){var metas=loadData('metas').filter(function(m){return m.vendedor===currentUser.id});var vendas=loadData('vendas').filter(function(v){return v.vendedor===currentUser.id});var atividades=loadData('atividades').filter(function(a){return a.vendedor===currentUser.id});if(!metas.length)return '<h2 class="st2">Minhas Metas</h2><div class="card"><div class="es"><div class="ic">METAS</div><p>A gerente ainda nao definiu suas metas.</p></div></div>';var m=metas[metas.length-1];var tV=vendas.reduce(function(s,x){return s+(parseFloat(x.total)||0)},0);var tL=atividades.filter(function(a){return a.tipo==='ligacao'}).reduce(function(s,x){return s+(parseInt(x.qtd)||0)},0);var tP=atividades.filter(function(a){return a.tipo==='prospeccao'}).reduce(function(s,x){return s+(parseInt(x.qtd)||0)},0);var tPr=vendas.reduce(function(s,x){return s+(parseInt(x.qtdProdutos)||0)},0);var pV=m.valorVenda?Math.min(100,(tV/m.valorVenda)*100):0;var pL=m.ligacoes?Math.min(100,(tL/m.ligacoes)*100):0;var pP=m.prospeccao?Math.min(100,(tP/m.prospeccao)*100):0;var pPr=m.produtos?Math.min(100,(tPr/m.produtos)*100):0;var marcaDet='';if(m.marcasDetalhe&&m.marcasDetalhe.length){marcaDet='<div class="accordion"><div class="accordion-hd" onclick="toggleAccordion(this)">Meta de Marcas Detalhada <span class="accordion-ico">&#9654;</span></div><div class="accordion-bd"><table><thead><tr><th>Marca</th><th class="tcc">Meta</th><th class="tcc">Vendido</th><th class="tcc">%</th></tr></thead><tbody>'+m.marcasDetalhe.map(function(d){var vendido=0;vendas.forEach(function(v){v.itens.forEach(function(it){if(getMarcaByCod(it.cod)===d.nome)vendido+=(parseInt(it.qtd)||0)})});var pct=d.qtd>0?Math.min(100,(vendido/d.qtd)*100):0;return '<tr><td>'+d.nome+'</td><td class="tcc">'+d.qtd+'</td><td class="tcc">'+vendido+'</td><td class="tcc">'+Math.round(pct)+'%</td></tr>'}).join('')+'</tbody></table></div></div>'}return '<h2 class="st2">Minhas Metas - '+m.mes+' / Semana '+m.semana+'</h2><div class="sg"><div class="sc '+(pV>=80?'s':pV>=50?'w':'d')+'"><div class="lb">Vendas</div><div class="vl">R$ '+fmtBRL(tV)+'</div><div class="sb">Meta: R$ '+fmtBRL(m.valorVenda)+'</div></div><div class="sc '+(pL>=80?'s':pL>=50?'w':'d')+'"><div class="lb">Ligacoes</div><div class="vl">'+tL+'</div><div class="sb">Meta: '+m.ligacoes+'</div></div><div class="sc '+(pP>=80?'s':pP>=50?'w':'d')+'"><div class="lb">Prospeccao</div><div class="vl">'+tP+'</div><div class="sb">Meta: '+m.prospeccao+'</div></div><div class="sc '+(pPr>=80?'s':pPr>=50?'w':'d')+'"><div class="lb">Produtos</div><div class="vl">'+tPr+'</div><div class="sb">Meta: '+m.produtos+'</div></div></div><div class="card"><h3>Progresso</h3>'+progressBar('Vendas (R$)',tV,m.valorVenda,pV)+progressBar('Ligacoes',tL,m.ligacoes,pL)+progressBar('Prospeccao',tP,m.prospeccao,pP)+progressBar('Produtos',tPr,m.produtos,pPr)+marcaDet+'</div>'}
function toggleAccordion(el){var bd=el.nextElementSibling;var ico=el.querySelector('.accordion-ico');if(bd.classList.contains('open')){bd.classList.remove('open');ico.classList.remove('open')}else{bd.classList.add('open');ico.classList.add('open')}}
function renderVenda(){var clientes=getMeusClientes();var cliOpts=clientes.map(function(c){return '<option value="COD '+c.cod+' - '+c.razao+' ('+c.cidade+'/'+c.estado+')|'+(c.segmento||'Outros')+'">COD '+c.cod+' - '+c.razao+' ('+c.cidade+'/'+c.estado+') - '+(c.segmento||'Outros')+'</option>'}).join('');var vendas=loadData('vendas').filter(function(v){return v.vendedor===currentUser.id});var rec=vendas.length?'<div class="card"><h3>Vendas Recentes</h3><table><thead><tr><th>Data</th><th>Cliente</th><th>Itens</th><th class="tcc">Qtd</th><th class="tcr">Total</th></tr></thead><tbody>'+vendas.slice().reverse().map(function(v){return '<tr><td>'+v.data+'</td><td>'+v.cliente+'</td><td>'+v.itens.map(function(i){return i.nome}).join(', ')+'</td><td class="tcc">'+v.qtdProdutos+'</td><td class="tcr">R$ '+fmtBRL(v.total)+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="card"><div class="es"><div class="ic">VEN</div><p>Nenhuma venda.</p></div></div>';var semCli=(!clientes.length)?'<div class="card" style="background:#fff3e0;border:2px solid #ff8f00;padding:16px;border-radius:8px;margin-bottom:16px"><p style="color:#e65100;font-weight:600">Voce ainda nao tem clientes cadastrados. Cadastre seus clientes primeiro na aba "Meus Clientes".</p></div>':'';return '<h2 class="st2">Registrar Venda</h2>'+semCli+'<div class="card"><h3>Nova Venda</h3><div class="fr"><div class="fg"><label>Cliente</label><select id="v-cli"><option value="">Selecione...</option>'+cliOpts+'</select></div><div class="fg"><label>Data</label><input type="date" id="v-data" value="'+new Date().toISOString().split('T')[0]+'"></div></div><div id="v-prods"></div><button class="btn btn-a btn-s" onclick="addProd()">+ Adicionar Produto</button><div class="st">Total: R$ <span id="v-total">0,00</span></div><div class="dv"></div><button class="btn btn-p btn-f" onclick="saveVenda()">Finalizar Venda</button></div>'+rec}
function addProd(){var div=document.createElement('div');div.className='pe';var prodOpts='<option value="">Produto...</option>'+PROD.map(function(p){return '<option value="'+p.cod+'|'+p.nome+' ('+p.un+')|'+p.preco+'">'+p.cod+' - '+p.nome+' - R$ '+fmtBRL(p.preco)+'</option>'}).join('');div.innerHTML='<select class="pe-prod" onchange="onProdChange(this)">'+prodOpts+'</select><input type="number" class="pe-qtd" placeholder="Qtd" oninput="calcTotal()" min="1" value="1"><input type="number" class="pe-val" placeholder="Valor Unit." oninput="calcTotal()" step="0.01"><button class="rb" onclick="this.parentElement.remove();calcTotal()">x</button>';document.getElementById('v-prods').appendChild(div)}
function onProdChange(sel){var parts=sel.value.split('|');if(parts[2]){var row=sel.parentElement;row.querySelector('.pe-val').value=parts[2];calcTotal()}}
function calcTotal(){var total=0;document.querySelectorAll('.pe').forEach(function(row){var q=parseFloat(row.querySelector('.pe-qtd').value)||0;var v=parseFloat(row.querySelector('.pe-val').value)||0;total+=q*v});document.getElementById('v-total').textContent=total.toLocaleString('pt-BR',{minimumFractionDigits:2})}
function saveVenda(){var cliRaw=document.getElementById('v-cli').value;if(!cliRaw){toast('Selecione um cliente','error');return}var cliParts=cliRaw.split('|');var cli=cliParts[0];var seg=cliParts[1]||'Outros';var data=document.getElementById('v-data').value;var itens=[];var total=0;var qtdProd=0;document.querySelectorAll('.pe').forEach(function(row){var pVal=row.querySelector('.pe-prod').value;var q=parseInt(row.querySelector('.pe-qtd').value)||0;var v=parseFloat(row.querySelector('.pe-val').value)||0;if(pVal&&q&&v){var parts=pVal.split('|');itens.push({cod:parts[0],nome:parts[1]||pVal,qtd:q,valor:v});total+=q*v;qtdProd+=q}});if(!itens.length){toast('Adicione pelo menos um produto','error');return}var m=cli.match(/\/([A-Z]{2})\)/);var estado=m?m[1]:'--';var venda={vendedor:currentUser.id,cliente:cli,data:data,itens:itens,total:total,qtdProdutos:qtdProd,estado:estado,segmento:seg};var vendas=loadData('vendas');vendas.push(venda);saveData('vendas',vendas);toast('Venda registrada! R$ '+fmtBRL(total),'success');renderTab('venda')}
function renderAtividades(){var atividades=loadData('atividades').filter(function(a){return a.vendedor===currentUser.id});var hist=atividades.length?'<table><thead><tr><th>Data</th><th>Tipo</th><th class="tcc">Qtd</th><th>Obs</th></tr></thead><tbody>'+atividades.slice().reverse().map(function(a){return '<tr><td>'+a.data+'</td><td>'+(a.tipo==='ligacao'?'Ligacao':'Prospeccao')+'</td><td class="tcc">'+a.qtd+'</td><td>'+(a.obs||'--')+'</td></tr>'}).join('')+'</tbody></table>':'<div class="es"><div class="ic">ATIV</div><p>Nenhuma atividade.</p></div>';return '<h2 class="st2">Registrar Atividades</h2><div class="card"><h3>Nova Atividade</h3><div class="fr"><div class="fg"><label>Tipo</label><select id="a-tipo"><option value="ligacao">Ligacao</option><option value="prospeccao">Prospeccao</option></select></div><div class="fg"><label>Quantidade</label><input type="number" id="a-qtd" value="1" min="1"></div><div class="fg"><label>Data</label><input type="date" id="a-data" value="'+new Date().toISOString().split('T')[0]+'"></div></div><div class="fg"><label>Observacao</label><textarea id="a-obs" rows="2" placeholder="Notas..."></textarea></div><button class="btn btn-p" onclick="saveAtiv()">Registrar</button></div><div class="card"><h3>Historico</h3>'+hist+'</div>'}
function saveAtiv(){var a={vendedor:currentUser.id,tipo:document.getElementById('a-tipo').value,qtd:parseInt(document.getElementById('a-qtd').value)||0,data:document.getElementById('a-data').value,obs:document.getElementById('a-obs').value.trim()};if(!a.qtd){toast('Digite a quantidade','error');return}var atividades=loadData('atividades');atividades.push(a);saveData('atividades',atividades);toast('Atividade registrada!','success');renderTab('atividades')}
function renderComissao(isManager){var vAtivos=getVendedores();var sel=isManager?'<div class="fr"><div class="fg"><label>Selecionar Vendedor</label><select id="comp-vend" onchange="renderCompContent(this.value)">'+vAtivos.map(function(v){return '<option value="'+v.id+'">'+getNome(v.id)+' ('+getNivel(v.id)+')</option>'}).join('')+'</select></div></div>':'';return '<h2 class="st2">Comissao</h2><div class="card">'+sel+'<div id="comp-content"></div></div>'}
function renderCompContent(vid){var vendas=loadData('vendas').filter(function(v){return v.vendedor===vid});var totalVendas=vendas.reduce(function(s,x){return s+(parseFloat(x.total)||0)},0);var nv=getNivel(vid);var faixas=COM[nv]||COM['Junior'];var tabela=faixas.map(function(f){return '<tr><td>'+(f.max>=999999999?'Acima de R$ '+f.min.toLocaleString('pt-BR'):'R$ '+f.min.toLocaleString('pt-BR')+' ate R$ '+f.max.toLocaleString('pt-BR'))+'</td><td class="tcc">'+f.taxa.toFixed(2)+'%</td></tr>'}).join('');var html='<div class="sg"><div class="sc"><div class="lb">Total de Vendas</div><div class="vl">R$ '+fmtBRL(totalVendas)+'</div><div class="sb">'+getNome(vid)+' - '+nv+'</div></div></div><div class="dv"></div><h3>Tabela - '+nv+'</h3><table><thead><tr><th>Faixa</th><th class="tcc">Taxa</th></tr></thead><tbody>'+tabela+'</tbody></table><div class="dv"></div><h3>Acelerador</h3><p style="font-size:.85rem;color:var(--m);margin-bottom:12px">+0,05% por semana atingida (max +0,20%).</p><div class="fr"><div class="fg"><label>Semana 1</label><select id="s1"><option value="0">Nao</option><option value="1">Sim</option></select></div><div class="fg"><label>Semana 2</label><select id="s2"><option value="0">Nao</option><option value="1">Sim</option></select></div><div class="fg"><label>Semana 3</label><select id="s3"><option value="0">Nao</option><option value="1">Sim</option></select></div><div class="fg"><label>Semana 4</label><select id="s4"><option value="0">Nao</option><option value="1">Sim</option></select></div></div><button class="btn btn-a btn-f" onclick="calcCom(\''+vid+'\')">Calcular</button><div id="com-res"></div>';var el=document.getElementById('comp-content');if(el)el.innerHTML=html}
function calcCom(vid){var vendas=loadData('vendas').filter(function(v){return v.vendedor===vid});var totalVendas=vendas.reduce(function(s,x){return s+(parseFloat(x.total)||0)},0);var nv=getNivel(vid);var faixas=COM[nv]||COM['Junior'];var taxaBase=faixas[0].taxa;for(var i=0;i<faixas.length;i++){if(totalVendas>=faixas[i].min&&totalVendas<=faixas[i].max){taxaBase=faixas[i].taxa;break}if(totalVendas>=faixas[i].min&&faixas[i].max>=999999999){taxaBase=faixas[i].taxa;break}}var sem=0;['s1','s2','s3','s4'].forEach(function(p){var el=document.getElementById(p);if(el)sem+=parseInt(el.value)||0});var acel=sem*0.05;var taxaTotal=taxaBase+acel;var comissao=totalVendas*(taxaTotal/100);var res=document.getElementById('com-res');if(res)res.innerHTML='<div class="cr"><div style="font-size:.9rem;color:#555">Comissao de '+getNome(vid)+'</div><div class="am">R$ '+fmtBRL(comissao)+'</div><div class="dt">Taxa base: <strong>'+taxaBase.toFixed(2)+'%</strong> ('+nv+')<br>Acelerador: <strong>+'+acel.toFixed(2)+'%</strong> ('+sem+' sem)<br>Total: <strong>'+taxaTotal.toFixed(2)+'%</strong><br>Base: R$ '+fmtBRL(totalVendas)+'</div></div>';toast('Comissao: R$ '+fmtBRL(comissao),'success')}
updateLoginNomes();
var savedUser=localStorage.getItem('mc_user');
if(savedUser){try{currentUser=JSON.parse(savedUser);loadNiveis();loadNomes();loadSenhas();document.getElementById('ls').style.display='none';document.getElementById('app').style.display='block';var b=document.getElementById('ub');b.textContent=getNome(currentUser.id)+' - '+getNivel(currentUser.id);b.className='badge'+(currentUser.isM?' mg':'');initSidebar()}catch(e){localStorage.removeItem('mc_user')}}
</script>
