function initCruzamentos(){var vendas=loadData('vendas');var vend=document.getElementById('cr-vend').value;var seg=document.getElementById('cr-seg').value;var uf=document.getElementById('cr-uf').value;var filtradas=vendas.filter(function(v){if(vend&&v.vendedor!==vend)return false;if(seg&&getSegmentoFromVenda(v)!==seg)return false;if(uf&&getEstadoFromVenda(v)!==uf)return false;return true});var tot=filtradas.reduce(function(s,v){return s+(parseFloat(v.total)||0)},0);var qtd=filtradas.reduce(function(s,v){return s+(parseInt(v.qtdProdutos)||0)},0);var html='<div class="sg"><div class="sc s"><div class="lb">Vendas Filtradas</div><div class="vl">'+filtradas.length+'</div></div><div class="sc"><div class="lb">Produtos</div><div class="vl">'+qtd+'</div></div><div class="sc"><div class="lb">Faturamento</div><div class="vl">R$ '+fmtBRL(tot)+'</div></div></div>';if(filtradas.length){html+='<table><thead><tr><th>Data</th><th>Cliente</th><th>UF</th><th>Segmento</th><th>Vendedor</th><th>Total</th></tr></thead><tbody>';filtradas.forEach(function(v){html+='<tr><td>'+v.data+'</td><td>'+v.cliente+'</td><td class="tcc">'+getEstadoFromVenda(v)+'</td><td>'+getSegmentoFromVenda(v)+'</td><td>'+getNome(v.vendedor)+'</td><td class="tcr">R$ '+fmtBRL(v.total)+'</td></tr>'});html+='</tbody></table>'}var div=document.getElementById('cr-result');if(div)div.innerHTML=html}
function renderAnaliseCli(){var clientes=loadData('clientes');var cliOpts=clientes.map(function(c){return '<option value="'+c.cod+'">'+c.cod+' - '+c.razao+'</option>'}).join('');return '<h2 class="st2">Analise de Clientes</h2><div class="card"><h3>Selecionar Cliente</h3><div class="fr"><div class="fg"><label>Cliente</label><select id="ac-cli" onchange="analisaCliente()"><option value="">Selecione...</option>'+cliOpts+'</select></div></div></div><div id="ac-result"></div>'}
function analisaCliente(){var cod=document.getElementById('ac-cli').value;if(!cod){document.getElementById('ac-result').innerHTML='';return}var vendas=loadData('vendas');var cliente=getClienteByCod(cod);var vCli=vendas.filter(function(v){var m=v.cliente.match(/COD\s+(\S+)/);return m&&m[1]===cod});vCli.sort(function(a,b){return a.data.localeCompare(b.data)});var html='';if(vCli.length===0){html='<div class="card"><div class="es"><div class="ic">SEM</div><p>Nenhuma compra registrada para este cliente.</p></div></div>'}else{var totGeral=vCli.reduce(function(s,v){return s+(parseFloat(v.total)||0)},0);var qtdProd=vCli.reduce(function(s,v){return s+(parseInt(v.qtdProdutos)||0)},0);var mediaTicket=totGeral/vCli.length;var todasDatas=vCli.map(function(v){return v.data});var ultima=todasDatas[todasDatas.length-1];var intervalos=[];for(var i=1;i<vCli.length;i++){var d1=new Date(vCli[i-1].data);var d2=new Date(vCli[i].data);intervalos.push(Math.floor((d2.getTime()-d1.getTime())/(1000*60*60*24)))}var intervaloMedio=intervalos.length?Math.round(intervalos.reduce(function(s,x){return s+x},0)/intervalos.length):0;var produtosFreq={};vCli.forEach(function(v){if(v.itens){v.itens.forEach(function(it){var nome=it.nome||it.cod;if(!produtosFreq[nome])produtosFreq[nome]={qtd:0,vezes:0};produtosFreq[nome].qtd+=parseInt(it.qtd)||0;produtosFreq[nome].vezes++})}});var prodsOrdenados=Object.keys(produtosFreq).sort(function(a,b){return produtosFreq[b].vezes-produtosFreq[a].vezes});var ultCompra=vCli[vCli.length-1];var prodsUltima=(ultCompra.itens||[]).map(function(it){return it.nome||it.cod});var prodsAnteriores=[];for(var j=0;j<vCli.length-1;j++){(vCli[j].itens||[]).forEach(function(it){var n=it.nome||it.cod;if(prodsAnteriores.indexOf(n)<0)prodsAnteriores.push(n)})}var novosProds=prodsUltima.filter(function(p){return prodsAnteriores.indexOf(p)<0});var prodsPrevistos=[];prodsOrdenados.forEach(function(p){if(produtosFreq[p].vezes>=Math.ceil(vCli.length/2)){prodsPrevistos.push(p)}});prodsUltima.forEach(function(p){if(prodsPrevistos.indexOf(p)<0)prodsPrevistos.push(p)});var valorPrevisto=mediaTicket;if(novosProds.length>0){valorPrevisto=mediaTicket*1.15}var dataPrevista='--';if(intervaloMedio>0){var dUlt=new Date(ultima);dUlt.setDate(dUlt.getDate()+intervaloMedio);dataPrevista=dUlt.toISOString().split('T')[0]}html='<div class="card"><h3>'+(cliente?cliente.razao:'Cliente '+cod)+'</h3><div class="sg"><div class="sc s"><div class="lb">Total Compras</div><div class="vl">'+vCli.length+'</div></div><div class="sc"><div class="lb">Faturamento Total</div><div class="vl">R$ '+fmtBRL(totGeral)+'</div></div><div class="sc"><div class="lb">Ticket Medio</div><div class="vl">R$ '+fmtBRL(mediaTicket)+'</div></div><div class="sc"><div class="lb">Produtos Comprados</div><div class="vl">'+qtdProd+'</div></div><div class="sc"><div class="lb">Intervalo Medio</div><div class="vl">'+intervaloMedio+' dias</div></div></div></div>';html+='<div class="card"><h3>Historico de Compras</h3><table><thead><tr><th>Data</th><th>Itens</th><th>Qtd</th><th>Total</th></tr></thead><tbody>';vCli.forEach(function(v){var itensStr=(v.itens&&v.itens.length)?v.itens.map(function(it){return it.qtd+'x '+it.nome}).join(', '):'--';html+='<tr><td>'+v.data+'</td><td style="font-size:.78rem">'+itensStr+'</td><td class="tcc">'+(v.qtdProdutos||0)+'</td><td class="tcr">R$ '+fmtBRL(v.total)+'</td></tr>'});html+='</tbody></table></div>';html+='<div class="card"><h3>Produtos Mais Comprados</h3><table><thead><tr><th>Produto</th><th>Qtd Total</th><th>Frequencia</th></tr></thead><tbody>';prodsOrdenados.forEach(function(p){html+='<tr><td>'+p+'</td><td class="tcc">'+produtosFreq[p].qtd+'</td><td class="tcc">'+produtosFreq[p].vezes+'x</td></tr>'});html+='</tbody></table></div>';html+='<div class="pred-card"><h4>Previsao do Proximo Pedido</h4><div class="pred-grid"><div class="pred-item"><div class="pred-label">Data Estimada</div><div class="pred-value">'+dataPrevista+'</div></div><div class="pred-item"><div class="pred-label">Valor Estimado</div><div class="pred-value">R$ '+fmtBRL(valorPrevisto)+'</div></div><div class="pred-item"><div class="pred-label">Intervalo</div><div class="pred-value">'+intervaloMedio+' dias</div></div></div>';html+='<div class="pred-prod-list"><strong>Produtos Previstos:</strong><ul>';if(prodsPrevistos.length){prodsPrevistos.forEach(function(p){html+='<li>'+p+'</li>'})}else{html+='<li>Nenhum padrao identificado ainda</li>'}html+='</ul>';if(novosProds.length){html+='<div style="margin-top:8px;padding-top:8px;border-top:1px solid #e3f2fd"><strong style="color:#1565c0">Produtos novos na ultima compra:</strong><br>'+novosProds.join(', ')+'</div>'}html+='</div></div>'}var div=document.getElementById('ac-result');if(div)div.innerHTML=html}
function renderComissao(isGerente){var vAtivos=getVendedores();var vendOpts=vAtivos.map(function(v){return '<option value="'+v.id+'">'+getNome(v.id)+'</option>'}).join('');return '<h2 class="st2">Comissao</h2><div class="card"><h3>Calcular Comissao</h3><div class="fr"><div class="fg"><label>Vendedor</label><select id="cm-vend" onchange="renderCompContent(document.getElementById(\'cm-vend\').value)">'+(isGerente?vendOpts:'<option value="'+currentUser.id+'">'+getNome(currentUser.id)+'</option>')+'</select></div></div><div id="cm-result"></div></div>'}
function renderCompContent(vid){var vendas=loadData('vendas').filter(function(v){return v.tipo!=='bonificacao'});var vV=vendas.filter(function(v){return v.vendedor===vid});var total=vV.reduce(function(s,v){return s+(parseFloat(v.total)||0)},0);var nivel=getNivel(vid);var faixas=COM[nivel]||COM['Junior'];var taxa=0;for(var i=0;i<faixas.length;i++){if(total>=faixas[i].min&&total<=faixas[i].max){taxa=faixas[i].taxa;break}}var faixaHtml='<table class="com-faixa-table"><thead><tr><th>Faixa de Vendas</th><th>Taxa</th></tr></thead><tbody>';faixas.forEach(function(f){var ativa=(total>=f.min&&total<=f.max);faixaHtml+='<tr'+(ativa?' class="ativa"':'')+'><td>'+(f.max>=999999999?'Acima de R$ '+fmtBRL(f.min):'R$ '+fmtBRL(f.min)+' ate R$ '+fmtBRL(f.max))+'</td><td style="text-align:center">'+f.taxa.toFixed(2)+'</td></tr>'});faixaHtml+='</tbody></table>';var html='<div class="com-hero"><div><div class="com-name">'+getNome(vid)+'</div><div class="com-nivel">'+nivel+'</div></div><div style="text-align:right"><div class="com-total-label">Total Vendido</div><div class="com-total">R$ '+fmtBRL(total)+'</div></div></div>';html+='<div class="com-stats"><div class="com-stat"><div class="com-stat-label">Taxa Base</div><div class="com-stat-value" id="cm-taxa-base">'+taxa.toFixed(2)+'</div></div><div class="com-stat"><div class="com-stat-label">Acelerador</div><div class="com-stat-value" id="cm-accel-val">+0.00</div><div class="com-stat-sub" id="cm-weeks-val">0/4 semanas</div></div><div class="com-stat"><div class="com-stat-label">Taxa Final</div><div class="com-stat-value" id="cm-taxa-final">'+taxa.toFixed(2)+'</div></div><div class="com-stat highlight"><div class="com-stat-label">Comissao</div><div class="com-stat-value" id="cm-comissao-val">R$ '+fmtBRL(total*taxa)+'</div></div></div>';html+='<div class="card"><h3>Faixas de Comissao - '+nivel+'</h3>'+faixaHtml+'</div>';html+='<div class="com-accel"><div class="com-accel-title">Acelerador por Positivacao</div><div class="com-accel-desc">0.05 por semana de meta de positivacao atingida (maximo 0.20 com as 4 semanas). Cliente contabilizado apenas uma vez no mes. Valido apenas para pedidos aprovados.</div><div class="com-week-grid">';for(var s=1;s<=4;s++){html+='<div class="com-week" id="cm-week-'+s+'" onclick="toggleWeek('+s+',\''+vid+'\')"><div class="com-week-num">Semana '+s+'</div><div class="com-week-icon">&#9744;</div><div class="com-week-bonus">+0.05</div></div>'}html+='</div><button class="btn btn-p btn-f" onclick="calcComissaoFinal(\''+vid+'\')" style="margin-top:16px">Calcular Comissao</button><div id="cm-resultado" style="margin-top:16px"></div></div>';var div=document.getElementById('cm-result');if(div)div.innerHTML=html}
function toggleWeek(s,vid){var w=document.getElementById('cm-week-'+s);if(!w)return;w.classList.toggle('checked');w.querySelector('.com-week-icon').innerHTML=w.classList.contains('checked')?'&#9745;':'&#9744;';updateComStats(vid)}
function updateComStats(vid){var vendas=loadData('vendas').filter(function(v){return v.tipo!=='bonificacao'});var vV=vendas.filter(function(v){return v.vendedor===vid});var total=vV.reduce(function(s,v){return s+(parseFloat(v.total)||0)},0);var nivel=getNivel(vid);var faixas=COM[nivel]||COM['Junior'];var taxa=0;for(var i=0;i<faixas.length;i++){if(total>=faixas[i].min&&total<=faixas[i].max){taxa=faixas[i].taxa;break}}var semanasBatidas=0;for(var s=1;s<=4;s++){var w=document.getElementById('cm-week-'+s);if(w&&w.classList.contains('checked'))semanasBatidas++}var acelerador=semanasBatidas*ACELERADOR_POR_SEMANA;var taxaFinal=taxa+acelerador;var comissao=total*taxaFinal;var av=document.getElementById('cm-accel-val');if(av)av.textContent='+'+acelerador.toFixed(2);var wv=document.getElementById('cm-weeks-val');if(wv)wv.textContent=semanasBatidas+'/4 semanas';var tf=document.getElementById('cm-taxa-final');if(tf)tf.textContent=taxaFinal.toFixed(2);var cv=document.getElementById('cm-comissao-val');if(cv)cv.textContent='R$ '+fmtBRL(comissao)}
function calcComissaoFinal(vid){var vendas=loadData('vendas').filter(function(v){return v.tipo!=='bonificacao'});var vV=vendas.filter(function(v){return v.vendedor===vid});var total=vV.reduce(function(s,v){return s+(parseFloat(v.total)||0)},0);var nivel=getNivel(vid);var faixas=COM[nivel]||COM['Junior'];var taxa=0;for(var i=0;i<faixas.length;i++){if(total>=faixas[i].min&&total<=faixas[i].max){taxa=faixas[i].taxa;break}}var semanasBatidas=0;for(var s=1;s<=4;s++){var w=document.getElementById('cm-week-'+s);if(w&&w.classList.contains('checked'))semanasBatidas++}var acelerador=semanasBatidas*ACELERADOR_POR_SEMANA;var taxaFinal=taxa+acelerador;var comissao=total*taxaFinal;var html='<div class="com-result"><div class="com-result-label">Comissao Calculada</div><div class="com-result-value">R$ '+fmtBRL(comissao)+'</div><div class="com-result-detail">Taxa base: '+taxa.toFixed(2)+' | Acelerador: +'+acelerador.toFixed(2)+' | Taxa final: '+taxaFinal.toFixed(2)+'</div><div class="com-result-badge">'+semanasBatidas+' de 4 semanas batidas</div></div>';var div=document.getElementById('cm-resultado');if(div)div.innerHTML=html}
function renderCatalogo(){var linhas={};PROD.forEach(function(p){if(!linhas[p.linha])linhas[p.linha]=[];linhas[p.linha].push(p)});var html='<h2 class="st2">Catalogo de Produtos</h2>';Object.keys(linhas).forEach(function(linha){html+='<div class="card"><h3>'+linha+'</h3><table><thead><tr><th>Cod</th><th>Produto</th><th>Un</th><th>Preco</th></tr></thead><tbody>';linhas[linha].forEach(function(p){html+='<tr><td>'+p.cod+'</td><td>'+p.nome+'</td><td>'+p.un+'</td><td class="tcr">R$ '+fmtBRL(p.preco)+'</td></tr>'});html+='</tbody></table></div>'});return html}
function renderRelatorios(){var vendas=loadData('vendas');var metas=loadData('metas');var atividades=loadData('atividades');var clientes=loadData('clientes');var tipoFiltro='<div class="card"><h3>Filtro de Tipo</h3><div class="filtros"><div class="fg"><label>Tipo de Registro</label><select id="rel-tipo"><option value="todos">Todos</option><option value="venda">Somente Vendas</option><option value="bonificacao">Somente Bonificacoes</option><option value="ambos">Vendas + Bonificacoes</option></select></div><div class="fg" style="display:flex;align-items:flex-end"><button class="btn btn-p btn-s" onclick="filtrarRelatorio()">OK</button></div></div></div>';var totV=vendas.reduce(function(s,v){return s+(parseFloat(v.total)||0)},0);var totL=atividades.filter(function(a){return a.tipo==='ligacao'}).reduce(function(s,a){return s+(parseInt(a.qtd)||0)},0);var totP=atividades.filter(function(a){return a.tipo==='prospeccao'}).reduce(function(s,a){return s+(parseInt(a.qtd)||0)},0);return '<h2 class="st2">Relatorios Gerais</h2>'+tipoFiltro+'<div class="card"><h3>Resumo Geral</h3><div id="rel-resumo"><div class="sg"><div class="sc s"><div class="lb">Faturamento</div><div class="vl">R$ '+fmtBRL(totV)+'</div></div><div class="sc"><div class="lb">Vendas</div><div class="vl">'+vendas.length+'</div></div><div class="sc"><div class="lb">Clientes</div><div class="vl">'+clientes.length+'</div></div><div class="sc"><div class="lb">Ligacoes</div><div class="vl">'+totL+'</div></div><div class="sc"><div class="lb">Prospeccao</div><div class="vl">'+totP+'</div></div></div></div><div id="rel-tabela"></div></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-a btn-s" onclick="exportarRelatorioCSV()">Exportar CSV</button><button class="btn btn-p btn-s" onclick="exportarRelatorioPDF()">Exportar PDF</button></div>'}
function filtrarRelatorio(){var vendas=loadData('vendas');var tipo=document.getElementById('rel-tipo').value;var filtradas=vendas.filter(function(v){var vt=v.tipo||'venda';if(tipo==='todos')return true;if(tipo==='venda')return vt==='venda';if(tipo==='bonificacao')return vt==='bonificacao';if(tipo==='ambos')return vt==='venda'||vt==='bonificacao';return true});var totV=filtradas.reduce(function(s,v){return s+(parseFloat(v.total)||0)},0);var resumo=document.getElementById('rel-resumo');if(resumo)resumo.innerHTML='<div class="sg"><div class="sc s"><div class="lb">Faturamento</div><div class="vl">R$ '+fmtBRL(totV)+'</div></div><div class="sc"><div class="lb">Registros</div><div class="vl">'+filtradas.length+'</div></div></div>';var tabelaDiv=document.getElementById('rel-tabela');if(!tabelaDiv)return;var html='<table><thead><tr><th>Data</th><th>Cliente</th><th>Vendedor</th><th>Tipo</th><th>Qtd</th><th>Total</th></tr></thead><tbody>';filtradas.forEach(function(v){var tipo=v.tipo||'venda';var tipoHtml='<span class="tipo-badge '+tipo+'">'+tipo+'</span>';html+='<tr><td>'+v.data+'</td><td>'+v.cliente+'</td><td>'+getNome(v.vendedor)+'</td><td class="tcc">'+tipoHtml+'</td><td class="tcc">'+(v.qtdProdutos||0)+'</td><td class="tcr">R$ '+fmtBRL(v.total)+'</td></tr>'});html+='</tbody></table>';tabelaDiv.innerHTML=html;window._relFiltradas=filtradas}
function exportarRelatorioCSV(){var dados=window._relFiltradas||loadData('vendas');exportCSV(dados,'relatorio-vendas.csv')}
function exportarRelatorioPDF(){var dados=window._relFiltradas||loadData('vendas');var html='<table><thead><tr><th>Data</th><th>Cliente</th><th>Vendedor</th><th>Tipo</th><th>Qtd</th><th>Total</th></tr></thead><tbody>';dados.forEach(function(v){html+='<tr><td>'+v.data+'</td><td>'+v.cliente+'</td><td>'+getNome(v.vendedor)+'</td><td>'+(v.tipo||'venda')+'</td><td>'+(v.qtdProdutos||0)+'</td><td>R$ '+fmtBRL(v.total)+'</td></tr>'});html+='</tbody></table>';exportPDF('Relatorio Geral de Vendas',html)}
function renderMinhas(){var metas=loadData('metas');var vendas=loadData('vendas');var atividades=loadData('atividades');var vM=metas.filter(function(m){return m.vendedor===currentUser.id});var vV=vendas.filter(function(v){return v.vendedor===currentUser.id&&(v.tipo||'venda')==='venda'});var vA=atividades.filter(function(a){return a.vendedor===currentUser.id});var m=vM[vM.length-1]||{};var vTotV=vV.reduce(function(s,v){return s+(parseFloat(v.total)||0)},0);var vL=vA.filter(function(a){return a.tipo==='ligacao'}).reduce(function(s,a){return s+(parseInt(a.qtd)||0)},0);var vP=vA.filter(function(a){return a.tipo==='prospeccao'}).reduce(function(s,a){return s+(parseInt(a.qtd)||0)},0);var vPr=vV.reduce(function(s,v){return s+(parseInt(v.qtdProdutos)||0)},0);var pV=m.valorVenda?Math.min(100,(vTotV/m.valorVenda)*100):0;var pL=m.ligacoes?Math.min(100,(vL/m.ligacoes)*100):0;var pP=m.prospeccao?Math.min(100,(vP/m.prospeccao)*100):0;var pPr=m.produtos?Math.min(100,(vPr/m.produtos)*100):0;return renderWeeklyBar()+renderProdutosDiscriminados()+'<h2 class="st2">Minhas Metas</h2><div class="card"><h3>Progresso Atual</h3>'+progressBar('Vendas (R$)',vTotV,m.valorVenda||0,pV)+progressBar('Ligacoes',vL,m.ligacoes||0,pL)+progressBar('Prospeccao',vP,m.prospeccao||0,pP)+progressBar('Produtos',vPr,m.produtos||0,pPr)+'</div>'}
function renderVenda(){var clientes=getMeusClientes();var cliOpts=clientes.map(function(c){return '<option value="'+c.cod+'">'+c.cod+' - '+c.razao+'</option>'}).join('');return renderWeeklyBar()+'<h2 class="st2">Registrar Venda</h2><div class="card"><h3>Nova Venda ou Bonificacao</h3><div class="tipo-toggle"><button id="tt-venda" class="act" onclick="setTipoLanc(\'venda\')">Venda</button><button id="tt-bonif" onclick="setTipoLanc(\'bonificacao\')">Bonificacao</button></div><div class="fr"><div class="fg"><label>Data</label><input type="date" id="vd-data" value="'+new Date().toISOString().split('T')[0]+'"></div><div class="fg"><label>Cliente</label><select id="vd-cli" onchange="updateClienteInfo()">'+cliOpts+'</select></div></div><div id="vd-cli-info"></div><div class="dv"></div><h3>Itens da Venda</h3><div id="vd-itens"></div><button class="btn btn-a btn-s" onclick="addVendaItem()">+ Adicionar Item</button><div class="dv"></div><div class="st" id="vd-total">Total: R$ 0,00</div><div class="dv"></div><button class="btn btn-p btn-f" onclick="saveVenda()">Salvar Lancamento</button></div>'}
function setTipoLanc(tipo){var bv=document.getElementById('tt-venda');var bb=document.getElementById('tt-bonif');if(!bv||!bb)return;if(tipo==='venda'){bv.classList.add('act');bb.classList.remove('act')}else{bb.classList.add('act');bv.classList.remove('act')}}
function getTipoLanc(){var bv=document.getElementById('tt-venda');if(bv&&bv.classList.contains('act'))return 'venda';return 'bonificacao'}
function updateClienteInfo(){var cod=document.getElementById('vd-cli').value;var c=getClienteByCod(cod);var div=document.getElementById('vd-cli-info');if(!c||!div){if(div)div.innerHTML='';return}div.innerHTML='<div class="client-info"><div style="display:flex;gap:20px;flex-wrap:wrap"><div><div class="ci-label">Cidade</div><div class="ci-value">'+(c.cidade||'--')+'</div></div><div><div class="ci-label">Estado</div><div class="ci-value">'+(c.estado||'--')+'</div></div><div><div class="ci-label">Segmento</div><div class="ci-value">'+(c.segmento||'--')+'</div></div><div><div class="ci-label">Vendedor</div><div class="ci-value">'+getNome(c.vendedorId||currentUser.id)+'</div></div></div></div>'}
function addVendaItem(){var div=document.createElement('div');div.className='pe';var prodOpts=PROD.map(function(p){return '<option value="'+p.cod+'">'+p.cod+' - '+p.nome+'</option>'}).join('');div.innerHTML='<select class="pe-prod" onchange="calcVendaTotal()">'+prodOpts+'</select><input type="number" class="pe-qtd" placeholder="Qtd" value="1" oninput="calcVendaTotal()" min="1"><input type="text" class="pe-preco" placeholder="Preco" readonly><button class="rb" onclick="this.parentElement.remove();calcVendaTotal()">x</button>';document.getElementById('vd-itens').appendChild(div);calcVendaTotal()}
function calcVendaTotal(){var total=0;var qtdTotal=0;document.querySelectorAll('.pe').forEach(function(row){var cod=row.querySelector('.pe-prod').value;var qtd=parseInt(row.querySelector('.pe-qtd').value)||0;var prod=PROD.find(function(p){return p.cod===cod});if(prod){var preco=prod.preco*qtd;total+=preco;qtdTotal+=qtd;row.querySelector('.pe-preco').value='R$ '+fmtBRL(preco)}});var div=document.getElementById('vd-total');if(div)div.textContent='Total: R$ '+fmtBRL(total)}
function saveVenda(){var data=document.getElementById('vd-data').value;var cod=document.getElementById('vd-cli').value;var cliente=getClienteByCod(cod);var tipo=getTipoLanc();var itens=[];var total=0;var qtdProdutos=0;document.querySelectorAll('.pe').forEach(function(row){var codProd=row.querySelector('.pe-prod').value;var qtd=parseInt(row.querySelector('.pe-qtd').value)||0;var prod=PROD.find(function(p){return p.cod===codProd});if(prod&&qtd>0){itens.push({cod:codProd,nome:prod.nome,qtd:qtd,preco:prod.preco});total+=prod.preco*qtd;qtdProdutos+=qtd}});if(itens.length===0){toast('Adicione pelo menos um item','error');return}if(tipo==='venda'){var vendas=loadData('vendas');var jaExiste=vendas.some(function(v){var m=v.cliente.match(/COD\s+(\S+)/);return m&&m[1]===cod&&v.vendedor===currentUser.id&&(v.tipo||'venda')==='venda'});if(jaExiste){toast('Este cliente ja possui uma venda cadastrada. Use Bonificacao para repetir o codigo.','error');return}}var nomeCli=cliente?cliente.razao:'COD '+cod;var estado=cliente?cliente.estado:'--';var segmento=cliente?cliente.segmento:'Outros';var venda={data:data,cliente:nomeCli+' (COD '+cod+' / '+estado+')',vendedor:currentUser.id,itens:itens,qtdProdutos:qtdProdutos,total:total,estado:estado,segmento:segmento,tipo:tipo};var vendas=loadData('vendas');vendas.push(venda);saveData('vendas',vendas);toast((tipo==='venda'?'Venda':'Bonificacao')+' salva: R$ '+fmtBRL(total),'success');renderTab('venda')}
function renderAtividades(){var atividades=loadData('atividades');var tipoOpts='<option value="ligacao">Ligacao</option><option value="prospeccao">Prospeccao</option><option value="visita">Visita</option><option value="email">E-mail</option><option value="whatsapp">WhatsApp</option>';var minhas=atividades.filter(function(a){return a.vendedor===currentUser.id});var tabela=minhas.length?'<table><thead><tr><th>Data</th><th>Tipo</th><th>Qtd</th><th>Obs</th><th>Acoes</th></tr></thead><tbody>'+minhas.map(function(a){var idx=atividades.indexOf(a);return '<tr><td>'+a.data+'</td><td>'+a.tipo+'</td><td class="tcc">'+a.qtd+'</td><td>'+(a.obs||'')+'</td><td><button class="del-btn" onclick="delAtividade('+idx+')">Excluir</button></td></tr>'}).join('')+'</tbody></table>':'<div class="es"><div class="ic">SEM</div><p>Nenhuma atividade.</p></div>';return '<h2 class="st2">Atividades</h2><div class="card"><h3>Registrar Atividade</h3><div class="fr"><div class="fg"><label>Data</label><input type="date" id="at-data" value="'+new Date().toISOString().split('T')[0]+'"></div><div class="fg"><label>Tipo</label><select id="at-tipo">'+tipoOpts+'</select></div><div class="fg"><label>Quantidade</label><input type="number" id="at-qtd" value="1" min="1"></div></div><div class="fg"><label>Observacao</label><textarea id="at-obs" rows="2" placeholder="Opcional"></textarea></div><button class="btn btn-p" onclick="saveAtividade()">Salvar Atividade</button></div><div class="card"><h3>Minhas Atividades</h3>'+tabela+'</div>'}
function saveAtividade(){var data=document.getElementById('at-data').value;var tipo=document.getElementById('at-tipo').value;var qtd=parseInt(document.getElementById('at-qtd').value)||0;var obs=document.getElementById('at-obs').value.trim();if(!data||!tipo){toast('Preencha data e tipo','error');return}var atividades=loadData('atividades');atividades.push({data:data,tipo:tipo,qtd:qtd,obs:obs,vendedor:currentUser.id});saveData('atividades',atividades);toast('Atividade salva','success');renderTab('atividades')}
function delAtividade(i){if(!confirm('Excluir esta atividade?'))return;var atividades=loadData('atividades');atividades.splice(i,1);saveData('atividades',atividades);toast('Atividade excluida','success');renderTab('atividades')}
;(function(){initDarkMode();var saved=localStorage.getItem('mc_user');if(!saved)return;try{var user=JSON.parse(saved);var existe=USU.find(function(u){return u.id===user.id});if(!existe){var nv=loadNovosVend().find(function(u){return u.id===user.id});if(!nv){localStorage.removeItem('mc_user');return}}currentUser=user;document.getElementById('ls').style.display='none';document.getElementById('app').style.display='block';var b=document.getElementById('ub');b.textContent=getNome(user.id)+' - '+getNivel(user.id);b.className='badge'+(user.isM?' mg':'');initSidebar();['vendas','clientes','metas','atividades'].forEach(function(k){sincronizar(k)})}catch(e){localStorage.removeItem('mc_user')}})();
</script>
