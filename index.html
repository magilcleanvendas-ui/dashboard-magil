    '<h2 class="st2">Minhas Metas</h2><p class="st3">Progresso da semana em todos os indicadores.</p>' +
    '<div class="card"><h3>Progresso Atual</h3>' +
    progressBar('Vendas (R$)', vTot, m.valorVenda || 0, m.valorVenda ? Math.min(100, (vTot / m.valorVenda) * 100) : 0) +
    progressBar('Ligacoes', vLig, m.ligacoes || 0, m.ligacoes ? Math.min(100, (vLig / m.ligacoes) * 100) : 0) +
    progressBar('Prospeccao', vPros, m.prospeccao || 0, m.prospeccao ? Math.min(100, (vPros / m.prospeccao) * 100) : 0) +
    progressBar('Produtos', vProd, m.produtos || 0, m.produtos ? Math.min(100, (vProd / m.produtos) * 100) : 0) +
    '</div>' +
    '<div class="card"><h3>Ligacoes Realizadas</h3>' +
    '<p style="font-size:.8rem;color:var(--txt2);margin-bottom:10px">' + vLig + ' ligacoes | ' + conectadas +
    ' conectadas | ' + (vLig - conectadas) + ' sem resposta</p>' +
    (ligs.length
      ? '<div class="tbl-wrap"><table><thead><tr>' +
        '<th>Data</th><th>Nome</th><th>Numero</th><th>Horario</th><th class="tcc">Duracao</th><th>Status</th>' +
        '</tr></thead><tbody>' +
        ligs.slice().sort(function (a, b) { return b.data.localeCompare(a.data); }).map(function (a) {
          var conect = a.status === 'conectada' || parseFloat(a.duracao) > 1;
          return '<tr><td>' + a.data + '</td><td>' + (a.clienteNome || '--') + '</td>' +
            '<td>' + (a.telefone || '--') + '</td><td>' + (a.horario || '--') + '</td>' +
            '<td class="tcc">' + (a.duracao !== undefined && a.duracao !== '' ? parseFloat(a.duracao).toFixed(1) + ' min' : '--') + '</td>' +
            '<td>' + (conect ? '<span class="tipo-badge venda">Conectada</span>' : '<span class="tipo-badge bonificacao">Sem resposta</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      : '<div class="es"><div class="ic">📞</div><p>Registre ligacoes na aba Atividades.</p></div>') +
    '</div>';
}

// ===== REGISTRAR VENDA =====
function renderVenda() {
  return renderWeeklyBar() +
    '<h2 class="st2">Registrar Venda</h2>' +
    '<p class="st3">Lance venda ou bonificacao vinculada a um cliente pelo codigo.</p>' +
    '<div class="card"><h3>Nova Venda ou Bonificacao</h3>' +
    '<div class="tipo-toggle"><button id="tt-venda" class="act" onclick="setTipoLanc(\'venda\')">Venda</button>' +
    '<button id="tt-bonif" onclick="setTipoLanc(\'bonificacao\')">Bonificacao</button></div>' +
    '<div class="fr">' +
    '<div class="fg"><label>Data</label><input type="date" id="vd-data" value="' + new Date().toISOString().split('T')[0] + '"></div>' +
    '<div class="fg"><label>Codigo do Cliente</label><input type="text" id="vd-cli" placeholder="Digite o codigo" oninput="updateClienteInfo()"></div>' +
    '<div class="fg"><label>Ou Nome</label><input type="text" id="vd-nome" placeholder="Digite parte do nome" oninput="updateClienteInfoNome()"></div>' +
    '</div>' +
    '<div id="vd-cli-info"></div>' +
    '<div class="dv"></div><h4>Itens da Venda</h4><div id="vd-itens"></div>' +
    '<button class="btn btn-a btn-s" onclick="addVendaItem()">+ Adicionar Item</button>' +
    '<div class="dv"></div><div class="st" id="vd-total">Total: R$ 0,00</div>' +
    '<div class="dv"></div>' +
    '<button class="btn btn-p btn-f" onclick="saveVenda()">OK — Salvar Lancamento</button></div>';
}
function setTipoLanc(tipo) {
  var bv = document.getElementById('tt-venda');
  var bb = document.getElementById('tt-bonif');
  if (!bv || !bb) { return; }
  if (tipo === 'venda') { bv.classList.add('act'); bb.classList.remove('act'); }
  else { bb.classList.add('act'); bv.classList.remove('act'); }
}
function getTipoLanc() {
  var bv = document.getElementById('tt-venda');
  return bv && bv.classList.contains('act') ? 'venda' : 'bonificacao';
}
function updateClienteInfoNome() {
  var n = (document.getElementById('vd-nome').value || '').trim();
  if (!n) {
    document.getElementById('vd-cli').value = '';
    updateClienteInfo();
    return;
  }
  var c = loadData('clientes').find(function (x) {
    return String(x.razao).toLowerCase().indexOf(n.toLowerCase()) >= 0 && x.vendedorId === currentUser.id;
  }) || loadData('clientes').find(function (x) { return String(x.razao).toLowerCase().indexOf(n.toLowerCase()) >= 0; });
  if (c) { document.getElementById('vd-cli').value = c.cod; }
  updateClienteInfo();
}
function updateClienteInfo() {
  var cod = (document.getElementById('vd-cli').value || '').trim();
  var c = getClienteByCod(cod);
  var div = document.getElementById('vd-cli-info');
  if (!div) { return; }
  if (!cod) { div.innerHTML = ''; return; }
  if (!c) {
    div.innerHTML = '<div class="client-info" style="border-left-color:var(--err)">' +
      '<div class="ci-label">Cliente</div><div class="ci-value" style="color:var(--err)">Nao encontrado com codigo: ' + cod + '</div></div>';
    return;
  }
  var nv = c.nivel || 'sem';
  div.innerHTML = '<div class="client-info"><div style="display:flex;gap:18px;flex-wrap:wrap">' +
    '<div><div class="ci-label">Cliente</div><div class="ci-value">' + c.razao + '</div></div>' +
    '<div><div class="ci-label">CNPJ</div><div class="ci-value">' + (c.cnpj || '--') + '</div></div>' +
    '<div><div class="ci-label">Cidade/UF</div><div class="ci-value">' + (c.cidade || '--') + '/' + (c.estado || '--') + '</div></div>' +
    '<div><div class="ci-label">Segmento</div><div class="ci-value">' + (c.segmento || '--') + '</div></div>' +
    '<div><div class="ci-label">Nivel</div><div class="ci-value"><span class="nivel-badge ' + nv + '">' +
    (nv === 'sem' ? 'Sem' : nv.charAt(0).toUpperCase() + nv.slice(1)) + '</span></div></div>' +
    '</div></div>';
}
function addVendaItem() {
  var div = document.createElement('div');
  div.className = 'pe';
  div.innerHTML = '<select class="pe-prod" onchange="calcVendaTotal()">' +
    PROD.map(function (p) { return '<option value="' + p.cod + '">' + p.cod + ' - ' + p.nome + '</option>'; }).join('') +
    '</select>' +
    '<input type="number" class="pe-qtd" placeholder="Qtd" value="1" oninput="calcVendaTotal()" min="1">' +
    '<input type="text" class="pe-preco" placeholder="Preco" readonly>' +
    '<button class="rb" onclick="this.parentElement.remove();calcVendaTotal()">x</button>';
  document.getElementById('vd-itens').appendChild(div);
  calcVendaTotal();
}
function calcVendaTotal() {
  var total = 0;
  document.querySelectorAll('.pe').forEach(function (row) {
    var cod = row.querySelector('.pe-prod').value;
    var qtd = parseInt(row.querySelector('.pe-qtd').value) || 0;
    var prod = PROD.find(function (p) { return p.cod === cod; });
    if (prod) {
      var preco = prod.preco * qtd;
      total += preco;
      row.querySelector('.pe-preco').value = 'R$ ' + fmtBRL(preco);
    }
  });
  var div = document.getElementById('vd-total');
  if (div) { div.textContent = 'Total: R$ ' + fmtBRL(total); }
}
function saveVenda() {
  var data = document.getElementById('vd-data').value;
  var cod = (document.getElementById('vd-cli').value || '').trim();
  var cliente = getClienteByCod(cod);
  var tipo = getTipoLanc();
  var itens = [];
  var total = 0;
  var qtdProdutos = 0;
  document.querySelectorAll('.pe').forEach(function (row) {
    var cp = row.querySelector('.pe-prod').value;
    var qtd = parseInt(row.querySelector('.pe-qtd').value) || 0;
    var prod = PROD.find(function (p) { return p.cod === cp; });
    if (prod && qtd > 0) {
      itens.push({ cod: cp, nome: prod.nome, qtd: qtd, preco: prod.preco });
      total += prod.preco * qtd;
      qtdProdutos += qtd;
    }
  });
  if (!data) { toast('Informe a data', 'error'); return; }
  if (!cod) { toast('Informe o codigo do cliente', 'error'); return; }
  if (!cliente) { toast('Cliente nao encontrado com o codigo ' + cod + '. Cadastre ou corrija.', 'error'); return; }
  if (itens.length === 0) { toast('Adicione pelo menos um item', 'error'); return; }
  var venda = {
    data: data,
    cliente: cliente.razao + ' (COD ' + cod + ' / ' + (cliente.estado || '--') + ')',
    clienteCod: cod,
    vendedor: currentUser.id,
    itens: itens,
    qtdProdutos: qtdProdutos,
    total: total,
    estado: cliente.estado || '--',
    segmento: cliente.segmento || 'Outros',
    tipo: tipo,
    editadoPor: getNome(currentUser.id),
    editadoEm: new Date().toISOString()
  };
  saveData('vendas', venda);
  toast((tipo === 'venda' ? 'Venda' : 'Bonificacao') + ' salva: R$ ' + fmtBRL(total), 'success');
  renderTab('venda');
}

// ===== MINHAS VENDAS =====
function renderMinhasVendas() {
  return renderWeeklyBar() +
    '<h2 class="st2">Minhas Vendas</h2><p class="st3">Lancamentos do periodo.</p>' +
    '<div class="card"><h3>Filtros</h3><div class="filtros">' +
    '<div class="fg"><label>Tipo</label><select id="mv-tipo">' +
    '<option value="todos">Todos</option><option value="venda">Venda</option><option value="bonificacao">Bonificacao</option></select></div>' +
    filtroPeriodoHTML('mv') +
    '<div class="fg" style="display:flex;align-items:flex-end">' +
    '<button class="btn btn-p btn-s" onclick="aplicarFiltroPeriodo(\'mv\')">OK</button>' +
    '<button class="btn btn-a btn-s" onclick="limparFiltroPeriodo(\'mv\')">Limpar</button>' +
    '</div></div></div>' +
    '<div id="mv-resumo"></div>' +
    '<div class="card"><h3>Vendas Lancadas</h3><div id="mv-tabela"></div></div>';
}
window['_filtro_mv'] = function (p, ini, fim, mes, ano) {
  var tipo = document.getElementById('mv-tipo').value;
  var vF = getMinhasVendas().filter(function (v) {
    if (tipo === 'venda' && (v.tipo || 'venda') !== 'venda') { return false; }
    if (tipo === 'bonificacao' && v.tipo !== 'bonificacao') { return false; }
    return passaFiltroPeriodo(v.data, p, ini, fim, mes, ano);
  });
  var vendaT = vF.filter(function (v) { return (v.tipo || 'venda') === 'venda'; })
    .reduce(function (s, x) { return s + (parseFloat(x.total) || 0); }, 0);
  var bonifT = vF.filter(function (v) { return v.tipo === 'bonificacao'; })
    .reduce(function (s, x) { return s + (parseFloat(x.total) || 0); }, 0);
  var res = document.getElementById('mv-resumo');
  if (res) {
    res.innerHTML = '<div class="sg">' +
      '<div class="sc"><div class="lb">Total Vendido</div><div class="vl num">R$ ' + fmtBRL(vendaT) + '</div></div>' +
      '<div class="sc w"><div class="lb">Bonificacoes</div><div class="vl num">R$ ' + fmtBRL(bonifT) + '</div></div>' +
      '<div class="sc"><div class="lb">Total Geral</div><div class="vl num">R$ ' + fmtBRL(vendaT + bonifT) + '</div></div>' +
      '<div class="sc"><div class="lb">Registros</div><div class="vl num">' + vF.length + '</div></div>' +
      '</div>';
  }
  var tab = document.getElementById('mv-tabela');
  if (!tab) { return; }
  tab.innerHTML = vF.length
    ? '<div class="tbl-wrap"><table><thead><tr>' +
      '<th>Data</th><th>Cliente</th><th>Cod</th><th>Tipo</th><th>Itens</th><th class="tcc">Qtd</th><th class="tcr">Total</th>' +
      '</tr></thead><tbody>' +
      vF.slice().sort(function (a, b) { return b.data.localeCompare(a.data); }).map(function (v) {
        var it = (v.itens && v.itens.length) ? v.itens.map(function (x) { return x.qtd + 'x ' + x.nome; }).join(', ') : '--';
        return '<tr><td>' + v.data + '</td><td>' + v.cliente + '</td>' +
          '<td class="tcc">' + (codVenda(v) || '--') + '</td>' +
          '<td>' + (v.tipo === 'bonificacao' ? '<span class="tipo-badge bonificacao">Bonif</span>' : '<span class="tipo-badge venda">Venda</span>') + '</td>' +
          '<td style="font-size:.74rem">' + it + '</td>' +
          '<td class="tcc">' + (v.qtdProdutos || 0) + '</td>' +
          '<td class="tcr num">R$ ' + fmtBRL(v.total) + '</td></tr>';
      }).join('') + '</tbody></table></div>'
    : '<div class="es"><div class="ic">📋</div><p>Nenhuma venda no filtro.</p></div>';
};

// ===== ATIVIDADES (vendedor) — Ligacao com status =====
function renderAtividades() {
  var atividades = loadData('atividades');
  var minhas = atividades.filter(function (a) { return a.vendedor === currentUser.id; });
  var ligs = minhas.filter(function (a) { return a.tipo === 'ligacao'; });
  var demais = minhas.filter(function (a) { return a.tipo !== 'ligacao'; });
  var html = '<h2 class="st2">Atividades</h2>' +
    '<p class="st3">Ligacoes: nome, numero, horario e duracao. Status automatico: Conectada (acima de 1 min) ou Sem resposta.</p>' +
    '<div class="card"><h3>Registrar Atividade</h3>' +
    '<div class="fr">' +
    '<div class="fg"><label>Data</label><input type="date" id="at-data" value="' + new Date().toISOString().split('T')[0] + '"></div>' +
    '<div class="fg"><label>Tipo</label><select id="at-tipo" onchange="toggleCamposLigacao()">' +
    '<option value="ligacao">Ligacao</option><option value="prospeccao">Prospeccao</option>' +
    '<option value="visita">Visita</option><option value="email">E-mail</option></select></div>' +
    '<div class="fg"><label>Quantidade</label><input type="number" id="at-qtd" value="1" min="1"></div>' +
    '</div>' +
    '<div id="at-ligacao-campos">' +
    '<div class="fr">' +
    '<div class="fg"><label>Nome do Cliente / Contato</label><input type="text" id="at-cliente" placeholder="Nome"></div>' +
    '<div class="fg"><label>Numero (Telefone)</label><input type="text" id="at-telefone" placeholder="(00) 00000-0000" maxlength="15" oninput="maskTelefone(this)"></div>' +
    '<div class="fg"><label>Horario</label><input type="time" id="at-horario"></div>' +
    '<div class="fg"><label>Duracao (minutos)</label><input type="number" id="at-duracao" placeholder="Ex: 0,5 ou 3" step="0.1" min="0"></div>' +
    '</div>' +
    '<div class="metrica-dica"><strong>Ligacao:</strong> duracao acima de 1 min = <strong>Conectada</strong>; caso contrario = <strong>Sem resposta</strong>.</div>' +
    '</div>' +
    '<div class="fr">' +
    '<div class="fg"><label>Status (demais tipos)</label><select id="at-status">' +
    '<option value="aberta">Aberta</option><option value="convertida">Convertida</option><option value="perdida">Perdida</option></select></div>' +
    '<div class="fg"><label>Data Inicio (oportunidade)</label><input type="date" id="at-inicio"></div>' +
    '<div class="fg"><label>Observacao</label><textarea id="at-obs" rows="1" placeholder="Opcional"></textarea></div>' +
    '</div>' +
    '<button class="btn btn-p" onclick="saveAtividade()">OK — Salvar Atividade</button>' +
    '</div>';
  html += '<div class="card"><h3>Ligacoes Realizadas (' + ligs.length + ')</h3>' +
    (ligs.length
      ? '<div class="tbl-wrap"><table><thead><tr>' +
        '<th>Data</th><th>Nome</th><th>Numero</th><th>Horario</th><th class="tcc">Duracao</th><th>Status</th><th>Acoes</th>' +
        '</tr></thead><tbody>' +
        ligs.slice().sort(function (a, b) { return b.data.localeCompare(a.data); }).map(function (a) {
          var conect = a.status === 'conectada' || parseFloat(a.duracao) > 1;
          var idx = atividades.indexOf(a);
          return '<tr><td>' + a.data + '</td><td>' + (a.clienteNome || '--') + '</td>' +
            '<td>' + (a.telefone || '--') + '</td><td>' + (a.horario || '--') + '</td>' +
            '<td class="tcc">' + (a.duracao !== undefined && a.duracao !== '' ? parseFloat(a.duracao).toFixed(1) + ' min' : '--') + '</td>' +
            '<td>' + (conect ? '<span class="tipo-badge venda">Conectada</span>' : '<span class="tipo-badge bonificacao">Sem resposta</span>') + '</td>' +
            '<td><button class="del-btn" onclick="delAtividade(' + idx + ')">Excluir</button></td></tr>';
        }).join('') + '</tbody></table></div>'
      : '<div class="es"><div class="ic">📞</div><p>Nenhuma ligacao registrada ainda.</p></div>') +
    '</div>';
  html += '<div class="card"><h3>Demais Atividades</h3>' +
    (demais.length
      ? '<div class="tbl-wrap"><table><thead><tr>' +
        '<th>Data</th><th>Tipo</th><th class="tcc">Qtd</th><th>Status</th><th>Obs</th><th>Acoes</th>' +
        '</tr></thead><tbody>' +
        demais.map(function (a) {
          var idx = atividades.indexOf(a);
          return '<tr><td>' + a.data + '</td><td>' + a.tipo + '</td><td class="tcc">' + (a.qtd || 1) + '</td>' +
            '<td>' + (a.status || 'aberta') + '</td><td>' + (a.obs || '') + '</td>' +
            '<td><button class="del-btn" onclick="delAtividade(' + idx + ')">Excluir</button></td></tr>';
        }).join('') + '</tbody></table></div>'
      : '<div class="es"><div class="ic">📋</div><p>Nenhuma atividade registrada ainda.</p></div>') +
    '</div>';
  return html;
}
function toggleCamposLigacao() {
  var tipo = document.getElementById('at-tipo').value;
  var div = document.getElementById('at-ligacao-campos');
  if (div) { div.style.display = (tipo === 'ligacao') ? 'block' : 'none'; }
}
function saveAtividade() {
  var data = document.getElementById('at-data').value;
  var tipo = document.getElementById('at-tipo').value;
  var qtd = parseInt(document.getElementById('at-qtd').value) || 0;
  var obs = (document.getElementById('at-obs').value || '').trim();
  if (!data || !tipo) { toast('Preencha data e tipo', 'error'); return; }
  var atv = {
    data: data,
    tipo: tipo,
    qtd: qtd,
    obs: obs,
    vendedor: currentUser.id,
    editadoPor: getNome(currentUser.id),
    editadoEm: new Date().toISOString()
  };
  if (tipo === 'ligacao') {
    var dur = parseFloat(document.getElementById('at-duracao').value) || 0;
    atv.clienteNome = (document.getElementById('at-cliente').value || '').trim();
    atv.telefone = (document.getElementById('at-telefone').value || '').trim();
    atv.horario = document.getElementById('at-horario').value;
    atv.duracao = dur;
    atv.status = dur > 1 ? 'conectada' : 'sem_resposta';
    if (!atv.telefone) { toast('Preencha o numero da ligacao', 'error'); return; }
    toast('Ligacao salva como ' + (atv.status === 'conectada' ? 'CONECTADA (mais de 1 min)' : 'SEM RESPOSTA'), 'success');
  } else {
    atv.status = document.getElementById('at-status').value;
    atv.dataInicio = document.getElementById('at-inicio').value;
    toast('Atividade salva (' + tipo + ')', 'success');
  }
  saveData('atividades', atv);
  renderTab('atividades');
}
function delAtividade(i) {
  confirmarExclusao('Tem certeza que deseja excluir esta atividade?', function () {
    var a = loadData('atividades')[i];
    if (a && a._id) {
      deleteDoc('atividades', a._id);
      toast('Atividade excluida', 'success');
      renderTab('atividades');
    }
  });
}

// ===== INICIALIZACAO (restaura sessao completa — corrige o F5) =====
(function () {
  initDarkMode();
  carregarDeletados();
  initListener('usuarios');
  var saved = localStorage.getItem('mc_user');
  if (!saved) { return; }
  try {
    var savedObj = JSON.parse(saved);
    // RESTAURA DIRETO do localStorage, sem depender do Firestore carregar antes
    var user = USU.find(function (u) { return u.id === savedObj.id; })
      || {
        id: savedObj.id,
        nome: savedObj.nome || savedObj.id,
        nivel: savedObj.nivel || 'Junior',
        isM: savedObj.isM || false,
        permissao: savedObj.permissao || 'padrao'
      };
    currentUser = user;
    if (USU.filter(function (u) { return u.id === user.id; }).length === 0) { USU.push(user); }
    document.getElementById('ls').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    var b = document.getElementById('ub');
    b.textContent = getNome(user.id) + ' - ' + getNivel(user.id);
    b.className = 'badge' + (user.isM ? ' mg' : '');
    _abaAtual = abaInicialDoUsuario(user);
    initSidebar();
    montarConteudo();
    ['vendas', 'clientes', 'metas', 'atividades', 'usuarios', 'config'].forEach(function (k) { initListener(k); });
    syncUsuarios();
  } catch (e) {
    localStorage.removeItem('mc_user');
  }
})();
</script>
