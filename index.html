body{background:var(--bg);color:#1a1a2e}

.lc{background:#fff;padding:40px 32px;border-radius:16px;box-shadow:0 12px 48px rgba(0,0,0,.25);width:420px;max-width:92%}

.badge{background:var(--a);padding:4px 14px;border-radius:20px;font-size:.78rem;font-weight:600;text-transform:uppercase}

.sidebar.collapsed{width:0;padding:0;overflow:hidden;border:none}

.sidebar .nav-item:hover{color:var(--p);background:#f8f9fa}
.sidebar .nav-ico{font-size:1.1rem;width:20px;text-align:center}
.sidebar .nav-sep{height:1px;background:#e8e8e8;margin:8px 16px}
.sidebar .nav-title{padding:8px 20px;font-size:.72rem;color:var(--m);text-transform:uppercase;font-weight:600}

.sc{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--s);border-left:4px solid var(--a)}

.sc .vl{font-size:1.7rem;font-weight:700;color:var(--p)}

.pw{margin-bottom:14px}

.pb{height:20px;background:#e8e8e8;border-radius:10px;overflow:hidden}
.pf{height:100%;border-radius:10px;transition:width .8s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:.72rem;color:#fff;font-weight:600;min-width:30px}

.vc{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--s)}

.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.fg label{display:block;font-size:.78rem;color:var(--m);margin-bottom:5px;font-weight:500}
.fg input,.fg select,.fg textarea{width:100%;padding:11px;border:2px solid #e0e0e0;border-radius:8px;font-size:.9rem;outline:none;background:#fff}

.btn-f{width:100%;justify-content:center}
.btn-s{padding:8px 16px;font-size:.82rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}

#toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}

.cr{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border:2px solid #43a047;border-radius:12px;padding:24px;margin-top:16px;text-align:center}
.cr .am{font-size:2.2rem;font-weight:700;color:#2e7d32;margin:8px 0}

.cc{position:relative;height:300px;margin-top:16px}
.cc2{position:relative;height:400px;margin-top:16px}
.pc{display:flex;align-items:center;justify-content:space-between;padding:16px;background:#fff;border-radius:10px;box-shadow:var(--s);margin-bottom:12px;gap:8px;flex-wrap:wrap}
.pc .pi{display:flex;align-items:center;gap:12px}
.pe{display:grid;grid-template-columns:1fr 80px 120px 40px;gap:8px;align-items:center;padding:10px;background:#f8f9fa;border-radius:8px;margin-bottom:8px}

.st{background:var(--p);color:#fff;padding:16px;border-radius:10px;text-align:center;font-size:1.1rem;font-weight:600;margin-top:12px}
.es{text-align:center;padding:40px;color:var(--m)}.es .ic{font-size:2.5rem;margin-bottom:12px;opacity:.3}

.pct-fill{height:100%;border-radius:4px;background:var(--a)}

.search-box input:focus{border-color:var(--a)}
.accordion{border:1px solid #e0e0e0;border-radius:8px;margin-bottom:8px;overflow:hidden}
.accordion-hd{padding:12px 16px;background:#f0f7ff;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--p);font-size:.9rem}

.accordion-ico{transition:transform .2s}
.accordion-ico.open{transform:rotate(90deg)}
.action-btns{display:flex;gap:6px;flex-wrap:wrap}

.pred-item{background:#fff;padding:12px;border-radius:8px;text-align:center}

function loadData(k){

return cacheDados[k];

var local=JSON.parse(localStorage.getItem('mc_'+k)||'[]');

function sincronizar(k){
fetch(API_URL+'?action=read&sheet='+k)
.then(function(r){return r.json()})
.then(function(data){
if(Array.isArray(data)){
data.forEach(function(row){
if(k==='metas'&&typeof row.marcasDetalhe==='string'){
try{row.marcasDetalhe=JSON.parse(row.marcasDetalhe)}catch(e){row.marcasDetalhe=[]}
}
if(k==='vendas'&&typeof row.itens==='string'){
try{row.itens=JSON.parse(row.itens)}catch(e){row.itens=[]}
}
if(k==='vendas'){
row.total=parseFloat(row.total)||0;
row.qtdProdutos=parseInt(row.qtdProdutos)||0;
}
if(k==='metas'){
row.ligacoes=parseInt(row.ligacoes)||0;
row.prospeccao=parseInt(row.prospeccao)||0;
row.produtos=parseInt(row.produtos)||0;
row.valorVenda=parseFloat(row.valorVenda)||0;
row.semana=parseInt(row.semana)||1;
}
if(k==='atividades'){
row.qtd=parseInt(row.qtd)||0;
}
if(k==='clientes'){
row.cod=String(row.cod||'');
row.razao=String(row.razao||'');
row.cidade=String(row.cidade||'');
row.estado=String(row.estado||'');
row.segmento=String(row.segmento||'');
row.vendedorId=String(row.vendedorId||'');
}
});
cacheDados[k]=data;
cacheExpira[k]=Date.now();
localStorage.setItem('mc_'+k,JSON.stringify(data));
var active=document.querySelector('.tc.act');
if(active)renderTab(active.id.replace('tc-',''));
}
})
.catch(function(){});
}

function saveData(k,d){
localStorage.setItem('mc_'+k,JSON.stringify(d));
if(k==='vendas'||k==='clientes'||k==='metas'||k==='atividades'){
fetch(API_URL+'?action=sync&sheet='+k+'&data='+encodeURIComponent(JSON.stringify(d)))
.then(function(r){return r.json()})
.then(function(res){
if(res.success){
toast('Sincronizado com a nuvem!','success');
sincronizar(k);
}
})
.catch(function(){
toast('Salvo local. Sincronizara online.','info');
});
}
}

}function renderOverview(){
var vendas=loadData('vendas');
var metas=loadData('metas');
var atividades=loadData('atividades');
var vAtivos=getVendedores();
var tV=0,tL=0,tP=0,tPr=0;
var cards=vAtivos.map(function(v){
var vV=vendas.filter(function(x){return x.vendedor===v.id});
var vA=atividades.filter(function(x){return x.vendedor===v.id});
var vM=metas.filter(function(x){return x.vendedor===v.id});
var vTotV=vV.reduce(function(s,x){return s+(parseFloat(x.total)||0)},0);
var vL=vA.filter(function(x){return x.tipo==='ligacao'}).reduce(function(s,x){return s+(parseInt(x.qtd)||0)},0);
var vP=vA.filter(function(x){return x.tipo==='prospeccao'}).reduce(function(s,x){return s+(parseInt(x.qtd)||0)},0);
var vPr=vV.reduce(function(s,x){return s+(parseInt(x.qtdProdutos)||0)},0);
tV+=vTotV;tL+=vL;tP+=vP;tPr+=vPr;
var m=vM[vM.length-1]||{};
var pV=m.valorVenda?Math.min(100,(vTotV/m.valorVenda)*100):0;
var pL=m.ligacoes?Math.min(100,(vL/m.ligacoes)*100):0;
var pP=m.prospeccao?Math.min(100,(vP/m.prospeccao)*100):0;
var pPr=m.produtos?Math.min(100,(vPr/m.produtos)*100):0;
var nv=getNivel(v.id);
return '<div class="vc">'+
'<div class="vh"><span class="vn">'+getNome(v.id)+'</span>'+
'<span class="vlv '+nv.toLowerCase()+'">'+nv+'</span></div>'+
progressBar('Vendas (R$)',vTotV,m.valorVenda||0,pV)+
progressBar('Ligacoes',vL,m.ligacoes||0,pL)+
progressBar('Prospeccao',vP,m.prospeccao||0,pP)+
progressBar('Produtos',vPr,m.produtos||0,pPr)+'</div>';
}).join('');
return '<h2 class="st2">Visao Geral</h2>'+
'<div class="sg">'+
'<div class="sc '+(tV>0?'s':'')+'"><div class="lb">Faturamento</div>'+
'<div class="vl">R$ '+fmtBRL(tV)+'</div>'+
'<div class="sb">'+vendas.length+' vendas</div></div>'+
'<div class="sc"><div class="lb">Ligacoes</div><div class="vl">'+tL+'</div></div>'+
'<div class="sc"><div class="lb">Prospeccao</div><div class="vl">'+tP+'</div></div>'+
'<div class="sc"><div class="lb">Produtos</div><div class="vl">'+tPr+'</div></div>'+
'</div>'+
'<div class="card"><h3>Performance</h3><div class="cc"><canvas id="chOv"></canvas></div></div>'+
'<div class="vg">'+cards+'</div>';
}

function filtrarRelAtiv(){
var atividades=loadData('atividades');
var periodo=document.getElementById('ra-periodo').value;
var inicio=document.getElementById('ra-inicio').value;
var fim=document.getElementById('ra-fim').value;
var vend=document.getElementById('ra-vend').value;
var tipo=document.getElementById('ra-tipo').value;
var filtradas=atividades.filter(function(a){
if(vend&&a.vendedor!==vend)return false;
if(tipo&&a.tipo!==tipo)return false;
if(inicio&&a.data<inicio)return false;
if(fim&&a.data>fim)return false;
if(periodo!=='todos'&&periodo&&inicio){
var dataAtiv=new Date(a.data);
var dataIni=new Date(inicio);
var diff=diasEntre(dataIni,dataAtiv);
if(periodo==='diario'&&diff!==0)return false;
if(periodo==='semanal'&&diff>7)return false;
if(periodo==='mensal'&&diff>30)return false;
if(periodo==='anual'&&diff>365)return false;
}
return true;
});
var html='';
if(filtradas.length===0){
html='<div class="es"><div class="ic">SEM</div><p>Nenhuma atividade no periodo.</p></div>';
}else{
var totLig=filtradas.filter(function(a){return a.tipo==='ligacao'}).reduce(function(s,a){return s+(parseInt(a.qtd)||0)},0);
var totPro=filtradas.filter(function(a){return a.tipo==='prospeccao'}).reduce(function(s,a){return s+(parseInt(a.qtd)||0)},0);
var totVis=filtradas.filter(function(a){return a.tipo==='visita'}).reduce(function(s,a){return s+(parseInt(a.qtd)||0)},0);
var totEm=filtradas.filter(function(a){return a.tipo==='email'}).reduce(function(s,a){return s+(parseInt(a.qtd)||0)},0);
var totWh=filtradas.filter(function(a){return a.tipo==='whatsapp'}).reduce(function(s,a){return s+(parseInt(a.qtd)||0)},0);
html='<div class="sg">'+
'<div class="sc"><div class="lb">Ligacoes</div><div class="vl">'+totLig+'</div></div>'+
'<div class="sc"><div class="lb">Prospeccao</div><div class="vl">'+totPro+'</div></div>'+
'<div class="sc"><div class="lb">Visitas</div><div class="vl">'+totVis+'</div></div>'+
'<div class="sc"><div class="lb">E-mails</div><div class="vl">'+totEm+'</div></div>'+
'<div class="sc"><div class="lb">WhatsApp</div><div class="vl">'+totWh+'</div></div>'+
'</div>';
html+='<table><thead><tr><th>Data</th><th>Vendedor</th><th>Tipo</th><th>Qtd</th><th>Obs</th></tr></thead><tbody>';
filtradas.forEach(function(a){
html+='<tr><td>'+a.data+'</td><td>'+getNome(a.vendedor)+'</td>'+
'<td>'+(a.tipo||'--')+'</td><td class="tcc">'+(a.qtd||0)+'</td>'+
'<td>'+(a.obs||'')+'</td></tr>';
});
html+='</tbody></table>';
}
var div=document.getElementById('ra-result');
if(div)div.innerHTML=html;
}

function diasEntre(d1,d2){
var ms=d2.getTime()-d1.getTime();
return Math.floor(ms/(1000*60*60*24));
}

function analisaCliente(){
var cod=document.getElementById('ac-cli').value;
if(!cod){document.getElementById('ac-result').innerHTML='';return}
var vendas=loadData('vendas');
var cliente=getClienteByCod(cod);
var vCli=vendas.filter(function(v){
var m=v.cliente.match(/COD\s+(\S+)/);
return m&&m[1]===cod;
});
vCli.sort(function(a,b){return a.data.localeCompare(b.data)});
var html='';
if(vCli.length===0){
html='<div class="card"><div class="es"><div class="ic">SEM</div>'+
'<p>Nenhuma compra registrada para este cliente.</p></div></div>';
}else{
var totGeral=vCli.reduce(function(s,v){return s+(parseFloat(v.total)||0)},0);
var qtdProd=vCli.reduce(function(s,v){return s+(parseInt(v.qtdProdutos)||0)},0);
var mediaTicket=totGeral/vCli.length;
var todasDatas=vCli.map(function(v){return v.data});
var primeira=todasDatas[0];
var ultima=todasDatas[todasDatas.length-1];
var intervalos=[];
for(var i=1;i<vCli.length;i++){
var d1=new Date(vCli[i-1].data);
var d2=new Date(vCli[i].data);
intervalos.push(diasEntre(d1,d2));
}
var intervaloMedio=intervalos.length?
Math.round(intervalos.reduce(function(s,x){return s+x},0)/intervalos.length):0;
var produtosFreq={};
vCli.forEach(function(v){
if(v.itens){
v.itens.forEach(function(it){
var nome=it.nome||it.cod;
if(!produtosFreq[nome])produtosFreq[nome]={qtd:0,vezes:0};
produtosFreq[nome].qtd+=parseInt(it.qtd)||0;
produtosFreq[nome].vezes++;
});
}
});
var prodsOrdenados=Object.keys(produtosFreq).sort(function(a,b){
return produtosFreq[b].vezes-produtosFreq[a].vezes;
});
var ultCompra=vCli[vCli.length-1];
var prodsUltima=(ultCompra.itens||[]).map(function(it){return it.nome||it.cod});
var prodsAnteriores=[];
for(var j=0;j<vCli.length-1;j++){
(vCli[j].itens||[]).forEach(function(it){
var n=it.nome||it.cod;
if(prodsAnteriores.indexOf(n)<0)prodsAnteriores.push(n);
});
}
var novosProds=prodsUltima.filter(function(p){return prodsAnteriores.indexOf(p)<0});
var prodsPrevistos=[];
prodsOrdenados.forEach(function(p){
if(produtosFreq[p].vezes>=Math.ceil(vCli.length/2)){
prodsPrevistos.push(p);
}
});
prodsUltima.forEach(function(p){
if(prodsPrevistos.indexOf(p)<0)prodsPrevistos.push(p);
});
var valorPrevisto=mediaTicket;
if(novosProds.length>0){
valorPrevisto=mediaTicket*1.15;
}
var dataPrevista='--';
if(intervaloMedio>0){
var dUlt=new Date(ultima);
dUlt.setDate(dUlt.getDate()+intervaloMedio);
dataPrevista=dUlt.toISOString().split('T')[0];
}
html='<div class="card"><h3>'+(cliente?cliente.razao:'Cliente '+cod)+'</h3>'+
'<div class="sg">'+
'<div class="sc s"><div class="lb">Total Compras</div><div class="vl">'+vCli.length+'</div></div>'+
'<div class="sc"><div class="lb">Faturamento Total</div><div class="vl">R$ '+fmtBRL(totGeral)+'</div></div>'+
'<div class="sc"><div class="lb">Ticket Medio</div><div class="vl">R$ '+fmtBRL(mediaTicket)+'</div></div>'+
'<div class="sc"><div class="lb">Produtos Comprados</div><div class="vl">'+qtdProd+'</div></div>'+
'<div class="sc"><div class="lb">Intervalo Medio</div><div class="vl">'+intervaloMedio+' dias</div></div>'+
'</div></div>';
html+='<div class="card"><h3>Historico de Compras</h3>'+
'<table><thead><tr><th>Data</th><th>Itens</th><th>Qtd</th><th>Total</th></tr></thead><tbody>';
vCli.forEach(function(v){
var itensStr=(v.itens&&v.itens.length)?
v.itens.map(function(it){return it.qtd+'x '+it.nome}).join(', '):'--';
html+='<tr><td>'+v.data+'</td><td style="font-size:.78rem">'+itensStr+'</td>'+
'<td class="tcc">'+(v.qtdProdutos||0)+'</td>'+
'<td class="tcr">R$ '+fmtBRL(v.total)+'</td></tr>';
});
html+='</tbody></table></div>';
html+='<div class="card"><h3>Produtos Mais Comprados</h3>'+
'<table><thead><tr><th>Produto</th><th>Qtd Total</th><th>Frequencia</th></tr></thead><tbody>';
prodsOrdenados.forEach(function(p){
html+='<tr><td>'+p+'</td><td class="tcc">'+produtosFreq[p].qtd+'</td>'+
'<td class="tcc">'+produtosFreq[p].vezes+'x</td></tr>';
});
html+='</tbody></table></div>';
html+='<div class="pred-card"><h4>Previsao do Proximo Pedido</h4>'+
'<div class="pred-grid">'+
'<div class="pred-item"><div class="pred-label">Data Estimada</div>'+
'<div class="pred-value">'+dataPrevista+'</div></div>'+
'<div class="pred-item"><div class="pred-label">Valor Estimado</div>'+
'<div class="pred-value">R$ '+fmtBRL(valorPrevisto)+'</div></div>'+
'<div class="pred-item"><div class="pred-label">Intervalo</div>'+
'<div class="pred-value">'+intervaloMedio+' dias</div></div>'+
'</div>';
html+='<div class="pred-prod-list"><strong>Produtos Previstos:</strong><ul>';
if(prodsPrevistos.length){
prodsPrevistos.forEach(function(p){
html+='<li>'+p+'</li>';
});
}else{
html+='<li>Nenhum padrao identificado ainda</li>';
}
html+='</ul>';
if(novosProds.length){
html+='<div style="margin-top:8px;padding-top:8px;border-top:1px solid #e3f2fd">'+
'<strong style="color:#1565c0">Produtos novos na ultima compra:</strong><br>'+
novosProds.join(', ')+'</div>';
}
html+='</div></div>';
}
var div=document.getElementById('ac-result');
if(div)div.innerHTML=html;
}

html+='<tr'+(ativa?' style="background:#e8f5e9;font-weight:600"':'')+'>'+
'<td>'+(ativa?'>> ':'')+'</td>'+
'<td>R$ '+fmtBRL(f.min)+'</td>'+

}

function toggleCalc(){document.getElementById('calcPanel').classList.toggle('open')}
function calcUpdate(){document.getElementById('calcDisplay').textContent=calcCurrent}
function calcNum(n){if(calcReset){calcCurrent='0';calcReset=false}if(n==='.'&&calcCurrent.indexOf('.')>=0)return;if(calcCurrent==='0'&&n!=='.')calcCurrent=n;else calcCurrent+=n;calcUpdate()}
function calcOp(op){if(calcPrev!==null)calcEq();calcPrev=parseFloat(calcCurrent);calcOperator=op;calcReset=true}
function calcEq(){if(calcPrev===null||calcOperator===null)return;var cur=parseFloat(calcCurrent);var r=0;if(calcOperator==='+')r=calcPrev+cur;if(calcOperator==='-')r=calcPrev-cur;if(calcOperator==='*')r=calcPrev*cur;if(calcOperator==='/')r=cur===0?0:calcPrev/cur;if(calcOperator==='%')r=calcPrev%cur;calcCurrent=String(Math.round(r*100)/100);calcPrev=null;calcOperator=null;calcReset=true;calcUpdate()}
function calcClear(){calcCurrent='0';calcPrev=null;calcOperator=null;calcUpdate()}
function calcDel(){calcCurrent=calcCurrent.length>1?calcCurrent.slice(0,-1):'0';calcUpdate()}
</script>
