<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Comercial Magil Clean</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Samsung One Display','Segoe UI',system-ui,sans-serif}
:root{--p:#1428a0;--p2:#1a237e;--a:#00bcd4;--bg:#f7f8fa;--m:#8c8c8c;--r:16px;--s:0 1px 8px rgba(0,0,0,.06);--sbw:260px}
body{background:var(--bg);color:#1a1a1a}
#ls{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1428a0,#00bcd4)}
.lc{background:#fff;padding:48px 36px;border-radius:24px;box-shadow:0 16px 64px rgba(0,0,0,.2);width:440px;max-width:92%}
.lc h1{color:var(--p);font-size:1.6rem;text-align:center;margin-bottom:4px;font-weight:700}
.lc p{text-align:center;color:var(--m);font-size:.85rem;margin-bottom:28px}
.lc select,.lc input{width:100%;padding:14px 16px;margin-bottom:14px;border:2px solid #e8e8e8;border-radius:12px;font-size:1rem;outline:none;background:#f7f8fa;transition:.2s}
.lc select:focus,.lc input:focus{border-color:var(--p);background:#fff}
.lc button{width:100%;padding:16px;background:var(--p);color:#fff;border:none;border-radius:12px;font-size:1.05rem;font-weight:600;cursor:pointer;transition:.2s}
.lc button:hover{background:#0d1a6e;transform:translateY(-1px)}
.lc .hint{text-align:center;font-size:.72rem;color:var(--m);margin-top:12px;padding:10px;background:#f7f8fa;border-radius:10px}
#app{display:none}
#hd{background:#fff;color:#1a1a1a;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.06);border-bottom:1px solid #eee}
#hd .hl{display:flex;align-items:center;gap:14px}
#hd h2{font-size:1.2rem;color:var(--p);font-weight:700}
#hd .hr{display:flex;align-items:center;gap:14px}
.sidebar-toggle{background:#f7f8fa;border:1px solid #e8e8e8;color:var(--p);padding:10px 14px;border-radius:10px;cursor:pointer;font-size:1.2rem;transition:.2s}
.sidebar-toggle:hover{background:#e8e8e8}
.badge{background:var(--p);color:#fff;padding:6px 16px;border-radius:20px;font-size:.78rem;font-weight:600}
.badge.mg{background:#ffd54f;color:var(--p)}
.bl{background:#f7f8fa;color:var(--p);border:1px solid #e8e8e8;padding:10px 18px;border-radius:10px;cursor:pointer;font-size:.82rem;font-weight:600;transition:.2s}
.bl:hover{background:#e8e8e8}
#main{display:flex;min-height:calc(100vh - 65px)}
.sidebar{width:var(--sbw);background:#fff;border-right:1px solid #eee;padding:12px 0;overflow-y:auto;position:sticky;top:65px;height:calc(100vh - 65px);flex-shrink:0;transition:width .3s}
.sidebar.collapsed{width:0;padding:0;overflow:hidden;border:none}
.sidebar.collapsed .nav-item,.sidebar.collapsed .nav-title,.sidebar.collapsed .nav-sep{display:none}
.sidebar .nav-item{padding:14px 24px;cursor:pointer;font-size:.9rem;color:#555;border-left:3px solid transparent;font-weight:500;transition:.2s;display:flex;align-items:center;gap:12px}
.sidebar .nav-item.act{color:var(--p);border-left-color:var(--p);font-weight:600;background:#f0f4ff}
.sidebar .nav-item:hover{color:var(--p);background:#f7f8fa}
.sidebar .nav-ico{font-size:1.1rem;width:22px;text-align:center}
.sidebar .nav-sep{height:1px;background:#eee;margin:10px 20px}
.sidebar .nav-title{padding:10px 24px;font-size:.7rem;color:var(--m);text-transform:uppercase;font-weight:700;letter-spacing:.05em}
.content{flex:1;padding:28px;overflow-x:auto}
.tc{display:none}.tc.act{display:block}
.card{background:#fff;border-radius:var(--r);padding:28px;box-shadow:var(--s);margin-bottom:20px;border:1px solid #eee}
.card h3{color:var(--p);font-size:1.1rem;margin-bottom:18px;font-weight:700}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.sc{background:#fff;border-radius:var(--r);padding:24px;box-shadow:var(--s);border:1px solid #eee;border-top:4px solid var(--a)}
.sc .lb{font-size:.72rem;color:var(--m);margin-bottom:8px;text-transform:uppercase;font-weight:600;letter-spacing:.03em}
.sc .vl{font-size:1.8rem;font-weight:700;color:var(--p)}
.sc .sb{font-size:.72rem;color:var(--m);margin-top:6px}
.sc.w{border-top-color:#ffb300}.sc.d{border-top-color:#e53935}.sc.s{border-top-color:#43a047}
.pw{margin-bottom:16px}
.pw .pl{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:6px}
.pw .pl span:first-child{color:var(--m)}.pw .pl span:last-child{font-weight:600;color:#333}
.pb{height:8px;background:#eee;border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;transition:width .8s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:.68rem;color:#fff;font-weight:600;min-width:30px}
.pf.lo{background:linear-gradient(90deg,#e53935,#ef5350)}.pf.mi{background:linear-gradient(90deg,#ff8f00,#ffb300)}.pf.hi{background:linear-gradient(90deg,#2e7d32,#43a047)}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.vc{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--s);border:1px solid #eee}
.vc .vh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #eee}
.vc .vn{font-weight:700;color:var(--p)}
.vlv{font-size:.68rem;padding:4px 12px;border-radius:12px;color:#fff;font-weight:600;text-transform:uppercase}
.vlv.junior{background:#78909c}.vlv.pleno{background:var(--p)}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.fg label{display:block;font-size:.78rem;color:var(--m);margin-bottom:6px;font-weight:600}
.fg input,.fg select,.fg textarea{width:100%;padding:12px 14px;border:2px solid #e8e8e8;border-radius:10px;font-size:.9rem;outline:none;background:#f7f8fa;transition:.2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--p);background:#fff}
.btn{padding:12px 24px;border:none;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:#0d1a6e;transform:translateY(-1px)}
.btn-a{background:var(--a);color:#fff}.btn-a:hover{background:#00838f}
.btn-d{background:#e53935;color:#fff}.btn-d:hover{background:#c62828}
.btn-f{width:100%;justify-content:center}
.btn-s{padding:8px 16px;font-size:.82rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{background:var(--p);color:#fff;padding:14px 16px;text-align:left;font-weight:600;font-size:.8rem;border-radius:0}
th:first-child{border-radius:10px 0 0 0}th:last-child{border-radius:0 10px 0 0}
td{padding:12px 16px;border-bottom:1px solid #eee}
tr:hover{background:#f7f8fa}
.tcr{text-align:right}.tcc{text-align:center}
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.tm{padding:14px 20px;border-radius:12px;color:#fff;font-size:.88rem;box-shadow:0 4px 24px rgba(0,0,0,.12);display:flex;align-items:center;gap:10px;max-width:360px}
.tm.success{background:#2e7d32}.tm.error{background:#c62828}.tm.info{background:var(--p)}
.cr{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border:2px solid #43a047;border-radius:16px;padding:28px;margin-top:16px;text-align:center}
.cr .am{font-size:2.4rem;font-weight:700;color:#2e7d32;margin:8px 0}
.cr .dt{font-size:.85rem;color:#555}
.cc{position:relative;height:300px;margin-top:16px}
.pc{display:flex;align-items:center;justify-content:space-between;padding:18px;background:#fff;border-radius:14px;box-shadow:var(--s);border:1px solid #eee;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.pc .pi{display:flex;align-items:center;gap:12px}
.pe{display:grid;grid-template-columns:1fr 80px 120px 40px;gap:8px;align-items:center;padding:12px;background:#f7f8fa;border-radius:10px;margin-bottom:8px}
.pe select,.pe input{padding:10px;border:1px solid #ddd;border-radius:8px;font-size:.85rem;width:100%}
.pe .rb{background:#e53935;color:#fff;border:none;border-radius:8px;cursor:pointer;padding:10px;font-size:1rem}
.st{background:var(--p);color:#fff;padding:18px;border-radius:12px;text-align:center;font-size:1.1rem;font-weight:600;margin-top:12px}
.es{text-align:center;padding:48px;color:var(--m)}.es .ic{font-size:2.5rem;margin-bottom:12px;opacity:.3}
.st2{font-size:1.4rem;color:var(--p);margin-bottom:24px;font-weight:700}
.dv{height:1px;background:#eee;margin:24px 0}
.del-btn{background:#e53935;color:#fff;border:none;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:.78rem;font-weight:600;transition:.2s}
.del-btn:hover{background:#c62828}
.edit-btn{background:var(--a);color:#fff;border:none;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:.78rem;font-weight:600;transition:.2s}
.edit-btn:hover{background:#00838f}
.inp-sm{padding:10px;border:1px solid #ddd;border-radius:8px;font-size:.85rem}
.filtros{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:flex-end}
.filtros .fg{min-width:160px}
.action-btns{display:flex;gap:6px;flex-wrap:wrap}
.mp-row{display:grid;grid-template-columns:1fr 100px 40px;gap:8px;align-items:center;padding:10px;background:#f7f8fa;border-radius:10px;margin-bottom:8px}
.mp-row select,.mp-row input{padding:10px;border:1px solid #ddd;border-radius:8px;font-size:.85rem;width:100%}
.mp-row .rb{background:#e53935;color:#fff;border:none;border-radius:8px;cursor:pointer;padding:10px}
.date-filter{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:flex-end}
.date-filter .fg{min-width:140px}
.pred-card{background:linear-gradient(135deg,#e3f2fd,#bbdefb);border:2px solid #1976d2;border-radius:16px;padding:24px;margin-top:16px}
.pred-card h4{color:#1565c0;margin-bottom:12px;font-size:1rem;font-weight:700}
.pred-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.pred-item{background:#fff;padding:14px;border-radius:10px;text-align:center;border:1px solid #e3f2fd}
.pred-item .pred-label{font-size:.72rem;color:var(--m);text-transform:uppercase;margin-bottom:6px;font-weight:600}
.pred-item .pred-value{font-size:1.1rem;font-weight:700;color:var(--p)}
.pred-prod-list{background:#fff;padding:14px;border-radius:10px;margin-top:8px}
.pred-prod-list li{padding:6px 0;border-bottom:1px solid #e3f2fd;font-size:.85rem;list-style:none}
.pred-prod-list li:last-child{border:none}
.client-info{background:#f0f4ff;border-radius:12px;padding:14px;margin-bottom:12px;border-left:4px solid var(--p)}
.client-info .ci-label{font-size:.72rem;color:var(--m);text-transform:uppercase;font-weight:600}
.client-info .ci-value{font-size:.9rem;color:#333;font-weight:600;margin-top:2px}
.tipo-toggle{display:flex;gap:0;margin-bottom:16px;border-radius:12px;overflow:hidden;border:2px solid var(--p)}
.tipo-toggle button{flex:1;padding:14px;border:none;background:#f7f8fa;color:var(--m);font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.tipo-toggle button.act{background:var(--p);color:#fff}
.tipo-toggle button:hover:not(.act){background:#e8e8e8}
.tipo-badge{display:inline-block;padding:3px 10px;border-radius:8px;font-size:.72rem;font-weight:600;text-transform:uppercase}
.tipo-badge.venda{background:#e8f5e9;color:#2e7d32}
.tipo-badge.bonificacao{background:#fff3e0;color:#e65100}
.weekly-bar{background:linear-gradient(135deg,var(--p),#0d1a6e);color:#fff;border-radius:14px;padding:20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.weekly-bar .wb-info{display:flex;flex-direction:column;gap:4px}
.weekly-bar .wb-label{font-size:.72rem;opacity:.8;text-transform:uppercase;font-weight:600;letter-spacing:.05em}
.weekly-bar .wb-value{font-size:1.8rem;font-weight:700}
.weekly-bar .wb-progress{flex:1;min-width:200px;height:12px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
.weekly-bar .wb-progress-fill{height:100%;background:#00e676;border-radius:6px;transition:width .8s ease}
.weekly-bar .wb-pct{font-size:1.2rem;font-weight:700}
.com-hero{background:linear-gradient(135deg,var(--p),#0d1a6e);color:#fff;border-radius:20px;padding:32px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.com-hero .com-name{font-size:1.4rem;font-weight:700}
.com-hero .com-nivel{font-size:.85rem;opacity:.8;margin-top:4px}
.com-hero .com-total{font-size:2.5rem;font-weight:800}
.com-hero .com-total-label{font-size:.72rem;opacity:.7;text-transform:uppercase;letter-spacing:.05em}
.com-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.com-stat{background:#fff;border-radius:14px;padding:20px;border:1px solid #eee;box-shadow:0 1px 8px rgba(0,0,0,.06);text-align:center}
.com-stat .com-stat-label{font-size:.7rem;color:var(--m);text-transform:uppercase;font-weight:600;margin-bottom:8px;letter-spacing:.03em}
.com-stat .com-stat-value{font-size:1.6rem;font-weight:700;color:var(--p)}
.com-stat .com-stat-sub{font-size:.7rem;color:var(--m);margin-top:4px}
.com-stat.highlight{border-top:4px solid #43a047}
.com-stat.highlight .com-stat-value{color:#2e7d32}
.com-faixa-table{width:100%;border-collapse:collapse;font-size:.85rem;border-radius:12px;overflow:hidden}
.com-faixa-table th{background:var(--p);color:#fff;padding:14px;text-align:left;font-weight:600}
.com-faixa-table td{padding:12px 14px;border-bottom:1px solid #eee}
.com-faixa-table tr.ativa{background:#e8f5e9;font-weight:600}
.com-faixa-table tr.ativa td:first-child::before{content:'>> ';color:#43a047}
.com-accel{background:#f7f8fa;border-radius:16px;padding:24px;margin-top:16px}
.com-accel-title{font-size:1rem;font-weight:700;color:var(--p);margin-bottom:8px}
.com-accel-desc{font-size:.8rem;color:var(--m);margin-bottom:16px;line-height:1.5}
.com-week-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.com-week{background:#fff;border:2px solid #eee;border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:.2s}
.com-week:hover{border-color:var(--p);transform:translateY(-2px)}
.com-week.checked{background:#e8f5e9;border-color:#43a047}
.com-week .com-week-num{font-size:.68rem;color:var(--m);text-transform:uppercase;font-weight:600;margin-bottom:8px}
.com-week .com-week-icon{font-size:1.8rem}
.com-week .com-week-bonus{font-size:.75rem;font-weight:600;margin-top:6px;color:var(--p)}
.com-week.checked .com-week-bonus{color:#2e7d32}
.com-result{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border:2px solid #43a047;border-radius:20px;padding:32px;margin-top:20px;text-align:center}
.com-result .com-result-label{font-size:.75rem;color:#555;text-transform:uppercase;font-weight:600;margin-bottom:8px;letter-spacing:.05em}
.com-result .com-result-value{font-size:3rem;font-weight:800;color:#2e7d32;margin:8px 0}
.com-result .com-result-detail{font-size:.82rem;color:#555;margin-top:8px}
.com-result .com-result-badge{display:inline-block;background:#2e7d32;color:#fff;padding:4px 14px;border-radius:20px;font-size:.75rem;font-weight:600;margin-top:10px}
body.dark{background:#0f1117;color:#e0e0e0}
body.dark #hd{background:#1a1d29;color:#e0e0e0;border-bottom:1px solid #2a2d3a}
body.dark #hd h2{color:#3d5afe}
body.dark .sidebar{background:#1a1d29;border-right:1px solid #2a2d3a}
body.dark .sidebar .nav-item{color:#8c8c8c}
body.dark .sidebar .nav-item.act{color:#3d5afe;background:#1e2230;border-left-color:#3d5afe}
body.dark .sidebar .nav-item:hover{background:#1e2230}
body.dark .sidebar .nav-title{color:#8c8c8c}
body.dark .card{background:#1a1d29;border:1px solid #2a2d3a}
body.dark .card h3{color:#e0e0e0}
body.dark .sc{background:#1a1d29;border:1px solid #2a2d3a}
body.dark .sc .vl{color:#e0e0e0}
body.dark .sc .lb{color:#8c8c8c}
body.dark table th{background:#2a2d3a;color:#e0e0e0}
body.dark td{border-bottom:1px solid #2a2d3a}
body.dark tr:hover{background:#1e2230}
body.dark .fg input,body.dark .fg select,body.dark .fg textarea{background:#0f1117;border-color:#2a2d3a;color:#e0e0e0}
body.dark .fg input:focus,body.dark .fg select:focus,body.dark .fg textarea:focus{border-color:#3d5afe}
body.dark .btn-p{background:#3d5afe}
body.dark .lc{background:#1a1d29}
body.dark .lc h1{color:#3d5afe}
body.dark .lc select,body.dark .lc input{background:#0f1117;border-color:#2a2d3a;color:#e0e0e0}
body.dark .st{background:#3d5afe}
body.dark .pe{background:#0f1117}
body.dark .pe select,body.dark .pe input{background:#1a1d29;border-color:#2a2d3a;color:#e0e0e0}
body.dark .pc{background:#1a1d29;border:1px solid #2a2d3a}
body.dark .inp-sm{background:#0f1117;border-color:#2a2d3a;color:#e0e0e0}
body.dark .mp-row{background:#0f1117}
body.dark .mp-row select,body.dark .mp-row input{background:#1a1d29;border-color:#2a2d3a;color:#e0e0e0}
body.dark .pred-card{background:linear-gradient(135deg,#1a237e,#283593);border-color:#3d5afe}
body.dark .pred-item{background:#1a1d29;border:1px solid #2a2d3a}
body.dark .pred-prod-list{background:#1a1d29}
body.dark .cr{background:linear-gradient(135deg,#1b5e20,#2e7d32);border-color:#43a047}
body.dark .client-info{background:#1e2230;border-left-color:#3d5afe}
body.dark .badge{background:#3d5afe}
body.dark .bl{background:#1e2230;color:#3d5afe;border-color:#2a2d3a}
body.dark .sidebar-toggle{background:#1e2230;color:#3d5afe;border-color:#2a2d3a}
body.dark .es{color:#8c8c8c}
body.dark .dv{background:#2a2d3a}
body.dark .pb{background:#2a2d3a}
body.dark .vlv.junior{background:#546e7a}
body.dark .vlv.pleno{background:#3d5afe}
body.dark .com-hero{background:linear-gradient(135deg,#3d5afe,#1a237e)}
body.dark .com-stat{background:#1a1d29;border:1px solid #2a2d3a}
body.dark .com-stat .com-stat-value{color:#e0e0e0}
body.dark .com-stat.highlight .com-stat-value{color:#43a047}
body.dark .com-faixa-table th{background:#2a2d3a}
body.dark .com-faixa-table td{border-bottom:1px solid #2a2d3a}
body.dark .com-faixa-table tr.ativa{background:#1b3a1b}
body.dark .com-accel{background:#0f1117}
body.dark .com-week{background:#1a1d29;border:2px solid #2a2d3a}
body.dark .com-week:hover{border-color:#3d5afe}
body.dark .com-week.checked{background:#1b3a1b;border-color:#43a047}
body.dark .com-result{background:linear-gradient(135deg,#1b5e20,#2e7d32);border-color:#43a047}
body.dark .com-result .com-result-value{color:#a5d6a7}
body.dark .com-result .com-result-detail{color:#c8e6c9}
body.dark .weekly-bar{background:linear-gradient(135deg,#3d5afe,#1a237e)}
body.dark .tipo-toggle{border-color:#3d5afe}
body.dark .tipo-toggle button{background:#1a1d29;color:#8c8c8c}
body.dark .tipo-toggle button.act{background:#3d5afe;color:#fff}
body.dark .tipo-badge.venda{background:#1b3a1b;color:#43a047}
body.dark .tipo-badge.bonificacao{background:#3e2723;color:#ff9800}
@media(max-width:768px){.sidebar{display:none}.content{padding:16px}.sg{grid-template-columns:repeat(2,1fr)}.vg{grid-template-columns:1fr}.fr{grid-template-columns:1fr}.pe{grid-template-columns:1fr;gap:6px}.pc{flex-direction:column;gap:10px;align-items:stretch}.filtros{flex-direction:column}.date-filter{flex-direction:column}.com-week-grid{grid-template-columns:repeat(2,1fr)}}
@media print{.sidebar{display:none}.content{padding:0}.card{box-shadow:none;border:1px solid #ddd}.bl{display:none}.sidebar-toggle{display:none}}
</style>
</head>
<body>

function loadData(k){if(cacheDados[k]&&Date.now()-cacheExpira[k]<CACHE_TEMPO){return cacheDados[k]}var local=JSON.parse(localStorage.getItem('mc_'+k)||'[]');sincronizar(k);return local}
function sincronizar(k){if(syncEmProgresso[k])return;syncEmProgresso[k]=true;fetch(API_URL+'?action=read&sheet='+k).then(function(r){return r.json()}).then(function(data){syncEmProgresso[k]=false;if(Array.isArray(data)){data.forEach(function(row){if(k==='metas'&&typeof row.marcasDetalhe==='string'){try{row.marcasDetalhe=JSON.parse(row.marcasDetalhe)}catch(e){row.marcasDetalhe=[]}}if(k==='vendas'&&typeof row.itens==='string'){try{row.itens=JSON.parse(row.itens)}catch(e){row.itens=[]}}if(k==='vendas'){row.total=parseFloat(row.total)||0;row.qtdProdutos=parseInt(row.qtdProdutos)||0;if(!row.tipo)row.tipo='venda'}if(k==='metas'){row.ligacoes=parseInt(row.ligacoes)||0;row.prospeccao=parseInt(row.prospeccao)||0;row.produtos=parseInt(row.produtos)||0;row.valorVenda=parseFloat(row.valorVenda)||0;row.semana=parseInt(row.semana)||1}if(k==='atividades'){row.qtd=parseInt(row.qtd)||0}if(k==='clientes'){row.cod=String(row.cod||'');row.razao=String(row.razao||'');row.cidade=String(row.cidade||'');row.estado=String(row.estado||'');row.segmento=String(row.segmento||'');row.vendedorId=String(row.vendedorId||'')}});cacheDados[k]=data;cacheExpira[k]=Date.now();localStorage.setItem('mc_'+k,JSON.stringify(data));var active=document.querySelector('.tc.act');if(active)renderTab(active.id.replace('tc-',''))}}).catch(function(){syncEmProgresso[k]=false})}
function saveData(k,d){localStorage.setItem('mc_'+k,JSON.stringify(d));if(k==='vendas'||k==='clientes'||k==='metas'||k==='atividades'||k==='usuarios'){fetch(API_URL+'?action=sync&sheet='+k+'&data='+encodeURIComponent(JSON.stringify(d))).then(function(r){return r.json()}).then(function(res){if(res.success)toast('Sincronizado com a nuvem!','success')}).catch(function(){if(Date.now()-lastSyncError>60000){toast('Salvo local. Sincronizara depois.','info');lastSyncError=Date.now()}})}}
function loadSenhas(){var s=JSON.parse(localStorage.getItem('mc_senhas')||'{}');USU.forEach(function(u){if(!s[u.id])s[u.id]='magil2026'});var us=cacheDados['usuarios']||[];us.forEach(function(u){if(u.id&&u.senha&&String(u.senha).length>0)s[u.id]=String(u.senha)});return s}

function fmtBRL(v){return parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function getClienteByCod(cod){var clientes=loadData('clientes');var codStr=String(cod).trim();return clientes.find(function(c){return String(c.cod).trim()===codStr})}
function getEstadoFromVenda(v){if(v.estado&&v.estado!=='--')return v.estado;var m=v.cliente.match(/\/([A-Z]{2})\)/);if(m)return m[1];return '--'}
function getSegmentoFromVenda(v){if(v.segmento&&v.segmento!=='Outros')return v.segmento;var m=v.cliente.match(/COD\s+(\S+)/);if(m){var c=getClienteByCod(m[1]);if(c)return c.segmento||'Outros'}return 'Outros'}
function getMeusClientes(){var clientes=loadData('clientes');if(currentUser.isM)return clientes;return clientes.filter(function(c){return c.vendedorId===currentUser.id})}

function getVendasTipo(tipo){var vendas=loadData('vendas');if(tipo==='todos')return vendas;return vendas.filter(function(v){return(v.tipo||'venda')===tipo})}
function toast(msg,type){var t=document.createElement('div');t.className='tm '+(type||'info');t.textContent=(type==='success'?'OK: ':type==='error'?'ERRO: ':'INFO: ')+msg;document.getElementById('toast').appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(100%)';setTimeout(function(){t.remove()},300)},3500)}
function progressBar(label,atual,meta,pct){var cls=pct>=80?'hi':pct>=50?'mi':'lo';var fa=parseFloat(atual||0);var fm=parseFloat(meta||0);var da=fa>100?'R$ '+fmtBRL(fa):fa;var dm=fm>100?'R$ '+fmtBRL(fm):fm;return '<div class="pw"><div class="pl"><span>'+label+'</span><span>'+da+' / '+dm+' ('+Math.round(pct)+'%)</span></div><div class="pb"><div class="pf '+cls+'" style="width:'+Math.max(2,Math.min(100,pct))+'%">'+Math.round(pct)+'%</div></div></div>'}

function syncUsuarios(){var us=cacheDados['usuarios']||[];var niveis=loadNiveis();var nomes=loadNomes();var senhas=loadSenhas();USU.forEach(function(u){var existing=us.find(function(x){return x.id===u.id});if(!existing){us.push({id:u.id,nome:nomes[u.id]||u.nome,nivel:niveis[u.id]||u.nivel,senha:senhas[u.id]||'magil2026'})}else{existing.nome=nomes[u.id]||u.nome;existing.nivel=niveis[u.id]||u.nivel;existing.senha=senhas[u.id]||'magil2026'}});cacheDados['usuarios']=us;saveData('usuarios',us)}

function doLogin(){var sel=document.getElementById('lu').value;var pwd=document.getElementById('lp').value;if(!sel){toast('Selecione um perfil','error');return}if(!pwd){toast('Digite a senha','error');return}var senhas=loadSenhas();if(senhas[sel]!==pwd){sincronizar('usuarios');setTimeout(function(){var s2=loadSenhas();if(s2[sel]!==pwd){toast('Senha incorreta!','error');return}completarLogin(sel)},2000);return}completarLogin(sel)}
function completarLogin(sel){var user=USU.find(function(u){return u.id===sel});if(!user){var nv=loadNovosVend().find(function(u){return u.id===sel});if(!nv){toast('Perfil nao encontrado','error');return}user=nv}currentUser=user;localStorage.setItem('mc_user',JSON.stringify(user));document.getElementById('ls').style.display='none';document.getElementById('app').style.display='block';var b=document.getElementById('ub');b.textContent=getNome(user.id)+' - '+getNivel(user.id);b.className='badge'+(user.isM?' mg':'');initSidebar();sincronizar('usuarios');['vendas','clientes','metas','atividades'].forEach(function(k){sincronizar(k)});toast('Bem-vindo, '+getNome(user.id)+'!','success')}

function exportCSV(data,filename){if(!data||!data.length)return;var headers=Object.keys(data[0]);var csv=headers.join(';')+'\n';data.forEach(function(row){var vals=headers.map(function(h){var v=row[h];if(typeof v==='object')v=JSON.stringify(v);if(v===null||v===undefined)v='';return String(v).replace(/;/g,',')});csv+=vals.join(';')+'\n'});var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename||'export.csv';a.click()}
function exportPDF(titulo,htmlContent){var w=window.open('','','width=900,height=700');w.document.write('<html><head><title>'+titulo+'</title><style>body{font-family:Segoe UI,sans-serif;padding:40px;color:#1a1a1a}h1{color:#1428a0;font-size:1.8rem;margin-bottom:20px}h2{color:#1428a0;font-size:1.2rem;margin:16px 0 8px}table{width:100%;border-collapse:collapse;margin:10px 0}th{background:#1428a0;color:#fff;padding:10px;text-align:left}td{padding:8px 10px;border-bottom:1px solid #eee}.stat{display:inline-block;margin:10px 20px 10px 0;padding:16px 24px;background:#f7f8fa;border-radius:12px;border-top:4px solid #1428a0}.stat .lb{font-size:.7rem;color:#8c8c8c;text-transform:uppercase}.stat .vl{font-size:1.4rem;font-weight:700;color:#1428a0}.header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1428a0;padding-bottom:16px;margin-bottom:24px}.header .logo{font-size:1.6rem;font-weight:700;color:#1428a0}.header .date{font-size:.85rem;color:#8c8c8c}</style></head><body><div class="header"><div class="logo">Magil Clean - Dashboard Comercial</div><div class="date">'+new Date().toLocaleDateString('pt-BR')+'</div></div><h1>'+titulo+'</h1>'+htmlContent+'</body></html>');w.document.close();w.print()}

function getMetaSemanalAtual(){var metas=loadData('metas');var vM=metas.filter(function(m){return m.vendedor===currentUser.id});if(!vM.length)return null;var hoje=new Date();var dia=hoje.getDate();var semana=Math.ceil(dia/7);var mSem=vM.filter(function(m){return m.semana==semana});if(mSem.length)return mSem[mSem.length-1];return vM[vM.length-1]}
function renderWeeklyBar(){if(currentUser.isM)return '';var m=getMetaSemanalAtual();if(!m)return '';var vendas=loadData('vendas');var vV=vendas.filter(function(v){return v.vendedor===currentUser.id&&(v.tipo||'venda')==='venda'});var vPr=vV.reduce(function(s,v){return s+(parseInt(v.qtdProdutos)||0)},0);var metaProd=m.produtos||0;var pct=metaProd>0?Math.min(100,(vPr/metaProd)*100):0;return '<div class="weekly-bar"><div class="wb-info"><div class="wb-label">Produtos Vendidos</div><div class="wb-value">'+vPr+'</div></div><div class="wb-progress"><div class="wb-progress-fill" style="width:'+Math.max(2,pct)+'%"></div></div><div class="wb-info" style="text-align:right"><div class="wb-label">Meta Semanal</div><div class="wb-value">'+metaProd+'</div></div><div class="wb-pct">'+Math.round(pct)+'%</div></div>'}
function renderProdutosDiscriminados(){if(currentUser.isM)return '';var m=getMetaSemanalAtual();if(!m)return '';var vendas=loadData('vendas');var vV=vendas.filter(function(v){return v.vendedor===currentUser.id&&(v.tipo||'venda')==='venda'});var prodCount={};vV.forEach(function(v){if(v.itens){v.itens.forEach(function(it){var nome=it.nome||it.cod;if(!prodCount[nome])prodCount[nome]=0;prodCount[nome]+=parseInt(it.qtd)||0})}});var metaProd=m.produtos||0;var totalVendido=Object.values(prodCount).reduce(function(s,v){return s+v},0);var pct=metaProd>0?Math.min(100,(totalVendido/metaProd)*100):0;var html='<div class="card"><h3>Produtos Discriminados</h3><table><thead><tr><th>Produto</th><th class="tcc">Qtd Vendida</th><th class="tcc">% da Meta</th></tr></thead><tbody>';Object.keys(prodCount).sort(function(a,b){return prodCount[b]-prodCount[a]}).forEach(function(p){var pp=metaProd>0?Math.round((prodCount[p]/metaProd)*100):0;html+='<tr><td>'+p+'</td><td class="tcc">'+prodCount[p]+'</td><td class="tcc">'+pp+'%</td></tr>'});html+='</tbody><tfoot><tr style="font-weight:700;background:#f0f4ff"><td>Total</td><td class="tcc">'+totalVendido+'</td><td class="tcc">'+Math.round(pct)+'%</td></tr></tfoot></table></div>';return html}
function initSidebar(){var sb=document.getElementById('sb');var mc=document.getElementById('mc');sb.innerHTML='';mc.innerHTML='';var items;if(currentUser.isM){items=[{sep:'GESTAO'},{id:'overview',label:'Visao Geral',ico:'📊'},{id:'metas',label:'Definir Metas',ico:'🎯'},{sep:'CADASTROS'},{id:'vendedores',label:'Gerenciar Vendedores',ico:'👥'},{id:'clientes',label:'Clientes',ico:'🏢'},{id:'vendas',label:'Vendas',ico:'💰'},{sep:'ANALISE'},{id:'vendvend',label:'Vend. por Vendedor',ico:'📈'},{id:'vendestado',label:'Vend. por Estado',ico:'🗺'},{id:'vendseg',label:'Vend. por Segmento',ico:'📦'},{id:'cruzamentos',label:'Cruzamentos',ico:'🔍'},{id:'analisecli',label:'Analise de Clientes',ico:'🔎'},{sep:'RELATORIOS'},{id:'relatividades',label:'Rel. Atividades',ico:'📋'},{id:'relatorios',label:'Relatorios Gerais',ico:'📑'},{sep:'CONFIG'},{id:'comissao',label:'Comissao',ico:'🧮'},{id:'catalogo',label:'Catalogo',ico:'📚'}]}else{items=[{id:'minhas',label:'Minhas Metas',ico:'🎯'},{id:'venda',label:'Registrar Venda',ico:'💰'},{id:'minhasvendas',label:'Minhas Vendas',ico:'📋'},{id:'atividades',label:'Atividades',ico:'📋'},{id:'comissao',label:'Comissao',ico:'🧮'},{id:'meuscli',label:'Meus Clientes',ico:'🏢'}]}var firstId='';items.forEach(function(it){if(it.sep){var title=document.createElement('div');title.className='nav-title';title.textContent=it.sep;sb.appendChild(title);return}if(!firstId)firstId=it.id;var el=document.createElement('div');el.className='nav-item'+(it.id===firstId?' act':'');el.innerHTML='<span class="nav-ico">'+(it.ico||'')+'</span> '+it.label;el.onclick=function(){document.querySelectorAll('.nav-item').forEach(function(x){x.classList.remove('act')});document.querySelectorAll('.tc').forEach(function(x){x.classList.remove('act')});el.classList.add('act');document.getElementById('tc-'+it.id).classList.add('act');renderTab(it.id)};sb.appendChild(el);var tc=document.createElement('div');tc.className='tc'+(it.id===firstId?' act':'');tc.id='tc-'+it.id;mc.appendChild(tc)});if(firstId)renderTab(firstId)}
function renderTab(id){var c=document.getElementById('tc-'+id);if(!c)return;if(id==='overview'){c.innerHTML=renderOverview();setTimeout(initOverviewChart,50)}else if(id==='metas'){c.innerHTML=renderMetas()}else if(id==='vendedores'){c.innerHTML=renderVendedores()}else if(id==='clientes'){c.innerHTML=renderClientes(true)}else if(id==='meuscli'){c.innerHTML=renderClientes(false)}else if(id==='vendas'){c.innerHTML=renderVendasGer()}else if(id==='minhasvendas'){c.innerHTML=renderMinhasVendas()}else if(id==='relatividades'){c.innerHTML=renderRelAtividades()}else if(id==='vendvend'){c.innerHTML=renderVendVendedor();setTimeout(initVendVendedorChart,50)}else if(id==='vendestado'){c.innerHTML=renderVendEstado();setTimeout(initVendEstadoChart,50)}else if(id==='vendseg'){c.innerHTML=renderVendSegmento();setTimeout(initVendSegmentoChart,50)}else if(id==='cruzamentos'){c.innerHTML=renderCruzamentos();setTimeout(initCruzamentos,50)}else if(id==='analisecli'){c.innerHTML=renderAnaliseCli()}else if(id==='comissao'){c.innerHTML=renderComissao(currentUser.isM);setTimeout(function(){renderCompContent(currentUser.id)},50)}else if(id==='catalogo'){c.innerHTML=renderCatalogo()}else if(id==='relatorios'){c.innerHTML=renderRelatorios()}else if(id==='minhas'){c.innerHTML=renderMinhas()}else if(id==='venda'){c.innerHTML=renderVenda()}else if(id==='atividades'){c.innerHTML=renderAtividades()}}function renderOverview(){var vendas=loadData('vendas');var metas=loadData('metas');var atividades=loadData('atividades');var vAtivos=getVendedores();var tV=0,tL=0,tP=0,tPr=0;var cards=vAtivos.map(function(v){var vV=vendas.filter(function(x){return x.vendedor===v.id&&(x.tipo||'venda')==='venda'});var vA=atividades.filter(function(x){return x.vendedor===v.id});var vM=metas.filter(function(x){return x.vendedor===v.id});var vTotV=vV.reduce(function(s,x){return s+(parseFloat(x.total)||0)},0);var vL=vA.filter(function(x){return x.tipo==='ligacao'}).reduce(function(s,x){return s+(parseInt(x.qtd)||0)},0);var vP=vA.filter(function(x){return x.tipo==='prospeccao'}).reduce(function(s,x){return s+(parseInt(x.qtd)||0)},0);var vPr=vV.reduce(function(s,x){return s+(parseInt(x.qtdProdutos)||0)},0);tV+=vTotV;tL+=vL;tP+=vP;tPr+=vPr;var m=vM[vM.length-1]||{};var pV=m.valorVenda?Math.min(100,(vTotV/m.valorVenda)*100):0;var pL=m.ligacoes?Math.min(100,(vL/m.ligacoes)*100):0;var pP=m.prospeccao?Math.min(100,(vP/m.prospeccao)*100):0;var pPr=m.produtos?Math.min(100,(vPr/m.produtos)*100):0;var nv=getNivel(v.id);return '<div class="vc"><div class="vh"><span class="vn">'+getNome(v.id)+'</span><span class="vlv '+nv.toLowerCase()+'">'+nv+'</span></div>'+progressBar('Vendas (R$)',vTotV,m.valorVenda||0,pV)+progressBar('Ligacoes',vL,m.ligacoes||0,pL)+progressBar('Prospeccao',vP,m.prospeccao||0,pP)+progressBar('Produtos',vPr,m.produtos||0,pPr)+'</div>'}).join('');return '<h2 class="st2">Visao Geral</h2><div class="sg"><div class="sc '+(tV>0?'s':'')+'"><div class="lb">Faturamento</div><div class="vl">R$ '+fmtBRL(tV)+'</div><div class="sb">'+vendas.length+' vendas</div></div><div class="sc"><div class="lb">Ligacoes</div><div class="vl">'+tL+'</div></div><div class="sc"><div class="lb">Prospeccao</div><div class="vl">'+tP+'</div></div><div class="sc"><div class="lb">Produtos</div><div class="vl">'+tPr+'</div></div></div><div class="card"><h3>Performance</h3><div class="cc"><canvas id="chOv"></canvas></div></div><div class="vg">'+cards+'</div>'}
function initOverviewChart(){var vendas=loadData('vendas').filter(function(v){return(v.tipo||'venda')==='venda'});var ctx=document.getElementById('chOv');if(!ctx)return;var vAtivos=getVendedores();if(charts.ov)charts.ov.destroy();charts.ov=new Chart(ctx,{type:'bar',data:{labels:vAtivos.map(function(v){return getNome(v.id)}),datasets:[{label:'Vendas',data:vAtivos.map(function(v){return vendas.filter(function(x){return x.vendedor===v.id}).reduce(function(s,x){return s+(parseFloat(x.total)||0)},0)}),backgroundColor:'#1428a0',borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})}
function renderMetas(){var metas=loadData('metas');var vAtivos=getVendedores();var opts=vAtivos.map(function(v){return '<option value="'+v.id+'">'+getNome(v.id)+' ('+getNivel(v.id)+')</option>'}).join('');var mesOpts=MESES.map(function(m,i){return '<option value="'+m+'"'+(i===7?' selected':'')+'>'+m+'</option>'}).join('');var btnLabel=editingMetaIdx>=0?'Atualizar Meta':'Salvar Meta';var list=metas.length?'<div class="card"><h3>Metas Cadastradas</h3><table><thead><tr><th>Vendedor</th><th>Ano</th><th>Mes</th><th>Sem</th><th>Lig</th><th>Pros</th><th>Prod</th><th>Marcas</th><th>Valor</th><th>Acoes</th></tr></thead><tbody>'+metas.map(function(m,i){var detStr=(m.marcasDetalhe&&m.marcasDetalhe.length)?m.marcasDetalhe.map(function(d){return d.qtd+'x '+d.nome}).join(', '):'--';return '<tr><td>'+getNome(m.vendedor)+'</td><td>'+m.ano+'</td><td>'+m.mes+'</td><td class="tcc">'+m.semana+'</td><td class="tcc">'+m.ligacoes+'</td><td class="tcc">'+m.prospeccao+'</td><td class="tcc">'+m.produtos+'</td><td style="font-size:.78rem">'+detStr+'</td><td class="tcr">R$ '+fmtBRL(m.valorVenda)+'</td><td><div class="action-btns"><button class="edit-btn" onclick="editMeta('+i+')">Editar</button><button class="del-btn" onclick="delMeta('+i+')">Excluir</button></div></td></tr>'}).join('')+'</tbody></table></div>':'<div class="card"><div class="es"><div class="ic">LISTA</div><p>Nenhuma meta.</p></div></div>';var formHtml='<div class="card"><h3>'+(editingMetaIdx>=0?'Editar Meta':'Definir Meta')+'</h3><div class="fr"><div class="fg"><label>Vendedor</label><select id="m-vend">'+opts+'</select></div><div class="fg"><label>Ano</label><select id="m-ano"><option>2025</option><option selected>2026</option><option>2027</option></select></div><div class="fg"><label>Mes</label><select id="m-mes">'+mesOpts+'</select></div><div class="fg"><label>Semana</label><select id="m-sem"><option value="1">Semana 1</option><option value="2">Semana 2</option><option value="3">Semana 3</option><option value="4">Semana 4</option></select></div></div><div class="fr"><div class="fg"><label>Ligacoes</label><input type="number" id="m-lig" value="50"></div><div class="fg"><label>Prospeccao</label><input type="number" id="m-pros" value="10"></div><div class="fg"><label>Produtos (Total)</label><input type="number" id="m-prod" value="30" oninput="somaProdMeta()"></div><div class="fg"><label>Valor (R$)</label><input type="number" id="m-val" value="50000"></div></div><div class="dv"></div><h3>Marcas Discriminadas</h3><p style="font-size:.82rem;color:var(--m);margin-bottom:10px">Defina as marcas. A soma deve bater com o total acima.</p><div id="m-prods-list"></div><button class="btn btn-a btn-s" onclick="addMetaMarca()">+ Adicionar Marca</button><div class="st" style="margin-top:10px">Soma: <span id="m-prod-soma">0</span> / <span id="m-prod-total">30</span></div><div class="dv"></div><button class="btn btn-p" onclick="saveMeta()">'+btnLabel+'</button>'+(editingMetaIdx>=0?' <button class="btn btn-d" onclick="cancelEditMeta()">Cancelar</button>':'')+'</div>';if(editingMetaIdx>=0){var mm=metas[editingMetaIdx];formHtml+='<scr'+'ipt>document.getElementById("m-vend").value="'+mm.vendedor+'";document.getElementById("m-ano").value="'+mm.ano+'";document.getElementById("m-mes").value="'+mm.mes+'";document.getElementById("m-sem").value="'+mm.semana+'";document.getElementById("m-lig").value='+mm.ligacoes+';document.getElementById("m-pros").value='+mm.prospeccao+';document.getElementById("m-prod").value='+mm.produtos+';document.getElementById("m-val").value='+mm.valorVenda+';';if(mm.marcasDetalhe&&mm.marcasDetalhe.length){formHtml+='var md='+JSON.stringify(mm.marcasDetalhe)+';md.forEach(function(d){addMetaMarcaPre(d.nome,d.qtd)});somaProdMeta();';}formHtml+='<\/scr'+'ipt>'}return '<h2 class="st2">Definir Metas</h2>'+formHtml+list}
function addMetaMarca(){var div=document.createElement('div');div.className='mp-row';var marcaOpts=MARCAS.map(function(m){return '<option value="'+m.nome+'">'+m.nome+'</option>'}).join('');div.innerHTML='<select class="mp-prod" onchange="somaProdMeta()">'+marcaOpts+'</select><input type="number" class="mp-qtd" placeholder="Qtd" oninput="somaProdMeta()" min="1" value="1"><button class="rb" onclick="this.parentElement.remove();somaProdMeta()">x</button>';document.getElementById('m-prods-list').appendChild(div);somaProdMeta()}
function addMetaMarcaPre(nome,qtd){var div=document.createElement('div');div.className='mp-row';var marcaOpts=MARCAS.map(function(m){return '<option value="'+m.nome+'"'+(m.nome===nome?' selected':'')+'>'+m.nome+'</option>'}).join('');div.innerHTML='<select class="mp-prod" onchange="somaProdMeta()">'+marcaOpts+'</select><input type="number" class="mp-qtd" placeholder="Qtd" oninput="somaProdMeta()" min="1" value="'+qtd+'"><button class="rb" onclick="this.parentElement.remove();somaProdMeta()">x</button>';document.getElementById('m-prods-list').appendChild(div);somaProdMeta()}
function somaProdMeta(){var soma=0;document.querySelectorAll('.mp-row').forEach(function(row){var q=parseInt(row.querySelector('.mp-qtd').value)||0;soma+=q});var total=parseInt(document.getElementById('m-prod').value)||0;var te=document.getElementById('m-prod-total');if(te)te.textContent=total;var se=document.getElementById('m-prod-soma');if(se)se.textContent=soma}
function saveMeta(){var m={vendedor:document.getElementById('m-vend').value,ano:document.getElementById('m-ano').value,mes:document.getElementById('m-mes').value,semana:document.getElementById('m-sem').value,ligacoes:parseInt(document.getElementById('m-lig').value)||0,prospeccao:parseInt(document.getElementById('m-pros').value)||0,produtos:parseInt(document.getElementById('m-prod').value)||0,valorVenda:parseFloat(document.getElementById('m-val').value)||0,marcasDetalhe:[]};document.querySelectorAll('.mp-row').forEach(function(row){var n=row.querySelector('.mp-prod').value;var q=parseInt(row.querySelector('.mp-qtd').value)||0;if(n&&q)m.marcasDetalhe.push({nome:n,qtd:q})});var metas=loadData('metas');if(editingMetaIdx>=0){metas[editingMetaIdx]=m;toast('Meta atualizada!','success')}else{metas.push(m);toast('Meta salva para '+getNome(m.vendedor),'success')}saveData('metas',metas);editingMetaIdx=-1;renderTab('metas')}
function editMeta(i){editingMetaIdx=i;renderTab('metas')}
function cancelEditMeta(){editingMetaIdx=-1;renderTab('metas')}
function delMeta(i){if(!confirm('Excluir esta meta?'))return;var metas=loadData('metas');metas.splice(i,1);saveData('metas',metas);toast('Meta excluida','success');renderTab('metas')}
function renderVendedores(){var vAtivos=getVendedores();var niveis=loadNiveis();var nomes=loadNomes();var senhas=loadSenhas();var cards=vAtivos.map(function(v){var nv=niveis[v.id]||v.nivel;var nm=nomes[v.id]||v.nome;var sn=senhas[v.id]||'magil2026';return '<div class="pc"><div class="pi"><input type="text" id="nm-'+v.id+'" value="'+nm+'" class="inp-sm" style="width:160px"><span class="vlv '+nv.toLowerCase()+'">'+nv+'</span></div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><input type="text" id="sn-'+v.id+'" value="'+sn+'" class="inp-sm" style="width:110px"><button class="btn btn-a btn-s" onclick="saveSenha(\''+v.id+'\')">Senha</button><button class="btn btn-p btn-s" onclick="saveNome(\''+v.id+'\')">Nome</button><button class="btn btn-s" style="background:'+(nv==='Junior'?'#00838f':'#78909c')+';color:#fff" onclick="toggleNivel(\''+v.id+'\')">'+(nv==='Junior'?'-> Pleno':'-> Junior')+'</button></div></div>'}).join('');var addForm='<div class="card"><h3>Adicionar Novo Vendedor</h3><div class="fr"><div class="fg"><label>Nome</label><input type="text" id="nv-nome" placeholder="Ex: Joao"></div><div class="fg"><label>Nivel</label><select id="nv-nivel"><option value="Junior">Junior</option><option value="Pleno">Pleno</option></select></div><div class="fg"><label>Senha</label><input type="text" id="nv-senha" value="magil2026"></div></div><button class="btn btn-a" onclick="addVendedor()">+ Adicionar</button></div>';return '<h2 class="st2">Gerenciar Vendedores</h2><div class="card"><h3>Renomear, Promover e Senhas</h3>'+cards+'</div>'+addForm}
function saveSenha(id){var val=document.getElementById('sn-'+id).value;if(!val){toast('Digite uma senha','error');return}var s=loadSenhas();s[id]=val;saveSenhas(s);syncUsuarios();toast('Senha salva e sincronizada: '+getNome(id),'success')}
function saveNome(id){var val=document.getElementById('nm-'+id).value;if(!val){toast('Digite um nome','error');return}var n=loadNomes();n[id]=val;saveNomes(n);var u=USU.find(function(x){return x.id===id});if(u)u.nome=val;updateLoginNomes();syncUsuarios();toast('Nome salvo e sincronizado: '+val,'success')}
function toggleNivel(id){var n=loadNiveis();var u=USU.find(function(x){return x.id===id});if(!u)return;var atual=n[id]||u.nivel;n[id]=atual==='Junior'?'Pleno':'Junior';saveNiveis(n);u.nivel=n[id];syncUsuarios();toast('Nivel alterado e sincronizado: '+getNome(id)+' -> '+n[id],'success');renderTab('vendedores')}
function addVendedor(){var nome=document.getElementById('nv-nome').value.trim();var nivel=document.getElementById('nv-nivel').value;var senha=document.getElementById('nv-senha').value;if(!nome){toast('Digite o nome','error');return}var novos=loadNovosVend();var id='v'+Date.now();novos.push({id:id,nome:nome,nivel:nivel,isM:false});saveNovosVend(novos);USU.push({id:id,nome:nome,nivel:nivel,isM:false});var s=loadSenhas();s[id]=senha;saveSenhas(s);updateLoginNomes();syncUsuarios();toast('Vendedor adicionado e sincronizado: '+nome,'success');renderTab('vendedores')}
function renderClientes(isGerente){var clientes=isGerente?loadData('clientes'):getMeusClientes();var segOpts=SEGMENTOS.map(function(s){return '<option value="'+s+'">'+s+'</option>'}).join('');var ufOpts=UFS.map(function(u){return '<option value="'+u+'">'+u+'</option>'}).join('');var vendOpts=getVendedores().map(function(v){return '<option value="'+v.id+'">'+getNome(v.id)+'</option>'}).join('');var tabela=clientes.length?'<table><thead><tr><th>Cod</th><th>Razao Social</th><th>Cidade</th><th>UF</th><th>Segmento</th>'+(isGerente?'<th>Vendedor</th><th>Transferir</th>':'')+'<th>Acoes</th></tr></thead><tbody>'+clientes.map(function(c,i){var transferirHtml=isGerente?'<td><select class="inp-sm" style="width:120px" onchange="transferirCliente(\''+c.cod+'\',this.value)"><option value="">--</option>'+vendOpts.replace('value="'+(c.vendedorId||'')+'"','value="'+(c.vendedorId||'')+'" selected')+'</select></td>':'';return '<tr><td>'+c.cod+'</td><td>'+c.razao+'</td><td>'+c.cidade+'</td><td>'+c.estado+'</td><td>'+(c.segmento||'--')+'</td>'+(isGerente?'<td>'+getNome(c.vendedorId||'')+'</td>':'')+transferirHtml+'<td><div class="action-btns"><button class="edit-btn" onclick="editCliente('+i+','+isGerente+')">Editar</button><button class="del-btn" onclick="delCliente('+i+','+isGerente+')">Excluir</button></div></td></tr>'}).join('')+'</tbody></table>':'<div class="es"><div class="ic">SEM</div><p>Nenhum cliente.</p></div>';var formHtml='<div class="card"><h3>Adicionar Cliente</h3><div class="fr"><div class="fg"><label>Codigo</label><input type="text" id="cl-cod" placeholder="Ex: 001"></div><div class="fg"><label>Razao Social</label><input type="text" id="cl-razao" placeholder="Nome do cliente"></div><div class="fg"><label>Cidade</label><input type="text" id="cl-cidade" placeholder="Cidade"></div><div class="fg"><label>Estado</label><select id="cl-estado"><option value="">--</option>'+ufOpts+'</select></div><div class="fg"><label>Segmento</label><select id="cl-segmento"><option value="">--</option>'+segOpts+'</select></div>'+(isGerente?'<div class="fg"><label>Vendedor</label><select id="cl-vend">'+vendOpts+'</select></div>':'')+'</div><button class="btn btn-p" onclick="saveCliente('+isGerente+')">Salvar Cliente</button></div>';return '<h2 class="st2">'+(isGerente?'Clientes':'Meus Clientes')+'</h2>'+formHtml+'<div class="card"><h3>Lista de Clientes</h3>'+tabela+'</div>'}
function transferirCliente(cod,novoVendId){if(!novoVendId)return;var clientes=loadData('clientes');var c=clientes.find(function(x){return x.cod===cod});if(!c){toast('Cliente nao encontrado','error');return}c.vendedorId=novoVendId;saveData('clientes',clientes);toast('Cliente '+c.razao+' transferido para '+getNome(novoVendId),'success');renderTab('clientes')}
function saveCliente(isGerente){var cod=document.getElementById('cl-cod').value.trim();var razao=document.getElementById('cl-razao').value.trim();if(!cod||!razao){toast('Codigo e Razao sao obrigatorios','error');return}var c={cod:cod,razao:razao,cidade:document.getElementById('cl-cidade').value.trim(),estado:document.getElementById('cl-estado').value,segmento:document.getElementById('cl-segmento').value,vendedorId:isGerente?document.getElementById('cl-vend').value:currentUser.id};var clientes=loadData('clientes');var existing=clientes.findIndex(function(x){return x.cod===cod});if(existing>=0){clientes[existing]=c;toast('Cliente atualizado: '+razao,'success')}else{clientes.push(c);toast('Cliente salvo: '+razao,'success')}saveData('clientes',clientes);renderTab(isGerente?'clientes':'meuscli')}

function renderVendasGer(){var vendas=loadData('vendas');var hoje=new Date();var mesAtual=hoje.getMonth()+1;var anoAtual=hoje.getFullYear();var vendasMes=vendas.filter(function(v){var d=new Date(v.data);return d.getMonth()+1===mesAtual&&d.getFullYear()===anoAtual});var totMesVendas=vendasMes.filter(function(v){return(v.tipo||'venda')==='venda'}).reduce(function(s,v){return s+(parseFloat(v.total)||0)},0);var totMesBonif=vendasMes.filter(function(v){return v.tipo==='bonificacao'}).reduce(function(s,v){return s+(parseFloat(v.total)||0)},0);var totMesGeral=totMesVendas+totMesBonif;var tabela=vendas.length?'<table><thead><tr><th>Data</th><th>Cliente</th><th>UF</th><th>Segmento</th><th>Vendedor</th><th>Tipo</th><th>Itens</th><th>Qtd</th><th>Total</th><th>Acoes</th></tr></thead><tbody>'+vendas.map(function(v,i){var itensStr=(v.itens&&v.itens.length)?v.itens.map(function(it){return it.qtd+'x '+it.nome}).join(', '):'--';var estado=v.estado||getEstadoFromVenda(v);var segmento=v.segmento||getSegmentoFromVenda(v);var tipo=v.tipo||'venda';var tipoHtml='<span class="tipo-badge '+tipo+'">'+tipo+'</span>';return '<tr><td>'+v.data+'</td><td>'+v.cliente+'</td><td class="tcc">'+estado+'</td><td>'+(segmento||'--')+'</td><td>'+getNome(v.vendedor)+'</td><td class="tcc">'+tipoHtml+'</td><td style="font-size:.78rem">'+itensStr+'</td><td class="tcc">'+(v.qtdProdutos||0)+'</td><td class="tcr">R$ '+fmtBRL(v.total)+'</td><td><div class="action-btns"><button class="edit-btn" onclick="editVenda('+i+')">Editar</button><button class="del-btn" onclick="delVenda('+i+')">Excluir</button></div></td></tr>'}).join('')+'</tbody></table>':'<div class="es"><div class="ic">SEM</div><p>Nenhuma venda.</p></div>';return '<h2 class="st2">Vendas</h2><div class="sg"><div class="sc s"><div class="lb">Vendas Mes (R$ '+MESES[mesAtual-1]+'/'+anoAtual+')</div><div class="vl">R$ '+fmtBRL(totMesVendas)+'</div></div><div class="sc w"><div class="lb">Bonificacoes Mes</div><div class="vl">R$ '+fmtBRL(totMesBonif)+'</div></div><div class="sc"><div class="lb">Total Geral Mes</div><div class="vl">R$ '+fmtBRL(totMesGeral)+'</div></div></div><div class="card"><h3>Todas as Vendas Detalhadas</h3><div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-a btn-s" onclick="exportCSV('+JSON.stringify('vendas').replace(/"/g,'&quot;')+')">Exportar CSV</button><button class="btn btn-p btn-s" onclick="exportVendasPDF()">Exportar PDF</button></div>'+tabela+'</div>'}

function editVenda(i){var vendas=loadData('vendas');var v=vendas[i];if(!v)return;editingVendaIdx=i;var clientes=loadData('clientes');var cliOpts=clientes.map(function(c){return '<option value="'+c.cod+'">'+c.cod+' - '+c.razao+'</option>'}).join('');var prodOpts=PROD.map(function(p){return '<option value="'+p.cod+'">'+p.cod+' - '+p.nome+'</option>'}).join('');var itensHtml='';if(v.itens&&v.itens.length){v.itens.forEach(function(it,idx){itensHtml+='<div class="pe"><select class="pe-prod" onchange="calcVendaTotal()">'+prodOpts.replace('value="'+it.cod+'"','value="'+it.cod+'" selected')+'</select><input type="number" class="pe-qtd" value="'+it.qtd+'" oninput="calcVendaTotal()" min="1"><input type="text" class="pe-preco" value="R$ '+fmtBRL(it.preco*it.qtd)+'" readonly><button class="rb" onclick="this.parentElement.remove();calcVendaTotal()">x</button></div>'})}var tipoSel=v.tipo||'venda';var html='<div class="card"><h3>Editar Venda</h3><div class="tipo-toggle"><button id="tt-venda" class="'+(tipoSel==='venda'?'act':'')+'" onclick="setTipoLanc(\'venda\')">Venda</button><button id="tt-bonif" class="'+(tipoSel==='bonificacao'?'act':'')+'" onclick="setTipoLanc(\'bonificacao\')">Bonificacao</button></div><div class="fr"><div class="fg"><label>Data</label><input type="date" id="vd-data" value="'+v.data+'"></div><div class="fg"><label>Cliente</label><select id="vd-cli">'+cliOpts+'</select></div></div><div class="dv"></div><h3>Itens</h3><div id="vd-itens">'+itensHtml+'</div><button class="btn btn-a btn-s" onclick="addVendaItem()">+ Adicionar Item</button><div class="dv"></div><div class="st" id="vd-total">Total: R$ '+fmtBRL(v.total)+'</div><div class="dv"></div><button class="btn btn-p btn-f" onclick="salvarEdicaoVenda()">Salvar Alteracoes</button> <button class="btn btn-d" onclick="cancelarEdicaoVenda()">Cancelar</button></div>';var c=document.getElementById('tc-vendas');if(c)c.innerHTML='<h2 class="st2">Editar Venda</h2>'+html;var cliSel=document.getElementById('vd-cli');if(cliSel){var m=v.cliente.match(/COD\s+(\S+)/);if(m)cliSel.value=m[1]}calcVendaTotal()}
function salvarEdicaoVenda(){if(editingVendaIdx<0){toast('Nenhuma venda selecionada','error');return}var vendas=loadData('vendas');var data=document.getElementById('vd-data').value;var cod=document.getElementById('vd-cli').value;var cliente=getClienteByCod(cod);var tipo=getTipoLanc();var itens=[];var total=0;var qtdProdutos=0;document.querySelectorAll('.pe').forEach(function(row){var codProd=row.querySelector('.pe-prod').value;var qtd=parseInt(row.querySelector('.pe-qtd').value)||0;var prod=PROD.find(function(p){return p.cod===codProd});if(prod&&qtd>0){itens.push({cod:codProd,nome:prod.nome,qtd:qtd,preco:prod.preco});total+=prod.preco*qtd;qtdProdutos+=qtd}});if(itens.length===0){toast('Adicione pelo menos um item','error');return}var nomeCli=cliente?cliente.razao:'COD '+cod;var estado=cliente?cliente.estado:'--';var segmento=cliente?cliente.segmento:'Outros';vendas[editingVendaIdx].data=data;vendas[editingVendaIdx].cliente=nomeCli+' (COD '+cod+' / '+estado+')';vendas[editingVendaIdx].itens=itens;vendas[editingVendaIdx].qtdProdutos=qtdProdutos;vendas[editingVendaIdx].total=total;vendas[editingVendaIdx].estado=estado;vendas[editingVendaIdx].segmento=segmento;vendas[editingVendaIdx].tipo=tipo;saveData('vendas',vendas);editingVendaIdx=-1;toast('Venda atualizada!','success');renderTab('vendas')}

function filtrarRelAtiv(){var atividades=loadData('atividades');var periodo=document.getElementById('ra-periodo').value;var inicio=document.getElementById('ra-inicio').value;var fim=document.getElementById('ra-fim').value;var vend=document.getElementById('ra-vend').value;var tipo=document.getElementById('ra-tipo').value;var filtradas=atividades.filter(function(a){if(vend&&a.vendedor!==vend)return false;if(tipo&&a.tipo!==tipo)return false;if(inicio&&a.data<inicio)return false;if(fim&&a.data>fim)return false;if(periodo!=='todos'&&periodo&&inicio){var dataAtiv=new Date(a.data);var dataIni=new Date(inicio);var diff=Math.floor((dataAtiv.getTime()-dataIni.getTime())/(1000*60*60*24));if(periodo==='diario'&&diff!==0)return false;if(periodo==='semanal'&&diff>7)return false;if(periodo==='mensal'&&diff>30)return false;if(periodo==='anual'&&diff>365)return false}return true});var html='';if(filtradas.length===0){html='<div class="es"><div class="ic">SEM</div><p>Nenhuma atividade no periodo.</p></div>'}else{var totLig=filtradas.filter(function(a){return a.tipo==='ligacao'}).reduce(function(s,a){return s+(parseInt(a.qtd)||0)},0);var totPro=filtradas.filter(function(a){return a.tipo==='prospeccao'}).reduce(function(s,a){return s+(parseInt(a.qtd)||0)},0);var totVis=filtradas.filter(function(a){return a.tipo==='visita'}).reduce(function(s,a){return s+(parseInt(a.qtd)||0)},0);var totEm=filtradas.filter(function(a){return a.tipo==='email'}).reduce(function(s,a){return s+(parseInt(a.qtd)||0)},0);var totWh=filtradas.filter(function(a){return a.tipo==='whatsapp'}).reduce(function(s,a){return s+(parseInt(a.qtd)||0)},0);html='<div class="sg"><div class="sc"><div class="lb">Ligacoes</div><div class="vl">'+totLig+'</div></div><div class="sc"><div class="lb">Prospeccao</div><div class="vl">'+totPro+'</div></div><div class="sc"><div class="lb">Visitas</div><div class="vl">'+totVis+'</div></div><div class="sc"><div class="lb">E-mails</div><div class="vl">'+totEm+'</div></div><div class="sc"><di function renderVendVendedor(){var vendas=loadData('vendas');var vAtivos=getVendedores();var vendOpts=vAtivos.map(function(v){return '<option value="'+v.id+'">'+getNome(v.id)+'</option>'}).join('');var tabela=vAtivos.map(function(v){var vV=vendas.filter(function(x){return x.vendedor===v.id});var tot=vV.reduce(function(s,x){return s+(parseFloat(x.total)||0)},0);var qtd=vV.reduce(function(s,x){return s+(parseInt(x.qtdProdutos)||0)},0);return '<tr><td>'+getNome(v.id)+'</td><td class="tcc">'+vV.length+'</td><td class="tcc">'+qtd+'</td><td class="tcr">R$ '+fmtBRL(tot)+'</td></tr>'}).join('');return '<h2 class="st2">Vendas por Vendedor</h2><div class="card"><h3>Filtros</h3><div class="filtros"><div class="fg"><label>Vendedor</label><select id="vv-vend"><option value="">Todos</option>'+vendOpts+'</select></div><div class="fg"><label>Periodo</label><select id="vv-periodo"><option value="todos">Todos</option><option value="diario">Diario</option><option value="mensal">Mensal</option><option value="anual">Anual</option></select></div><div class="fg"><label>Data</label><input type="date" id="vv-data"></div><div class="fg" style="display:flex;align-items:flex-end"><button class="btn btn-p btn-s" onclick="filtrarVendVendedor()">OK</button></div></div></div><div class="card"><h3>Resumo</h3><table id="vv-tabela"><thead><tr><th>Vendedor</th><th>Vendas</th><th>Produtos</th><th>Total</th></tr></thead><tbody>'+tabela+'</tbody></table></div><div class="card"><h3>Grafico</h3><div class="cc"><canvas id="chVV"></canvas></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-a btn-s" onclick="exportChartPNG(\'chVV\',\'vendas-vendedor.png\')">Exportar PNG</button><button class="btn btn-p btn-s" onclick="exportVendVendedorPDF()">Exportar PDF</button></div></div>'}
function filtrarVendVendedor(){var vendas=loadData('vendas');var vend=document.getElementById('vv-vend').value;var periodo=document.getElementById('vv-periodo').value;var dataRef=document.getElementById('vv-data').value;var filtradas=vendas.filter(function(v){if(vend&&v.vendedor!==vend)return false;if(dataRef){var dV=new Date(v.data);var dR=new Date(dataRef);if(periodo==='diario'&&dV.toDateString()!==dR.toDateString())return false;if(periodo==='mensal'&&(dV.getMonth()!==dR.getMonth()||dV.getFullYear()!==dR.getFullYear()))return false;if(periodo==='anual'&&dV.getFullYear()!==dR.getFullYear())return false}return true});var vAtivos=getVendedores();var tabela=vAtivos.map(function(v){var vV=filtradas.filter(function(x){return x.vendedor===v.id});var tot=vV.reduce(function(s,x){return s+(parseFloat(x.total)||0)},0);var qtd=vV.reduce(function(s,x){return s+(parseInt(x.qtdProdutos)||0)},0);return '<tr><td>'+getNome(v.id)+'</td><td class="tcc">'+vV.length+'</td><td class="tcc">'+qtd+'</td><td class="tcr">R$ '+fmtBRL(tot)+'</td></tr>'}).join('');var div=document.getElementById('vv-tabela');if(div)div.innerHTML='<thead><tr><th>Vendedor</th><th>Vendas</th><th>Produtos</th><th>Total</th></tr></thead><tbody>'+tabela+'</tbody>';if(charts.vv)charts.vv.destroy();var ctx=document.getElementById('chVV');if(ctx){charts.vv=new Chart(ctx,{type:'bar',data:{labels:vAtivos.map(function(v){return getNome(v.id)}),datasets:[{label:'Total',data:vAtivos.map(function(v){return filtradas.filter(function(x){return x.vendedor===v.id}).reduce(function(s,x){return s+(parseFloat(x.total)||0)},0)}),backgroundColor:CORES,borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})}}
function initVendVendedorChart(){filtrarVendVendedor()}
