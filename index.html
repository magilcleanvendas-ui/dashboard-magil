<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magil Clean — Gestão Comercial</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230071e3'/%3E%3Ctext x='32' y='44' font-family='-apple-system,Arial' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EMC%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
/* ============ DESIGN SYSTEM — ESTILO APPLE ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f5f7;
  --card:#ffffff;
  --txt:#1d1d1f;
  --txt2:#86868b;
  --txt3:#a1a1a6;
  --acc:#0071e3;
  --acc2:#0077ed;
  --ok:#34c759;
  --warn:#ff9f0a;
  --err:#ff3b30;
  --brd:rgba(0,0,0,.08);
  --r:18px;
  --s:0 8px 40px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --sbw:250px;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;
}
html,body{font-family:var(--font);-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5}

/* ============ LOGIN ============ */
#ls{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(180deg,#f5f5f7 0%,#e8e8ed 100%)}
.lc{background:rgba(255,255,255,.72);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid var(--brd);border-radius:28px;padding:48px 40px;box-shadow:0 24px 80px rgba(0,0,0,.12);width:400px;max-width:92%}
.lc .logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#0071e3,#5ac8fa);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff;margin:0 auto 20px;box-shadow:0 8px 24px rgba(0,113,227,.35)}
.lc h1{font-size:1.7rem;font-weight:700;text-align:center;letter-spacing:-.02em}
.lc p{text-align:center;color:var(--txt2);font-size:.9rem;margin:6px 0 28px}
.lc label{display:block;font-size:.78rem;font-weight:600;color:var(--txt2);margin-bottom:6px;padding-left:4px}
.lc select,.lc input{width:100%;padding:14px 16px;margin-bottom:16px;border:1px solid var(--brd);border-radius:12px;font-size:1rem;outline:none;background:#fff;color:var(--txt);transition:.2s}
.lc select:focus,.lc input:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(0,113,227,.15)}
.lc button{width:100%;padding:15px;background:var(--acc);color:#fff;border:none;border-radius:980px;font-size:1rem;font-weight:600;cursor:pointer;transition:.2s}
.lc button:hover{background:var(--acc2);transform:translateY(-1px)}
.lc .hint{text-align:center;font-size:.72rem;color:var(--txt3);margin-top:14px;line-height:1.5}

/* ============ APP SHELL ============ */
#app{display:none}
#hd{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:12px 28px;background:rgba(245,245,247,.72);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-bottom:1px solid var(--brd)}
#hd .hl{display:flex;align-items:center;gap:14px}
#hd .app-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#0071e3,#5ac8fa);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff}
#hd h2{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;color:var(--txt)}
#hd .hr{display:flex;align-items:center;gap:10px}
.icon-btn{background:transparent;border:1px solid var(--brd);border-radius:980px;padding:8px 14px;font-size:.85rem;color:var(--txt);cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.icon-btn:hover{background:rgba(0,0,0,.05)}
.badge{background:rgba(0,113,227,.1);color:var(--acc);padding:5px 14px;border-radius:980px;font-size:.75rem;font-weight:600}
.badge.mg{background:rgba(255,159,10,.14);color:#c93400}
#main{display:flex;min-height:calc(100vh - 55px)}

/* ============ SIDEBAR ============ */
.sidebar{width:var(--sbw);background:rgba(255,255,255,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--brd);padding:16px 10px;overflow-y:auto;position:sticky;top:55px;height:calc(100vh - 55px);flex-shrink:0;transition:width .3s,opacity .3s}
.sidebar.collapsed{width:0;padding:0;opacity:0;overflow:hidden;border:none}
.sidebar .nav-item{padding:11px 14px;cursor:pointer;font-size:.88rem;color:var(--txt2);border-radius:10px;font-weight:500;transition:.15s;display:flex;align-items:center;gap:10px;margin-bottom:2px}
.sidebar .nav-item.act{color:#fff;background:var(--acc);font-weight:600;box-shadow:0 4px 12px rgba(0,113,227,.3)}
.sidebar .nav-item:hover:not(.act){background:rgba(0,0,0,.05);color:var(--txt)}
.sidebar .nav-ico{font-size:1rem;width:20px;text-align:center}
.sidebar .nav-sep{height:1px;background:var(--brd);margin:10px 12px}
.sidebar .nav-title{padding:10px 14px 4px;font-size:.68rem;color:var(--txt3);text-transform:uppercase;font-weight:700;letter-spacing:.06em}

/* ============ CONTENT ============ */
.content{flex:1;padding:32px;overflow-x:auto;max-width:1400px}
.tc{display:none}
.tc.act{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:28px;box-shadow:var(--s);margin-bottom:20px}
.card h3{font-size:1.02rem;font-weight:700;margin-bottom:16px;letter-spacing:-.01em}
.st2{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin-bottom:24px}
.dv{height:1px;background:var(--brd);margin:20px 0}

/* ============ STATS ============ */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:24px}
.sc{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:22px;box-shadow:var(--s)}
.sc .lb{font-size:.72rem;color:var(--txt2);margin-bottom:8px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.sc .vl{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;color:var(--txt)}
.sc .sb{font-size:.74rem;color:var(--txt3);margin-top:4px}
.sc.w{border-top:3px solid var(--warn)}
.sc.d{border-top:3px solid var(--err)}
.sc.s{border-top:3px solid var(--ok)}

/* ============ PROGRESS ============ */
.pw{margin-bottom:16px}
.pw .pl{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:6px}
.pw .pl span:first-child{color:var(--txt2);font-weight:500}
.pw .pl span:last-child{font-weight:600}
.pb{height:8px;background:rgba(0,0,0,.06);border-radius:980px;overflow:hidden}
.pf{height:100%;border-radius:980px;transition:width .8s ease;min-width:0}
.pf.lo{background:var(--err)}
.pf.mi{background:var(--warn)}
.pf.hi{background:var(--ok)}

/* ============ VENDEDOR CARDS ============ */
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.vc{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:22px;box-shadow:var(--s)}
.vc .vh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--brd)}
.vc .vn{font-weight:700;font-size:1rem}
.vlv{font-size:.66rem;padding:3px 12px;border-radius:980px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.vlv.junior{background:rgba(142,142,147,.15);color:#636366}
.vlv.pleno{background:rgba(0,113,227,.12);color:var(--acc)}

/* ============ FORMS ============ */
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.fg label{display:block;font-size:.76rem;color:var(--txt2);margin-bottom:6px;font-weight:600}
.fg input,.fg select,.fg textarea{width:100%;padding:12px 14px;border:1px solid var(--brd);border-radius:12px;font-size:.9rem;outline:none;background:#fff;color:var(--txt);transition:.2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(0,113,227,.12)}

/* ============ BUTTONS ============ */
.btn{padding:11px 22px;border:none;border-radius:980px;font-size:.88rem;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-p{background:var(--acc);color:#fff}
.btn-p:hover{background:var(--acc2);transform:translateY(-1px)}
.btn-a{background:rgba(0,113,227,.1);color:var(--acc)}
.btn-a:hover{background:rgba(0,113,227,.18)}
.btn-d{background:rgba(255,59,48,.1);color:var(--err)}
.btn-d:hover{background:rgba(255,59,48,.18)}
.btn-f{width:100%}
.btn-s{padding:8px 16px;font-size:.8rem}

/* ============ TABLES ============ */
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{background:rgba(0,0,0,.03);color:var(--txt2);padding:12px 14px;text-align:left;font-weight:600;font-size:.74rem;letter-spacing:.03em;text-transform:uppercase;border-bottom:1px solid var(--brd)}
td{padding:12px 14px;border-bottom:1px solid rgba(0,0,0,.05)}
tr:hover td{background:rgba(0,113,227,.03)}
.tcr{text-align:right;font-variant-numeric:tabular-nums}
.tcc{text-align:center}

/* ============ TOAST ============ */
#toast{position:fixed;bottom:28px;right:28px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.tm{padding:14px 22px;border-radius:14px;color:#fff;font-size:.88rem;box-shadow:0 12px 40px rgba(0,0,0,.2);display:flex;align-items:center;gap:10px;max-width:380px;backdrop-filter:blur(10px);transition:.3s}
.tm.success{background:rgba(52,199,89,.95)}
.tm.error{background:rgba(255,59,48,.95)}
.tm.info{background:rgba(0,113,227,.95)}

/* ============ CHARTS ============ */
.cc{position:relative;height:300px;margin-top:16px}

/* ============ VENDEDOR ROW ============ */
.pc{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--card);border:1px solid var(--brd);border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.04);margin-bottom:10px;gap:10px;flex-wrap:wrap}
.pc .pi{display:flex;align-items:center;gap:12px}

/* ============ PRODUTO ENTRY ============ */
.pe{display:grid;grid-template-columns:1fr 90px 130px 40px;gap:8px;align-items:center;padding:12px;background:rgba(0,0,0,.03);border-radius:12px;margin-bottom:8px}
.pe select,.pe input{padding:9px 12px;border:1px solid var(--brd);border-radius:10px;font-size:.85rem;width:100%;background:#fff;color:var(--txt)}
.pe .rb{background:var(--err);color:#fff;border:none;border-radius:10px;cursor:pointer;padding:8px;font-size:1rem}
.st{background:var(--txt);color:#fff;padding:16px;border-radius:14px;text-align:center;font-size:1.1rem;font-weight:700;margin-top:12px;letter-spacing:-.01em}
.es{text-align:center;padding:40px;color:var(--txt3)}
.es .ic{font-size:2.6rem;margin-bottom:12px;opacity:.35}

/* ============ SEARCH ============ */
.search-box{position:relative;margin-bottom:18px}
.search-box input{width:100%;padding:14px 18px 14px 46px;border:1px solid var(--brd);border-radius:14px;font-size:.95rem;outline:none;background:#fff;color:var(--txt);box-shadow:0 2px 12px rgba(0,0,0,.04);transition:.2s}
.search-box input:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(0,113,227,.12)}
.search-box .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:1.1rem;pointer-events:none}

/* ============ TIPO TOGGLE ============ */
.tipo-toggle{display:flex;gap:4px;background:rgba(0,0,0,.05);padding:4px;border-radius:980px;margin-bottom:18px}
.tipo-toggle button{flex:1;padding:10px 16px;border:none;background:transparent;color:var(--txt2);font-size:.86rem;font-weight:600;cursor:pointer;border-radius:980px;transition:.2s}
.tipo-toggle button.act{background:#fff;color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.tipo-badge{display:inline-block;padding:3px 12px;border-radius:980px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.tipo-badge.venda{background:rgba(52,199,89,.14);color:#248a3d}
.tipo-badge.bonificacao{background:rgba(255,159,10,.16);color:#b25e00}

/* ============ WEEKLY BAR ============ */
.weekly-bar{background:linear-gradient(135deg,#1d1d1f,#3a3a3c);color:#fff;border-radius:var(--r);padding:24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.weekly-bar .wb-label{font-size:.7rem;opacity:.6;text-transform:uppercase;font-weight:600;letter-spacing:.05em}
.weekly-bar .wb-value{font-size:1.9rem;font-weight:700;letter-spacing:-.02em}
.weekly-bar .wb-progress{flex:1;min-width:200px;height:8px;background:rgba(255,255,255,.2);border-radius:980px;overflow:hidden}
.weekly-bar .wb-progress-fill{height:100%;background:#30d158;border-radius:980px;transition:width .8s ease}
.weekly-bar .wb-pct{font-size:1.2rem;font-weight:700}

/* ============ COMISSAO ============ */
.com-hero{background:linear-gradient(135deg,#1d1d1f,#3a3a3c);color:#fff;border-radius:var(--r);padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.com-hero .com-name{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.com-hero .com-nivel{font-size:.85rem;opacity:.65;margin-top:4px}
.com-hero .com-total{font-size:2.6rem;font-weight:800;letter-spacing:-.02em}
.com-hero .com-total-label{font-size:.7rem;opacity:.6;text-transform:uppercase;letter-spacing:.05em}
.com-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.com-stat{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:18px;text-align:center}
.com-stat .com-stat-label{font-size:.68rem;color:var(--txt2);text-transform:uppercase;font-weight:600;margin-bottom:6px;letter-spacing:.04em}
.com-stat .com-stat-value{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.com-stat .com-stat-sub{font-size:.7rem;color:var(--txt3);margin-top:4px}
.com-stat.highlight{border-top:3px solid var(--ok)}
.com-stat.highlight .com-stat-value{color:#248a3d}
.com-faixa-table th{background:rgba(0,0,0,.03)}
.com-faixa-table tr.ativa td{background:rgba(52,199,89,.08);font-weight:700}
.com-accel{background:rgba(0,0,0,.03);border-radius:16px;padding:22px;margin-top:16px}
.com-accel-title{font-size:1rem;font-weight:700;margin-bottom:8px}
.com-accel-desc{font-size:.8rem;color:var(--txt2);margin-bottom:14px;line-height:1.6}
.com-week-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.com-week{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:14px;text-align:center;cursor:pointer;transition:.15s}
.com-week:hover{border-color:var(--acc)}
.com-week.checked{background:rgba(52,199,89,.1);border-color:var(--ok)}
.com-week .com-week-num{font-size:.66rem;color:var(--txt2);text-transform:uppercase;font-weight:600;letter-spacing:.04em;margin-bottom:6px}
.com-week .com-week-icon{font-size:1.7rem}
.com-week .com-week-bonus{font-size:.74rem;font-weight:700;margin-top:6px;color:var(--acc)}
.com-week.checked .com-week-bonus{color:#248a3d}
.com-result{background:linear-gradient(135deg,#f0fff5,#e0f8e8);border:1px solid rgba(52,199,89,.3);border-radius:16px;padding:28px;margin-top:20px;text-align:center}
.com-result .com-result-label{font-size:.72rem;color:#555;text-transform:uppercase;font-weight:600;letter-spacing:.05em}
.com-result .com-result-value{font-size:3rem;font-weight:800;color:#248a3d;margin:8px 0;letter-spacing:-.02em}
.com-result .com-result-detail{font-size:.82rem;color:#555;margin-top:8px}
.com-result .com-result-badge{display:inline-block;background:#248a3d;color:#fff;padding:4px 16px;border-radius:980px;font-size:.74rem;font-weight:600;margin-top:12px}

/* ============ PREVISAO ============ */
.pred-card{background:linear-gradient(135deg,#e8f2ff,#dceaff);border:1px solid rgba(0,113,227,.25);border-radius:16px;padding:22px;margin-top:16px}
.pred-card h4{color:#0040dd;margin-bottom:12px;font-weight:700}
.pred-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:12px}
.pred-item{background:#fff;padding:14px;border-radius:12px;text-align:center;border:1px solid rgba(0,113,227,.1)}
.pred-item .pred-label{font-size:.7rem;color:var(--txt2);text-transform:uppercase;font-weight:600;margin-bottom:4px;letter-spacing:.04em}
.pred-item .pred-value{font-size:1.15rem;font-weight:700;color:var(--txt)}
.client-info{background:rgba(0,113,227,.05);border-radius:14px;padding:14px;margin-bottom:14px;border-left:4px solid var(--acc)}
.client-info .ci-label{font-size:.68rem;color:var(--txt2);text-transform:uppercase;font-weight:700;letter-spacing:.04em}
.client-info .ci-value{font-size:.92rem;color:var(--txt);font-weight:600;margin-top:2px}

/* ============ METAS MARCA ROW ============ */
.mp-row{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;align-items:center;padding:10px;background:rgba(0,0,0,.03);border-radius:12px;margin-bottom:8px}
.mp-row select,.mp-row input{padding:9px 12px;border:1px solid var(--brd);border-radius:10px;font-size:.85rem;width:100%;background:#fff;color:var(--txt)}
.mp-row .rb{background:var(--err);color:#fff;border:none;border-radius:10px;cursor:pointer;padding:8px}

/* ============ FILTROS ============ */
.filtros,.date-filter{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;align-items:flex-end}
.filtros .fg,.date-filter .fg{min-width:150px}
.inp-sm{padding:9px 12px;border:1px solid var(--brd);border-radius:10px;font-size:.85rem;background:#fff;color:var(--txt);outline:none}
.inp-sm:focus{border-color:var(--acc)}
.action-btns{display:flex;gap:6px;flex-wrap:wrap}
.edit-btn{background:rgba(0,113,227,.1);color:var(--acc);border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.76rem;font-weight:600}
.del-btn{background:rgba(255,59,48,.1);color:var(--err);border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.76rem;font-weight:600}

/* ============ MODO ESCURO ============ */
body.dark{--bg:#000;--card:#1c1c1e;--txt:#f5f5f7;--txt2:#98989d;--txt3:#6e6e73;--brd:rgba(255,255,255,.1);--s:0 8px 40px rgba(0,0,0,.5)}
body.dark #ls{background:linear-gradient(180deg,#000 0%,#1c1c1e 100%)}
body.dark .lc{background:rgba(28,28,30,.7);border-color:rgba(255,255,255,.12)}
body.dark .lc select,body.dark .lc input{background:#2c2c2e;color:#f5f5f7;border-color:rgba(255,255,255,.12)}
body.dark .lc .hint{color:#6e6e73}
body.dark #hd{background:rgba(0,0,0,.6);border-bottom-color:rgba(255,255,255,.1)}
body.dark #hd h2{color:#f5f5f7}
body.dark .icon-btn{color:#f5f5f7;border-color:rgba(255,255,255,.15)}
body.dark .icon-btn:hover{background:rgba(255,255,255,.08)}
body.dark .sidebar{background:rgba(28,28,30,.65);border-right-color:rgba(255,255,255,.08)}
body.dark .sidebar .nav-item{color:#98989d}
body.dark .sidebar .nav-item.act{background:var(--acc);color:#fff}
body.dark .sidebar .nav-item:hover:not(.act){background:rgba(255,255,255,.07);color:#f5f5f7}
body.dark .sidebar .nav-sep{background:rgba(255,255,255,.1)}
body.dark .sidebar .nav-title{color:#6e6e73}
body.dark .card,body.dark .sc,body.dark .vc,body.dark .pc,body.dark .com-stat{background:#1c1c1e;border-color:rgba(255,255,255,.1)}
body.dark .card h3{color:#f5f5f7}
body.dark th{background:rgba(255,255,255,.05);color:#98989d;border-bottom-color:rgba(255,255,255,.08)}
body.dark td{border-bottom-color:rgba(255,255,255,.06)}
body.dark tr:hover td{background:rgba(0,113,227,.07)}
body.dark .fg input,body.dark .fg select,body.dark .fg textarea,body.dark .search-box input{background:#2c2c2e;color:#f5f5f7;border-color:rgba(255,255,255,.12)}
body.dark .pe,body.dark .mp-row{background:rgba(255,255,255,.05)}

// ===== FUNCOES DE DADOS =====
function loadData(k) {
  if (cacheDados[k]) { return cacheDados[k]; }
  return [];
}

function initListener(k) {
  if (listeners[k]) { return; }
  listeners[k] = db.collection(k).onSnapshot(function (snap) {
    var arr = [];
    snap.forEach(function (doc) {
      var d = doc.data();
      d._id = doc.id;
      arr.push(d);
    });
    if (k === 'metas') {
      arr.forEach(function (row) {
        if (typeof row.marcasDetalhe === 'string') {
          try { row.marcasDetalhe = JSON.parse(row.marcasDetalhe); } catch (e) { row.marcasDetalhe = []; }
        }
        row.ligacoes = parseInt(row.ligacoes) || 0;
        row.prospeccao = parseInt(row.prospeccao) || 0;
        row.produtos = parseInt(row.produtos) || 0;
        row.valorVenda = parseFloat(row.valorVenda) || 0;
        row.semana = parseInt(row.semana) || 1;
        row.positivacao = parseInt(row.positivacao) || 0;
        row.clientesNovos = parseInt(row.clientesNovos) || 0;
      });
    }
    if (k === 'vendas') {
      arr.forEach(function (row) {
        if (typeof row.itens === 'string') {
          try { row.itens = JSON.parse(row.itens); } catch (e) { row.itens = []; }
        }
        row.total = parseFloat(row.total) || 0;
        row.qtdProdutos = parseInt(row.qtdProdutos) || 0;
        if (!row.tipo) { row.tipo = 'venda'; }
      });
    }
    if (k === 'atividades') {
      arr.forEach(function (row) { row.qtd = parseInt(row.qtd) || 0; });
    }
    if (k === 'clientes') {
      arr.forEach(function (row) {

        row.razao = String(row.razao || '');
        row.contato = String(row.contato || '');
        row.telefone = String(row.telefone || '');
        row.celular = String(row.celular || '');
        row.email = String(row.email || '');
        row.cidade = String(row.cidade || '');
        row.estado = String(row.estado || '');
        row.segmento = String(row.segmento || '');
        row.vendedorId = String(row.vendedorId || '');
        if (!row.origem) { row.origem = 'importado'; }
      });
    }
    if (k === 'usuarios') {
      arr.forEach(function (u) {
        if (u.id) {
          var usu = USU.find(function (x) { return x.id === u.id; });
          if (usu) {
            usu.nome = String(u.nome || usu.nome);
            usu.nivel = String(u.nivel || usu.nivel);
          }
        }
      });
      updateLoginNomes();
      var b = document.getElementById('ub');
      if (b && currentUser) { b.textContent = getNome(currentUser.id) + ' - ' + getNivel(currentUser.id); }
    }
    cacheDados[k] = arr;
    var active = document.querySelector('.tc.act');
    if (active && currentUser) { renderTab(active.id.replace('tc-', '')); }
  }, function (err) {
    console.log('Listener error for ' + k + ':', err);
  });
}

function saveData(k, d) {
  var col = db.collection(k);
  if (Array.isArray(d)) {
    d.forEach(function (item) {
      var id = item._id || item.id || db.collection(k).doc().id;
      var docData = JSON.parse(JSON.stringify(item));
      delete docData._id;
      col.doc(id).set(docData, { merge: true }).catch(function (e) { console.log('Save error:', e); });
    });
  } else {
    var id = d._id || d.id || db.collection(k).doc().id;
    var docData = JSON.parse(JSON.stringify(d));
    delete docData._id;
    col.doc(id).set(docData, { merge: true }).catch(function (e) { console.log('Save error:', e); });
  }
}

function deleteDoc(k, docId) {
  db.collection(k).doc(docId).delete().catch(function (e) { console.log('Delete error:', e); });
}

// ===== FUNCOES DE USUARIO =====
function getNivel(id) {
  var us = cacheDados['usuarios'] || [];
  var u = us.find(function (x) { return x.id === id; });
  if (u && u.nivel) { return String(u.nivel); }
  var usu = USU.find(function (x) { return x.id === id; });
  return usu ? usu.nivel : 'Junior';
}

function getNome(id) {
  var us = cacheDados['usuarios'] || [];
  var u = us.find(function (x) { return x.id === id; });
  if (u && u.nome) { return String(u.nome); }
  var usu = USU.find(function (x) { return x.id === id; });
  return usu ? usu.nome : id;
}

function loadSenhas() {
  var s = {};
  var us = cacheDados['usuarios'] || [];
  us.forEach(function (u) { if (u.id && u.senha) { s[u.id] = String(u.senha); } });
  USU.forEach(function (u) { if (!s[u.id]) { s[u.id] = 'magil2026'; } });
  return s;
}

function getVendedores() {
  return USU.filter(function (u) { return !u.isM; });
}

function syncUsuarios() {
  USU.forEach(function (u) {
    db.collection('usuarios').doc(u.id).get().then(function (doc) {
      if (!doc.exists) {
        db.collection('usuarios').doc(u.id).set({
          id: u.id, nome: u.nome, nivel: u.nivel, senha: 'magil2026'
        }).catch(function (e) { console.log('Sync user error:', e); });
      }
    }).catch(function (e) { console.log('Sync check error:', e); });
  });
}

// ===== FUNCOES AUXILIARES =====
function fmtBRL(v) {
  return parseFloat(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getClienteByCod(cod) {
  var clientes = loadData('clientes');
  var codStr = String(cod).trim();
  return clientes.find(function (c) { return String(c.cod).trim() === codStr; });
}

function getEstadoFromVenda(v) {
  if (v.estado && v.estado !== '--') { return v.estado; }
  var m = v.cliente.match(/\/([A-Z]{2})\)/);
  if (m) { return m[1]; }
  return '--';
}

function getSegmentoFromVenda(v) {
  if (v.segmento && v.segmento !== 'Outros') { return v.segmento; }
  var m = v.cliente.match(/COD\s+(\S+)/);
  if (m) {
    var c = getClienteByCod(m[1]);
    if (c) { return c.segmento || 'Outros'; }
  }
  return 'Outros';
}

function getMeusClientes() {
  var clientes = loadData('clientes');
  if (currentUser.isM) { return clientes; }
  return clientes.filter(function (c) { return c.vendedorId === currentUser.id; });
}

function getMinhasVendas() {
  var vendas = loadData('vendas');
  if (currentUser.isM) { return vendas; }
  return vendas.filter(function (v) { return v.vendedor === currentUser.id; });
}

function toast(msg, type) {
  var t = document.createElement('div');
  t.className = 'tm ' + (type || 'info');
  t.textContent = (type === 'success' ? 'OK: ' : (type === 'error' ? 'ERRO: ' : 'INFO: ')) + msg;
  document.getElementById('toast').appendChild(t);
  setTimeout(function () {
    t.style.opacity = '0';
    t.style.transform = 'translateX(100%)';
    setTimeout(function () { t.remove(); }, 300);
  }, 3500);
}

function progressBar(label, atual, meta, pct) {
  var cls = pct >= 80 ? 'hi' : (pct >= 50 ? 'mi' : 'lo');
  var fa = parseFloat(atual || 0);
  var fm = parseFloat(meta || 0);
  var da = fa > 100 ? 'R$ ' + fmtBRL(fa) : fa;
  var dm = fm > 100 ? 'R$ ' + fmtBRL(fm) : fm;
  return '<div class="pw"><div class="pl"><span>' + label + '</span><span>' + da + ' / ' + dm + ' (' + Math.round(pct) + '%)</span></div><div class="pb"><div class="pf ' + cls + '" style="width:' + Math.max(2, Math.min(100, pct)) + '%"></div></div></div>';
}

function updateLoginNomes() {
  var sel = document.getElementById('lu');
  if (!sel) { return; }
  sel.innerHTML = '<option value="">Selecione...</option>';
  USU.forEach(function (u) {
    var nm = getNome(u.id);
    var opt = document.createElement('option');
    opt.value = u.id;
    opt.textContent = u.isM ? nm + ' (Gerente)' : nm;
    sel.appendChild(opt);
  });
}

// ===== LOGIN / LOGOUT =====
function doLogin() {
  var sel = document.getElementById('lu').value;
  var pwd = document.getElementById('lp').value;
  if (!sel) { toast('Selecione um perfil', 'error'); return; }
  if (!pwd) { toast('Digite a senha', 'error'); return; }
  var senhas = loadSenhas();
  if (senhas[sel] !== pwd) { toast('Senha incorreta!', 'error'); return; }
  completarLogin(sel);
}

function completarLogin(sel) {
  var user = USU.find(function (u) { return u.id === sel; });
  if (!user) { toast('Perfil nao encontrado', 'error'); return; }
  currentUser = user;
  localStorage.setItem('mc_user', JSON.stringify({ id: user.id }));
  document.getElementById('ls').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  var b = document.getElementById('ub');
  b.textContent = getNome(user.id) + ' - ' + getNivel(user.id);
  b.className = 'badge' + (user.isM ? ' mg' : '');
  initSidebar();
  ['vendas', 'clientes', 'metas', 'atividades', 'usuarios'].forEach(function (k) { initListener(k); });
  syncUsuarios();
  toast('Bem-vindo, ' + getNome(user.id) + '!', 'success');
}

function doLogout() {
  currentUser = null;
  localStorage.removeItem('mc_user');
  location.reload();
}

function toggleSidebar() {
  var sb = document.getElementById('sb');
  sb.classList.toggle('collapsed');

// ===== MASCARA DE TELEFONE (00) 00000-0000 — 11 digitos =====
function maskTelefone(el) {
  var v = el.value.replace(/\D/g, '').slice(0, 11);
  var r = '';
  if (v.length > 0) { r = '(' + v.slice(0, 2); }
  if (v.length >= 3) { r += ') ' + v.slice(2, 7); }
  if (v.length >= 8) { r += '-' + v.slice(7, 11); } else if (v.length > 7) { r += v.slice(7); }
  el.value = r;
}

// ===== EXPORTACAO =====
function exportCSV(data, filename) {
  if (!data || !data.length) { return; }
  var headers = Object.keys(data[0]).filter(function (h) { return h !== '_id'; });
  var csv = headers.join(';') + '\n';
  data.forEach(function (row) {
    var vals = headers.map(function (h) {
      var v = row[h];
      if (typeof v === 'object') { v = JSON.stringify(v); }
      if (v === null || v === undefined) { v = ''; }
      return String(v).replace(/;/g, ',');
    });
    csv += vals.join(';') + '\n';
  });
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename || 'export.csv';
  a.click();
}

function exportPDF(titulo, htmlContent) {
  var w = window.open('', '', 'width=900,height=700');

  w.document.close();
  w.print();
}

// ===== META SEMANAL (VENDEDOR) =====
function getMetaSemanalAtual() {
  var metas = loadData('metas');
  if (!metas || !metas.length) { return null; }
  var vM = metas.filter(function (m) { return m.vendedor === currentUser.id; });
  if (!vM.length) { return null; }
  var hoje = new Date();
  var dia = hoje.getDate();
  var semana = Math.ceil(dia / 7);
  var mSem = vM.filter(function (m) { return parseInt(m.semana) === semana; });
  if (mSem.length) { return mSem[mSem.length - 1]; }
  var mAno = vM.filter(function (m) { return m.ano == String(hoje.getFullYear()); });
  if (mAno.length) { return mAno[mAno.length - 1]; }
  return vM[vM.length - 1];
}

function renderWeeklyBar() {
  if (currentUser.isM) { return ''; }
  var m = getMetaSemanalAtual();
  if (!m) { return ''; }
  var vendas = loadData('vendas');
  var vV = vendas.filter(function (v) { return v.vendedor === currentUser.id && (v.tipo || 'venda') === 'venda'; });
  var vPr = vV.reduce(function (s, v) { return s + (parseInt(v.qtdProdutos) || 0); }, 0);
  var metaProd = parseInt(m.produtos) || 0;
  var pct = metaProd > 0 ? Math.min(100, (vPr / metaProd) * 100) : 0;
  return '<div class="weekly-bar"><div class="wb-info"><div class="wb-label">Produtos Vendidos</div><div class="wb-value">' + vPr + '</div></div><div class="wb-progress"><div class="wb-progress-fill" style="width:' + Math.max(2, pct) + '%"></div></div><div class="wb-info" style="text-align:right"><div class="wb-label">Meta Semanal</div><div class="wb-value">' + metaProd + '</div></div><div class="wb-pct">' + Math.round(pct) + '%</div></div>';
}

function renderProdutosDiscriminados() {
  if (currentUser.isM) { return ''; }
  var m = getMetaSemanalAtual();
  if (!m) { return ''; }
  var vendas = loadData('vendas');
  var vV = vendas.filter(function (v) { return v.vendedor === currentUser.id && (v.tipo || 'venda') === 'venda'; });
  var prodCount = {};
  vV.forEach(function (v) {
    if (v.itens) {
      v.itens.forEach(function (it) {
        var nome = it.nome || it.cod;
        if (!prodCount[nome]) { prodCount[nome] = 0; }
        prodCount[nome] += parseInt(it.qtd) || 0;
      });
    }
  });
  var metaProd = parseInt(m.produtos) || 0;
  var totalVendido = Object.keys(prodCount).reduce(function (s, k) { return s + prodCount[k]; }, 0);
  var pct = metaProd > 0 ? Math.min(100, (totalVendido / metaProd) * 100) : 0;
  var html = '<div class="card"><h3>Produtos Discriminados</h3><table><thead><tr><th>Produto</th><th class="tcc">Qtd Vendida</th><th class="tcc">% da Meta</th></tr></thead><tbody>';
  Object.keys(prodCount).sort(function (a, b) { return prodCount[b] - prodCount[a]; }).forEach(function (p) {
    var pp = metaProd > 0 ? Math.round((prodCount[p] / metaProd) * 100) : 0;
    html += '<tr><td>' + p + '</td><td class="tcc">' + prodCount[p] + '</td><td class="tcc">' + pp + '%</td></tr>';
  });
  html += '</tbody><tfoot><tr style="font-weight:700;background:rgba(0,113,227,.05)"><td>Total</td><td class="tcc">' + totalVendido + '</td><td class="tcc">' + Math.round(pct) + '%</td></tr></tfoot></table></div>';
  return html;
}

}// ===== VISAO GERAL (GERENTE) — com quadro "Clientes Existentes" =====
function renderOverview() {
  var vendas = loadData('vendas');
  var metas = loadData('metas');
  var atividades = loadData('atividades');
  var clientes = loadData('clientes');
  var vAtivos = getVendedores();
  var tV = 0, tL = 0, tP = 0, tPr = 0, tPos = 0, tCN = 0;
  var clientesExistentes = clientes.filter(function (c) { return c.origem !== 'manual'; }).length;
  var clientesNovosManual = clientes.filter(function (c) { return c.origem === 'manual'; }).length;

  var cards = vAtivos.map(function (v) {
    var vV = vendas.filter(function (x) { return x.vendedor === v.id && (x.tipo || 'venda') === 'venda'; });
    var vA = atividades.filter(function (x) { return x.vendedor === v.id; });
    var vM = metas.filter(function (x) { return x.vendedor === v.id; });
    var vTotV = vV.reduce(function (s, x) { return s + (parseFloat(x.total) || 0); }, 0);
    var vL = vA.filter(function (x) { return x.tipo === 'ligacao'; }).reduce(function (s, x) { return s + (parseInt(x.qtd) || 0); }, 0);
    var vP = vA.filter(function (x) { return x.tipo === 'prospeccao'; }).reduce(function (s, x) { return s + (parseInt(x.qtd) || 0); }, 0);
    var vPr = vV.reduce(function (s, x) { return s + (parseInt(x.qtdProdutos) || 0); }, 0);
    var vPos = vV.length;
    var vCN = clientes.filter(function (c) { return c.vendedorId === v.id; }).length;

    tV += vTotV; tL += vL; tP += vP; tPr += vPr; tPos += vPos; tCN += vCN;

    var m = vM[vM.length - 1] || {};
    var pV = m.valorVenda ? Math.min(100, (vTotV / m.valorVenda) * 100) : 0;
    var pL = m.ligacoes ? Math.min(100, (vL / m.ligacoes) * 100) : 0;
    var pP = m.prospeccao ? Math.min(100, (vP / m.prospeccao) * 100) : 0;
    var pPr = m.produtos ? Math.min(100, (vPr / m.produtos) * 100) : 0;
    var pPos = m.positivacao ? Math.min(100, (vPos / m.positivacao) * 100) : 0;
    var pCN = m.clientesNovos ? Math.min(100, (vCN / m.clientesNovos) * 100) : 0;
    var nv = getNivel(v.id);

    return '<div class="vc">' +
      '<div class="vh"><span class="vn">' + getNome(v.id) + '</span><span class="vlv ' + nv.toLowerCase() + '">' + nv + '</span></div>' +
      progressBar('Vendas (R$)', vTotV, m.valorVenda || 0, pV) +
      progressBar('Ligacoes', vL, m.ligacoes || 0, pL) +
      progressBar('Prospeccao', vP, m.prospeccao || 0, pP) +
      progressBar('Produtos', vPr, m.produtos || 0, pPr) +
      progressBar('Positivacao', vPos, m.positivacao || 0, pPos) +
      progressBar('Clientes Novos', vCN, m.clientesNovos || 0, pCN) +
      '</div>';
  }).join('');

  return '<h2 class="st2">Visao Geral</h2>' +
    '<div class="sg">' +
    '<div class="sc ' + (tV > 0 ? 's' : '') + '"><div class="lb">Faturamento</div><div class="vl">R$ ' + fmtBRL(tV) + '</div><div class="sb">' + vendas.length + ' vendas</div></div>' +
    '<div class="sc"><div class="lb">Ligacoes</div><div class="vl">' + tL + '</div></div>' +
    '<div class="sc"><div class="lb">Prospeccao</div><div class="vl">' + tP + '</div></div>' +
    '<div class="sc"><div class="lb">Produtos</div><div class="vl">' + tPr + '</div></div>' +
    '<div class="sc"><div class="lb">Positivacao</div><div class="vl">' + tPos + '</div></div>' +
    '<div class="sc"><div class="lb">Clientes Existentes</div><div class="vl">' + clientesExistentes + '</div></div>' +
    '<div class="sc"><div class="lb">Clientes Novos</div><div class="vl">' + clientesNovosManual + '</div></div>' +
    '</div>' +
    '<div class="card"><h3>Performance</h3><div class="cc"><canvas id="chOv"></canvas></div></div>' +
    '<div class="vg">' + cards + '</div>';
}

function importClientes() {

function handleImportFile(event) {
  var file = event.target.files[0];
  if (!file) { return; }
  var reader = new FileReader();
  reader.onload = function (e) {
    try {
      var data = new Uint8Array(e.target.result);
      var workbook = XLSX.read(data, { type: 'array' });
      var sheetName = workbook.SheetNames[0];
      var sheet = workbook.Sheets[sheetName];
      var rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      if (!rows.length) { toast('Planilha vazia', 'error'); return; }
      var importados = 0, atualizados = 0, ignorados = 0;
      rows.forEach(function (row) {
        var cod = String(row['Código'] || row['Codigo'] || row['COD'] || row['codigo'] || '').trim();
        var razao = String(row['Razão Social'] || row['Razao Social'] || row['RazaoSocial'] || row['razao'] || '').trim();
        if (!cod || !razao) { ignorados++; return; }
        var vendedorId = currentUser.isM
          ? (String(row['Vendedor'] || row['vendedor'] || '').trim() || currentUser.id)
          : currentUser.id;
        var cliente = {
          cod: cod,
          razao: razao,
          contato: String(row['Contato'] || row['contato'] || '').trim(),
          telefone: String(row['Telefone'] || row['telefone'] || '').trim(),
          celular: String(row['Celular'] || row['celular'] || '').trim(),
          email: String(row['E-mail'] || row['Email'] || row['email'] || '').trim(),
          cidade: String(row['Cidade'] || row['cidade'] || '').trim(),
          estado: String(row['UF'] || row['Estado'] || row['uf'] || '').trim(),
          segmento: String(row['Segmento'] || row['segmento'] || '').trim(),
          vendedorId: vendedorId,
          origem: 'importado'
        };
        var clientes = loadData('clientes');
        var existing = clientes.find(function (c) { return String(c.cod).trim() === cod; });
        if (existing) {
          cliente._id = existing._id;
          saveData('clientes', cliente);
          atualizados++;
        } else {
          saveData('clientes', cliente);
          importados++;
        }
      });
      toast('Importacao concluida: ' + importados + ' novos, ' + atualizados + ' atualizados' +
        (ignorados ? ', ' + ignorados + ' sem codigo/razao' : ''), 'success');
      renderTab(currentUser.isM ? 'clientes' : 'meuscli');
    } catch (err) {
      toast('Erro ao importar: ' + err.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
}

function transferirCliente(cod, novoVendId) {
  if (!novoVendId) { return; }
  if (!currentUser.isM) { toast('Somente a gerente pode transferir clientes', 'error'); return; }
  var clientes = loadData('clientes');
  var c = clientes.find(function (x) { return String(x.cod).trim() === String(cod).trim(); });
  if (!c) { toast('Cliente nao encontrado', 'error'); return; }
  c.vendedorId = novoVendId;
  saveData('clientes', c);
  toast('Cliente ' + c.razao + ' transferido para ' + getNome(novoVendId), 'success');
  renderTab('clientes');
}

function saveCliente(isGerente) {
  var cod = document.getElementById('cl-cod').value.trim();
  var razao = document.getElementById('cl-razao').value.trim();
  if (!cod || !razao) { toast('Codigo e Razao sao obrigatorios', 'error'); return; }
  var c = {
    cod: cod,
    razao: razao,
    contato: document.getElementById('cl-contato').value.trim(),
    telefone: '',
    celular: document.getElementById('cl-celular').value.trim(),
    email: '',
    cidade: document.getElementById('cl-cidade').value.trim(),
    estado: document.getElementById('cl-estado').value,
    segmento: document.getElementById('cl-segmento').value,
    vendedorId: isGerente ? document.getElementById('cl-vend').value : currentUser.id
  };
  var clientes = loadData('clientes');
  var existing = clientes.find(function (x) { return String(x.cod).trim() === cod; });

    c._id = existing._id;

      '<div><div class="com-name">' + getNome(v.id) + ' <span id="rd-arrow-' + v.id + '" style="font-size:.9rem;opacity:.7">▾</span></div>' +
      '<div class="com-nivel">' + getNivel(v.id) + ' — ' + meus.length + ' clientes</div></div>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap" onclick="event.stopPropagation()">' +
      '<select id="rd-dest-' + v.id + '" class="inp-sm" style="width:150px"><option value="">Destino...</option>' + destOpts + '</select>' +
      '<button class="btn btn-a btn-s" onclick="transferirCarteira(\'' + v.id + '\')">Mover Carteira</button>' +
      '</div></div>' +
      '<div id="rd-body-' + v.id + '">' + corpo + '</div>' +

  });

}

function toggleCarteira(vid) {
  var body = document.getElementById('rd-body-' + vid);
  var arrow = document.getElementById('rd-arrow-' + vid);
  if (!body) { return; }
  var hidden = body.style.display === 'none';
  body.style.display = hidden ? 'block' : 'none';
  if (arrow) { arrow.textContent = hidden ? '▾' : '▸'; }
}

function transferirCarteira(origemId) {
  var destId = document.getElementById('rd-dest-' + origemId).value;
  if (!destId) { toast('Selecione o vendedor de destino', 'error'); return; }
  if (!currentUser.isM) { toast('Somente a gerente pode transferir carteiras', 'error'); return; }
  var clientes = loadData('clientes');
  var daCarteira = clientes.filter(function (c) { return c.vendedorId === origemId; });
  if (!daCarteira.length) { toast(getNome(origemId) + ' nao possui clientes na carteira', 'error'); return; }
  if (!confirm('Mover a carteira de ' + getNome(origemId) + ' (' + daCarteira.length + ' clientes) para ' + getNome(destId) + '?')) { return; }
  daCarteira.forEach(function (c) {
    c.vendedorId = destId;
    saveData('clientes', c);
  });
  toast('Carteira de ' + getNome(origemId) + ' movida para ' + getNome(destId), 'success');
  renderTab('rodizio');
}

function rodizioAutomatico() {
  if (!currentUser.isM) { toast('Somente a gerente pode fazer o rodizio', 'error'); return; }
  var vAtivos = getVendedores();
  var clientes = loadData('clientes');
  if (!clientes.length) { toast('Nenhum cliente para rodizio', 'error'); return; }
  if (!confirm('Rodizio automatico: a carteira de TODOS os vendedores sera movida para o proximo da lista (V1 -> V2, V2 -> V3, ..., ultimo -> V1). Continuar?')) { return; }
  var mapa = {};
  vAtivos.forEach(function (v, i) {
    var prox = vAtivos[(i + 1) % vAtivos.length];
    mapa[v.id] = prox.id;
  });
  clientes.forEach(function (c) {
    c.vendedorId = mapa[c.vendedorId] || c.vendedorId;
    saveData('clientes', c);
  });
  localStorage.setItem('mc_ultimo_rodizio', new Date().toISOString());
  toast('Rodizio concluido: todas as carteiras movidas para o proximo vendedor', 'success');
  renderTab('rodizio');
}

function salvarEdicaoVenda() {
  if (editingVendaIdx < 0) { toast('Nenhuma venda selecionada', 'error'); return; }
  var vendas = loadData('vendas');
  var v = vendas[editingVendaIdx];
  if (!v) { toast('Venda nao encontrada', 'error'); return; }
  var data = document.getElementById('vd-data').value;
  var cod = document.getElementById('vd-cli').value;
  var cliente = getClienteByCod(cod);
  var tipo = getTipoLanc();
  var itens = [];
  var total = 0;
  var qtdProdutos = 0;
  document.querySelectorAll('.pe').forEach(function (row) {
    var codProd = row.querySelector('.pe-prod').value;
    var qtd = parseInt(row.querySelector('.pe-qtd').value) || 0;
    var prod = PROD.find(function (p) { return p.cod === codProd; });
    if (prod && qtd > 0) {
      itens.push({ cod: codProd, nome: prod.nome, qtd: qtd, preco: prod.preco });
      total += prod.preco * qtd;
      qtdProdutos += qtd;
    }
  });
  if (itens.length === 0) { toast('Adicione pelo menos um item', 'error'); return; }
  var nomeCli = cliente ? cliente.razao : 'COD ' + cod;
  var estado = cliente ? cliente.estado : '--';
  var segmento = cliente ? cliente.segmento : 'Outros';
  var updated = {
    _id: v._id,
    data: data,
    cliente: nomeCli + ' (COD ' + cod + ' / ' + estado + ')',
    vendedor: v.vendedor,
    itens: itens,
    qtdProdutos: qtdProdutos,
    total: total,
    estado: estado,
    segmento: segmento,
    tipo: tipo
  };
  saveData('vendas', updated);
  editingVendaIdx = -1;
  toast('Venda atualizada!', 'success');
  renderTab('vendas');
}

function cancelarEdicaoVenda() { editingVendaIdx = -1; renderTab('vendas'); }

function delVenda(i) {
  if (!confirm('Excluir esta venda?')) { return; }
  var vendas = loadData('vendas');
  var v = vendas[i];
  if (v && v._id) {
    deleteDoc('vendas', v._id);
    toast('Venda excluida', 'success');
    renderTab('vendas');
  }
}

function filtrarRelAtiv() {
  var atividades = loadData('atividades');
  var periodo = document.getElementById('ra-periodo').value;
  var inicio = document.getElementById('ra-inicio').value;
  var fim = document.getElementById('ra-fim').value;
  var vend = document.getElementById('ra-vend').value;
  var tipo = document.getElementById('ra-tipo').value;
  var filtradas = atividades.filter(function (a) {
    if (vend && a.vendedor !== vend) { return false; }
    if (tipo && a.tipo !== tipo) { return false; }
    if (inicio && a.data < inicio) { return false; }
    if (fim && a.data > fim) { return false; }
    if (periodo !== 'todos' && inicio) {
      var dataAtiv = new Date(a.data);
      var dataIni = new Date(inicio);
      var diff = Math.floor((dataAtiv.getTime() - dataIni.getTime()) / (1000 * 60 * 60 * 24));
      if (periodo === 'diario' && diff !== 0) { return false; }
      if (periodo === 'semanal' && diff > 7) { return false; }
      if (periodo === 'mensal' && diff > 30) { return false; }
      if (periodo === 'anual' && diff > 365) { return false; }
    }
    return true;
  });
  var html = '';
  if (filtradas.length === 0) {
    html = '<div class="es"><div class="ic">SEM</div><p>Nenhuma atividade no periodo.</p></div>';
  } else {
    var totLig = filtradas.filter(function (a) { return a.tipo === 'ligacao'; })
      .reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);
    var totPro = filtradas.filter(function (a) { return a.tipo === 'prospeccao'; })
      .reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);
    var totVis = filtradas.filter(function (a) { return a.tipo === 'visita'; })
      .reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);
    var totEm = filtradas.filter(function (a) { return a.tipo === 'email'; })
      .reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);
    var totWh = filtradas.filter(function (a) { return a.tipo === 'whatsapp'; })
      .reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);
    html = '<div class="sg">' +
      '<div class="sc"><div class="lb">Ligacoes</div><div class="vl">' + totLig + '</div></div>' +
      '<div class="sc"><div class="lb">Prospeccao</div><div class="vl">' + totPro + '</div></div>' +
      '<div class="sc"><div class="lb">Visitas</div><div class="vl">' + totVis + '</div></div>' +
      '<div class="sc"><div class="lb">E-mails</div><div class="vl">' + totEm + '</div></div>' +
      '<div class="sc"><div class="lb">WhatsApp</div><div class="vl">' + totWh + '</div></div>' +
      '</div>';
    html += '<table><thead><tr><th>Data</th><th>Vendedor</th><th>Tipo</th><th>Qtd</th><th>Obs</th></tr></thead><tbody>';
    filtradas.forEach(function (a) {
      html += '<tr><td>' + a.data + '</td><td>' + getNome(a.vendedor) + '</td>' +
        '<td>' + (a.tipo || '--') + '</td><td class="tcc">' + (a.qtd || 0) + '</td>' +
        '<td>' + (a.obs || '') + '</td></tr>';
    });
    html += '</tbody></table>';
  }
  var div = document.getElementById('ra-result');
  if (div) { div.innerHTML = html; }

function filtrarVendVendedor() {
  var vendas = loadData('vendas');
  var vend = document.getElementById('vv-vend').value;
  var periodo = document.getElementById('vv-periodo').value;
  var dataRef = document.getElementById('vv-data').value;
  var filtradas = vendas.filter(function (v) {
    if (vend && v.vendedor !== vend) { return false; }
    if (dataRef) {
      var dV = new Date(v.data);
      var dR = new Date(dataRef);
      if (periodo === 'diario' && dV.toDateString() !== dR.toDateString()) { return false; }
      if (periodo === 'mensal' && (dV.getMonth() !== dR.getMonth() || dV.getFullYear() !== dR.getFullYear())) { return false; }
      if (periodo === 'anual' && dV.getFullYear() !== dR.getFullYear()) { return false; }
    }
    return true;
  });
  var vAtivos = getVendedores();
  var tabela = vAtivos.map(function (v) {
    var vV = filtradas.filter(function (x) { return x.vendedor === v.id; });
    var tot = vV.reduce(function (s, x) { return s + (parseFloat(x.total) || 0); }, 0);
    var qtd = vV.reduce(function (s, x) { return s + (parseInt(x.qtdProdutos) || 0); }, 0);
    return '<tr><td>' + getNome(v.id) + '</td><td class="tcc">' + vV.length + '</td>' +
      '<td class="tcc">' + qtd + '</td><td class="tcr">R$ ' + fmtBRL(tot) + '</td></tr>';
  }).join('');
  var div = document.getElementById('vv-tabela');
  if (div) {

    '</div></div><div id="ac-result"></div>';

function analisaCliente() {
  var selCod = document.getElementById('ac-cli').value;
  if (!selCod) {
    var r = document.getElementById('ac-result');
    if (r) { r.innerHTML = ''; }
    return;
  }
  var vendas = loadData('vendas');
  var cliente = getClienteByCod(selCod);
  var vCli = vendas.filter(function (v) {
    var m = v.cliente.match(/COD\s+(\S+)/);
    return m && m[1] === selCod;
  });
  vCli.sort(function (a, b) { return a.data.localeCompare(b.data); });
  var html = '';
  if (vCli.length === 0) {
    html = '<div class="card"><div class="es"><div class="ic">SEM</div><p>Nenhuma compra registrada para este cliente.</p></div></div>';
  } else {
    var totGeral = vCli.reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
    var qtdProd = vCli.reduce(function (s, v) { return s + (parseInt(v.qtdProdutos) || 0); }, 0);
    var mediaTicket = totGeral / vCli.length;
    var intervalos = [];
    for (var i = 1; i < vCli.length; i++) {
      var d1 = new Date(vCli[i - 1].data);
      var d2 = new Date(vCli[i].data);
      intervalos.push(Math.floor((d2.getTime() - d1.getTime()) / (1000 * 60 * 60 * 24)));
    }
    var intervaloMedio = intervalos.length ? Math.round(intervalos.reduce(function (s, x) { return s + x; }, 0) / intervalos.length) : 0;
    var produtosFreq = {};
    vCli.forEach(function (v) {
      if (v.itens) {
        v.itens.forEach(function (it) {
          var nome = it.nome || it.cod;
          if (!produtosFreq[nome]) { produtosFreq[nome] = { qtd: 0, vezes: 0 }; }
          produtosFreq[nome].qtd += parseInt(it.qtd) || 0;
          produtosFreq[nome].vezes++;
        });
      }
    });
    var prodsOrdenados = Object.keys(produtosFreq).sort(function (a, b) { return produtosFreq[b].vezes - produtosFreq[a].vezes; });
    var dataPrevista = '--';
    if (intervaloMedio > 0 && vCli.length > 1) {
      var dUlt = new Date(vCli[vCli.length - 1].data);
      dUlt.setDate(dUlt.getDate() + intervaloMedio);
      dataPrevista = dUlt.toISOString().split('T')[0];
    }
    var valorPrevisto = mediaTicket;
    html = '<div class="card"><h3>' + (cliente ? cliente.razao : 'Cliente ' + selCod) + '</h3><div class="sg">' +
      '<div class="sc s"><div class="lb">Total Compras</div><div class="vl">' + vCli.length + '</div></div>' +
      '<div class="sc"><div class="lb">Faturamento Total</div><div class="vl">R$ ' + fmtBRL(totGeral) + '</div></div>' +
      '<div class="sc"><div class="lb">Ticket Medio</div><div class="vl">R$ ' + fmtBRL(mediaTicket) + '</div></div>' +
      '<div class="sc"><div class="lb">Produtos Comprados</div><div class="vl">' + qtdProd + '</div></div>' +
      '<div class="sc"><div class="lb">Intervalo Medio</div><div class="vl">' + intervaloMedio + ' dias</div></div>' +
      '</div></div>';
    html += '<div class="card"><h3>Historico de Compras</h3><table><thead><tr><th>Data</th><th>Itens</th><th>Qtd</th><th>Total</th></tr></thead><tbody>';
    vCli.forEach(function (v) {
      var itensStr = (v.itens && v.itens.length)
        ? v.itens.map(function (it) { return it.qtd + 'x ' + it.nome; }).join(', ')
        : '--';
      html += '<tr><td>' + v.data + '</td><td style="font-size:.78rem">' + itensStr + '</td>' +
        '<td class="tcc">' + (v.qtdProdutos || 0) + '</td><td class="tcr">R$ ' + fmtBRL(v.total) + '</td></tr>';
    });
    html += '</tbody></table></div>';
    html += '<div class="card"><h3>Produtos Mais Comprados</h3><table><thead><tr><th>Produto</th><th>Qtd Total</th><th>Frequencia</th></tr></thead><tbody>';
    prodsOrdenados.forEach(function (p) {
      html += '<tr><td>' + p + '</td><td class="tcc">' + produtosFreq[p].qtd + '</td><td class="tcc">' + produtosFreq[p].vezes + 'x</td></tr>';
    });
    html += '</tbody></table></div>';
    html += '<div class="pred-card"><h4>Previsao do Proximo Pedido</h4><div class="pred-grid">' +
      '<div class="pred-item"><div class="pred-label">Data Estimada</div><div class="pred-value">' + dataPrevista + '</div></div>' +
      '<div class="pred-item"><div class="pred-label">Valor Estimado</div><div class="pred-value">R$ ' + fmtBRL(valorPrevisto) + '</div></div>' +
      '<div class="pred-item"><div class="pred-label">Intervalo</div><div class="pred-value">' + intervaloMedio + ' dias</div></div>' +
      '</div></div>';
  }
  var div = document.getElementById('ac-result');
  if (div) { div.innerHTML = html; }
}// ===== COMISSAO =====

function renderCompContent(vid) {
  var vendas = loadData('vendas').filter(function (v) { return v.tipo !== 'bonificacao'; });
  var vV = vendas.filter(function (v) { return v.vendedor === vid; });
  var total = vV.reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
  var nivel = getNivel(vid);
  var faixas = COM[nivel] || COM['Junior'];
  var taxa = 0;
  for (var i = 0; i < faixas.length; i++) {
    if (total >= faixas[i].min && total <= faixas[i].max) { taxa = faixas[i].taxa; break; }
  }
  var faixaHtml = '<table class="com-faixa-table"><thead><tr><th>Faixa de Vendas</th><th>Taxa (por R$ 1.000)</th></tr></thead><tbody>';
  faixas.forEach(function (f) {
    var ativa = (total >= f.min && total <= f.max);
    faixaHtml += '<tr' + (ativa ? ' class="ativa"' : '') + '><td>' +
      (f.max >= 999999999 ? 'Acima de R$ ' + fmtBRL(f.min) : 'R$ ' + fmtBRL(f.min) + ' ate R$ ' + fmtBRL(f.max)) +
      '</td><td style="text-align:center">' + f.taxa.toFixed(2) + '</td></tr>';
  });
  faixaHtml += '</tbody></table>';
  var comissaoBase = (total / 1000) * taxa;
  var html = '<div class="com-hero"><div><div class="com-name">' + getNome(vid) + '</div><div class="com-nivel">' + nivel + '</div></div>' +
    '<div style="text-align:right"><div class="com-total-label">Total Vendido</div><div class="com-total">R$ ' + fmtBRL(total) + '</div></div></div>';
  html += '<div class="com-stats">' +
    '<div class="com-stat"><div class="com-stat-label">Taxa Base</div><div class="com-stat-value" id="cm-taxa-base">' + taxa.toFixed(2) + '</div></div>' +
    '<div class="com-stat"><div class="com-stat-label">Acelerador</div><div class="com-stat-value" id="cm-accel-val">+0.00</div><div class="com-stat-sub" id="cm-weeks-val">0/4 semanas</div></div>' +
    '<div class="com-stat"><div class="com-stat-label">Taxa Final</div><div class="com-stat-value" id="cm-taxa-final">' + taxa.toFixed(2) + '</div></div>' +
    '<div class="com-stat highlight"><div class="com-stat-label">Comissao</div><div class="com-stat-value" id="cm-comissao-val">R$ ' + fmtBRL(comissaoBase) + '</div></div>' +
    '</div>';
  html += '<div class="card"><h3>Faixas de Comissao - ' + nivel + '</h3>' + faixaHtml + '</div>';
  html += '<div class="com-accel"><div class="com-accel-title">Acelerador por Positivacao</div>' +
    '<div class="com-accel-desc">+0.05 por semana de meta de positivacao atingida (maximo +0.20 com as 4 semanas). Valor adicionado a taxa base. Cliente contabilizado apenas uma vez no mes. Valido apenas para pedidos aprovados.</div>' +
    '<div class="com-week-grid">';
  for (var s = 1; s <= 4; s++) {
    html += '<div class="com-week" id="cm-week-' + s + '" onclick="toggleWeek(' + s + ',\'' + vid + '\')">' +
      '<div class="com-week-num">Semana ' + s + '</div><div class="com-week-icon">&#9744;</div><div class="com-week-bonus">+0.05</div></div>';
  }
  html += '</div>' +
    '<button class="btn btn-p btn-f" onclick="calcComissaoFinal(\'' + vid + '\')" style="margin-top:16px">Calcular Comissao</button>' +
    '<div id="cm-resultado" style="margin-top:16px"></div></div>';
  var div = document.getElementById('cm-result');
  if (div) { div.innerHTML = html; }
}

function toggleWeek(s, vid) {
  var w = document.getElementById('cm-week-' + s);
  if (!w) { return; }
  w.classList.toggle('checked');
  w.querySelector('.com-week-icon').innerHTML = w.classList.contains('checked') ? '&#9745;' : '&#9744;';
  updateComStats(vid);
}

function updateComStats(vid) {
  var vendas = loadData('vendas').filter(function (v) { return v.tipo !== 'bonificacao'; });
  var vV = vendas.filter(function (v) { return v.vendedor === vid; });
  var total = vV.reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
  var nivel = getNivel(vid);
  var faixas = COM[nivel] || COM['Junior'];
  var taxa = 0;
  for (var i = 0; i < faixas.length; i++) {
    if (total >= faixas[i].min && total <= faixas[i].max) { taxa = faixas[i].taxa; break; }
  }
  var semanasBatidas = 0;
  for (var s = 1; s <= 4; s++) {
    var w = document.getElementById('cm-week-' + s);
    if (w && w.classList.contains('checked')) { semanasBatidas++; }
  }
  var acelerador = semanasBatidas * ACELERADOR_POR_SEMANA;
  var taxaFinal = taxa + acelerador;
  var comissao = (total / 1000) * taxaFinal;
  var av = document.getElementById('cm-accel-val');
  if (av) { av.textContent = '+' + acelerador.toFixed(2); }
  var wv = document.getElementById('cm-weeks-val');
  if (wv) { wv.textContent = semanasBatidas + '/4 semanas'; }
  var tf = document.getElementById('cm-taxa-final');
  if (tf) { tf.textContent = taxaFinal.toFixed(2); }
  var cv = document.getElementById('cm-comissao-val');
  if (cv) { cv.textContent = 'R$ ' + fmtBRL(comissao); }
}

function calcComissaoFinal(vid) {
  var vendas = loadData('vendas').filter(function (v) { return v.tipo !== 'bonificacao'; });
  var vV = vendas.filter(function (v) { return v.vendedor === vid; });
  var total = vV.reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
  var nivel = getNivel(vid);
  var faixas = COM[nivel] || COM['Junior'];
  var taxa = 0;
  for (var i = 0; i < faixas.length; i++) {
    if (total >= faixas[i].min && total <= faixas[i].max) { taxa = faixas[i].taxa; break; }
  }
  var semanasBatidas = 0;
  for (var s = 1; s <= 4; s++) {
    var w = document.getElementById('cm-week-' + s);
    if (w && w.classList.contains('checked')) { semanasBatidas++; }
  }
  var acelerador = semanasBatidas * ACELERADOR_POR_SEMANA;
  var taxaFinal = taxa + acelerador;
  var comissao = (total / 1000) * taxaFinal;
  var html = '<div class="com-result">' +
    '<div class="com-result-label">Comissao Calculada</div>' +
    '<div class="com-result-value">R$ ' + fmtBRL(comissao) + '</div>' +
    '<div class="com-result-detail">Taxa base: ' + taxa.toFixed(2) + ' | Acelerador: +' + acelerador.toFixed(2) + ' | Taxa final: ' + taxaFinal.toFixed(2) + '</div>' +
    '<div class="com-result-badge">' + semanasBatidas + ' de 4 semanas batidas</div></div>';
  var div = document.getElementById('cm-resultado');
  if (div) { div.innerHTML = html; }
}

// ===== CATALOGO =====
function renderCatalogo() {
  var linhas = {};
  PROD.forEach(function (p) {
    if (!linhas[p.linha]) { linhas[p.linha] = []; }
    linhas[p.linha].push(p);
  });
  var html = '<h2 class="st2">Catalogo de Produtos</h2>';
  Object.keys(linhas).forEach(function (linha) {
    html += '<div class="card"><h3>' + linha + '</h3><table><thead><tr><th>Cod</th><th>Produto</th><th>Un</th><th>Preco</th></tr></thead><tbody>';
    linhas[linha].forEach(function (p) {
      html += '<tr><td>' + p.cod + '</td><td>' + p.nome + '</td><td>' + p.un + '</td><td class="tcr">R$ ' + fmtBRL(p.preco) + '</td></tr>';
    });
    html += '</tbody></table></div>';
  });
  return html;
}

// ===== RELATORIOS GERAIS =====
function renderRelatorios() {
  var vendas = loadData('vendas');
  var atividades = loadData('atividades');
  var clientes = loadData('clientes');
  var tipoFiltro = '<div class="card"><h3>Filtro de Tipo</h3><div class="filtros">' +
    '<div class="fg"><label>Tipo de Registro</label><select id="rel-tipo">' +
    '<option value="todos">Todos</option><option value="venda">Somente Vendas</option>' +
    '<option value="bonificacao">Somente Bonificacoes</option><option value="ambos">Vendas + Bonificacoes</option>' +
    '</select></div>' +
    '<div class="fg" style="display:flex;align-items:flex-end"><button class="btn btn-p btn-s" onclick="filtrarRelatorio()">OK</button></div>' +
    '</div></div>';
  var totV = vendas.reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
  var totL = atividades.filter(function (a) { return a.tipo === 'ligacao'; })
    .reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);
  var totP = atividades.filter(function (a) { return a.tipo === 'prospeccao'; })
    .reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);
  return '<h2 class="st2">Relatorios Gerais</h2>' + tipoFiltro +
    '<div class="card"><h3>Resumo Geral</h3><div id="rel-resumo">' +
    '<div class="sg">' +
    '<div class="sc s"><div class="lb">Faturamento</div><div class="vl">R$ ' + fmtBRL(totV) + '</div></div>' +
    '<div class="sc"><div class="lb">Vendas</div><div class="vl">' + vendas.length + '</div></div>' +
    '<div class="sc"><div class="lb">Clientes</div><div class="vl">' + clientes.length + '</div></div>' +
    '<div class="sc"><div class="lb">Ligacoes</div><div class="vl">' + totL + '</div></div>' +
    '<div class="sc"><div class="lb">Prospeccao</div><div class="vl">' + totP + '</div></div>' +
    '</div></div><div id="rel-tabela"></div></div>' +
    '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn btn-a btn-s" onclick="exportarRelatorioCSV()">Exportar CSV</button>' +
    '<button class="btn btn-p btn-s" onclick="exportarRelatorioPDF()">Exportar PDF</button>' +
    '</div>';
}

function filtrarRelatorio() {
  var vendas = loadData('vendas');
  var tipo = document.getElementById('rel-tipo').value;
  var filtradas = vendas.filter(function (v) {
    var vt = v.tipo || 'venda';
    if (tipo === 'todos') { return true; }
    if (tipo === 'venda') { return vt === 'venda'; }
    if (tipo === 'bonificacao') { return vt === 'bonificacao'; }
    if (tipo === 'ambos') { return vt === 'venda' || vt === 'bonificacao'; }
    return true;
  });
  var totV = filtradas.reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
  var resumo = document.getElementById('rel-resumo');
  if (resumo) {
    resumo.innerHTML = '<div class="sg">' +
      '<div class="sc s"><div class="lb">Faturamento</div><div class="vl">R$ ' + fmtBRL(totV) + '</div></div>' +
      '<div class="sc"><div class="lb">Registros</div><div class="vl">' + filtradas.length + '</div></div>' +
      '</div>';
  }
  var tabelaDiv = document.getElementById('rel-tabela');
  if (!tabelaDiv) { return; }
  var html = '<table><thead><tr><th>Data</th><th>Cliente</th><th>Vendedor</th><th>Tipo</th><th>Qtd</th><th>Total</th></tr></thead><tbody>';
  filtradas.forEach(function (v) {
    var tipoV = v.tipo || 'venda';
    var tipoHtml = '<span class="tipo-badge ' + tipoV + '">' + tipoV + '</span>';
    html += '<tr><td>' + v.data + '</td><td>' + v.cliente + '</td><td>' + getNome(v.vendedor) + '</td>' +
      '<td class="tcc">' + tipoHtml + '</td><td class="tcc">' + (v.qtdProdutos || 0) + '</td>' +
      '<td class="tcr">R$ ' + fmtBRL(v.total) + '</td></tr>';
  });
  html += '</tbody></table>';
  tabelaDiv.innerHTML = html;
  window._relFiltradas = filtradas;
}

function exportarRelatorioCSV() {
  var dados = window._relFiltradas || loadData('vendas');
  exportCSV(dados, 'relatorio-vendas.csv');
}

function exportarRelatorioPDF() {
  var dados = window._relFiltradas || loadData('vendas');
  var html = '<table><thead><tr><th>Data</th><th>Cliente</th><th>Vendedor</th><th>Tipo</th><th>Qtd</th><th>Total</th></tr></thead><tbody>';
  dados.forEach(function (v) {
    html += '<tr><td>' + v.data + '</td><td>' + v.cliente + '</td><td>' + getNome(v.vendedor) + '</td>' +
      '<td>' + (v.tipo || 'venda') + '</td><td>' + (v.qtdProdutos || 0) + '</td><td>R$ ' + fmtBRL(v.total) + '</td></tr>';
  });
  html += '</tbody></table>';
  exportPDF('Relatorio Geral de Vendas', html);
}

// ===== MINHAS METAS (VENDEDOR) =====
function renderMinhas() {
  var metas = loadData('metas');
  var vendas = loadData('vendas');
  var atividades = loadData('atividades');
  var clientes = loadData('clientes');
  var vM = metas.filter(function (m) { return m.vendedor === currentUser.id; });
  var vV = vendas.filter(function (v) { return v.vendedor === currentUser.id && (v.tipo || 'venda') === 'venda'; });
  var vA = atividades.filter(function (a) { return a.vendedor === currentUser.id; });
  var m = vM[vM.length - 1] || {};
  var vTotV = vV.reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
  var vL = vA.filter(function (a) { return a.tipo === 'ligacao'; })
    .reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);
  var vP = vA.filter(function (a) { return a.tipo === 'prospeccao'; })
    .reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);
  var vPr = vV.reduce(function (s, v) { return s + (parseInt(v.qtdProdutos) || 0); }, 0);
  var vPos = vV.length;
  var vCN = clientes.filter(function (c) { return c.vendedorId === currentUser.id; }).length;
  var pV = m.valorVenda ? Math.min(100, (vTotV / m.valorVenda) * 100) : 0;
  var pL = m.ligacoes ? Math.min(100, (vL / m.ligacoes) * 100) : 0;
  var pP = m.prospeccao ? Math.min(100, (vP / m.prospeccao) * 100) : 0;
  var pPr = m.produtos ? Math.min(100, (vPr / m.produtos) * 100) : 0;
  var pPos = m.positivacao ? Math.min(100, (vPos / m.positivacao) * 100) : 0;
  var pCN = m.clientesNovos ? Math.min(100, (vCN / m.clientesNovos) * 100) : 0;
  return renderWeeklyBar() + renderProdutosDiscriminados() +
    '<h2 class="st2">Minhas Metas</h2>' +
    '<div class="card"><h3>Progresso Atual</h3>' +
    progressBar('Vendas (R$)', vTotV, m.valorVenda || 0, pV) +
    progressBar('Ligacoes', vL, m.ligacoes || 0, pL) +
    progressBar('Prospeccao', vP, m.prospeccao || 0, pP) +
    progressBar('Produtos', vPr, m.produtos || 0, pPr) +
    progressBar('Positivacao', vPos, m.positivacao || 0, pPos) +
    progressBar('Clientes Novos', vCN, m.clientesNovos || 0, pCN) +
    '</div>';
}

// ===== REGISTRAR VENDA (VENDEDOR) — campo de CODIGO do cliente =====
function renderVenda() {
  return renderWeeklyBar() +
    '<h2 class="st2">Registrar Venda</h2>' +
    '<div class="card"><h3>Nova Venda ou Bonificacao</h3>' +
    '<div class="tipo-toggle">' +
    '<button id="tt-venda" class="act" onclick="setTipoLanc(\'venda\')">Venda</button>' +
    '<button id="tt-bonif" onclick="setTipoLanc(\'bonificacao\')">Bonificacao</button>' +
    '</div>' +
    '<div class="fr">' +
    '<div class="fg"><label>Data</label><input type="date" id="vd-data" value="' + new Date().toISOString().split('T')[0] + '"></div>' +
    '<div class="fg"><label>Codigo do Cliente</label><input type="text" id="vd-cli" placeholder="Digite o codigo do cliente" oninput="updateClienteInfo()"></div>' +
    '</div>' +
    '<div id="vd-cli-info"></div>' +
    '<div class="dv"></div><h3>Itens da Venda</h3><div id="vd-itens"></div>' +
    '<button class="btn btn-a btn-s" onclick="addVendaItem()">+ Adicionar Item</button>' +
    '<div class="dv"></div><div class="st" id="vd-total">Total: R$ 0,00</div>' +
    '<div class="dv"></div>' +
    '<button class="btn btn-p btn-f" onclick="saveVenda()">Salvar Lancamento</button>' +
    '</div>';
}

function setTipoLanc(tipo) {
  var bv = document.getElementById('tt-venda');
  var bb = document.getElementById('tt-bonif');
  if (!bv || !bb) { return; }
  if (tipo === 'venda') {
    bv.classList.add('act');
    bb.classList.remove('act');
  } else {
    bb.classList.add('act');
    bv.classList.remove('act');
  }
}

function getTipoLanc() {
  var bv = document.getElementById('tt-venda');
  if (bv && bv.classList.contains('act')) { return 'venda'; }
  return 'bonificacao';
}

function updateClienteInfo() {
  var cod = document.getElementById('vd-cli').value.trim();
  var c = getClienteByCod(cod);
  var div = document.getElementById('vd-cli-info');
  if (!div) { return; }
  if (!cod) { div.innerHTML = ''; return; }
  if (!c) {
    div.innerHTML = '<div class="client-info" style="border-left-color:var(--err)"><div class="ci-label">Cliente</div><div class="ci-value" style="color:var(--err)">Nao encontrado com o codigo: ' + cod + '</div></div>';
    return;
  }
  div.innerHTML = '<div class="client-info"><div style="display:flex;gap:20px;flex-wrap:wrap">' +
    '<div><div class="ci-label">Razao Social</div><div class="ci-value">' + c.razao + '</div></div>' +
    '<div><div class="ci-label">Cidade</div><div class="ci-value">' + (c.cidade || '--') + '</div></div>' +
    '<div><div class="ci-label">Estado</div><div class="ci-value">' + (c.estado || '--') + '</div></div>' +
    '<div><div class="ci-label">Segmento</div><div class="ci-value">' + (c.segmento || '--') + '</div></div>' +
    '<div><div class="ci-label">Vendedor</div><div class="ci-value">' + getNome(c.vendedorId || currentUser.id) + '</div></div>' +
    '</div></div>';
}

function addVendaItem() {
  var div = document.createElement('div');
  div.className = 'pe';
  var prodOpts = PROD.map(function (p) { return '<option value="' + p.cod + '">' + p.cod + ' - ' + p.nome + '</option>'; }).join('');
  div.innerHTML = '<select class="pe-prod" onchange="calcVendaTotal()">' + prodOpts + '</select>' +
    '<input type="number" class="pe-qtd" placeholder="Qtd" value="1" oninput="calcVendaTotal()" min="1">' +
    '<input type="text" class="pe-preco" placeholder="Preco" readonly>' +
    '<button class="rb" onclick="this.parentElement.remove();calcVendaTotal()">x</button>';
  document.getElementById('vd-itens').appendChild(div);
  calcVendaTotal();
}

function calcVendaTotal() {
  var total = 0;
  document.querySelectorAll('.pe').forEach(function (row) {
    var cod = row.querySelector('.pe-prod').value;
    var qtd = parseInt(row.querySelector('.pe-qtd').value) || 0;
    var prod = PROD.find(function (p) { return p.cod === cod; });
    if (prod) {
      var preco = prod.preco * qtd;
      total += preco;
      row.querySelector('.pe-preco').value = 'R$ ' + fmtBRL(preco);
    }
  });
  var div = document.getElementById('vd-total');
  if (div) { div.textContent = 'Total: R$ ' + fmtBRL(total); }
}

function saveVenda() {
  var data = document.getElementById('vd-data').value;
  var cod = document.getElementById('vd-cli').value.trim();
  var cliente = getClienteByCod(cod);
  var tipo = getTipoLanc();
  var itens = [];
  var total = 0;
  var qtdProdutos = 0;
  document.querySelectorAll('.pe').forEach(function (row) {
    var codProd = row.querySelector('.pe-prod').value;
    var qtd = parseInt(row.querySelector('.pe-qtd').value) || 0;
    var prod = PROD.find(function (p) { return p.cod === codProd; });
    if (prod && qtd > 0) {
      itens.push({ cod: codProd, nome: prod.nome, qtd: qtd, preco: prod.preco });
      total += prod.preco * qtd;
      qtdProdutos += qtd;
    }
  });
  if (itens.length === 0) { toast('Adicione pelo menos um item', 'error'); return; }
  if (tipo === 'venda') {
    var vendas = loadData('vendas');
    var jaExiste = vendas.some(function (v) {
      var m = v.cliente.match(/COD\s+(\S+)/);
      return m && m[1] === cod && v.vendedor === currentUser.id && (v.tipo || 'venda') === 'venda';
    });
    if (jaExiste) {
      toast('Este cliente ja possui uma venda cadastrada. Use Bonificacao para repetir o codigo.', 'error');
      return;
    }
  }
  var nomeCli = cliente ? cliente.razao : 'COD ' + cod;
  var estado = cliente ? cliente.estado : '--';
  var segmento = cliente ? cliente.segmento : 'Outros';
  var venda = {
    data: data,
    cliente: nomeCli + ' (COD ' + cod + ' / ' + estado + ')',
    vendedor: currentUser.id,
    itens: itens,
    qtdProdutos: qtdProdutos,
    total: total,
    estado: estado,
    segmento: segmento,
    tipo: tipo
  };
  saveData('vendas', venda);
  toast((tipo === 'venda' ? 'Venda' : 'Bonificacao') + ' salva: R$ ' + fmtBRL(total), 'success');
  renderTab('venda');
}

// ===== ATIVIDADES (VENDEDOR) =====
function renderAtividades() {
  var atividades = loadData('atividades');
  var tipoOpts = '<option value="ligacao">Ligacao</option>' +
    '<option value="prospeccao">Prospeccao</option>' +
    '<option value="visita">Visita</option>' +
    '<option value="email">E-mail</option>' +
    '<option value="whatsapp">WhatsApp</option>';
  var minhas = atividades.filter(function (a) { return a.vendedor === currentUser.id; });
  var tabela = minhas.length
    ? '<table><thead><tr><th>Data</th><th>Tipo</th><th>Qtd</th><th>Obs</th><th>Acoes</th></tr></thead><tbody>' +
      minhas.map(function (a) {
        var idx = atividades.indexOf(a);
        return '<tr><td>' + a.data + '</td><td>' + a.tipo + '</td><td class="tcc">' + a.qtd + '</td>' +
          '<td>' + (a.obs || '') + '</td>' +
          '<td><button class="del-btn" onclick="delAtividade(' + idx + ')">Excluir</button></td></tr>';
      }).join('') +
      '</tbody></table>'
    : '<div class="es"><div class="ic">SEM</div><p>Nenhuma atividade.</p></div>';
  return '<h2 class="st2">Atividades</h2>' +
    '<div class="card"><h3>Registrar Atividade</h3>' +
    '<div class="fr">' +
    '<div class="fg"><label>Data</label><input type="date" id="at-data" value="' + new Date().toISOString().split('T')[0] + '"></div>' +
    '<div class="fg"><label>Tipo</label><select id="at-tipo">' + tipoOpts + '</select></div>' +
    '<div class="fg"><label>Quantidade</label><input type="number" id="at-qtd" value="1" min="1"></div>' +
    '</div>' +
    '<div class="fg"><label>Observacao</label><textarea id="at-obs" rows="2" placeholder="Opcional"></textarea></div>' +
    '<button class="btn btn-p" onclick="saveAtividade()">Salvar Atividade</button>' +
    '</div>' +
    '<div class="card"><h3>Minhas Atividades</h3>' + tabela + '</div>';
}

function saveAtividade() {
  var data = document.getElementById('at-data').value;
  var tipo = document.getElementById('at-tipo').value;
  var qtd = parseInt(document.getElementById('at-qtd').value) || 0;
  var obs = document.getElementById('at-obs').value.trim();
  if (!data || !tipo) { toast('Preencha data e tipo', 'error'); return; }
  var atividade = { data: data, tipo: tipo, qtd: qtd, obs: obs, vendedor: currentUser.id };
  saveData('atividades', atividade);
  toast('Atividade salva', 'success');
  renderTab('atividades');
}

function delAtividade(i) {
  if (!confirm('Excluir esta atividade?')) { return; }
  var atividades = loadData('atividades');
  var a = atividades[i];
  if (a && a._id) {
    deleteDoc('atividades', a._id);
    toast('Atividade excluida', 'success');
    renderTab('atividades');
  }
}

// ===== INICIALIZACAO =====
(function () {
  initDarkMode();
  initListener('usuarios');
  var saved = localStorage.getItem('mc_user');
  if (!saved) { return; }
  try {
    var savedObj = JSON.parse(saved);
    var user = USU.find(function (u) { return u.id === savedObj.id; });
    if (!user) { localStorage.removeItem('mc_user'); return; }
    currentUser = user;
    document.getElementById('ls').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    var b = document.getElementById('ub');
    b.textContent = getNome(user.id) + ' - ' + getNivel(user.id);
    b.className = 'badge' + (user.isM ? ' mg' : '');
    initSidebar();
    ['vendas', 'clientes', 'metas', 'atividades', 'usuarios'].forEach(function (k) { initListener(k); });
    syncUsuarios();
  } catch (e) {
    localStorage.removeItem('mc_user');
  }
})();
</script>
