<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magil Clean — Gestão Comercial</title> <link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6f9;--card:#ffffff;--txt:#1f2a36;--txt2:#6b7a8d;--txt3:#9aa8b8;--acc:#0ea5a4;--acc2:#14b8a6;--ok:#10b981;--warn:#f59e0b;--err:#ef4444;--brd:#e5e9ef;--r:14px;--s:0 2px 8px rgba(31,42,54,.05),0 8px 24px rgba(31,42,54,.06);--font:'Inter','Segoe UI',system-ui,-apple-system,sans-serif}
html,body{font-family:var(--font);-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5}
#ls,#cs{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(1200px 600px at 20% -10%,#0ea5a4 0%,transparent 50%),radial-gradient(1000px 500px at 100% 110%,#14b8a6 0%,transparent 50%),#f4f6f9}
.lc{background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border:1px solid var(--brd);border-radius:20px;padding:44px 38px;box-shadow:0 20px 60px rgba(31,42,54,.14);width:400px;max-width:92%}
.lc .logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#0ea5a4,#14b8a6);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff;margin:0 auto 20px;box-shadow:0 10px 30px rgba(14,165,164,.35)}
.lc h1{font-size:1.6rem;font-weight:800;text-align:center;letter-spacing:-.02em;color:var(--txt)}
.lc p{text-align:center;color:var(--txt2);font-size:.9rem;margin:6px 0 26px}
.lc label{display:block;font-size:.78rem;font-weight:600;color:var(--txt2);margin-bottom:6px;padding-left:2px}
.lc input{width:100%;padding:13px 14px;margin-bottom:16px;border:1px solid var(--brd);border-radius:12px;font-size:1rem;outline:none;background:#fff;color:var(--txt);transition:.2s}
.lc input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(14,165,164,.15)}
.lc button{width:100%;padding:14px;background:var(--acc);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s}
.lc button:hover{background:var(--acc2)}
.lc .hint{text-align:center;font-size:.72rem;color:var(--txt3);margin-top:14px;line-height:1.5}
.cust-select{position:relative;margin-bottom:16px}
.cust-select-trigger{width:100%;padding:13px 14px;border:1px solid var(--brd);border-radius:12px;background:#fff;color:var(--txt);font-size:1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:.2s}
.cust-select.open .cust-select-trigger{border-color:var(--acc);box-shadow:0 0 0 3px rgba(14,165,164,.15)}
.cust-arrow{color:var(--txt2);transition:.2s}
.cust-select.open .cust-arrow{transform:rotate(180deg)}
.cust-select-list{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--brd);border-radius:12px;box-shadow:0 20px 60px rgba(31,42,54,.14);margin-top:6px;max-height:300px;overflow-y:auto;z-index:50}
.cust-select.open .cust-select-list{display:block}
.cust-option{padding:12px 14px;cursor:pointer;font-size:.95rem;color:var(--txt)}
.cust-option:hover{background:#e6f7f6;color:var(--acc)}
#app{display:none}
#hd{background:rgba(255,255,255,.9);backdrop-filter:blur(12px);color:var(--txt);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--brd)}
#hd .hl{display:flex;align-items:center;gap:12px}
#hd .app-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0ea5a4,#14b8a6);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff}
#hd h2{font-size:1.05rem;font-weight:800;letter-spacing:-.01em;color:var(--txt)}
#hd .hr{display:flex;align-items:center;gap:10px}
.icon-btn{background:#f4f6f9;border:1px solid var(--brd);border-radius:10px;padding:8px 14px;font-size:.85rem;color:var(--txt);cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.icon-btn:hover{background:#e6f7f6;color:var(--acc)}
.badge{background:#e6f7f6;color:var(--acc);padding:5px 14px;border-radius:20px;font-size:.75rem;font-weight:700}
.badge.mg{background:linear-gradient(135deg,#0ea5a4,#14b8a6);color:#fff}
#main{min-height:calc(100vh - 60px);padding:20px}
/* ===== GUIAS RECOLHIVEIS (sem sidebar) ===== */
.tabs-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tab-pill{background:#fff;border:1px solid var(--brd);border-radius:12px;padding:10px 16px;font-size:.85rem;font-weight:600;color:var(--txt2);cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.tab-pill:hover{color:var(--acc);border-color:var(--acc)}
.tab-pill.act{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 6px 16px rgba(14,165,164,.3)}
.tab-pill .ico{font-size:1rem}
.tc{display:none}
.tc.act{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:24px;box-shadow:var(--s);margin-bottom:20px}
.card h3{font-size:1.02rem;font-weight:700;margin-bottom:16px;letter-spacing:-.01em;color:var(--txt)}
.st2{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:24px;color:var(--txt)}
.dv{height:1px;background:var(--brd);margin:20px 0}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:24px}
.sc{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:20px;box-shadow:var(--s);border-top:3px solid var(--acc)}
.sc .lb{font-size:.72rem;color:var(--txt2);margin-bottom:8px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.sc .vl{font-size:1.8rem;font-weight:800;letter-spacing:-.02em;color:var(--txt)}
.sc .sb{font-size:.74rem;color:var(--txt3);margin-top:4px}
.sc.w{border-top-color:var(--warn)}
.sc.d{border-top-color:var(--err)}
.sc.s{border-top-color:var(--ok)}
.pw{margin-bottom:14px}
.pw .pl{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:6px}
.pw .pl span:first-child{color:var(--txt2);font-weight:500}
.pw .pl span:last-child{font-weight:600}
.pb{height:8px;background:#eef3f7;border-radius:980px;overflow:hidden}
.pf{height:100%;border-radius:980px;transition:width .8s ease;min-width:0}
.pf.lo{background:var(--err)}
.pf.mi{background:var(--warn)}
.pf.hi{background:var(--ok)}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.vc{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:20px;box-shadow:var(--s)}
.vc .vh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--brd)}
.vc .vn{font-weight:700;font-size:1rem;color:var(--txt)}
.vlv{font-size:.66rem;padding:3px 12px;border-radius:980px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.vlv.junior{background:#9aa8b8}
.vlv.pleno{background:var(--acc)}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.fg label{display:block;font-size:.76rem;color:var(--txt2);margin-bottom:6px;font-weight:600}
.fg input,.fg select,.fg textarea{width:100%;padding:11px 12px;border:1px solid var(--brd);border-radius:10px;font-size:.9rem;outline:none;background:#fff;color:var(--txt);transition:.2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(14,165,164,.12)}
.btn{padding:11px 22px;border:none;border-radius:10px;font-size:.88rem;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-p{background:var(--acc);color:#fff}
.btn-p:hover{background:var(--acc2)}
.btn-a{background:#e6f7f6;color:var(--acc)}
.btn-a:hover{background:#cdeeea}
.btn-d{background:#fdecec;color:var(--err)}
.btn-d:hover{background:#fbdada}
.btn-f{width:100%}
.btn-s{padding:8px 16px;font-size:.8rem}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{background:#f4f6f9;color:var(--txt2);padding:12px 14px;text-align:left;font-weight:600;font-size:.74rem;letter-spacing:.03em;text-transform:uppercase;border-bottom:1px solid var(--brd)}
td{padding:12px 14px;border-bottom:1px solid #eef3f7}
tr:hover td{background:#f4f6f9}
.tcr{text-align:right;font-variant-numeric:tabular-nums}
.tcc{text-align:center}
#toast{position:fixed;bottom:28px;right:28px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.tm{padding:14px 22px;border-radius:12px;color:#fff;font-size:.88rem;box-shadow:0 12px 40px rgba(31,42,54,.2);display:flex;align-items:center;gap:10px;max-width:380px;transition:.3s}
.tm.success{background:var(--ok)}
.tm.error{background:var(--err)}
.tm.info{background:var(--txt)}
.cc{position:relative;height:300px;margin-top:16px}
.pe{display:grid;grid-template-columns:1fr 90px 130px 40px;gap:8px;align-items:center;padding:12px;background:#f4f6f9;border-radius:10px;margin-bottom:8px}
.pe select,.pe input{padding:9px 12px;border:1px solid var(--brd);border-radius:8px;font-size:.85rem;width:100%;background:#fff;color:var(--txt)}
.pe .rb{background:var(--err);color:#fff;border:none;border-radius:8px;cursor:pointer;padding:8px;font-size:1rem}
.st{background:var(--txt);color:#fff;padding:16px;border-radius:10px;text-align:center;font-size:1.1rem;font-weight:700;margin-top:12px;letter-spacing:-.01em}
.es{text-align:center;padding:40px;color:var(--txt3)}
.es .ic{font-size:2.6rem;margin-bottom:12px;opacity:.35}
.search-box{position:relative;margin-bottom:18px}
.search-box input{width:100%;padding:14px 18px 14px 46px;border:1px solid var(--brd);border-radius:12px;font-size:.95rem;outline:none;background:#fff;color:var(--txt);box-shadow:0 2px 12px rgba(31,42,54,.04);transition:.2s}
.search-box input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(14,165,164,.12)}
.search-box .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:1.1rem;pointer-events:none}
.tipo-toggle{display:flex;gap:4px;background:#eef3f7;padding:4px;border-radius:980px;margin-bottom:18px}
.tipo-toggle button{flex:1;padding:10px 16px;border:none;background:transparent;color:var(--txt2);font-size:.86rem;font-weight:600;cursor:pointer;border-radius:980px;transition:.2s}
.tipo-toggle button.act{background:#fff;color:var(--acc);box-shadow:0 2px 8px rgba(31,42,54,.1)}
.tipo-badge{display:inline-block;padding:3px 12px;border-radius:980px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.tipo-badge.venda{background:#e6f7f6;color:var(--acc)}
.tipo-badge.bonificacao{background:#fff3e8;color:#b25e00}
.weekly-bar{background:linear-gradient(135deg,#0ea5a4,#14b8a6);color:#fff;border-radius:var(--r);padding:24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.weekly-bar .wb-label{font-size:.7rem;opacity:.6;text-transform:uppercase;font-weight:600;letter-spacing:.05em}
.weekly-bar .wb-value{font-size:1.9rem;font-weight:700;letter-spacing:-.02em}
.weekly-bar .wb-progress{flex:1;min-width:200px;height:8px;background:rgba(255,255,255,.2);border-radius:980px;overflow:hidden}
.weekly-bar .wb-progress-fill{height:100%;background:#fff;border-radius:980px;transition:width .8s ease}
.weekly-bar .wb-pct{font-size:1.2rem;font-weight:700}
.com-hero{background:linear-gradient(135deg,#0ea5a4,#14b8a6);color:#fff;border-radius:var(--r);padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.com-hero .com-name{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.com-hero .com-nivel{font-size:.85rem;opacity:.65;margin-top:4px}
.com-hero .com-total{font-size:2.6rem;font-weight:800;letter-spacing:-.02em}
.com-hero .com-total-label{font-size:.7rem;opacity:.6;text-transform:uppercase;letter-spacing:.05em}
.com-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.com-stat{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:18px;text-align:center}
.com-stat .com-stat-label{font-size:.68rem;color:var(--txt2);text-transform:uppercase;font-weight:600;margin-bottom:6px;letter-spacing:.04em}
.com-stat .com-stat-value{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.com-stat .com-stat-sub{font-size:.7rem;color:var(--txt3);margin-top:4px}
.com-stat.highlight{border-top:3px solid var(--ok)}
.com-stat.highlight .com-stat-value{color:var(--acc)}
.com-faixa-table tr.ativa td{background:#e6f7f6;font-weight:700}
.com-accel{background:#f4f6f9;border-radius:12px;padding:22px;margin-top:16px}
.com-accel-title{font-size:1rem;font-weight:700;margin-bottom:8px}
.com-accel-desc{font-size:.8rem;color:var(--txt2);margin-bottom:14px;line-height:1.6}
.com-week-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.com-week{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:.15s}
.com-week:hover{border-color:var(--acc)}
.com-week.checked{background:#e6f7f6;border-color:var(--ok)}
.com-week .com-week-num{font-size:.66rem;color:var(--txt2);text-transform:uppercase;font-weight:600;letter-spacing:.04em;margin-bottom:6px}
.com-week .com-week-icon{font-size:1.7rem}
.com-week .com-week-bonus{font-size:.74rem;font-weight:700;margin-top:6px;color:var(--acc)}
.com-result{background:#e6f7f6;border:1px solid var(--acc);border-radius:12px;padding:28px;margin-top:20px;text-align:center}
.com-result .com-result-label{font-size:.72rem;color:var(--txt2);text-transform:uppercase;font-weight:600;letter-spacing:.05em}
.com-result .com-result-value{font-size:3rem;font-weight:800;color:var(--acc);margin:8px 0;letter-spacing:-.02em}
.com-result .com-result-detail{font-size:.82rem;color:var(--txt2);margin-top:8px}
.com-result .com-result-badge{display:inline-block;background:var(--acc);color:#fff;padding:4px 16px;border-radius:980px;font-size:.74rem;font-weight:600;margin-top:12px}
.pred-card{background:#e6f7f6;border:1px solid var(--acc);border-radius:12px;padding:22px;margin-top:16px}
.pred-card h4{color:var(--acc);margin-bottom:12px;font-weight:700}
.pred-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:12px}
.pred-item{background:#fff;padding:14px;border-radius:10px;text-align:center;border:1px solid var(--brd)}
.pred-item .pred-label{font-size:.7rem;color:var(--txt2);text-transform:uppercase;font-weight:600;margin-bottom:4px;letter-spacing:.04em}
.pred-item .pred-value{font-size:1.15rem;font-weight:700;color:var(--txt)}
.client-info{background:#e6f7f6;border-radius:12px;padding:14px;margin-bottom:14px;border-left:4px solid var(--acc)}
.client-info .ci-label{font-size:.68rem;color:var(--txt2);text-transform:uppercase;font-weight:700;letter-spacing:.04em}
.client-info .ci-value{font-size:.92rem;color:var(--txt);font-weight:600;margin-top:2px}
.mp-row{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;align-items:center;padding:10px;background:#f4f6f9;border-radius:10px;margin-bottom:8px}
.mp-row select,.mp-row input{padding:9px 12px;border:1px solid var(--brd);border-radius:8px;font-size:.85rem;width:100%;background:#fff;color:var(--txt)}
.mp-row .rb{background:var(--err);color:#fff;border:none;border-radius:8px;cursor:pointer;padding:8px}
.filtros,.date-filter{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;align-items:flex-end}
.filtros .fg,.date-filter .fg{min-width:150px}
.inp-sm{padding:9px 12px;border:1px solid var(--brd);border-radius:8px;font-size:.85rem;background:#fff;color:var(--txt);outline:none}
.inp-sm:focus{border-color:var(--acc)}
.action-btns{display:flex;gap:6px;flex-wrap:wrap}
.edit-btn{background:#e6f7f6;color:var(--acc);border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.76rem;font-weight:600}
.del-btn{background:#fdecec;color:var(--err);border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.76rem;font-weight:600}
/* ===== SELECAO EM MASSA ===== */
.bulk-bar{display:flex;align-items:center;gap:10px;background:#e6f7f6;border:1px solid var(--acc);border-radius:12px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap}
.bulk-bar .bb-count{font-weight:700;color:var(--acc)}
.bulk-bar .bb-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.chk{width:18px;height:18px;accent-color:var(--acc);cursor:pointer}
tr.sel td{background:#e6f7f6}
/* ===== NIVEL DO CLIENTE ===== */
.nivel-badge{display:inline-block;padding:3px 12px;border-radius:980px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#fff}
.nivel-badge.ouro{background:linear-gradient(135deg,#f5b301,#d48806);box-shadow:0 1px 4px rgba(212,136,6,.4)}
.nivel-badge.prata{background:linear-gradient(135deg,#b0bec5,#90a4ae);box-shadow:0 1px 4px rgba(144,164,174,.4)}
.nivel-badge.bronze{background:linear-gradient(135deg,#cd7f32,#a05a1c);box-shadow:0 1px 4px rgba(160,90,28,.4)}
.nivel-badge.sem{background:#e0e0e0;color:#757575}
/* ===== CAIXA "EDITADO POR" ===== */
.edit-note{display:flex;align-items:center;gap:8px;background:#e6f7f6;border:1px solid var(--acc);border-radius:10px;padding:10px 14px;font-size:.8rem;color:var(--acc);font-weight:600;margin-bottom:14px}
.edit-note .ico{font-size:1rem}
/* ===== METRICAS ===== */
.metrica-dica{background:#fff8e6;border:1px solid #f5c542;border-radius:10px;padding:12px 16px;font-size:.82rem;color:#8a6d1a;margin-bottom:14px;line-height:1.6}
.metrica-dica strong{color:#6b5200}
.metrica-grupo{margin-bottom:24px}
.metrica-grupo-titulo{font-size:1.05rem;font-weight:800;color:var(--txt);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.metrica-grupo-desc{font-size:.8rem;color:var(--txt2);margin-bottom:14px}
.rfm-badge{display:inline-block;padding:3px 12px;border-radius:980px;font-size:.7rem;font-weight:700;color:#fff}
.rfm-badge.campeao{background:linear-gradient(135deg,#f5b301,#d48806)}
.rfm-badge.leal{background:linear-gradient(135deg,#0ea5a4,#14b8a6)}
.rfm-badge.promissor{background:linear-gradient(135deg,#10b981,#34d399)}
.rfm-badge.risco{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.rfm-badge.perdido{background:linear-gradient(135deg,#ef4444,#f87171)}
/* ===== MODO ESCURO ===== */
body.dark{background:#141b24;color:#e6edf3}
body.dark .card,body.dark .sc,body.dark .vc,body.dark .com-stat,body.dark .lc{background:#1d2733;border-color:#2c3a49;box-shadow:0 1px 3px rgba(0,0,0,.3)}
body.dark #hd{background:rgba(20,27,36,.9);border-bottom-color:#2c3a49}
body.dark .tab-pill{background:#1d2733;border-color:#2c3a49;color:#9db0c0}
body.dark .tab-pill.act{background:var(--acc);color:#fff;border-color:var(--acc)}
body.dark th{background:#141b24;color:#9db0c0;border-bottom-color:#2c3a49}
body.dark td{border-bottom-color:#24303d}
body.dark tr:hover td{background:#1d2733}
body.dark tr.sel td{background:#1d3a3a}
body.dark .fg input,body.dark .fg select,body.dark .fg textarea,body.dark .inp-sm,body.dark .search-box input,body.dark .pe select,body.dark .pe input,body.dark .mp-row select,body.dark .mp-row input,body.dark .cust-select-trigger{background:#141b24;border-color:#2c3a49;color:#e6edf3}

// ===== SENHA PADRAO GERADA DINAMICAMENTE (nao aparece no codigo) =====
function senhaPadrao() {
  return 'mc' + String(new Date().getFullYear());
}

// ===== FUNCOES DE DADOS =====
function loadData(k) {
  if (cacheDados[k]) { return cacheDados[k]; }
  return [];
}

function initListener(k) {
  if (listeners[k]) { return; }
  listeners[k] = db.collection(k).onSnapshot(function (snap) {
    var arr = [];
    snap.forEach(function (doc) {
      var d = doc.data();
      d._id = doc.id;
      arr.push(d);
    });
    if (k === 'metas') {
      arr.forEach(function (row) {
        if (typeof row.marcasDetalhe === 'string') {
          try { row.marcasDetalhe = JSON.parse(row.marcasDetalhe); } catch (e) { row.marcasDetalhe = []; }
        }
        row.ligacoes = parseInt(row.ligacoes) || 0;
        row.prospeccao = parseInt(row.prospeccao) || 0;
        row.produtos = parseInt(row.produtos) || 0;
        row.valorVenda = parseFloat(row.valorVenda) || 0;
        row.semana = parseInt(row.semana) || 1;
        row.positivacao = parseInt(row.positivacao) || 0;
        row.clientesNovos = parseInt(row.clientesNovos) || 0;
      });
    }
    if (k === 'vendas') {
      arr.forEach(function (row) {
        if (typeof row.itens === 'string') {
          try { row.itens = JSON.parse(row.itens); } catch (e) { row.itens = []; }
        }
        row.total = parseFloat(row.total) || 0;
        row.qtdProdutos = parseInt(row.qtdProdutos) || 0;
        if (!row.tipo) { row.tipo = 'venda'; }
      });
    }
    if (k === 'atividades') {
      arr.forEach(function (row) { row.qtd = parseInt(row.qtd) || 0; });
    }
    if (k === 'clientes') {
      arr.forEach(function (row) {
        row.cod = String(row.cod || '');
        row.razao = String(row.razao || '');
        row.contato = String(row.contato || '');
        row.telefone = String(row.telefone || '');
        row.celular = String(row.celular || '');
        row.email = String(row.email || '');
        row.cidade = String(row.cidade || '');
        row.estado = String(row.estado || '');
        row.segmento = String(row.segmento || '');
        row.nivel = String(row.nivel || '').toLowerCase();
        row.vendedorId = String(row.vendedorId || '');
        if (!row.origem) { row.origem = 'importado'; }
      });
    }
    if (k === 'usuarios') {
      arr.forEach(function (u) {
        if (u.id) {
          var usu = USU.find(function (x) { return x.id === u.id; });
          if (usu) {
            usu.nome = String(u.nome || usu.nome);
            usu.nivel = String(u.nivel || usu.nivel);
            usu.permissao = String(u.permissao || usu.permissao || 'padrao');
          } else if (DELETADOS.indexOf(u.id) === -1) {
            USU.push({ id: u.id, nome: String(u.nome || u.id), nivel: String(u.nivel || 'Junior'), isM: u.id === 'gerente', permissao: String(u.permissao || 'padrao') });
          }
        }
      });
      updateLoginNomes();
      var b = document.getElementById('ub');
      if (b && currentUser) { b.textContent = getNome(currentUser.id) + ' - ' + getNivel(currentUser.id); }
    }
    cacheDados[k] = arr;
    var active = document.querySelector('.tc.act');
    if (active && currentUser) { renderTab(active.id.replace('tc-', '')); }
  }, function (err) {
    console.log('Listener error for ' + k + ':', err);
  });
}

function saveData(k, d) {
  var col = db.collection(k);
  if (Array.isArray(d)) {
    d.forEach(function (item) {
      var id = item._id || item.id || db.collection(k).doc().id;
      var docData = JSON.parse(JSON.stringify(item));
      delete docData._id;
      col.doc(id).set(docData, { merge: true }).catch(function (e) { console.log('Save error:', e); });
    });
  } else {
    var id = d._id || d.id || db.collection(k).doc().id;
    var docData = JSON.parse(JSON.stringify(d));
    delete docData._id;
    col.doc(id).set(docData, { merge: true }).catch(function (e) { console.log('Save error:', e); });
  }
}

function deleteDoc(k, docId) {
  db.collection(k).doc(docId).delete().catch(function (e) { console.log('Delete error:', e); });

// ===== FUNCOES DE USUARIO =====
function getNivel(id) {
  var us = cacheDados['usuarios'] || [];
  var u = us.find(function (x) { return x.id === id; });
  if (u && u.nivel) { return String(u.nivel); }
  var usu = USU.find(function (x) { return x.id === id; });
  return usu ? usu.nivel : 'Junior';
}

function getNome(id) {
  var us = cacheDados['usuarios'] || [];
  var u = us.find(function (x) { return x.id === id; });
  if (u && u.nome) { return String(u.nome); }
  var usu = USU.find(function (x) { return x.id === id; });
  return usu ? usu.nome : id;
}

function loadSenhas() {
  var s = {};
  var us = cacheDados['usuarios'] || [];
  us.forEach(function (u) { if (u.id && u.senha) { s[u.id] = String(u.senha); } });
  USU.forEach(function (u) { if (!s[u.id]) { s[u.id] = senhaPadrao(); } });
  return s;
}

function getVendedores() {
  return USU.filter(function (u) { return !u.isM; });
}

function getGestores() {
  return USU.filter(function (u) { return !u.isM && isAdmin(u.id); });
}

function syncUsuarios() {
  USU.forEach(function (u) {
    if (DELETADOS.indexOf(u.id) !== -1) { return; }
    db.collection('usuarios').doc(u.id).get().then(function (doc) {
      if (!doc.exists) {
        db.collection('usuarios').doc(u.id).set({
          id: u.id, nome: u.nome, nivel: u.nivel, senha: senhaPadrao(), permissao: u.permissao || 'padrao'
        }).catch(function (e) { console.log('Sync user error:', e); });
      }
    }).catch(function (e) { console.log('Sync check error:', e); });
  });
}

// ===== FUNCOES AUXILIARES =====
function fmtBRL(v) {
  return parseFloat(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getClienteByCod(cod) {
  var clientes = loadData('clientes');
  var codStr = String(cod).trim();
  return clientes.find(function (c) { return String(c.cod).trim() === codStr; });
}

function getEstadoFromVenda(v) {
  if (v.estado && v.estado !== '--') { return v.estado; }
  var m = v.cliente.match(/\/([A-Z]{2})\)/);
  if (m) { return m[1]; }
  return '--';
}

function getSegmentoFromVenda(v) {
  if (v.segmento && v.segmento !== 'Outros') { return v.segmento; }
  var m = v.cliente.match(/COD\s+(\S+)/);
  if (m) {
    var c = getClienteByCod(m[1]);
    if (c) { return c.segmento || 'Outros'; }
  }
  return 'Outros';
}

function getMeusClientes() {
  var clientes = loadData('clientes');
  if (currentUser.isM) { return clientes; }
  return clientes.filter(function (c) { return c.vendedorId === currentUser.id; });
}

function getMinhasVendas() {
  var vendas = loadData('vendas');
  if (currentUser.isM) { return vendas; }
  return vendas.filter(function (v) { return v.vendedor === currentUser.id; });
}

// ===== RODIZIO 90 DIAS =====
function getUltimaCompraCliente(cod) {
  var vendas = loadData('vendas');
  var vCli = vendas.filter(function (v) {
    var m = v.cliente.match(/COD\s+(\S+)/);
    return m && m[1] === String(cod).trim();
  });
  if (!vCli.length) { return null; }
  vCli.sort(function (a, b) { return b.data.localeCompare(a.data); });
  return vCli[0].data;
}

function clienteElegivelRodizio(cod) {
  var ultima = getUltimaCompraCliente(cod);
  if (!ultima) { return true; }
  var hoje = new Date();
  var dUlt = new Date(ultima);
  var diff = Math.floor((hoje.getTime() - dUlt.getTime()) / (1000 * 60 * 60 * 24));
  return diff > DIAS_RODIZIO;
}

function toast(msg, type) {
  var t = document.createElement('div');
  t.className = 'tm ' + (type || 'info');
  t.textContent = (type === 'success' ? 'OK: ' : (type === 'error' ? 'ERRO: ' : 'INFO: ')) + msg;
  document.getElementById('toast').appendChild(t);
  setTimeout(function () {
    t.style.opacity = '0';
    t.style.transform = 'translateX(100%)';
    setTimeout(function () { t.remove(); }, 300);
  }, 3500);
}

}

function aplicarFiltroPeriodo(prefix) {

}

function doLogin() {

function completarLogin(sel) {
  var user = USU.find(function (u) { return u.id === sel; });

  currentUser = user;
  var senhas = loadSenhas();

function salvarNovaSenha() {
  if (!currentUser) { return; }
  var nova = document.getElementById('cs-senha').value;
  var confirma = document.getElementById('cs-confirma').value;
  if (!nova || nova.length < 4) { toast('A senha deve ter pelo menos 4 caracteres', 'error'); return; }
  if (nova !== confirma) { toast('As senhas nao coincidem', 'error'); return; }
  db.collection('usuarios').doc(currentUser.id).set({ senha: nova }, { merge: true })
    .then(function () {
      document.getElementById('cs').style.display = 'none';
      toast('Senha criada com sucesso! Agora use a nova senha para entrar.', 'success');

function entrarNoApp(sel) {
  var user = USU.find(function (u) { return u.id === sel; });

// ===== MASCARA DE TELEFONE =====
function maskTelefone(el) {
  var v = el.value.replace(/\D/g, '').slice(0, 11);
  var r = '';
  if (v.length > 0) { r = '(' + v.slice(0, 2); }
  if (v.length >= 3) { r += ') ' + v.slice(2, 7); }
  if (v.length >= 8) { r += '-' + v.slice(7, 11); } else if (v.length > 7) { r += v.slice(7); }
  el.value = r;
}

// ===== EXPORTACAO =====
function exportCSV(data, filename) {
  if (!data || !data.length) { return; }
  var headers = Object.keys(data[0]).filter(function (h) { return h !== '_id'; });
  var csv = headers.join(';') + '\n';
  data.forEach(function (row) {
    var vals = headers.map(function (h) {
      var v = row[h];
      if (typeof v === 'object') { v = JSON.stringify(v); }
      if (v === null || v === undefined) { v = ''; }
      return String(v).replace(/;/g, ',');
    });
    csv += vals.join(';') + '\n';
  });
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename || 'export.csv';
  a.click();
}

// ===== META SEMANAL (VENDEDOR) =====
function getMetaSemanalAtual() {
  var metas = loadData('metas');
  if (!metas || !metas.length) { return null; }
  var vM = metas.filter(function (m) { return m.vendedor === currentUser.id; });
  if (!vM.length) { return null; }
  var hoje = new Date();
  var dia = hoje.getDate();
  var semana = Math.ceil(dia / 7);
  var mSem = vM.filter(function (m) { return parseInt(m.semana) === semana; });
  if (mSem.length) { return mSem[mSem.length - 1]; }
  var mAno = vM.filter(function (m) { return m.ano == String(hoje.getFullYear()); });
  if (mAno.length) { return mAno[mAno.length - 1]; }
  return vM[vM.length - 1];
}

function renderWeeklyBar() {
  if (currentUser.isM) { return ''; }
  var m = getMetaSemanalAtual();
  if (!m) { return ''; }
  var vendas = loadData('vendas');
  var vV = vendas.filter(function (v) { return v.vendedor === currentUser.id && (v.tipo || 'venda') === 'venda'; });
  var vPr = vV.reduce(function (s, v) { return s + (parseInt(v.qtdProdutos) || 0); }, 0);
  var metaProd = parseInt(m.produtos) || 0;
  var pct = metaProd > 0 ? Math.min(100, (vPr / metaProd) * 100) : 0;
  return '<div class="weekly-bar"><div class="wb-info"><div class="wb-label">Produtos Vendidos</div><div class="wb-value">' + vPr + '</div></div><div class="wb-progress"><div class="wb-progress-fill" style="width:' + Math.max(2, pct) + '%"></div></div><div class="wb-info" style="text-align:right"><div class="wb-label">Meta Semanal</div><div class="wb-value">' + metaProd + '</div></div><div class="wb-pct">' + Math.round(pct) + '%</div></div>';
}

function renderProdutosDiscriminados() {
  if (currentUser.isM) { return ''; }
  var m = getMetaSemanalAtual();
  if (!m) { return ''; }
  var vendas = loadData('vendas');
  var vV = vendas.filter(function (v) { return v.vendedor === currentUser.id && (v.tipo || 'venda') === 'venda'; });
  var prodCount = {};
  vV.forEach(function (v) {
    if (v.itens) {
      v.itens.forEach(function (it) {
        var nome = it.nome || it.cod;
        if (!prodCount[nome]) { prodCount[nome] = 0; }
        prodCount[nome] += parseInt(it.qtd) || 0;
      });
    }
  });
  var metaProd = parseInt(m.produtos) || 0;
  var totalVendido = Object.keys(prodCount).reduce(function (s, k) { return s + prodCount[k]; }, 0);
  var pct = metaProd > 0 ? Math.min(100, (totalVendido / metaProd) * 100) : 0;
  var html = '<div class="card"><h3>Produtos Discriminados</h3><table><thead><tr><th>Produto</th><th class="tcc">Qtd Vendida</th><th class="tcc">% da Meta</th></tr></thead><tbody>';
  Object.keys(prodCount).sort(function (a, b) { return prodCount[b] - prodCount[a]; }).forEach(function (p) {
    var pp = metaProd > 0 ? Math.round((prodCount[p] / metaProd) * 100) : 0;
    html += '<tr><td>' + p + '</td><td class="tcc">' + prodCount[p] + '</td><td class="tcc">' + pp + '%</td></tr>';
  });
  html += '</tbody><tfoot><tr style="font-weight:700;background:#e6f7f6"><td>Total</td><td class="tcc">' + totalVendido + '</td><td class="tcc">' + Math.round(pct) + '%</td></tr></tfoot></table></div>';
  return html;
}

}// ===== VISAO GERAL (GERENTE / GESTOR) =====
function renderOverview() {
  var vendas = loadData('vendas');
  var metas = loadData('metas');
  var atividades = loadData('atividades');
  var clientes = loadData('clientes');
  var vAtivos = getVendedores();
  var tV = 0, tL = 0, tP = 0, tPr = 0, tPos = 0, tCN = 0;
  var clientesExistentes = clientes.filter(function (c) { return c.origem !== 'manual'; }).length;
  var clientesNovosManual = clientes.filter(function (c) { return c.origem === 'manual'; }).length;
  var cards = vAtivos.map(function (v) {
    var vV = vendas.filter(function (x) { return x.vendedor === v.id && (x.tipo || 'venda') === 'venda'; });
    var vA = atividades.filter(function (x) { return x.vendedor === v.id; });
    var vM = metas.filter(function (x) { return x.vendedor === v.id; });
    var vTotV = vV.reduce(function (s, x) { return s + (parseFloat(x.total) || 0); }, 0);
    var vL = vA.filter(function (x) { return x.tipo === 'ligacao'; }).reduce(function (s, x) { return s + (parseInt(x.qtd) || 0); }, 0);
    var vP = vA.filter(function (x) { return x.tipo === 'prospeccao'; }).reduce(function (s, x) { return s + (parseInt(x.qtd) || 0); }, 0);
    var vPr = vV.reduce(function (s, x) { return s + (parseInt(x.qtdProdutos) || 0); }, 0);
    var vPos = vV.length;
    var vCN = clientes.filter(function (c) { return c.vendedorId === v.id; }).length;
    tV += vTotV; tL += vL; tP += vP; tPr += vPr; tPos += vPos; tCN += vCN;
    var m = vM[vM.length - 1] || {};
    var pV = m.valorVenda ? Math.min(100, (vTotV / m.valorVenda) * 100) : 0;
    var pL = m.ligacoes ? Math.min(100, (vL / m.ligacoes) * 100) : 0;
    var pP = m.prospeccao ? Math.min(100, (vP / m.prospeccao) * 100) : 0;
    var pPr = m.produtos ? Math.min(100, (vPr / m.produtos) * 100) : 0;
    var pPos = m.positivacao ? Math.min(100, (vPos / m.positivacao) * 100) : 0;
    var pCN = m.clientesNovos ? Math.min(100, (vCN / m.clientesNovos) * 100) : 0;
    var nv = getNivel(v.id);
    return '<div class="vc"><div class="vh"><span class="vn">' + getNome(v.id) + '</span><span class="vlv ' + nv.toLowerCase() + '">' + nv + '</span></div>' +
      progressBar('Vendas (R$)', vTotV, m.valorVenda || 0, pV) +
      progressBar('Ligacoes', vL, m.ligacoes || 0, pL) +
      progressBar('Prospeccao', vP, m.prospeccao || 0, pP) +
      progressBar('Produtos', vPr, m.produtos || 0, pPr) +
      progressBar('Positivacao', vPos, m.positivacao || 0, pPos) +
      progressBar('Clientes Novos', vCN, m.clientesNovos || 0, pCN) + '</div>';
  }).join('');
  return '<h2 class="st2">Visao Geral</h2>' +
    '<div class="sg">' +
    '<div class="sc ' + (tV > 0 ? 's' : '') + '"><div class="lb">Faturamento</div><div class="vl">R$ ' + fmtBRL(tV) + '</div><div class="sb">' + vendas.length + ' vendas</div></div>' +
    '<div class="sc"><div class="lb">Ligacoes</div><div class="vl">' + tL + '</div></div>' +
    '<div class="sc"><div class="lb">Prospeccao</div><div class="vl">' + tP + '</div></div>' +
    '<div class="sc"><div class="lb">Produtos</div><div class="vl">' + tPr + '</div></div>' +
    '<div class="sc"><div class="lb">Positivacao</div><div class="vl">' + tPos + '</div></div>' +

function addMetaMarcaPre(nome, qtd) {
  var div = document.createElement('div');
  div.className = 'mp-row';
  var marcaOpts = MARCAS.map(function (m) { return '<option value="' + m.nome + '"' + (m.nome === nome ? ' selected' : '') + '>' + m.nome + '</option>'; }).join('');
  div.innerHTML = '<select class="mp-prod" onchange="somaProdMeta()">' + marcaOpts + '</select>' +

function somaProdMeta() {
  var soma = 0;
  document.querySelectorAll('.mp-row').forEach(function (row) {
    var q = parseInt(row.querySelector('.mp-qtd').value) || 0;
    soma += q;
  });
  var total = parseInt(document.getElementById('m-prod').value) || 0;
  var te = document.getElementById('m-prod-total');
  if (te) { te.textContent = total; }
  var se = document.getElementById('m-prod-soma');
  if (se) { se.textContent = soma; }
}

function saveMeta() {
  var m = {
    vendedor: document.getElementById('m-vend').value,
    ano: document.getElementById('m-ano').value,
    mes: document.getElementById('m-mes').value,
    semana: document.getElementById('m-sem').value,
    ligacoes: parseInt(document.getElementById('m-lig').value) || 0,
    prospeccao: parseInt(document.getElementById('m-pros').value) || 0,
    produtos: parseInt(document.getElementById('m-prod').value) || 0,
    valorVenda: parseFloat(document.getElementById('m-val').value) || 0,
    positivacao: parseInt(document.getElementById('m-pos').value) || 0,
    clientesNovos: parseInt(document.getElementById('m-cn').value) || 0,
    marcasDetalhe: []
  };
  document.querySelectorAll('.mp-row').forEach(function (row) {
    var n = row.querySelector('.mp-prod').value;
    var q = parseInt(row.querySelector('.mp-qtd').value) || 0;
    if (n && q) { m.marcasDetalhe.push({ nome: n, qtd: q }); }
  });
  var metas = loadData('metas');
  if (editingMetaIdx >= 0) {
    m._id = metas[editingMetaIdx]._id;
    saveData('metas', m);
    toast('Meta atualizada!', 'success');
  } else {
    saveData('metas', m);
    toast('Meta salva para ' + getNome(m.vendedor), 'success');
  }
  editingMetaIdx = -1;
  renderTab('metas');
}

function editMeta(i) { editingMetaIdx = i; renderTab('metas'); }

function delMeta(i) {

}

function addVendedor() {
  if (!currentUser.isM) { toast('Somente a gerente pode criar perfis', 'error'); return; }
  var nome = document.getElementById('nv-nome').value.trim();
  var nivel = document.getElementById('nv-nivel').value;
  var perm = document.getElementById('nv-perm').value;
  if (!nome) { toast('Digite o nome do perfil', 'error'); return; }
  var novoId = 'v' + Date.now().toString().slice(-5);
  DELETADOS = DELETADOS.filter(function (x) { return x !== novoId; });
  salvarDeletados();
  var novo = { id: novoId, nome: nome, nivel: nivel, isM: false, permissao: perm };
  USU.push(novo);
  db.collection('usuarios').doc(novoId).set({ id: novoId, nome: nome, nivel: nivel, senha: senhaPadrao(), permissao: perm })
    .then(function () { updateLoginNomes(); toast('Perfil criado: ' + nome + ' (' + (perm === 'admin' ? 'Admin' : 'Padrao') + ')', 'success'); renderTab('perfis'); })
    .catch(function (e) { toast('Erro ao criar: ' + e.message, 'error'); });
}

function saveSenha(id) {
  var val = document.getElementById('sn-' + id).value;
  if (!val) { toast('Digite uma senha', 'error'); return; }
  db.collection('usuarios').doc(id).set({ senha: val }, { merge: true })
    .then(function () { toast('Senha salva e sincronizada: ' + getNome(id), 'success'); })
    .catch(function (e) { toast('Erro ao salvar senha: ' + e.message, 'error'); });
}

function saveNome(id) {
  var val = document.getElementById('nm-' + id).value;
  if (!val) { toast('Digite um nome', 'error'); return; }
  db.collection('usuarios').doc(id).set({ nome: val }, { merge: true })
    .then(function () {
      var u = USU.find(function (x) { return x.id === id; });
      if (u) { u.nome = val; }
      updateLoginNomes();
      toast('Nome salvo e sincronizado: ' + val, 'success');
      renderTab('perfis');
    })
    .catch(function (e) { toast('Erro ao salvar nome: ' + e.message, 'error'); });
}

function togglePermissao(id) {
  if (!currentUser.isM) { toast('Somente a gerente pode alterar permissoes', 'error'); return; }
  var perm = getPermissao(id);
  var novoPerm = perm === 'admin' ? 'padrao' : 'admin';
  db.collection('usuarios').doc(id).set({ permissao: novoPerm }, { merge: true })
    .then(function () {
      var u = USU.find(function (x) { return x.id === id; });
      if (u) { u.permissao = novoPerm; }
      toast('Permissao alterada: ' + getNome(id) + ' -> ' + (novoPerm === 'admin' ? 'Admin' : 'Padrao'), 'success');
      renderTab('perfis');
    })
    .catch(function (e) { toast('Erro ao alterar permissao: ' + e.message, 'error'); });
}

function delVendedor(id) {
  if (!currentUser || !currentUser.isM) { toast('Somente a gerente pode excluir perfis', 'error'); return; }
  var v = USU.find(function (x) { return x.id === id; });
  if (!v) { toast('Perfil nao encontrado', 'error'); return; }
  var nome = getNome(id);
  if (!confirm('Excluir o perfil ' + nome + '? Os clientes da carteira dele serao transferidos para outro perfil.')) { return; }
  var restantes = getVendedores().filter(function (x) { return x.id !== id; });
  var destino = restantes.length ? restantes[0].id : currentUser.id;
  var clientes = loadData('clientes');
  clientes.forEach(function (c) {
    if (c.vendedorId === id) { c.vendedorId = destino; saveData('clientes', c); }
  });
  USU = USU.filter(function (x) { return x.id !== id; });
  if (DELETADOS.indexOf(id) === -1) { DELETADOS.push(id); }
  salvarDeletados();
  db.collection('usuarios').doc(id).delete().catch(function (e) { console.log('Delete user error:', e); });
  updateLoginNomes();
  toast('Perfil excluido: ' + nome + ' (clientes transferidos para ' + getNome(destino) + ')', 'success');
  renderTab('perfis');
}

// ===== IMPORTACAO DE PLANILHA (gerente e gestores admin) =====
function importClientes() { document.getElementById('import-file').click(); }

function handleImportFile(event) {
  var file = event.target.files[0];
  if (!file) { return; }
  var reader = new FileReader();
  reader.onload = function (e) {
    try {
      var data = new Uint8Array(e.target.result);
      var workbook = XLSX.read(data, { type: 'array' });
      var sheetName = workbook.SheetNames[0];
      var sheet = workbook.Sheets[sheetName];
      var rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      if (!rows.length) { toast('Planilha vazia', 'error'); return; }
      var importados = 0, atualizados = 0, ignorados = 0;
      rows.forEach(function (row) {
        var cod = String(row['Código'] || row['Codigo'] || row['COD'] || row['codigo'] || '').trim();
        var razao = String(row['Razão Social'] || row['Razao Social'] || row['RazaoSocial'] || row['razao'] || '').trim();
        if (!cod || !razao) { ignorados++; return; }
        var vendedorId = currentUser.isM ? (String(row['Vendedor'] || row['vendedor'] || '').trim() || currentUser.id) : currentUser.id;
        var nivelRaw = String(row['Nivel'] || row['Nível'] || row['nivel'] || '').toLowerCase().trim();
        var nivel = (nivelRaw === 'ouro' || nivelRaw === 'prata' || nivelRaw === 'bronze') ? nivelRaw : '';
        var cliente = {
          cod: cod, razao: razao,
          contato: String(row['Contato'] || row['contato'] || '').trim(),
          telefone: String(row['Telefone'] || row['telefone'] || '').trim(),
          celular: String(row['Celular'] || row['celular'] || '').trim(),
          email: String(row['E-mail'] || row['Email'] || row['email'] || '').trim(),
          cidade: String(row['Cidade'] || row['cidade'] || '').trim(),
          estado: String(row['UF'] || row['Estado'] || row['uf'] || '').trim(),
          segmento: String(row['Segmento'] || row['segmento'] || '').trim(),
          nivel: nivel,
          vendedorId: vendedorId,
          origem: 'importado'
        };
        var clientes = loadData('clientes');
        var existing = clientes.find(function (c) { return String(c.cod).trim() === cod; });
        if (existing) { cliente._id = existing._id; saveData('clientes', cliente); atualizados++; }
        else { saveData('clientes', cliente); importados++; }
      });
      toast('Importacao concluida: ' + importados + ' novos, ' + atualizados + ' atualizados' + (ignorados ? ', ' + ignorados + ' sem codigo/razao' : ''), 'success');
      renderTab(currentUser.isM ? 'clientes' : 'meuscli');
    } catch (err) { toast('Erro ao importar: ' + err.message, 'error'); }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
}

        return '<tr id="row-' + c.cod + '">' + chkHtml + '<td>' + c.cod + '</td><td>' + c.razao + '</td><td>' + (c.contato || '--') + '</td><td>' + (c.celular || '--') + '</td><td>' + c.cidade + '</td><td>' + c.estado + '</td><td>' + (c.segmento || '--') + '</td><td>' + nivelHtml + '</td>' + (isGerente ? '<td>' + getNome(c.vendedorId || '') + '</td>' : '') + transferirHtml + '<td><div class="action-btns"><button class="edit-btn" onclick="abrirEdicaoCliente(\'' + c.cod + '\',' + isGerente + ')">Editar</button><button class="del-btn" onclick="delCliente(' + i + ',' + isGerente + ')">Excluir</button></div></td></tr>';
      }).join('') + '</tbody></table>'
    : '<div class="es"><div class="ic">SEM</div><p>Nenhum cliente.</p></div>';
  var importCard = '<div class="card"><h3>Importar Planilha</h3>' +

    '<input type="file" id="import-file" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleImportFile(event)">' +
    '<button class="btn btn-a" onclick="importClientes()">📥 Importar Planilha</button></div>';
  var formHtml = '<div class="card"><h3>Adicionar Cliente</h3><div class="fr">' +
    '<div class="fg"><label>Codigo</label><input type="text" id="cl-cod" placeholder="Ex: 001"></div>' +
    '<div class="fg"><label>Razao Social</label><input type="text" id="cl-razao" placeholder="Nome do cliente"></div>' +
    '<div class="fg"><label>Contato</label><input type="text" id="cl-contato" placeholder="Pessoa responsavel"></div>' +
    '<div class="fg"><label>Celular</label><input type="text" id="cl-celular" placeholder="(00) 00000-0000" oninput="maskTelefone(this)" maxlength="15"></div>' +
    '<div class="fg"><label>Cidade</label><input type="text" id="cl-cidade" placeholder="Cidade"></div>' +
    '<div class="fg"><label>Estado</label><select id="cl-estado"><option value="">--</option>' + ufOpts + '</select></div>' +
    '<div class="fg"><label>Segmento</label><select id="cl-segmento"><option value="">--</option>' + segOpts + '</select></div>' +
    '<div class="fg"><label>Nivel</label><select id="cl-nivel">' + nivelFormOpts + '</select></div>' +
    (isGerente ? '<div class="fg"><label>Vendedor</label><select id="cl-vend">' + vendOpts + '</select></div>' : '') +
    '</div><button class="btn btn-p" onclick="saveCliente(' + isGerente + ')">Salvar Cliente</button></div>';
  var rotacaoCard = isGerente ? '<div class="card" style="border-left:4px solid var(--warn)"><h3>🔄 Rodizio de 90 Dias</h3><p style="font-size:.82rem;color:var(--txt2);margin-bottom:12px">O rodizio completo (carteiras por vendedor) esta na aba <strong>Rodizio (90 Dias)</strong> no menu.</p><button class="btn btn-a" onclick="renderTab(\'rodizio\')">Ir para o Rodizio</button></div>' : '';
  var filtroHtml = '<div class="card"><h3>Buscar Cliente</h3><div class="search-box"><span class="ico">🔍</span><input type="text" id="cl-busca" placeholder="Buscar por nome, codigo ou telefone..." oninput="filtrarClientes(' + isGerente + ')"></div>' +
    '<div class="filtros" style="margin-top:12px"><div class="fg"><label>Filtrar por Nivel</label><select id="cl-filtro-nivel" onchange="filtrarClientes(' + isGerente + ')">' + nivelOpts + '</select></div></div>' +
    '<div id="cl-lista">' + tabela + '</div></div>';
  return '<h2 class="st2">' + (isGerente ? 'Clientes' : 'Meus Clientes') + '</h2>' + importCard + rotacaoCard + formHtml + bulkBar + filtroHtml;
}

// ===== SELECAO EM MASSA =====
function atualizarSelecao() {
  var count = 0;
  document.querySelectorAll('.chk-cli').forEach(function (chk) {
    if (chk.checked) { selecionados[chk.dataset.cod] = true; count++; }
    else { delete selecionados[chk.dataset.cod]; }
  });
  var el = document.getElementById('bb-count');
  if (el) { el.textContent = count + ' selecionados'; }
}

function toggleAllSelecao() {
  var all = document.getElementById('chk-all');
  var checked = all.checked;
  document.querySelectorAll('.chk-cli').forEach(function (chk) {
    chk.checked = checked;
    if (checked) { selecionados[chk.dataset.cod] = true; }
    else { delete selecionados[chk.dataset.cod]; }
  });
  atualizarSelecao();
}

function limparSelecao() {
  selecionados = {};
  document.querySelectorAll('.chk-cli').forEach(function (chk) { chk.checked = false; });
  var all = document.getElementById('chk-all'); if (all) { all.checked = false; }
  atualizarSelecao();
}

function moverSelecionados() {
  if (!currentUser.isM && !isAdmin(currentUser.id)) { toast('Somente gerente ou gestor pode mover clientes em massa', 'error'); return; }
  var destId = document.getElementById('bb-dest').value;
  if (!destId) { toast('Selecione o vendedor de destino', 'error'); return; }
  var cods = Object.keys(selecionados);
  if (!cods.length) { toast('Nenhum cliente selecionado', 'error'); return; }
  if (!confirm('Mover ' + cods.length + ' clientes para ' + getNome(destId) + '?')) { return; }
  var clientes = loadData('clientes');
  cods.forEach(function (cod) {
    var c = clientes.find(function (x) { return String(x.cod).trim() === String(cod).trim(); });
    if (c) { c.vendedorId = destId; c.editadoPor = getNome(currentUser.id); c.editadoEm = new Date().toISOString(); saveData('clientes', c); }
  });
  toast(cods.length + ' clientes movidos para ' + getNome(destId) + ' por ' + getNome(currentUser.id), 'success');
  limparSelecao();
  renderTab('clientes');
}

function excluirSelecionados() {
  if (!currentUser.isM) { toast('Somente a gerente pode excluir clientes em massa', 'error'); return; }
  var cods = Object.keys(selecionados);
  if (!cods.length) { toast('Nenhum cliente selecionado', 'error'); return; }
  if (!confirm('Excluir definitivamente ' + cods.length + ' clientes? Esta acao nao pode ser desfeita.')) { return; }
  var clientes = loadData('clientes');
  cods.forEach(function (cod) {
    var c = clientes.find(function (x) { return String(x.cod).trim() === String(cod).trim(); });
    if (c && c._id) { deleteDoc('clientes', c._id); }
  });
  toast(cods.length + ' clientes excluidos por ' + getNome(currentUser.id), 'success');
  limparSelecao();
  renderTab('clientes');
}

function filtrarClientes(isGerente) {
  var clientes = isGerente ? loadData('clientes') : getMeusClientes();
  var termo = document.getElementById('cl-busca').value.toLowerCase().trim();
  var nivelFiltro = document.getElementById('cl-filtro-nivel').value;
  var filtrados = clientes.filter(function (c) {
    if (nivelFiltro) {
      var cn = c.nivel || 'sem';
      if (nivelFiltro === 'sem' && cn !== 'sem') { return false; }
      if (nivelFiltro !== 'sem' && cn !== nivelFiltro) { return false; }
    }
    if (termo) {
      return (c.razao || '').toLowerCase().indexOf(termo) >= 0 || (c.cod || '').toLowerCase().indexOf(termo) >= 0 || (c.celular || '').indexOf(termo) >= 0 || (c.telefone || '').indexOf(termo) >= 0;
    }
    return true;
  });
  var vendOpts = getVendedores().map(function (v) { return '<option value="' + v.id + '">' + getNome(v.id) + '</option>'; }).join('');
  var html = filtrados.length
    ? '<table><thead><tr>' + (isGerente ? '<th><input type="checkbox" class="chk" id="chk-all" onchange="toggleAllSelecao()"></th>' : '') + '<th>Cod</th><th>Razao Social</th><th>Contato</th><th>Celular</th><th>Cidade</th><th>UF</th><th>Segmento</th><th>Nivel</th>' + (isGerente ? '<th>Vendedor</th><th>Transferir</th>' : '') + '<th>Acoes</th></tr></thead><tbody>' +
      filtrados.map(function (c) {
        var transferirHtml = isGerente ? '<td><select class="inp-sm" style="width:120px" onchange="transferirCliente(\'' + c.cod + '\',this.value)"><option value="">--</option>' + vendOpts + '</select></td>' : '';
        var nivel = c.nivel || 'sem';
        var nivelHtml = '<span class="nivel-badge ' + nivel + '">' + (nivel === 'sem' ? 'Sem' : nivel.charAt(0).toUpperCase() + nivel.slice(1)) + '</span>';
        var chkHtml = isGerente ? '<td><input type="checkbox" class="chk chk-cli" data-cod="' + c.cod + '" onchange="atualizarSelecao()"' + (selecionados[c.cod] ? ' checked' : '') + '></td>' : '';
        return '<tr id="row-' + c.cod + '">' + chkHtml + '<td>' + c.cod + '</td><td>' + c.razao + '</td><td>' + (c.contato || '--') + '</td><td>' + (c.celular || '--') + '</td><td>' + c.cidade + '</td><td>' + c.estado + '</td><td>' + (c.segmento || '--') + '</td><td>' + nivelHtml + '</td>' + (isGerente ? '<td>' + getNome(c.vendedorId || '') + '</td>' : '') + transferirHtml + '<td><div class="action-btns"><button class="edit-btn" onclick="abrirEdicaoCliente(\'' + c.cod + '\',' + isGerente + ')">Editar</button><button class="del-btn" onclick="delCliente(' + clientes.indexOf(c) + ',' + isGerente + ')">Excluir</button></div></td></tr>';
      }).join('') + '</tbody></table>'
    : '<div class="es"><div class="ic">SEM</div><p>Nenhum cliente encontrado.</p></div>';
  var div = document.getElementById('cl-lista');
  if (div) { div.innerHTML = html; }
}

// ===== EDITAR CLIENTE EM NOVA ABA =====
function abrirEdicaoCliente(cod, isGerente) {
  var clientes = loadData('clientes');
  var cli = clientes.find(function (c) { return String(c.cod).trim() === String(cod).trim(); });
  if (!cli) { toast('Cliente nao encontrado', 'error'); return; }
  var segOpts = SEGMENTOS.map(function (s) { return '<option value="' + s + '"' + (s === cli.segmento ? ' selected' : '') + '>' + s + '</option>'; }).join('');
  var ufOpts = UFS.map(function (u) { return '<option value="' + u + '"' + (u === cli.estado ? ' selected' : '') + '>' + u + '</option>'; }).join('');
  var nivelFormOpts = '<option value="">Sem Nivel</option><option value="ouro"' + (cli.nivel === 'ouro' ? ' selected' : '') + '>Ouro</option><option value="prata"' + (cli.nivel === 'prata' ? ' selected' : '') + '>Prata</option><option value="bronze"' + (cli.nivel === 'bronze' ? ' selected' : '') + '>Bronze</option>';
  var vendOpts = getVendedores().map(function (v) { return '<option value="' + v.id + '"' + (v.id === cli.vendedorId ? ' selected' : '') + '>' + getNome(v.id) + '</option>'; }).join('');
  var html = '<h2 class="st2">Editar Cliente</h2>' +
    editNoteHTML() +
    '<div class="card"><h3>' + cli.razao + ' (COD ' + cli.cod + ')</h3><div class="fr">' +
    '<div class="fg"><label>Codigo</label><input type="text" id="ec-cod" value="' + cli.cod + '"></div>' +
    '<div class="fg"><label>Razao Social</label><input type="text" id="ec-razao" value="' + cli.razao + '"></div>' +
    '<div class="fg"><label>Contato</label><input type="text" id="ec-contato" value="' + (cli.contato || '') + '"></div>' +
    '<div class="fg"><label>Celular</label><input type="text" id="ec-celular" value="' + (cli.celular || '') + '" oninput="maskTelefone(this)" maxlength="15"></div>' +
    '<div class="fg"><label>Cidade</label><input type="text" id="ec-cidade" value="' + (cli.cidade || '') + '"></div>' +
    '<div class="fg"><label>Estado</label><select id="ec-estado"><option value="">--</option>' + ufOpts + '</select></div>' +
    '<div class="fg"><label>Segmento</label><select id="ec-segmento"><option value="">--</option>' + segOpts + '</select></div>' +
    '<div class="fg"><label>Nivel</label><select id="ec-nivel">' + nivelFormOpts + '</select></div>' +
    (isGerente ? '<div class="fg"><label>Vendedor</label><select id="ec-vend">' + vendOpts + '</select></div>' : '') +
    '</div><div class="action-btns"><button class="btn btn-p" onclick="salvarEdicaoCliente(\'' + cli.cod + '\',' + isGerente + ')">Salvar Alteracoes</button>' +
    '<button class="btn btn-d" onclick="renderTab(\'clientes\')">Cancelar</button></div></div>';
  var c = document.getElementById('tc-clientes');
  if (c) { c.innerHTML = html; }
}

function salvarEdicaoCliente(codOriginal, isGerente) {
  var clientes = loadData('clientes');
  var cli = clientes.find(function (c) { return String(c.cod).trim() === String(codOriginal).trim(); });
  if (!cli) { toast('Cliente nao encontrado', 'error'); return; }
  var novoCod = document.getElementById('ec-cod').value.trim();
  var razao = document.getElementById('ec-razao').value.trim();
  if (!novoCod || !razao) { toast('Codigo e Razao sao obrigatorios', 'error'); return; }
  var dup = clientes.find(function (c) { return String(c.cod).trim() === novoCod && String(c.cod).trim() !== String(codOriginal).trim(); });
  if (dup) { toast('Ja existe um cliente com o codigo ' + novoCod, 'error'); return; }
  var updated = {
    _id: cli._id,
    cod: novoCod, razao: razao,
    contato: document.getElementById('ec-contato').value.trim(),
    telefone: cli.telefone || '',
    celular: document.getElementById('ec-celular').value.trim(),
    email: cli.email || '',
    cidade: document.getElementById('ec-cidade').value.trim(),
    estado: document.getElementById('ec-estado').value,
    segmento: document.getElementById('ec-segmento').value,
    nivel: document.getElementById('ec-nivel').value,
    vendedorId: isGerente ? document.getElementById('ec-vend').value : cli.vendedorId,
    origem: cli.origem || 'importado',
    editadoPor: getNome(currentUser.id),
    editadoEm: new Date().toISOString()
  };
  saveData('clientes', updated);
  toast('Cliente atualizado por ' + getNome(currentUser.id), 'success');
  renderTab(isGerente ? 'clientes' : 'meuscli');
}

function transferirCliente(cod, novoVendId) {
  if (!novoVendId) { return; }
  if (!currentUser.isM && !isAdmin(currentUser.id)) { toast('Somente gerente ou gestor pode transferir clientes', 'error'); return; }
  var clientes = loadData('clientes');
  var c = clientes.find(function (x) { return String(x.cod).trim() === String(cod).trim(); });
  if (!c) { toast('Cliente nao encontrado', 'error'); return; }
  c.vendedorId = novoVendId;
  c.editadoPor = getNome(currentUser.id);
  c.editadoEm = new Date().toISOString();
  saveData('clientes', c);
  toast('Cliente ' + c.razao + ' transferido para ' + getNome(novoVendId) + ' por ' + getNome(currentUser.id), 'success');
  renderTab('clientes');
}

function saveCliente(isGerente) {
  var cod = document.getElementById('cl-cod').value.trim();
  var razao = document.getElementById('cl-razao').value.trim();
  if (!cod || !razao) { toast('Codigo e Razao sao obrigatorios', 'error'); return; }
  var c = {
    cod: cod, razao: razao,
    contato: document.getElementById('cl-contato').value.trim(),
    telefone: '',
    celular: document.getElementById('cl-celular').value.trim(),
    email: '',
    cidade: document.getElementById('cl-cidade').value.trim(),
    estado: document.getElementById('cl-estado').value,
    segmento: document.getElementById('cl-segmento').value,
    nivel: document.getElementById('cl-nivel').value,
    vendedorId: isGerente ? document.getElementById('cl-vend').value : currentUser.id,
    editadoPor: getNome(currentUser.id),
    editadoEm: new Date().toISOString()
  };
  var clientes = loadData('clientes');
  var existing = clientes.find(function (x) { return String(x.cod).trim() === cod; });
  if (existing) {
    c._id = existing._id;
    if (existing.origem) { c.origem = existing.origem; }
    saveData('clientes', c);
    toast('Cliente atualizado por ' + getNome(currentUser.id), 'success');
  } else {
    c.origem = 'manual';
    saveData('clientes', c);
    toast('Cliente salvo por ' + getNome(currentUser.id), 'success');
  }
  renderTab(isGerente ? 'clientes' : 'meuscli');
}

function delCliente(i, isGerente) {
  if (!confirm('Excluir este cliente?')) { return; }
  var clientes = loadData('clientes');
  var cli = isGerente ? clientes[i] : getMeusClientes()[i];
  if (!cli) { toast('Cliente nao encontrado', 'error'); return; }
  var idx = clientes.findIndex(function (c) { return String(c.cod).trim() === String(cli.cod).trim(); });
  if (idx < 0) { toast('Cliente nao encontrado', 'error'); return; }
  if (cli._id) { deleteDoc('clientes', cli._id); }
  toast('Cliente excluido', 'success');
  renderTab(isGerente ? 'clientes' : 'meuscli');
}

// ===== RODIZIO (90 DIAS) — inclui gerente e gestores =====
function renderRodizio() {
  if (!currentUser.isM && !isAdmin(currentUser.id)) { return '<div class="card"><div class="es"><div class="ic">🔒</div><p>Somente gerente ou gestor pode acessar o rodizio.</p></div></div>'; }
  var todos = USU.filter(function (u) { return DELETADOS.indexOf(u.id) === -1; });
  var clientes = loadData('clientes');
  var ultimoRod = localStorage.getItem('mc_ultimo_rodizio');
  var html = '<h2 class="st2">Rodizio de Clientes (90 Dias)</h2>';
  if (ultimoRod) {
    var d = new Date(ultimoRod);
    html += '<div class="card" style="background:rgba(245,158,11,.08);border-left:4px solid var(--warn)"><h3 style="color:#b25e00">Ultimo rodizio realizado</h3><p style="font-size:.9rem;color:var(--txt2)">' + d.toLocaleDateString('pt-BR') + ' — o proximo rodizio deve ocorrer apos 90 dias.</p></div>';
  }
  html += '<div class="card"><h3>Como funciona</h3><p style="font-size:.82rem;color:var(--txt2);margin-bottom:12px">O rodizio considera <strong>somente clientes que nao compraram ha mais de 90 dias</strong>. Clientes que compraram ha menos de 90 dias <strong>ficam com o responsavel atual</strong> (nao entram no rodizio). <strong>Gerente, gestores e vendedores</strong> participam: cada um pode mover <strong>todos os seus clientes de uma vez</strong>. Clique no nome para <strong>expandir/recolher</strong> a lista. Use o <strong>Rodizio Automatico</strong> para girar as carteiras (V1 -> V2, V2 -> V3, ..., ultimo -> V1).</p><button class="btn btn-d" onclick="rodizioAutomatico()">🔄 Rodizio Automatico (90 Dias)</button></div>';
  todos.forEach(function (v) {
    var meus = clientes.filter(function (c) { return c.vendedorId === v.id; });
    var elegiveis = meus.filter(function (c) { return clienteElegivelRodizio(c.cod); });
    var destOpts = todos.filter(function (d) { return d.id !== v.id; }).map(function (d) { return '<option value="' + d.id + '">' + getNome(d.id) + '</option>'; }).join('');
    var corpo = meus.length
      ? '<table><thead><tr><th>Cod</th><th>Razao Social</th><th>Contato</th><th>Celular</th><th>Cidade</th><th>UF</th><th>Nivel</th><th>Rodizio</th></tr></thead><tbody>' + meus.map(function (c) {
        var nivel = c.nivel || 'sem';
        var nivelHtml = '<span class="nivel-badge ' + nivel + '">' + (nivel === 'sem' ? 'Sem' : nivel.charAt(0).toUpperCase() + nivel.slice(1)) + '</span>';
        var elegivel = clienteElegivelRodizio(c.cod);
        var rodHtml = elegivel ? '<span class="tipo-badge venda">Elegivel</span>' : '<span class="tipo-badge bonificacao">Ativo</span>';
        return '<tr><td>' + c.cod + '</td><td>' + c.razao + '</td><td>' + (c.contato || '--') + '</td><td>' + (c.celular || '--') + '</td><td>' + c.cidade + '</td><td>' + c.estado + '</td><td>' + nivelHtml + '</td><td class="tcc">' + rodHtml + '</td></tr>';
      }).join('') + '</tbody></table>'
      : '<div class="es"><div class="ic">SEM</div><p>Sem clientes atribuidos a este perfil.</p></div>';
    html += '<div class="card"><div class="com-hero" style="margin-bottom:12px;cursor:pointer" onclick="toggleCarteira(\'' + v.id + '\')">' +
      '<div><div class="com-name">' + getNome(v.id) + ' <span id="rd-arrow-' + v.id + '" style="font-size:.9rem;opacity:.7">▾</span></div><div class="com-nivel">' + (v.isM ? 'Gerente' : (isAdmin(v.id) ? 'Gestor' : getNivel(v.id))) + ' — ' + meus.length + ' clientes (' + elegiveis.length + ' elegiveis)</div></div>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap" onclick="event.stopPropagation()">' +
      '<select id="rd-dest-' + v.id + '" class="inp-sm" style="width:150px"><option value="">Destino...</option>' + destOpts + '</select>' +
      '<button class="btn btn-a btn-s" onclick="transferirCarteira(\'' + v.id + '\')">Mover Carteira</button></div></div>' +
      '<div id="rd-body-' + v.id + '">' + corpo + '</div></div>';
  });
  return html;
}

function toggleCarteira(vid) {
  var body = document.getElementById('rd-body-' + vid);
  var arrow = document.getElementById('rd-arrow-' + vid);
  if (!body) { return; }
  var hidden = body.style.display === 'none';
  body.style.display = hidden ? 'block' : 'none';
  if (arrow) { arrow.textContent = hidden ? '▾' : '▸'; }
}

function transferirCarteira(origemId) {
  var destId = document.getElementById('rd-dest-' + origemId).value;
  if (!destId) { toast('Selecione o perfil de destino', 'error'); return; }
  if (!currentUser.isM && !isAdmin(currentUser.id)) { toast('Somente gerente ou gestor pode transferir carteiras', 'error'); return; }
  var clientes = loadData('clientes');
  var daCarteira = clientes.filter(function (c) { return c.vendedorId === origemId && clienteElegivelRodizio(c.cod); });
  if (!daCarteira.length) { toast(getNome(origemId) + ' nao possui clientes elegiveis para rodizio', 'error'); return; }
  if (!confirm('Mover a carteira elegivel de ' + getNome(origemId) + ' (' + daCarteira.length + ' clientes) para ' + getNome(destId) + '?')) { return; }
  daCarteira.forEach(function (c) { c.vendedorId = destId; c.editadoPor = getNome(currentUser.id); c.editadoEm = new Date().toISOString(); saveData('clientes', c); });
  toast('Carteira de ' + getNome(origemId) + ' movida para ' + getNome(destId), 'success');
  renderTab('rodizio');
}

function rodizioAutomatico() {
  if (!currentUser.isM && !isAdmin(currentUser.id)) { toast('Somente gerente ou gestor pode fazer o rodizio', 'error'); return; }
  var todos = USU.filter(function (u) { return DELETADOS.indexOf(u.id) === -1; });
  var clientes = loadData('clientes');
  var elegiveis = clientes.filter(function (c) { return clienteElegivelRodizio(c.cod); });
  if (!elegiveis.length) { toast('Nenhum cliente elegivel para rodizio (todos compraram ha menos de 90 dias)', 'error'); return; }
  if (!confirm('Rodizio automatico: a carteira ELEGIVEL (sem compra ha mais de 90 dias) de TODOS os perfis sera movida para o proximo da lista (V1 -> V2, V2 -> V3, ..., ultimo -> V1). Clientes ativos ficam com o responsavel atual. Continuar?')) { return; }
  var mapa = {};
  todos.forEach(function (v, i) { mapa[v.id] = todos[(i + 1) % todos.length].id; });
  elegiveis.forEach(function (c) {
    var novo = mapa[c.vendedorId];
    if (novo) { c.vendedorId = novo; c.editadoPor = getNome(currentUser.id); c.editadoEm = new Date().toISOString(); saveData('clientes', c); }
  });
  localStorage.setItem('mc_ultimo_rodizio', new Date().toISOString());
  toast('Rodizio concluido: ' + elegiveis.length + ' clientes elegiveis movidos para o proximo perfil', 'success');
  renderTab('rodizio');
}

// ===== VENDAS (GERENTE / GESTOR) — filtro de periodo dinamico =====
function renderVendasGer() {
  var filtro = '<div class="card"><h3>Filtros</h3><div class="filtros">' + filtroPeriodoHTML('vg') +
    '<div class="fg" style="display:flex;align-items:flex-end"><button class="btn btn-a btn-s" onclick="limparFiltroPeriodo(\'vg\')">Limpar</button></div></div></div>';
  window['_filtro_vg'] = function (p, ini, fim, mes, ano) {
    var vendas = loadData('vendas');
    var filtradas = vendas.filter(function (v) {
      if (p === 'anual' && ano) { var d = new Date(v.data); if (d.getFullYear() !== parseInt(ano)) { return false; } }
      if (p === 'mensal' && mes) { var d2 = new Date(v.data); var ym = d2.getFullYear() + '-' + String(d2.getMonth() + 1).padStart(2, '0'); if (ym !== mes) { return false; } }
      if ((p === 'semanal' || p === 'periodo') && ini && v.data < ini) { return false; }
      if ((p === 'semanal' || p === 'periodo') && fim && v.data > fim) { return false; }
      return true;
    });
    var totVendas = filtradas.filter(function (v) { return (v.tipo || 'venda') === 'venda'; }).reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
    var totBonif = filtradas.filter(function (v) { return v.tipo === 'bonificacao'; }).reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
    var resumo = document.getElementById('vg-resumo');
    if (resumo) {
      resumo.innerHTML = '<div class="sg">' +
        '<div class="sc s"><div class="lb">Total Vendido</div><div class="vl">R$ ' + fmtBRL(totVendas) + '</div></div>' +
        '<div class="sc w"><div class="lb">Bonificacoes</div><div class="vl">R$ ' + fmtBRL(totBonif) + '</div></div>' +
        '<div class="sc"><div class="lb">Total Geral</div><div class="vl">R$ ' + fmtBRL(totVendas + totBonif) + '</div></div>' +
        '<div class="sc"><div class="lb">Registros</div><div class="vl">' + filtradas.length + '</div></div></div>';
    }
    var tabelaDiv = document.getElementById('vg-tabela');
    if (!tabelaDiv) { return; }
    var html = filtradas.length
      ? '<table><thead><tr><th>Data</th><th>Cliente</th><th>UF</th><th>Segmento</th><th>Vendedor</th><th>Tipo</th><th>Itens</th><th>Qtd</th><th>Total</th><th>Acoes</th></tr></thead><tbody>' +
        filtradas.map(function (v) {
          var fullIdx = vendas.indexOf(v);
          var itensStr = (v.itens && v.itens.length) ? v.itens.map(function (it) { return it.qtd + 'x ' + it.nome; }).join(', ') : '--';
          var estado = v.estado || getEstadoFromVenda(v);
          var segmento = v.segmento || getSegmentoFromVenda(v);
          var tipo = v.tipo || 'venda';
          var tipoHtml = '<span class="tipo-badge ' + tipo + '">' + tipo + '</span>';
          return '<tr><td>' + v.data + '</td><td>' + v.cliente + '</td><td class="tcc">' + estado + '</td><td>' + (segmento || '--') + '</td><td>' + getNome(v.vendedor) + '</td><td class="tcc">' + tipoHtml + '</td><td style="font-size:.78rem">' + itensStr + '</td><td class="tcc">' + (v.qtdProdutos || 0) + '</td><td class="tcr">R$ ' + fmtBRL(v.total) + '</td><td><div class="action-btns"><button class="edit-btn" onclick="editVenda(' + fullIdx + ')">Editar</button><button class="del-btn" onclick="delVenda(' + fullIdx + ')">Excluir</button></div></td></tr>';
        }).join('') + '</tbody></table>'
      : '<div class="es"><div class="ic">SEM</div><p>Nenhuma venda no periodo.</p></div>';
    tabelaDiv.innerHTML = html;
  };
  setTimeout(function () { aplicarFiltroPeriodo('vg'); }, 50);
  return '<h2 class="st2">Vendas</h2>' + filtro +
    '<div id="vg-resumo"></div>' +
    '<div class="card"><h3>Todas as Vendas Detalhadas</h3><div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn btn-a btn-s" onclick="exportCSV(loadData(\'vendas\'),\'vendas.csv\')">Exportar CSV</button>' +
    '<button class="btn btn-p btn-s" onclick="exportVendasPDF()">Exportar PDF</button></div><div id="vg-tabela"></div></div>';
}

function exportVendasPDF() {
  var vendas = loadData('vendas');

  vendas.forEach(function (v) { html += '<tr><td>' + v.data + '</td><td>' + v.cliente + '</td><td>' + getNome(v.vendedor) + '</td><td>' + (v.tipo || 'venda') + '</td><td>' + (v.qtdProdutos || 0) + '</td><td>R$ ' + fmtBRL(v.total) + '</td></tr>'; });

function editVenda(i) {
  var vendas = loadData('vendas');
  var v = vendas[i];
  if (!v) { return; }
  editingVendaIdx = i;
  var clientes = loadData('clientes');
  var cliOpts = clientes.map(function (c) { return '<option value="' + c.cod + '">' + c.cod + ' - ' + c.razao + '</option>'; }).join('');
  var prodOpts = PROD.map(function (p) { return '<option value="' + p.cod + '">' + p.cod + ' - ' + p.nome + '</option>'; }).join('');
  var itensHtml = '';
  if (v.itens && v.itens.length) {
    v.itens.forEach(function (it) {
      itensHtml += '<div class="pe"><select class="pe-prod" onchange="calcVendaTotal()">' + prodOpts.replace('value="' + it.cod + '"', 'value="' + it.cod + '" selected') + '</select><input type="number" class="pe-qtd" value="' + it.qtd + '" oninput="calcVendaTotal()" min="1"><input type="text" class="pe-preco" value="R$ ' + fmtBRL(it.preco * it.qtd) + '" readonly><button class="rb" onclick="this.parentElement.remove();calcVendaTotal()">x</button></div>';
    });
  }
  var tipoSel = v.tipo || 'venda';
  var html = '<h2 class="st2">Editar Venda</h2>' + editNoteHTML() +
    '<div class="card"><h3>Editar Venda</h3><div class="tipo-toggle">' +
    '<button id="tt-venda" class="' + (tipoSel === 'venda' ? 'act' : '') + '" onclick="setTipoLanc(\'venda\')">Venda</button>' +
    '<button id="tt-bonif" class="' + (tipoSel === 'bonificacao' ? 'act' : '') + '" onclick="setTipoLanc(\'bonificacao\')">Bonificacao</button></div>' +
    '<div class="fr"><div class="fg"><label>Data</label><input type="date" id="vd-data" value="' + v.data + '"></div>' +
    '<div class="fg"><label>Cliente</label><select id="vd-cli">' + cliOpts + '</select></div></div>' +
    '<div class="dv"></div><h3>Itens</h3><div id="vd-itens">' + itensHtml + '</div>' +
    '<button class="btn btn-a btn-s" onclick="addVendaItem()">+ Adicionar Item</button>' +
    '<div class="dv"></div><div class="st" id="vd-total">Total: R$ ' + fmtBRL(v.total) + '</div>' +
    '<div class="dv"></div><button class="btn btn-p btn-f" onclick="salvarEdicaoVenda()">Salvar Alteracoes</button> <button class="btn btn-d" onclick="cancelarEdicaoVenda()">Cancelar</button></div>';
  var c = document.getElementById('tc-vendas');
  if (c) { c.innerHTML = html; }
  var cliSel = document.getElementById('vd-cli');
  if (cliSel) { var m = v.cliente.match(/COD\s+(\S+)/); if (m) { cliSel.value = m[1]; } }
  calcVendaTotal();
}

function salvarEdicaoVenda() {
  if (editingVendaIdx < 0) { toast('Nenhuma venda selecionada', 'error'); return; }
  var vendas = loadData('vendas');
  var v = vendas[editingVendaIdx];
  if (!v) { toast('Venda nao encontrada', 'error'); return; }
  var data = document.getElementById('vd-data').value;
  var cod = document.getElementById('vd-cli').value;
  var cliente = getClienteByCod(cod);
  var tipo = getTipoLanc();
  var itens = [];
  var total = 0;
  var qtdProdutos = 0;
  document.querySelectorAll('.pe').forEach(function (row) {
    var codProd = row.querySelector('.pe-prod').value;
    var qtd = parseInt(row.querySelector('.pe-qtd').value) || 0;
    var prod = PROD.find(function (p) { return p.cod === codProd; });
    if (prod && qtd > 0) { itens.push({ cod: codProd, nome: prod.nome, qtd: qtd, preco: prod.preco }); total += prod.preco * qtd; qtdProdutos += qtd; }
  });
  if (itens.length === 0) { toast('Adicione pelo menos um item', 'error'); return; }
  var nomeCli = cliente ? cliente.razao : 'COD ' + cod;
  var estado = cliente ? cliente.estado : '--';
  var segmento = cliente ? cliente.segmento : 'Outros';
  var updated = { _id: v._id, data: data, cliente: nomeCli + ' (COD ' + cod + ' / ' + estado + ')', vendedor: v.vendedor, itens: itens, qtdProdutos: qtdProdutos, total: total, estado: estado, segmento: segmento, tipo: tipo, editadoPor: getNome(currentUser.id), editadoEm: new Date().toISOString() };
  saveData('vendas', updated);
  editingVendaIdx = -1;
  toast('Venda atualizada por ' + getNome(currentUser.id), 'success');
  renderTab('vendas');
}

function cancelarEdicaoVenda() { editingVendaIdx = -1; renderTab('vendas'); }

function delVenda(i) {
  if (!confirm('Excluir esta venda?')) { return; }
  var vendas = loadData('vendas');
  var v = vendas[i];
  if (v && v._id) { deleteDoc('vendas', v._id); toast('Venda excluida', 'success'); renderTab('vendas'); }
}

function renderRelAtividades() {

  window['_filtro_ra'] = function (p, ini, fim, mes, ano) {

    var vend = document.getElementById('ra-vend').value;
    var tipo = document.getElementById('ra-tipo').value;
    var filtradas = atividades.filter(function (a) {
      if (vend && a.vendedor !== vend) { return false; }
      if (tipo && a.tipo !== tipo) { return false; }
      if (p === 'anual' && ano) { var d = new Date(a.data); if (d.getFullYear() !== parseInt(ano)) { return false; } }
      if (p === 'mensal' && mes) { var d2 = new Date(a.data); var ym = d2.getFullYear() + '-' + String(d2.getMonth() + 1).padStart(2, '0'); if (ym !== mes) { return false; } }
      if ((p === 'semanal' || p === 'periodo') && ini && a.data < ini) { return false; }
      if ((p === 'semanal' || p === 'periodo') && fim && a.data > fim) { return false; }
      return true;
    });
    var html = '';
    if (filtradas.length === 0) {
      html = '<div class="es"><div class="ic">SEM</div><p>Nenhuma atividade no periodo.</p></div>';

      var totLig = filtradas.filter(function (a) { return a.tipo === 'ligacao'; }).reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);

      var totVis = filtradas.filter(function (a) { return a.tipo === 'visita'; }).reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);
      var totEm = filtradas.filter(function (a) { return a.tipo === 'email'; }).reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);
      html = '<div class="sg"><div class="sc"><div class="lb">Ligacoes</div><div class="vl">' + totLig + '</div></div><div class="sc"><div class="lb">Prospeccao</div><div class="vl">' + totPro + '</div></div><div class="sc"><div class="lb">Visitas</div><div class="vl">' + totVis + '</div></div><div class="sc"><div class="lb">E-mails</div><div class="vl">' + totEm + '</div></div></div>';
      if (tipo === 'ligacao') {
        html += '<table><thead><tr><th>Data</th><th>Vendedor</th><th>Qtd</th><th>Horario</th><th>Telefone</th><th>Cliente</th><th>Obs</th></tr></thead><tbody>';
        filtradas.forEach(function (a) {
          html += '<tr><td>' + a.data + '</td><td>' + getNome(a.vendedor) + '</td><td class="tcc">' + (a.qtd || 0) + '</td><td>' + (a.horario || '--') + '</td><td>' + (a.telefone || '--') + '</td><td>' + truncarNome(a.clienteNome) + '</td><td>' + (a.obs || '') + '</td></tr>';

        filtradas.forEach(function (a) { html += '<tr><td>' + a.data + '</td><td>' + getNome(a.vendedor) + '</td><td>' + (a.tipo || '--') + '</td><td class="tcc">' + (a.qtd || 0) + '</td><td>' + (a.obs || '') + '</td></tr>'; });

    '<button class="btn btn-p btn-s" onclick="exportAtividadesPDF()">📑 Exportar PDF</button></div><div id="ra-result"></div></div>';
