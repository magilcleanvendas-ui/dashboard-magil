function truncarNome(nome) {
  if (!nome) { return '--'; }
  var palavras = String(nome).trim().split(/\s+/);
  if (palavras.length <= 2) { return String(nome).trim(); }
  return palavras.slice(0, 2).join(' ') + ' ...';
}

function exportAtividadesXLSX() {
  var dados = window._raFiltradas || [];
  if (!dados.length) { toast('Nenhum dado para exportar', 'error'); return; }
  var tipo = window._raTipo || '';
  var linhas = [];
  if (tipo === 'ligacao') {
    linhas.push(['Data', 'Vendedor', 'Qtd', 'Horario', 'Telefone', 'Cliente', 'Obs']);
    dados.forEach(function (a) {
      linhas.push([a.data, getNome(a.vendedor), a.qtd || 0, a.horario || '', a.telefone || '', a.clienteNome || '', a.obs || '']);
    });
  } else {
    linhas.push(['Data', 'Vendedor', 'Tipo', 'Qtd', 'Obs']);
    dados.forEach(function (a) {
      linhas.push([a.data, getNome(a.vendedor), a.tipo || '', a.qtd || 0, a.obs || '']);
    });
  }
  var ws = XLSX.utils.aoa_to_sheet(linhas);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Atividades');
  XLSX.writeFile(wb, 'relatorio-atividades.xlsx');
  toast('Relatorio exportado em XLSX', 'success');
}

function exportAtividadesPDF() {
  var dados = window._raFiltradas || [];
  if (!dados.length) { toast('Nenhum dado para exportar', 'error'); return; }
  var tipo = window._raTipo || '';
  var html = '<h2>Relatorio de Atividades</h2>';
  if (tipo === 'ligacao') {
    html += '<table><tr><th>Data</th><th>Vendedor</th><th>Qtd</th><th>Horario</th><th>Telefone</th><th>Cliente</th><th>Obs</th></tr>';
    dados.forEach(function (a) {

// ===== VENDAS POR VENDEDOR =====

  var filtro = '<div class="card"><h3>Filtros</h3><div class="filtros">' +

    '<div class="fg" style="display:flex;align-items:flex-end"><button class="btn btn-p btn-s" onclick="analisaClientes()">Analisar</button>' +
    '<button class="btn btn-a btn-s" onclick="limparFiltroPeriodo(\'ac\')">Limpar</button></div></div></div>' +
    '<div class="card" style="border-left:4px solid var(--acc)"><h3>Como usar</h3><p style="font-size:.82rem;color:var(--txt2);margin-bottom:8px">Digite o <strong>codigo</strong> do cliente no campo acima. Para analisar <strong>varios clientes de uma vez</strong>, separe os codigos por <strong>virgula</strong> (ex: <code>001, 002, 003</code>).</p><p style="font-size:.82rem;color:var(--txt2)">Dica: se nao souber o codigo, consulte a aba <strong>Clientes</strong> para encontrar.</p></div>';
  return '<h2 class="st2">Analise de Clientes</h2>' + filtro + '<div id="ac-result"></div>';

function analisaClientes() {
  var input = document.getElementById('ac-cod').value.trim();
  if (!input) { toast('Digite o codigo do cliente', 'error'); return; }
  var cods = input.split(',').map(function (c) { return c.trim(); }).filter(function (c) { return c.length > 0; });
  if (!cods.length) { toast('Digite pelo menos um codigo valido', 'error'); return; }
  var p = document.getElementById('ac-periodo').value;
  var ini = document.getElementById('ac-ini') ? document.getElementById('ac-ini').value : '';
  var fim = document.getElementById('ac-fim') ? document.getElementById('ac-fim').value : '';
  var mes = document.getElementById('ac-mes') ? document.getElementById('ac-mes').value : '';
  var ano = document.getElementById('ac-ano') ? document.getElementById('ac-ano').value : '';
  var vendas = loadData('vendas');
  var html = '';
  var encontrados = 0;
  cods.forEach(function (cod) {
    var cliente = getClienteByCod(cod);
    if (!cliente) {
      html += '<div class="card" style="border-left:4px solid var(--err)"><h3>Cliente ' + cod + '</h3><div class="es"><div class="ic">SEM</div><p>Nenhum cliente encontrado com o codigo <strong>' + cod + '</strong>.</p></div></div>';
      return;
    }
    encontrados++;
    var vCli = vendas.filter(function (v) { var m = v.cliente.match(/COD\s+(\S+)/); return m && m[1] === cod; });
    vCli = vCli.filter(function (v) {
      if (p === 'anual' && ano) { var d = new Date(v.data); if (d.getFullYear() !== parseInt(ano)) { return false; } }
      if (p === 'mensal' && mes) { var d2 = new Date(v.data); var ym = d2.getFullYear() + '-' + String(d2.getMonth() + 1).padStart(2, '0'); if (ym !== mes) { return false; } }
      if ((p === 'semanal' || p === 'periodo') && ini && v.data < ini) { return false; }
      if ((p === 'semanal' || p === 'periodo') && fim && v.data > fim) { return false; }
      return true;
    });
    vCli.sort(function (a, b) { return a.data.localeCompare(b.data); });
    html += '<div class="card"><h3>' + cliente.razao + ' (COD ' + cod + ')</h3>';
    if (vCli.length === 0) {
      html += '<div class="es"><div class="ic">SEM</div><p>Nenhuma compra no periodo.</p></div></div>';
      return;
    }
    var totGeral = vCli.reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
    var qtdProd = vCli.reduce(function (s, v) { return s + (parseInt(v.qtdProdutos) || 0); }, 0);
    var mediaTicket = totGeral / vCli.length;
    var intervalos = [];
    for (var j = 1; j < vCli.length; j++) { var d1 = new Date(vCli[j - 1].data); var d2 = new Date(vCli[j].data); intervalos.push(Math.floor((d2.getTime() - d1.getTime()) / (1000 * 60 * 60 * 24))); }
    var intervaloMedio = intervalos.length ? Math.round(intervalos.reduce(function (s, x) { return s + x; }, 0) / intervalos.length) : 0;
    var produtosFreq = {};
    vCli.forEach(function (v) {
      if (v.itens) { v.itens.forEach(function (it) { var nome = it.nome || it.cod; if (!produtosFreq[nome]) { produtosFreq[nome] = { qtd: 0, vezes: 0 }; } produtosFreq[nome].qtd += parseInt(it.qtd) || 0; produtosFreq[nome].vezes++; }); }
    });
    var prodsOrdenados = Object.keys(produtosFreq).sort(function (a, b) { return produtosFreq[b].vezes - produtosFreq[a].vezes; });
    var dataPrevista = '--';
    if (intervaloMedio > 0 && vCli.length > 1) { var dUlt = new Date(vCli[vCli.length - 1].data); dUlt.setDate(dUlt.getDate() + intervaloMedio); dataPrevista = dUlt.toISOString().split('T')[0]; }
    html += '<div class="sg">' +
      '<div class="sc s"><div class="lb">Total Compras</div><div class="vl">' + vCli.length + '</div></div>' +
      '<div class="sc"><div class="lb">Faturamento</div><div class="vl">R$ ' + fmtBRL(totGeral) + '</div></div>' +
      '<div class="sc"><div class="lb">Ticket Medio</div><div class="vl">R$ ' + fmtBRL(mediaTicket) + '</div></div>' +
      '<div class="sc"><div class="lb">Produtos</div><div class="vl">' + qtdProd + '</div></div>' +
      '<div class="sc"><div class="lb">Intervalo Medio</div><div class="vl">' + intervaloMedio + ' dias</div></div></div>';
    html += '<table><thead><tr><th>Data</th><th>Itens</th><th>Qtd</th><th>Total</th></tr></thead><tbody>';
    vCli.forEach(function (v) { var itensStr = (v.itens && v.itens.length) ? v.itens.map(function (it) { return it.qtd + 'x ' + it.nome; }).join(', ') : '--'; html += '<tr><td>' + v.data + '</td><td style="font-size:.78rem">' + itensStr + '</td><td class="tcc">' + (v.qtdProdutos || 0) + '</td><td class="tcr">R$ ' + fmtBRL(v.total) + '</td></tr>'; });
    html += '</tbody></table>';
    html += '<div class="pred-card"><h4>Previsao do Proximo Pedido</h4><div class="pred-grid">' +
      '<div class="pred-item"><div class="pred-label">Data Estimada</div><div class="pred-value">' + dataPrevista + '</div></div>' +
      '<div class="pred-item"><div class="pred-label">Valor Estimado</div><div class="pred-value">R$ ' + fmtBRL(mediaTicket) + '</div></div>' +
      '<div class="pred-item"><div class="pred-label">Intervalo</div><div class="pred-value">' + intervaloMedio + ' dias</div></div></div></div>';
    html += '</div>';
  });
  if (encontrados === 0) {
    html = '<div class="card"><div class="es"><div class="ic">SEM</div><p>Nenhum cliente encontrado com os codigos informados.</p></div></div>';
  }
  var div = document.getElementById('ac-result');
  if (div) { div.innerHTML = html; }
}

// ===== METRICAS DE CLIENTES (foco comercial: sem CAC/LTV/Satisfacao) =====
var _mtDados = null; // guarda os dados calculados para exportacao

function renderMetricas() {
  var filtro = '<div class="card"><h3>Filtros</h3><div class="filtros">' + filtroPeriodoHTML('mt') +
    '<div class="fg" style="display:flex;align-items:flex-end"><button class="btn btn-a btn-s" onclick="limparFiltroPeriodo(\'mt\')">Limpar</button></div></div></div>';
  window['_filtro_mt'] = function (p, ini, fim, mes, ano) { renderMetricasConteudo(p, ini, fim, mes, ano); };
  setTimeout(function () { aplicarFiltroPeriodo('mt'); }, 50);
  return '<h2 class="st2">Metricas de Clientes</h2>' + filtro +
    '<div class="card" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><h3 style="margin:0;flex:1">Exportar</h3>' +
    '<button class="btn btn-a btn-s" onclick="exportMetricasCSV()">📄 Exportar CSV</button>' +
    '<button class="btn btn-p btn-s" onclick="exportMetricasPDF()">📑 Exportar PDF</button></div>' +
    '<div id="mt-result"></div>';
}

function initMetricas() { aplicarFiltroPeriodo('mt'); }

function renderMetricasConteudo(p, ini, fim, mes, ano) {
  var vendas = loadData('vendas');
  var clientes = loadData('clientes');
  var metas = loadData('metas');
  var vAtivos = getVendedores();
  var filtradas = vendas.filter(function (v) {
    if (p === 'anual' && ano) { var d = new Date(v.data); if (d.getFullYear() !== parseInt(ano)) { return false; } }
    if (p === 'mensal' && mes) { var d2 = new Date(v.data); var ym = d2.getFullYear() + '-' + String(d2.getMonth() + 1).padStart(2, '0'); if (ym !== mes) { return false; } }
    if ((p === 'semanal' || p === 'periodo') && ini && v.data < ini) { return false; }
    if ((p === 'semanal' || p === 'periodo') && fim && v.data > fim) { return false; }
    return true;
  });
  var html = '<div class="metrica-dica"><strong>Como ler esta tela:</strong> aqui voce ve a performance comercial em linguagem simples. Use os filtros de periodo acima para focar em um mes, um ano ou um intervalo especifico.</div>';
  // ===== 1. FATURAMENTO =====
  var totalVendas = filtradas.filter(function (v) { return (v.tipo || 'venda') === 'venda'; }).reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
  var totalBonif = filtradas.filter(function (v) { return v.tipo === 'bonificacao'; }).reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
  var totalClientes = clientes.length || 1;
  var ticketMedio = filtradas.length > 0 ? totalVendas / filtradas.length : 0;
  var clientesNovosPeriodo = clientes.filter(function (c) { return c.origem === 'manual'; }).length;
  html += '<div class="metrica-grupo"><div class="metrica-grupo-titulo">💰 1. Faturamento</div>' +
    '<div class="metrica-grupo-desc">Quanto a operacao vendeu no periodo e a composicao do resultado.</div>' +
    '<div class="sg">' +
    '<div class="sc s"><div class="lb">Total Vendido</div><div class="vl">R$ ' + fmtBRL(totalVendas) + '</div><div class="sb">Somente vendas (sem bonificacoes)</div></div>' +
    '<div class="sc w"><div class="lb">Bonificacoes</div><div class="vl">R$ ' + fmtBRL(totalBonif) + '</div><div class="sb">Valor distribuido em bonificacoes</div></div>' +
    '<div class="sc"><div class="lb">Ticket Medio</div><div class="vl">R$ ' + fmtBRL(ticketMedio) + '</div><div class="sb">Valor medio por venda</div></div>' +
    '<div class="sc"><div class="lb">Novos Clientes</div><div class="vl">' + clientesNovosPeriodo + '</div><div class="sb">Clientes cadastrados manualmente</div></div>' +
    '</div></div>';
  // ===== 2. RETENCAO E CHURN =====
  var clientesComCompra = {};
  filtradas.forEach(function (v) { var m = v.cliente.match(/COD\s+(\S+)/); if (m) { clientesComCompra[m[1]] = true; } });
  var ativos = Object.keys(clientesComCompra).length;
  var churn = totalClientes > 0 ? Math.max(0, (1 - (ativos / totalClientes)) * 100) : 0;
  var recompra = 0;
  var compradoresMultiplas = 0;
  var porCliente = {};
  filtradas.forEach(function (v) { var m = v.cliente.match(/COD\s+(\S+)/); if (m) { if (!porCliente[m[1]]) { porCliente[m[1]] = 0; } porCliente[m[1]]++; } });
  Object.keys(porCliente).forEach(function (c) { if (porCliente[c] > 1) { compradoresMultiplas++; } });
  recompra = ativos > 0 ? (compradoresMultiplas / ativos) * 100 : 0;
  html += '<div class="metrica-grupo"><div class="metrica-grupo-titulo">🛡️ 2. Clientes que Ficam</div>' +
    '<div class="metrica-grupo-desc">Quantos clientes continuam comprando e quantos pararam.</div>' +
    '<div class="sg">' +
    '<div class="sc ' + (churn < 20 ? 's' : (churn < 40 ? 'w' : 'd')) + '"><div class="lb">Churn (perda)</div><div class="vl">' + churn.toFixed(1) + '%</div><div class="sb">% de clientes que nao compraram no periodo</div></div>' +
    '<div class="sc s"><div class="lb">Retencao</div><div class="vl">' + (100 - churn).toFixed(1) + '%</div><div class="sb">% de clientes que continuam comprando</div></div>' +
    '<div class="sc"><div class="lb">Recompra</div><div class="vl">' + recompra.toFixed(1) + '%</div><div class="sb">% de clientes que compraram mais de 1x</div></div>' +
    '<div class="sc"><div class="lb">Clientes Ativos</div><div class="vl">' + ativos + '</div><div class="sb">Compraram no periodo</div></div>' +
    '</div></div>';
  // ===== 3. PERFORMANCE POR VENDEDOR (ranking + meta vs realizado) =====
  var perfVendedor = vAtivos.map(function (v) {
    var vV = filtradas.filter(function (x) { return x.vendedor === v.id && (x.tipo || 'venda') === 'venda'; });
    var tot = vV.reduce(function (s, x) { return s + (parseFloat(x.total) || 0); }, 0);
    var vM = metas.filter(function (m) { return m.vendedor === v.id; });
    var meta = vM.length ? (parseFloat(vM[vM.length - 1].valorVenda) || 0) : 0;
    var pct = meta > 0 ? Math.min(100, (tot / meta) * 100) : 0;
    return { id: v.id, nome: getNome(v.id), tot: tot, meta: meta, pct: pct };
  });
  perfVendedor.sort(function (a, b) { return b.tot - a.tot; });
  var perfRows = perfVendedor.map(function (v) {
    var pctCls = v.pct >= 80 ? 'hi' : (v.pct >= 50 ? 'mi' : 'lo');
    return '<tr><td>' + v.nome + '</td><td class="tcr">R$ ' + fmtBRL(v.tot) + '</td><td class="tcr">R$ ' + fmtBRL(v.meta) + '</td><td class="tcc">' + Math.round(v.pct) + '%</td><td><div class="pb"><div class="pf ' + pctCls + '" style="width:' + Math.max(2, v.pct) + '%"></div></div></td></tr>';
  }).join('');
  html += '<div class="metrica-grupo"><div class="metrica-grupo-titulo">📈 3. Performance por Vendedor</div>' +
    '<div class="metrica-grupo-desc">Ranking de faturamento e quanto cada vendedor esta batendo da meta.</div>' +
    '<table><thead><tr><th>Vendedor</th><th>Faturamento</th><th>Meta</th><th>% da Meta</th><th>Progresso</th></tr></thead><tbody>' + perfRows + '</tbody></table></div>';
  // ===== 4. RFM =====
  html += '<div class="metrica-grupo"><div class="metrica-grupo-titulo">🏆 4. Classificacao dos Clientes (RFM)</div>' +
    '<div class="metrica-grupo-desc">Agrupa os clientes por: quando compraram (Recencia), quantas vezes (Frequencia) e quanto gastaram (Valor).</div>';
  var hoje = new Date();
  var rfm = [];
  Object.keys(porCliente).forEach(function (cod) {
    var vCli = filtradas.filter(function (v) { var m = v.cliente.match(/COD\s+(\S+)/); return m && m[1] === cod; });
    vCli.sort(function (a, b) { return b.data.localeCompare(a.data); });
    var dUlt = new Date(vCli[0].data);
    var dias = Math.floor((hoje.getTime() - dUlt.getTime()) / (1000 * 60 * 60 * 24));
    var total = vCli.reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
    var freq = vCli.length;
    var classe = 'perdido';
    if (dias <= 30 && freq >= 3 && total >= 1000) { classe = 'campeao'; }
    else if (dias <= 60 && freq >= 2) { classe = 'leal'; }
    else if (dias <= 90 && freq >= 1) { classe = 'promissor'; }
    else if (dias <= 180) { classe = 'risco'; }
    var nome = getClienteByCod(cod);
    rfm.push({ cod: cod, nome: nome ? nome.razao : cod, dias: dias, freq: freq, total: total, classe: classe });
  });
  rfm.sort(function (a, b) { return b.total - a.total; });
  var rfmLabels = { campeao: 'Campeao', leal: 'Leal', promissor: 'Promissor', risco: 'Em Risco', perdido: 'Perdido' };
  if (rfm.length) {
    html += '<table><thead><tr><th>Cliente</th><th>Ultima Compra</th><th>Vezes</th><th>Total</th><th>Classificacao</th></tr></thead><tbody>';
    rfm.forEach(function (r) {
      html += '<tr><td>' + r.nome + '</td><td>' + r.dias + ' dias atras</td><td class="tcc">' + r.freq + '</td><td class="tcr">R$ ' + fmtBRL(r.total) + '</td><td><span class="rfm-badge ' + r.classe + '">' + rfmLabels[r.classe] + '</span></td></tr>';
    });
    html += '</tbody></table>';
  } else {
    html += '<div class="es"><div class="ic">SEM</div><p>Sem dados no periodo.</p></div>';
  }
  html += '</div>';
  // ===== 5. DISTRIBUICAO POR NIVEL =====
  var nivelCount = { ouro: 0, prata: 0, bronze: 0, sem: 0 };
  var nivelFaturamento = { ouro: 0, prata: 0, bronze: 0, sem: 0 };
  clientes.forEach(function (c) {
    var nv = c.nivel || 'sem';
    if (!nivelCount[nv]) { nivelCount[nv] = 0; }
    nivelCount[nv]++;
  });
  filtradas.forEach(function (v) {
    var m = v.cliente.match(/COD\s+(\S+)/);
    if (m) {
      var cli = getClienteByCod(m[1]);
      var nv = cli ? (cli.nivel || 'sem') : 'sem';
      if (!nivelFaturamento[nv]) { nivelFaturamento[nv] = 0; }
      nivelFaturamento[nv] += parseFloat(v.total) || 0;
    }
  });
  var nivelLabels = { ouro: 'Ouro', prata: 'Prata', bronze: 'Bronze', sem: 'Sem Nivel' };
  html += '<div class="metrica-grupo"><div class="metrica-grupo-titulo">🥇 5. Distribuicao por Nivel</div>' +
    '<div class="metrica-grupo-desc">Quantos clientes em cada nivel e quanto cada nivel fatura.</div>' +
    '<table><thead><tr><th>Nivel</th><th>Clientes</th><th>% da Base</th><th>Faturamento</th></tr></thead><tbody>';
  ['ouro', 'prata', 'bronze', 'sem'].forEach(function (nv) {
    var pctBase = totalClientes > 0 ? (nivelCount[nv] / totalClientes) * 100 : 0;
    html += '<tr><td><span class="nivel-badge ' + nv + '">' + nivelLabels[nv] + '</span></td><td class="tcc">' + nivelCount[nv] + '</td><td class="tcc">' + pctBase.toFixed(1) + '%</td><td class="tcr">R$ ' + fmtBRL(nivelFaturamento[nv]) + '</td></tr>';
  });
  html += '</tbody></table></div>';
  // ===== 6. CLIENTES EM RISCO =====
  var emRisco = rfm.filter(function (r) { return r.classe === 'risco' || r.classe === 'perdido'; });
  var totalRisco = emRisco.reduce(function (s, r) { return s + r.total; }, 0);
  html += '<div class="metrica-grupo"><div class="metrica-grupo-titulo">⚠️ 6. Clientes em Risco</div>' +
    '<div class="metrica-grupo-desc">Clientes que pararam de comprar ou estao prestes a parar. Priorize o contato com eles.</div>' +
    '<div class="sg">' +
    '<div class="sc d"><div class="lb">Em Risco / Perdidos</div><div class="vl">' + emRisco.length + '</div><div class="sb">Clientes que precisam de atencao</div></div>' +
    '<div class="sc w"><div class="lb">Faturamento em Risco</div><div class="vl">R$ ' + fmtBRL(totalRisco) + '</div><div class="sb">Valor que pode ser perdido</div></div>' +
    '</div>';
  if (emRisco.length) {
    html += '<table><thead><tr><th>Cliente</th><th>Ultima Compra</th><th>Vezes</th><th>Total</th><th>Classificacao</th></tr></thead><tbody>';
    emRisco.forEach(function (r) {
      html += '<tr><td>' + r.nome + '</td><td>' + r.dias + ' dias atras</td><td class="tcc">' + r.freq + '</td><td class="tcr">R$ ' + fmtBRL(r.total) + '</td><td><span class="rfm-badge ' + r.classe + '">' + rfmLabels[r.classe] + '</span></td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  // ===== 7. PARETO 80/20 =====
  var pareto = rfm.slice().sort(function (a, b) { return b.total - a.total; });
  var receitaTotal = pareto.reduce(function (s, r) { return s + r.total; }, 0);
  var acumulado = 0;
  var qtd80 = 0;
  for (var i = 0; i < pareto.length; i++) {
    acumulado += pareto[i].total;
    qtd80++;
    if (receitaTotal > 0 && (acumulado / receitaTotal) >= 0.8) { break; }
  }
  var pctClientes80 = pareto.length > 0 ? (qtd80 / pareto.length) * 100 : 0;
  var pctReceita80 = receitaTotal > 0 ? (acumulado / receitaTotal) * 100 : 0;
  html += '<div class="metrica-grupo"><div class="metrica-grupo-titulo">📊 7. Concentracao de Receita (Pareto 80/20)</div>' +
    '<div class="metrica-grupo-desc">Quantos clientes geram a maior parte do faturamento. Use para priorizar quem cuidar.</div>' +
    '<div class="sg">' +
    '<div class="sc s"><div class="lb">Clientes que geram 80%</div><div class="vl">' + qtd80 + '</div><div class="sb">' + pctClientes80.toFixed(1) + '% da base</div></div>' +
    '<div class="sc"><div class="lb">Receita desses clientes</div><div class="vl">' + pctReceita80.toFixed(1) + '%</div><div class="sb">Do total faturado no periodo</div></div>' +
    '<div class="sc"><div class="lb">Faturamento Total</div><div class="vl">R$ ' + fmtBRL(receitaTotal) + '</div><div class="sb">Somente clientes com compra</div></div>' +
    '</div></div>';
  // ===== 8. PRODUTOS E INATIVIDADE =====
  var prodCount = {};
  var prodReceita = {};
  filtradas.forEach(function (v) {
    if (v.itens) {
      v.itens.forEach(function (it) {
        var nome = it.nome || it.cod;
        if (!prodCount[nome]) { prodCount[nome] = 0; prodReceita[nome] = 0; }
        prodCount[nome] += parseInt(it.qtd) || 0;
        prodReceita[nome] += (parseFloat(it.preco) || 0) * (parseInt(it.qtd) || 0);
      });
    }
  });
  var topProds = Object.keys(prodCount).sort(function (a, b) { return prodReceita[b] - prodReceita[a]; }).slice(0, 10);
  var inativos90 = clientes.filter(function (c) {
    var ult = getUltimaCompraCliente(c.cod);
    if (!ult) { return false; }
    var dUlt = new Date(ult);
    var diff = Math.floor((hoje.getTime() - dUlt.getTime()) / (1000 * 60 * 60 * 24));
    return diff > 90;
  });
  var freqMedia = ativos > 0 ? (filtradas.length / ativos) : 0;
  html += '<div class="metrica-grupo"><div class="metrica-grupo-titulo">📦 8. Produtos e Inatividade</div>' +
    '<div class="metrica-grupo-desc">Quais produtos mais vendem e quais clientes pararam de comprar ha mais de 90 dias.</div>' +
    '<div class="sg">' +
    '<div class="sc"><div class="lb">Frequencia Media</div><div class="vl">' + freqMedia.toFixed(1) + 'x</div><div class="sb">Compras por cliente ativo no periodo</div></div>' +
    '<div class="sc d"><div class="lb">Inativos 90+ dias</div><div class="vl">' + inativos90.length + '</div><div class="sb">Clientes que pararam de comprar</div></div>' +
    '</div>';
  if (topProds.length) {
    html += '<table><thead><tr><th>Produto</th><th>Qtd Vendida</th><th>Faturamento</th></tr></thead><tbody>';
    topProds.forEach(function (p) {
      html += '<tr><td>' + p + '</td><td class="tcc">' + prodCount[p] + '</td><td class="tcr">R$ ' + fmtBRL(prodReceita[p]) + '</td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  var div = document.getElementById('mt-result');
  if (div) { div.innerHTML = html; }
  // Guarda os dados para exportacao
  _mtDados = {
    periodo: p, ini: ini, fim: fim, mes: mes, ano: ano,
    totalVendas: totalVendas, totalBonif: totalBonif, ticketMedio: ticketMedio, clientesNovosPeriodo: clientesNovosPeriodo,
    ativos: ativos, churn: churn, recompra: recompra, totalRegistros: filtradas.length,
    perfVendedor: perfVendedor,
    rfm: rfm, rfmLabels: rfmLabels,
    nivelCount: nivelCount, nivelFaturamento: nivelFaturamento, nivelLabels: nivelLabels,
    emRisco: emRisco, totalRisco: totalRisco,
    qtd80: qtd80, pctClientes80: pctClientes80, pctReceita80: pctReceita80, receitaTotal: receitaTotal,
    topProds: topProds, prodCount: prodCount, prodReceita: prodReceita, inativos90: inativos90.length, freqMedia: freqMedia
  };
}

// ===== EXPORTACAO DAS METRICAS =====
function exportMetricasCSV() {
  if (!_mtDados) { toast('Calcule as metricas primeiro (abra a aba Metricas)', 'error'); return; }
  var d = _mtDados;
  var linhas = [];
  linhas.push(['Metrica', 'Valor']);
  linhas.push(['Total Vendido', 'R$ ' + fmtBRL(d.totalVendas)]);
  linhas.push(['Bonificacoes', 'R$ ' + fmtBRL(d.totalBonif)]);
  linhas.push(['Ticket Medio', 'R$ ' + fmtBRL(d.ticketMedio)]);
  linhas.push(['Novos Clientes', d.clientesNovosPeriodo]);
  linhas.push(['Churn (perda)', d.churn.toFixed(1) + '%']);
  linhas.push(['Retencao', (100 - d.churn).toFixed(1) + '%']);
  linhas.push(['Recompra', d.recompra.toFixed(1) + '%']);
  linhas.push(['Clientes Ativos', d.ativos]);
  linhas.push(['Frequencia Media', d.freqMedia.toFixed(1) + 'x']);
  linhas.push(['Inativos 90+ dias', d.inativos90]);
  linhas.push([]);
  linhas.push(['Performance por Vendedor', 'Faturamento', 'Meta', '% da Meta']);
  d.perfVendedor.forEach(function (v) {
    linhas.push([v.nome, 'R$ ' + fmtBRL(v.tot), 'R$ ' + fmtBRL(v.meta), Math.round(v.pct) + '%']);
  });
  linhas.push([]);
  linhas.push(['Distribuicao por Nivel', 'Clientes', 'Faturamento']);
  ['ouro', 'prata', 'bronze', 'sem'].forEach(function (nv) {
    linhas.push([d.nivelLabels[nv], d.nivelCount[nv], 'R$ ' + fmtBRL(d.nivelFaturamento[nv])]);
  });
  linhas.push([]);
  linhas.push(['Clientes em Risco', 'Ultima Compra', 'Vezes', 'Total', 'Classificacao']);
  d.emRisco.forEach(function (r) {
    linhas.push([r.nome, r.dias + ' dias atras', r.freq, 'R$ ' + fmtBRL(r.total), d.rfmLabels[r.classe]]);
  });
  linhas.push([]);
  linhas.push(['Pareto 80/20', 'Valor']);
  linhas.push(['Clientes que geram 80%', d.qtd80 + ' (' + d.pctClientes80.toFixed(1) + '% da base)']);
  linhas.push(['Receita desses clientes', d.pctReceita80.toFixed(1) + '%']);
  linhas.push(['Faturamento Total', 'R$ ' + fmtBRL(d.receitaTotal)]);
  linhas.push([]);
  linhas.push(['Top Produtos', 'Qtd', 'Faturamento']);
  d.topProds.forEach(function (p) {
    linhas.push([p, d.prodCount[p], 'R$ ' + fmtBRL(d.prodReceita[p])]);
  });
  linhas.push([]);
  linhas.push(['RFM - Cliente', 'Ultima Compra', 'Vezes', 'Total', 'Classificacao']);
  d.rfm.forEach(function (r) {
    linhas.push([r.nome, r.dias + ' dias atras', r.freq, 'R$ ' + fmtBRL(r.total), d.rfmLabels[r.classe]]);
  });
  var csv = linhas.map(function (l) { return l.map(function (c) { return String(c).replace(/;/g, ','); }).join(';'); }).join('\n');
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'metricas-clientes.csv';
  a.click();
  toast('Metricas exportadas em CSV', 'success');
}

function exportMetricasPDF() {
  if (!_mtDados) { toast('Calcule as metricas primeiro (abra a aba Metricas)', 'error'); return; }
  var d = _mtDados;

function renderComissao(isGerente) {
  var vAtivos = getVendedores();
  var vendOpts = vAtivos.map(function (v) { return '<option value="' + v.id + '">' + getNome(v.id) + '</option>'; }).join('');

    '<div class="card"><h3>Calcular Comissao</h3><div class="fr"><div class="fg"><label>Vendedor</label><select id="cm-vend" onchange="renderCompContent(document.getElementById(\'cm-vend\').value)">' + (isGerente ? vendOpts : '<option value="' + currentUser.id + '">' + getNome(currentUser.id) + '</option>') + '</select></div></div><div id="cm-result"></div></div>';
}

function renderCompContent(vid) {
  var vendas = loadData('vendas').filter(function (v) { return v.tipo !== 'bonificacao'; });
  var vV = vendas.filter(function (v) { return v.vendedor === vid; });
  var total = vV.reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
  var nivel = getNivel(vid);
  var faixas = COM[nivel] || COM['Junior'];
  var taxa = faixas[faixas.length - 1].taxa;
  for (var i = 0; i < faixas.length; i++) { if (total >= faixas[i].min && total <= faixas[i].max) { taxa = faixas[i].taxa; break; } }
  var faixaHtml = '<table class="com-faixa-table"><thead><tr><th>Faixa de Vendas</th><th>Taxa (por R$ 1.000)</th></tr></thead><tbody>';
  faixas.forEach(function (f) {
    var ativa = (total >= f.min && total <= f.max);
    faixaHtml += '<tr' + (ativa ? ' class="ativa"' : '') + '><td>' + (f.max >= 999999999 ? 'Acima de R$ ' + fmtBRL(f.min) : 'R$ ' + fmtBRL(f.min) + ' ate R$ ' + fmtBRL(f.max)) + '</td><td style="text-align:center">' + f.taxa.toFixed(2) + '</td></tr>';
  });
  faixaHtml += '</tbody></table>';
  var comissaoBase = (total / 1000) * taxa;
  var html = '<div class="com-hero"><div><div class="com-name">' + getNome(vid) + '</div><div class="com-nivel">' + nivel + '</div></div><div style="text-align:right"><div class="com-total-label">Total Vendido</div><div class="com-total">R$ ' + fmtBRL(total) + '</div></div></div>';
  html += '<div class="com-stats">' +
    '<div class="com-stat"><div class="com-stat-label">Taxa Base</div><div class="com-stat-value" id="cm-taxa-base">' + taxa.toFixed(2) + '</div></div>' +
    '<div class="com-stat"><div class="com-stat-label">Acelerador</div><div class="com-stat-value" id="cm-accel-val">+0.00</div><div class="com-stat-sub" id="cm-weeks-val">0/4 semanas</div></div>' +
    '<div class="com-stat"><div class="com-stat-label">Taxa Final</div><div class="com-stat-value" id="cm-taxa-final">' + taxa.toFixed(2) + '</div></div>' +
    '<div class="com-stat highlight"><div class="com-stat-label">Comissao</div><div class="com-stat-value" id="cm-comissao-val">R$ ' + fmtBRL(comissaoBase) + '</div></div></div>';
  html += '<div class="card"><h3>Faixas de Comissao - ' + nivel + '</h3>' + faixaHtml + '</div>';
  html += '<div class="com-accel"><div class="com-accel-title">Acelerador por Positivacao</div>' +
    '<div class="com-accel-desc">+0.05 por semana de meta de positivacao atingida (maximo +0.20 com as 4 semanas). Valor adicionado a taxa base. Cliente contabilizado apenas uma vez no mes. Valido apenas para pedidos aprovados.</div>' +
    '<div class="com-week-grid">';
  for (var s = 1; s <= 4; s++) { html += '<div class="com-week" id="cm-week-' + s + '" onclick="toggleWeek(' + s + ',\'' + vid + '\')"><div class="com-week-num">Semana ' + s + '</div><div class="com-week-icon">&#9744;</div><div class="com-week-bonus">+0.05</div></div>'; }
  html += '</div><button class="btn btn-p btn-f" onclick="calcComissaoFinal(\'' + vid + '\')" style="margin-top:16px">Calcular Comissao</button><div id="cm-resultado" style="margin-top:16px"></div></div>';
  var div = document.getElementById('cm-result');
  if (div) { div.innerHTML = html; }
}

function toggleWeek(s, vid) {
  var w = document.getElementById('cm-week-' + s);
  if (!w) { return; }
  w.classList.toggle('checked');
  w.querySelector('.com-week-icon').innerHTML = w.classList.contains('checked') ? '&#9745;' : '&#9744;';
  updateComStats(vid);
}

function updateComStats(vid) {
  var vendas = loadData('vendas').filter(function (v) { return v.tipo !== 'bonificacao'; });
  var vV = vendas.filter(function (v) { return v.vendedor === vid; });
  var total = vV.reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
  var nivel = getNivel(vid);
  var faixas = COM[nivel] || COM['Junior'];
  var taxa = faixas[faixas.length - 1].taxa;
  for (var i = 0; i < faixas.length; i++) { if (total >= faixas[i].min && total <= faixas[i].max) { taxa = faixas[i].taxa; break; } }
  var semanasBatidas = 0;
  for (var s = 1; s <= 4; s++) { var w = document.getElementById('cm-week-' + s); if (w && w.classList.contains('checked')) { semanasBatidas++; } }
  var acelerador = semanasBatidas * ACELERADOR_POR_SEMANA;
  var taxaFinal = taxa + acelerador;
  var comissao = (total / 1000) * taxaFinal;
  var av = document.getElementById('cm-accel-val'); if (av) { av.textContent = '+' + acelerador.toFixed(2); }
  var wv = document.getElementById('cm-weeks-val'); if (wv) { wv.textContent = semanasBatidas + '/4 semanas'; }
  var tf = document.getElementById('cm-taxa-final'); if (tf) { tf.textContent = taxaFinal.toFixed(2); }
  var cv = document.getElementById('cm-comissao-val'); if (cv) { cv.textContent = 'R$ ' + fmtBRL(comissao); }
}

function calcComissaoFinal(vid) {
  var vendas = loadData('vendas').filter(function (v) { return v.tipo !== 'bonificacao'; });
  var vV = vendas.filter(function (v) { return v.vendedor === vid; });
  var total = vV.reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
  var nivel = getNivel(vid);
  var faixas = COM[nivel] || COM['Junior'];
  var taxa = faixas[faixas.length - 1].taxa;
  for (var i = 0; i < faixas.length; i++) { if (total >= faixas[i].min && total <= faixas[i].max) { taxa = faixas[i].taxa; break; } }
  var semanasBatidas = 0;
  for (var s = 1; s <= 4; s++) { var w = document.getElementById('cm-week-' + s); if (w && w.classList.contains('checked')) { semanasBatidas++; } }
  var acelerador = semanasBatidas * ACELERADOR_POR_SEMANA;
  var taxaFinal = taxa + acelerador;
  var comissao = (total / 1000) * taxaFinal;
  var html = '<div class="com-result"><div class="com-result-label">Comissao Calculada</div><div class="com-result-value">R$ ' + fmtBRL(comissao) + '</div><div class="com-result-detail">Taxa base: ' + taxa.toFixed(2) + ' | Acelerador: +' + acelerador.toFixed(2) + ' | Taxa final: ' + taxaFinal.toFixed(2) + '</div><div class="com-result-badge">' + semanasBatidas + ' de 4 semanas batidas</div></div>';
  var div = document.getElementById('cm-resultado');
  if (div) { div.innerHTML = html; }
}

// ===== RELATORIOS GERAIS =====
function renderRelatorios() {
  var mesOpts = MESES.map(function (m, i) { return '<option value="' + (i + 1) + '">' + m + '</option>'; }).join('');
  var anoAtual = new Date().getFullYear();
  var filtro = '<div class="card"><h3>Filtros do Relatorio</h3><div class="filtros">' +
    '<div class="fg"><label>Tipo de Registro</label><select id="rel-tipo" onchange="aplicarFiltroPeriodo(\'rel\')"><option value="todos">Todos</option><option value="venda">Somente Vendas</option><option value="bonificacao">Somente Bonificacoes</option><option value="ambos">Vendas + Bonificacoes</option></select></div>' +
    filtroPeriodoHTML('rel') +
    '<div class="fg" style="display:flex;align-items:flex-end"><button class="btn btn-a btn-s" onclick="limparFiltroPeriodo(\'rel\')">Limpar</button></div></div></div>';
  window['_filtro_rel'] = function (p, ini, fim, mes, ano) {
    var vendas = loadData('vendas');
    var tipo = document.getElementById('rel-tipo').value;
    var filtradas = vendas.filter(function (v) {
      var vt = v.tipo || 'venda';
      if (tipo === 'venda' && vt !== 'venda') { return false; }
      if (tipo === 'bonificacao' && vt !== 'bonificacao') { return false; }
      if (tipo === 'ambos' && vt !== 'venda' && vt !== 'bonificacao') { return false; }
      if (p === 'anual' && ano) { var d = new Date(v.data); if (d.getFullYear() !== parseInt(ano)) { return false; } }
      if (p === 'mensal' && mes) { var d2 = new Date(v.data); var ym = d2.getFullYear() + '-' + String(d2.getMonth() + 1).padStart(2, '0'); if (ym !== mes) { return false; } }
      if ((p === 'semanal' || p === 'periodo') && ini && v.data < ini) { return false; }
      if ((p === 'semanal' || p === 'periodo') && fim && v.data > fim) { return false; }
      return true;
    });
    var totVendas = filtradas.filter(function (v) { return (v.tipo || 'venda') === 'venda'; }).reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
    var totBonif = filtradas.filter(function (v) { return v.tipo === 'bonificacao'; }).reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
    var totGeral = totVendas + totBonif;
    var resumo = document.getElementById('rel-resumo');
    if (resumo) {
      resumo.innerHTML = '<div class="sg">' +
        '<div class="sc s"><div class="lb">Total Vendido</div><div class="vl">R$ ' + fmtBRL(totVendas) + '</div></div>' +
        '<div class="sc w"><div class="lb">Bonificacoes</div><div class="vl">R$ ' + fmtBRL(totBonif) + '</div></div>' +
        '<div class="sc"><div class="lb">Total Geral</div><div class="vl">R$ ' + fmtBRL(totGeral) + '</div></div>' +
        '<div class="sc"><div class="lb">Registros</div><div class="vl">' + filtradas.length + '</div></div></div>';
    }
    var tabelaDiv = document.getElementById('rel-tabela');
    if (!tabelaDiv) { return; }
    var html = '<table><thead><tr><th>Data</th><th>Cliente</th><th>Vendedor</th><th>Tipo</th><th>Qtd</th><th>Total</th></tr></thead><tbody>';
    filtradas.forEach(function (v) {
      var tipoV = v.tipo || 'venda';
      var tipoHtml = '<span class="tipo-badge ' + tipoV + '">' + tipoV + '</span>';
      html += '<tr><td>' + v.data + '</td><td>' + v.cliente + '</td><td>' + getNome(v.vendedor) + '</td><td class="tcc">' + tipoHtml + '</td><td class="tcc">' + (v.qtdProdutos || 0) + '</td><td class="tcr">R$ ' + fmtBRL(v.total) + '</td></tr>';
    });
    html += '</tbody></table>';
    tabelaDiv.innerHTML = html;
    window._relFiltradas = filtradas;
  };
  setTimeout(function () { aplicarFiltroPeriodo('rel'); }, 50);
  var totV = loadData('vendas').reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
  var totL = loadData('atividades').filter(function (a) { return a.tipo === 'ligacao'; }).reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);
  var totP = loadData('atividades').filter(function (a) { return a.tipo === 'prospeccao'; }).reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);
  return '<h2 class="st2">Relatorios Gerais</h2>' + filtro +
    '<div class="card"><h3>Resumo Geral</h3><div id="rel-resumo"><div class="sg">' +
    '<div class="sc s"><div class="lb">Faturamento Total</div><div class="vl">R$ ' + fmtBRL(totV) + '</div></div>' +
    '<div class="sc"><div class="lb">Vendas</div><div class="vl">' + loadData('vendas').length + '</div></div>' +
    '<div class="sc"><div class="lb">Clientes</div><div class="vl">' + loadData('clientes').length + '</div></div>' +
    '<div class="sc"><div class="lb">Ligacoes</div><div class="vl">' + totL + '</div></div>' +
    '<div class="sc"><div class="lb">Prospeccao</div><div class="vl">' + totP + '</div></div></div></div><div id="rel-tabela"></div></div>' +
    '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-a btn-s" onclick="exportarRelatorioCSV()">Exportar CSV</button><button class="btn btn-p btn-s" onclick="exportarRelatorioPDF()">Exportar PDF</button></div>';
}

// ===== MINHAS METAS (VENDEDOR) =====
function renderMinhas() {
  var metas = loadData('metas');
  var vendas = loadData('vendas');
  var atividades = loadData('atividades');
  var clientes = loadData('clientes');
  var vM = metas.filter(function (m) { return m.vendedor === currentUser.id; });
  var vV = vendas.filter(function (v) { return v.vendedor === currentUser.id && (v.tipo || 'venda') === 'venda'; });
  var vA = atividades.filter(function (a) { return a.vendedor === currentUser.id; });
  var m = vM[vM.length - 1] || {};
  var vTotV = vV.reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
  var vL = vA.filter(function (a) { return a.tipo === 'ligacao'; }).reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);
  var vP = vA.filter(function (a) { return a.tipo === 'prospeccao'; }).reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);
  var vPr = vV.reduce(function (s, v) { return s + (parseInt(v.qtdProdutos) || 0); }, 0);
  var vPos = vV.length;
  var vCN = clientes.filter(function (c) { return c.vendedorId === currentUser.id; }).length;
  var pV = m.valorVenda ? Math.min(100, (vTotV / m.valorVenda) * 100) : 0;
  var pL = m.ligacoes ? Math.min(100, (vL / m.ligacoes) * 100) : 0;
  var pP = m.prospeccao ? Math.min(100, (vP / m.prospeccao) * 100) : 0;
  var pPr = m.produtos ? Math.min(100, (vPr / m.produtos) * 100) : 0;
  var pPos = m.positivacao ? Math.min(100, (vPos / m.positivacao) * 100) : 0;
  var pCN = m.clientesNovos ? Math.min(100, (vCN / m.clientesNovos) * 100) : 0;
  return renderWeeklyBar() + renderProdutosDiscriminados() +
    '<h2 class="st2">Minhas Metas</h2><div class="card"><h3>Progresso Atual</h3>' +
    progressBar('Vendas (R$)', vTotV, m.valorVenda || 0, pV) +
    progressBar('Ligacoes', vL, m.ligacoes || 0, pL) +
    progressBar('Prospeccao', vP, m.prospeccao || 0, pP) +
    progressBar('Produtos', vPr, m.produtos || 0, pPr) +
    progressBar('Positivacao', vPos, m.positivacao || 0, pPos) +
    progressBar('Clientes Novos', vCN, m.clientesNovos || 0, pCN) + '</div>';
}

function setTipoLanc(tipo) {
  var bv = document.getElementById('tt-venda');
  var bb = document.getElementById('tt-bonif');
  if (!bv || !bb) { return; }
  if (tipo === 'venda') { bv.classList.add('act'); bb.classList.remove('act'); }
  else { bb.classList.add('act'); bv.classList.remove('act'); }
}

function getTipoLanc() {
  var bv = document.getElementById('tt-venda');
  if (bv && bv.classList.contains('act')) { return 'venda'; }
  return 'bonificacao';
}

function updateClienteInfo() {
  var cod = document.getElementById('vd-cli').value.trim();
  var c = getClienteByCod(cod);
  var div = document.getElementById('vd-cli-info');
  if (!div) { return; }
  if (!cod) { div.innerHTML = ''; return; }
  if (!c) { div.innerHTML = '<div class="client-info" style="border-left-color:var(--err)"><div class="ci-label">Cliente</div><div class="ci-value" style="color:var(--err)">Nao encontrado com o codigo: ' + cod + '</div></div>'; return; }
  var nivel = c.nivel || 'sem';
  var nivelHtml = '<span class="nivel-badge ' + nivel + '">' + (nivel === 'sem' ? 'Sem' : nivel.charAt(0).toUpperCase() + nivel.slice(1)) + '</span>';
  div.innerHTML = '<div class="client-info"><div style="display:flex;gap:20px;flex-wrap:wrap">' +
    '<div><div class="ci-label">Razao Social</div><div class="ci-value">' + c.razao + '</div></div>' +
    '<div><div class="ci-label">Cidade</div><div class="ci-value">' + (c.cidade || '--') + '</div></div>' +
    '<div><div class="ci-label">Estado</div><div class="ci-value">' + (c.estado || '--') + '</div></div>' +
    '<div><div class="ci-label">Segmento</div><div class="ci-value">' + (c.segmento || '--') + '</div></div>' +
    '<div><div class="ci-label">Nivel</div><div class="ci-value">' + nivelHtml + '</div></div>' +
    '<div><div class="ci-label">Vendedor</div><div class="ci-value">' + getNome(c.vendedorId || currentUser.id) + '</div></div></div></div>';
}

function addVendaItem() {
  var div = document.createElement('div');
  div.className = 'pe';
  var prodOpts = PROD.map(function (p) { return '<option value="' + p.cod + '">' + p.cod + ' - ' + p.nome + '</option>'; }).join('');
  div.innerHTML = '<select class="pe-prod" onchange="calcVendaTotal()">' + prodOpts + '</select>' +
    '<input type="number" class="pe-qtd" placeholder="Qtd" value="1" oninput="calcVendaTotal()" min="1">' +
    '<input type="text" class="pe-preco" placeholder="Preco" readonly>' +
    '<button class="rb" onclick="this.parentElement.remove();calcVendaTotal()">x</button>';
  document.getElementById('vd-itens').appendChild(div);
  calcVendaTotal();
}

function calcVendaTotal() {
  var total = 0;
  document.querySelectorAll('.pe').forEach(function (row) {
    var cod = row.querySelector('.pe-prod').value;
    var qtd = parseInt(row.querySelector('.pe-qtd').value) || 0;
    var prod = PROD.find(function (p) { return p.cod === cod; });
    if (prod) { var preco = prod.preco * qtd; total += preco; row.querySelector('.pe-preco').value = 'R$ ' + fmtBRL(preco); }
  });
  var div = document.getElementById('vd-total');
  if (div) { div.textContent = 'Total: R$ ' + fmtBRL(total); }
}

function saveVenda() {
  var data = document.getElementById('vd-data').value;
  var cod = document.getElementById('vd-cli').value.trim();
  var cliente = getClienteByCod(cod);
  var tipo = getTipoLanc();
  var itens = [];
  var total = 0;
  var qtdProdutos = 0;
  document.querySelectorAll('.pe').forEach(function (row) {
    var codProd = row.querySelector('.pe-prod').value;
    var qtd = parseInt(row.querySelector('.pe-qtd').value) || 0;
    var prod = PROD.find(function (p) { return p.cod === codProd; });
    if (prod && qtd > 0) { itens.push({ cod: codProd, nome: prod.nome, qtd: qtd, preco: prod.preco }); total += prod.preco * qtd; qtdProdutos += qtd; }
  });
  if (itens.length === 0) { toast('Adicione pelo menos um item', 'error'); return; }
  var nomeCli = cliente ? cliente.razao : 'COD ' + cod;
  var estado = cliente ? cliente.estado : '--';
  var segmento = cliente ? cliente.segmento : 'Outros';
  var venda = { data: data, cliente: nomeCli + ' (COD ' + cod + ' / ' + estado + ')', vendedor: currentUser.id, itens: itens, qtdProdutos: qtdProdutos, total: total, estado: estado, segmento: segmento, tipo: tipo, editadoPor: getNome(currentUser.id), editadoEm: new Date().toISOString() };
  saveData('vendas', venda);
  toast((tipo === 'venda' ? 'Venda' : 'Bonificacao') + ' salva por ' + getNome(currentUser.id) + ': R$ ' + fmtBRL(total), 'success');
  renderTab('venda');
}

// ===== ATIVIDADES (VENDEDOR) — com Telefone/Nome/Horario para Ligacao =====
function renderAtividades() {
  var atividades = loadData('atividades');
  var tipoOpts = '<option value="ligacao">Ligacao</option><option value="prospeccao">Prospeccao</option><option value="visita">Visita</option><option value="email">E-mail</option>';
  var minhas = atividades.filter(function (a) { return a.vendedor === currentUser.id; });
  var tabela = minhas.length
    ? '<table><thead><tr><th>Data</th><th>Tipo</th><th>Qtd</th><th>Telefone</th><th>Cliente</th><th>Horario</th><th>Obs</th><th>Acoes</th></tr></thead><tbody>' +
      minhas.map(function (a) { var idx = atividades.indexOf(a); return '<tr><td>' + a.data + '</td><td>' + a.tipo + '</td><td class="tcc">' + a.qtd + '</td><td>' + (a.telefone || '--') + '</td><td>' + (a.clienteNome || '--') + '</td><td>' + (a.horario || '--') + '</td><td>' + (a.obs || '') + '</td><td><button class="del-btn" onclick="delAtividade(' + idx + ')">Excluir</button></td></tr>'; }).join('') + '</tbody></table>'
    : '<div class="es"><div class="ic">SEM</div><p>Nenhuma atividade.</p></div>';
  return '<h2 class="st2">Atividades</h2>' +
    '<div class="card"><h3>Registrar Atividade</h3><div class="fr">' +
    '<div class="fg"><label>Data</label><input type="date" id="at-data" value="' + new Date().toISOString().split('T')[0] + '"></div>' +
    '<div class="fg"><label>Tipo</label><select id="at-tipo" onchange="toggleCamposLigacao()">' + tipoOpts + '</select></div>' +
    '<div class="fg"><label>Quantidade</label><input type="number" id="at-qtd" value="1" min="1"></div></div>' +
    '<div id="at-ligacao-campos" style="display:none"><div class="fr">' +
    '<div class="fg"><label>Telefone</label><input type="text" id="at-telefone" placeholder="(00) 00000-0000" oninput="maskTelefone(this)" maxlength="15"></div>' +
    '<div class="fg"><label>Nome do Cliente</label><input type="text" id="at-cliente" placeholder="Nome do cliente"></div>' +
    '<div class="fg"><label>Horario</label><input type="time" id="at-horario"></div>' +
    '</div></div>' +
    '<div class="fg"><label>Observacao</label><textarea id="at-obs" rows="2" placeholder="Opcional"></textarea></div>' +
    '<button class="btn btn-p" onclick="saveAtividade()">Salvar Atividade</button></div>' +
    '<div class="card"><h3>Minhas Atividades</h3>' + tabela + '</div>';
}

function toggleCamposLigacao() {
  var tipo = document.getElementById('at-tipo').value;
  var div = document.getElementById('at-ligacao-campos');
  if (div) { div.style.display = (tipo === 'ligacao') ? 'block' : 'none'; }
}

function saveAtividade() {
  var data = document.getElementById('at-data').value;
  var tipo = document.getElementById('at-tipo').value;
  var qtd = parseInt(document.getElementById('at-qtd').value) || 0;
  var obs = document.getElementById('at-obs').value.trim();
  if (!data || !tipo) { toast('Preencha data e tipo', 'error'); return; }
  var atividade = { data: data, tipo: tipo, qtd: qtd, obs: obs, vendedor: currentUser.id, editadoPor: getNome(currentUser.id), editadoEm: new Date().toISOString() };
  if (tipo === 'ligacao') {
    atividade.telefone = document.getElementById('at-telefone').value.trim();
    atividade.clienteNome = document.getElementById('at-cliente').value.trim();
    atividade.horario = document.getElementById('at-horario').value;
  }
  saveData('atividades', atividade);
  toast('Atividade salva por ' + getNome(currentUser.id), 'success');
  renderTab('atividades');
}

function delAtividade(i) {
  if (!confirm('Excluir esta atividade?')) { return; }
  var atividades = loadData('atividades');
  var a = atividades[i];
  if (a && a._id) { deleteDoc('atividades', a._id); toast('Atividade excluida', 'success'); renderTab('atividades'); }
}

// ===== INICIALIZACAO =====
(function () {
  initDarkMode();
  carregarDeletados();
  initListener('usuarios');
  var saved = localStorage.getItem('mc_user');
  if (!saved) { return; }
  try {
    var savedObj = JSON.parse(saved);
    var user = USU.find(function (u) { return u.id === savedObj.id; });
    if (!user) { localStorage.removeItem('mc_user'); return; }
    currentUser = user;
    document.getElementById('ls').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    var b = document.getElementById('ub');
    b.textContent = getNome(user.id) + ' - ' + getNivel(user.id);
    b.className = 'badge' + (user.isM ? ' mg' : '');
    initTabs();
    ['vendas', 'clientes', 'metas', 'atividades', 'usuarios'].forEach(function (k) { initListener(k); });
    syncUsuarios();
  } catch (e) { localStorage.removeItem('mc_user'); }
})();
</script>
</body>
</html>
