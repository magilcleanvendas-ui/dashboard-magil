<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magil Clean — Gestao Comercial</title> <link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
:root {
  --bg: #F5F5F7;
  --card: #FFFFFF;
  --txt: #1D1D1F;
  --txt2: #6E6E73;
  --txt3: #86868B;
  --acc: #0071E3;
  --acc2: #0077ED;
  --acc-soft: #EAF3FF;
  --ok: #34C759;
  --warn: #FF9F0A;
  --err: #FF3B30;
  --brd: rgba(0,0,0,.08);
  --row: rgba(0,0,0,.05);
  --r: 14px;
  --s: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --sb: #1D1D1F;
  --sb2: #2C2C2E;
  --sb3: #3A3A3C;
  --font: -apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif;
}
html, body {
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body {
  background: var(--bg);
  color: var(--txt);
  font-size: 14.5px;
  line-height: 1.55;
  letter-spacing: -.01em;
}
.num {
  font-variant-numeric: tabular-nums;
}
#ls, #cs {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: linear-gradient(180deg, #FBFBFD, #F5F5F7);
}
.lc {
  background: var(--card);
  border: 1px solid var(--brd);
  border-radius: 20px;
  padding: 48px 40px;
  box-shadow: var(--s);
  width: 400px;
  max-width: 92%;
}
.lc .logo {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: var(--acc);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  margin: 0 auto 22px;
  box-shadow: 0 8px 24px rgba(0,113,227,.35);
  overflow: hidden;
}
.lc h1 {
  font-size: 1.45rem;
  font-weight: 700;
  text-align: center;
  letter-spacing: -.02em;
  color: var(--txt);
}
.lc p {
  text-align: center;
  color: var(--txt2);
  font-size: .88rem;
  margin: 6px 0 28px;
}
.lc label {
  display: block;
  font-size: .75rem;
  font-weight: 600;
  color: var(--txt2);
  margin-bottom: 6px;
  padding-left: 2px;
}
.lc input {
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 16px;
  border: 1px solid var(--brd);
  border-radius: 12px;
  font-size: .95rem;
  outline: none;
  background: var(--card);
  color: var(--txt);
  transition: .2s;
}
.lc input:focus {
  border-color: var(--acc);
  box-shadow: 0 0 0 4px rgba(0,113,227,.12);
}
.lc button {
  width: 100%;
  padding: 14px;
  background: var(--acc);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: .95rem;
  font-weight: 600;
  cursor: pointer;
  transition: .2s;
}
.lc button:hover {
  background: var(--acc2);
  opacity: .92;
}
.lc .hint {
  text-align: center;
  font-size: .72rem;
  color: var(--txt3);
  margin-top: 14px;
  line-height: 1.6;
}
.cust-select {
  position: relative;
  margin-bottom: 16px;
}
.cust-select-trigger {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--brd);
  border-radius: 12px;
  background: var(--card);
  color: var(--txt);
  font-size: .95rem;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: .2s;
}
.cust-select.open .cust-select-trigger {
  border-color: var(--acc);
  box-shadow: 0 0 0 4px rgba(0,113,227,.12);
}
.cust-arrow {
  color: var(--txt3);
  transition: .2s;
}
.cust-select.open .cust-arrow {
  transform: rotate(180deg);
}
.cust-select-list {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--card);
  border: 1px solid var(--brd);
  border-radius: 12px;
  box-shadow: 0 16px 48px rgba(0,0,0,.12);
  margin-top: 6px;
  max-height: 300px;
  overflow-y: auto;
  z-index: 50;
}
.cust-select.open .cust-select-list {
  display: block;
}
.cust-option {
  padding: 12px 14px;
  cursor: pointer;
  font-size: .9rem;
  color: var(--txt);
}
.cust-option:hover {
  background: var(--acc-soft);
  color: var(--acc);
}
#app {
  display: none;
}
#hd {
  background: rgba(255,255,255,.8);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  color: var(--txt);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--brd);
}
#hd .hl {
  display: flex;
  align-items: center;
  gap: 12px;
}
#hd .app-mark {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--acc);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  overflow: hidden;
}
#hd h2 {
  font-size: .98rem;
  font-weight: 600;
  letter-spacing: -.01em;
  color: var(--txt);
}
#hd .hr {
  display: flex;
  align-items: center;
  gap: 8px;
}
.icon-btn {
  background: var(--card);
  border: 1px solid var(--brd);
  border-radius: 9px;
  padding: 7px 12px;
  font-size: .8rem;
  color: var(--txt2);
  cursor: pointer;
  transition: .15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.icon-btn:hover {
  color: var(--acc);
  background: var(--acc-soft);
}
.badge {
  background: var(--acc-soft);
  color: var(--acc);
  padding: 4px 12px;
  border-radius: 980px;
  font-size: .72rem;
  font-weight: 600;
}
.badge.mg {
  background: var(--acc);
  color: #fff;
}
#main {
  display: flex;
  min-height: calc(100vh - 56px);
}
.sidebar {
  width: 248px;
  background: var(--sb);
  color: #D1D1D6;
  padding: 14px 10px;
  overflow-y: auto;
  position: sticky;
  top: 56px;
  height: calc(100vh - 56px);
  flex-shrink: 0;
  transition: width .3s ease;
  z-index: 90;
}
.sidebar.collapsed {
  width: 0;
  padding: 0;
  overflow: hidden;
  border: none;
}
.sidebar::-webkit-scrollbar {
  width: 4px;
}
.sidebar::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.14);
  border-radius: 4px;
}
.sb-group {
  margin-bottom: 2px;
}
.sb-group-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: .72rem;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: #98989D;
  transition: .15s;
  user-select: none;
}
.sb-group-head:hover {
  color: #F5F5F7;
  background: rgba(255,255,255,.05);
}
.sb-group-head .sb-ico {
  font-size: .9rem;
  width: 18px;
  text-align: center;
}
.sb-group-head .sb-arrow {
  margin-left: auto;
  font-size: .65rem;
  transition: transform .2s ease;
  opacity: .6;
}
.sb-group.open .sb-group-head .sb-arrow {
  transform: rotate(90deg);
}
.sb-group-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height .25s ease;
}
.sb-group.open .sb-group-body {
  max-height: 640px;
}
.sb-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 10px 7px 36px;
  border-radius: 8px;
  cursor: pointer;
  font-size: .84rem;
  color: #AEAEB2;
  transition: .12s;
}
.sb-item:hover {
  color: #fff;
  background: rgba(255,255,255,.06);
}
.sb-item.act {
  color: #fff;
  background: var(--sb3);
  font-weight: 500;
}
.sb-item .sb-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--acc);
  opacity: 0;
  transition: .12s;
}
.sb-item.act .sb-dot {
  opacity: 1;
}
.sb-foot {
  margin-top: auto;
  padding: 10px;
  font-size: .7rem;
  color: #636366;
  border-top: 1px solid rgba(255,255,255,.08);
}
.content {
  flex: 1;
  padding: 28px 32px;
  overflow-x: auto;
  min-width: 0;
}
.tc {
  display: none;
}
.tc.act {
  display: block;
  animation: pageIn .25s ease;
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}
.st2 {
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: -.02em;
  margin-bottom: 4px;
  color: var(--txt);
}
.st3 {
  font-size: .84rem;
  color: var(--txt2);
  margin-bottom: 24px;
}
.card {
  background: var(--card);
  border: 1px solid var(--brd);
  border-radius: var(--r);
  padding: 24px;
  box-shadow: var(--s);
  margin-bottom: 20px;
}
.card h3 {
  font-size: .98rem;
  font-weight: 600;
  margin-bottom: 16px;
  letter-spacing: -.01em;
  color: var(--txt);
}
.card h4 {
  font-size: .9rem;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--txt);
}
.dv {
  height: 1px;
  background: var(--brd);
  margin: 20px 0;
}
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.kpi {
  background: var(--card);
  border: 1px solid var(--brd);
  border-radius: var(--r);
  padding: 20px;
  box-shadow: var(--s);
  transition: .18s;
}
.kpi:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(0,0,0,.07);
}
.kpi .kpi-ico {
  font-size: 1.15rem;
  margin-bottom: 12px;
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: var(--acc-soft);
  display: flex;
  align-items: center;
  justify-content: center;
}
.kpi .kpi-label {
  font-size: .68rem;
  color: var(--txt2);
  margin-bottom: 6px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.kpi .kpi-value {
  font-size: 1.55rem;
  font-weight: 700;
  letter-spacing: -.02em;
  color: var(--txt);
  font-variant-numeric: tabular-nums;
}
.kpi .kpi-sub {
  font-size: .74rem;
  color: var(--txt3);
  margin-top: 5px;
}
.kpi .kpi-evo {
  font-size: .76rem;
  font-weight: 600;
  margin-top: 6px;
}
.kpi .kpi-evo.up {
  color: var(--ok);
}
.kpi .kpi-evo.down {
  color: var(--err);
}
.sg {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.sc {
  background: var(--card);
  border: 1px solid var(--brd);
  border-radius: var(--r);
  padding: 18px;
  box-shadow: var(--s);
}
.sc .lb {
  font-size: .68rem;
  color: var(--txt2);
  margin-bottom: 6px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.sc .vl {
  font-size: 1.45rem;
  font-weight: 700;
  letter-spacing: -.02em;
  color: var(--txt);
  font-variant-numeric: tabular-nums;
}
.sc .sb {
  font-size: .72rem;
  color: var(--txt3);
  margin-top: 3px;
}
.sc.w .vl { color: var(--warn); }
.sc.d .vl { color: var(--err); }
.sc.s .vl { color: var(--ok); }
.pw {
  margin-bottom: 12px;
}
.pw .pl {
  display: flex;
  justify-content: space-between;
  font-size: .78rem;
  margin-bottom: 5px;
}
.pw .pl span:first-child {
  color: var(--txt2);
  font-weight: 500;
}
.pw .pl span:last-child {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.pb {
  height: 6px;
  background: rgba(0,0,0,.06);
  border-radius: 980px;
  overflow: hidden;
}
.pf {
  height: 100%;
  border-radius: 980px;
  transition: width .8s ease;
  min-width: 0;
}
.pf.lo { background: var(--err); }
.pf.mi { background: var(--warn); }
.pf.hi { background: var(--ok); }
.vg {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  gap: 16px;
}
.vc {
  background: var(--card);
  border: 1px solid var(--brd);
  border-radius: var(--r);
  padding: 20px;
  box-shadow: var(--s);
}
.vc .vh {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--brd);
}
.vc .vn {
  font-weight: 600;
  font-size: .95rem;
  color: var(--txt);
}
.vlv {
  font-size: .62rem;
  padding: 3px 10px;
  border-radius: 980px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: #fff;
}
.vlv.junior { background: #AEAEB2; }
.vlv.pleno { background: var(--acc); }
.fr {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.fg label {
  display: block;
  font-size: .72rem;
  color: var(--txt2);
  margin-bottom: 5px;
  font-weight: 600;
}
.fg input, .fg select, .fg textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--brd);
  border-radius: 9px;
  font-size: .86rem;
  outline: none;
  background: var(--card);
  color: var(--txt);
  transition: .15s;
}
.fg input:focus, .fg select:focus, .fg textarea:focus {
  border-color: var(--acc);
  box-shadow: 0 0 0 3px rgba(0,113,227,.10);
}
.cnpj-wrap {
  display: flex;
  gap: 6px;
  align-items: center;
}
.cnpj-wrap input {
  flex: 1;
}
.cnpj-btn {
  white-space: nowrap;
  padding: 10px 12px;
  border: 1px solid var(--brd);
  border-radius: 9px;
  background: var(--acc-soft);
  color: var(--acc);
  font-size: .8rem;
  font-weight: 600;
  cursor: pointer;
  transition: .15s;
}
.cnpj-btn:hover {
  background: #D6E9FF;
}
.cnpj-btn:disabled {
  opacity: .5;
  cursor: wait;
}
.btn {
  padding: 10px 18px;
  border: none;
  border-radius: 9px;
  font-size: .84rem;
  font-weight: 600;
  cursor: pointer;
  transition: .15s;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  justify-content: center;
}
.btn-p { background: var(--acc); color: #fff; }
.btn-p:hover { background: var(--acc2); opacity: .92; }
.btn-a { background: var(--acc-soft); color: var(--acc); }
.btn-a:hover { background: #D6E9FF; }
.btn-d { background: #FFEBEA; color: var(--err); }
.btn-d:hover { background: #FFD9D6; }
.btn-f { width: 100%; }
.btn-s { padding: 7px 14px; font-size: .76rem; }
.tbl-wrap {
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: .83rem;
}
th {
  color: var(--txt3);
  font-weight: 600;
  font-size: .68rem;
  letter-spacing: .03em;
  text-transform: uppercase;
  padding: 9px 12px;
  text-align: left;
  border-bottom: 1px solid var(--brd);
  white-space: nowrap;
}
td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--row);
  color: var(--txt);
  vertical-align: middle;
}
tr:last-child td {
  border-bottom: none;
}
tr:hover td {
  background: rgba(0,0,0,.015);
}
.tcr {
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.tcc {
  text-align: center;
}
.action-btns {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.edit-btn {
  background: transparent;
  color: var(--acc);
  border: 1px solid rgba(0,113,227,.25);
  border-radius: 7px;
  padding: 5px 11px;
  cursor: pointer;
  font-size: .72rem;
  font-weight: 600;
  transition: .15s;
}
.edit-btn:hover {
  background: var(--acc-soft);
}
.del-btn {
  background: transparent;
  color: var(--err);
  border: 1px solid rgba(255,59,48,.25);
  border-radius: 7px;
  padding: 5px 11px;
  cursor: pointer;
  font-size: .72rem;
  font-weight: 600;
  transition: .15s;
}
.del-btn:hover {
  background: #FFEBEA;
}
.tipo-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 980px;
  font-size: .66rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .03em;
}
.tipo-badge.venda { background: var(--acc-soft); color: var(--acc); }
.tipo-badge.bonificacao { background: #FFF4E5; color: #B25E00; }
.nivel-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 980px;
  font-size: .66rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .03em;
  color: #fff;
}
.nivel-badge.ouro { background: linear-gradient(135deg, #F5B301, #D48806); }
.nivel-badge.prata { background: linear-gradient(135deg, #B0BEC5, #8A99A3); }
.nivel-badge.bronze { background: linear-gradient(135deg, #CD7F32, #A05A1C); }
.nivel-badge.sem { background: #E5E5EA; color: #6E6E73; }
.rfm-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 980px;
  font-size: .66rem;
  font-weight: 600;
  color: #fff;
}
.rfm-badge.campeao { background: linear-gradient(135deg, #F5B301, #D48806); }
.rfm-badge.leal { background: linear-gradient(135deg, #0071E3, #54B2FF); }
.rfm-badge.promissor { background: linear-gradient(135deg, #34C759, #63E6A0); }
.rfm-badge.risco { background: linear-gradient(135deg, #FF9F0A, #FFD60A); }
.rfm-badge.perdido { background: linear-gradient(135deg, #FF3B30, #FF6961); }
#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tm {
  padding: 13px 20px;
  border-radius: 12px;
  color: #fff;
  font-size: .84rem;
  box-shadow: 0 8px 32px rgba(0,0,0,.16);
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 380px;
  transition: .3s;
}
.tm.success { background: var(--ok); }
.tm.error { background: var(--err); }
.tm.info { background: #1D1D1F; }
.es {
  text-align: center;
  padding: 44px;
  color: var(--txt3);
}
.es .ic {
  font-size: 2.2rem;
  margin-bottom: 12px;
  opacity: .3;
}
.cc {
  position: relative;
  height: 280px;
  margin-top: 12px;
}
.cc2 {
  position: relative;
  height: 200px;
  margin-top: 8px;
}
.search-box {
  position: relative;
  margin-bottom: 14px;
}
.search-box input {
  width: 100%;
  padding: 11px 14px 11px 40px;
  border: 1px solid var(--brd);
  border-radius: 10px;
  font-size: .88rem;
  outline: none;
  background: var(--card);
  color: var(--txt);
  transition: .15s;
}
.search-box input:focus {
  border-color: var(--acc);
  box-shadow: 0 0 0 3px rgba(0,113,227,.10);
}

// ===== LISTENER FIREBASE =====
function initListener(k) {
  if (listeners[k]) { return; }
  listeners[k] = db.collection(k).onSnapshot(function (snap) {
    var arr = [];
    snap.forEach(function (doc) {
      var d = doc.data();
      d._id = doc.id;
      arr.push(d);
    });
    if (k === 'metas') {
      arr.forEach(function (row) {
        if (typeof row.marcasDetalhe === 'string') {
          try { row.marcasDetalhe = JSON.parse(row.marcasDetalhe); } catch (e) { row.marcasDetalhe = []; }
        }
        row.ligacoes = parseInt(row.ligacoes) || 0;
        row.prospeccao = parseInt(row.prospeccao) || 0;
        row.produtos = parseInt(row.produtos) || 0;
        row.valorVenda = parseFloat(row.valorVenda) || 0;
        row.semana = parseInt(row.semana) || 1;
        row.positivacao = parseInt(row.positivacao) || 0;
        row.clientesNovos = parseInt(row.clientesNovos) || 0;
      });
    }
    if (k === 'vendas') {
      arr.forEach(function (row) {
        if (typeof row.itens === 'string') {
          try { row.itens = JSON.parse(row.itens); } catch (e) { row.itens = []; }
        }
        row.total = parseFloat(row.total) || 0;
        row.qtdProdutos = parseInt(row.qtdProdutos) || 0;
        if (!row.tipo) { row.tipo = 'venda'; }
        if (!row.clienteCod) {
          var m = String(row.cliente || '').match(/COD\s+(\S+)/);
          row.clienteCod = m ? m[1] : '';
        }
        if (!row.estado) { row.estado = getEstadoFromVenda(row); }
        if (!row.segmento) { row.segmento = getSegmentoFromVenda(row); }
      });
    }
    if (k === 'atividades') {
      arr.forEach(function (row) {
        row.qtd = parseInt(row.qtd) || 0;
        if (!row.status) { row.status = 'aberta'; }
      });
    }
    if (k === 'clientes') {
      arr.forEach(function (row) {
        row.cod = String(row.cod || '');
        row.razao = String(row.razao || '');
        row.contato = String(row.contato || '');
        row.telefone = String(row.telefone || '');
        row.celular = String(row.celular || '');
        row.email = String(row.email || '');
        row.cnpj = String(row.cnpj || '');
        row.cidade = String(row.cidade || '');
        row.estado = String(row.estado || '');
        row.segmento = String(row.segmento || '');
        row.nivel = String(row.nivel || '').toLowerCase();
        row.vendedorId = String(row.vendedorId || '');
        if (!row.origem) { row.origem = 'importado'; }
      });
    }
    if (k === 'config') {
      arr.forEach(function (row) {
        if (row.chave === 'margem') { _margemConfig = parseFloat(row.valor) || null; }
      });
    }
    if (k === 'usuarios') {
      arr.forEach(function (u) {
        if (u.id) {
          var usu = USU.find(function (x) { return x.id === u.id; });
          if (usu) {
            usu.nome = String(u.nome || usu.nome);
            usu.nivel = String(u.nivel || usu.nivel);
            usu.permissao = String(u.permissao || usu.permissao || 'padrao');
          } else if (DELETADOS.indexOf(u.id) === -1) {
            USU.push({ id: u.id, nome: String(u.nome || u.id), nivel: String(u.nivel || 'Junior'), isM: u.id === 'gerente', permissao: String(u.permissao || 'padrao') });
          }
        }
      });
      updateLoginNomes();
      var b = document.getElementById('ub');
      if (b && currentUser) { b.textContent = getNome(currentUser.id) + ' - ' + getNivel(currentUser.id); }
    }
    cacheDados[k] = arr;
    if (_abaAtual && currentUser) { renderTab(_abaAtual); }
  }, function (err) {
    console.log('Listener error for ' + k + ':', err);
  });
}

// ===== SALVAR / EXCLUIR =====
function saveData(k, d) {
  var col = db.collection(k);
  if (Array.isArray(d)) {
    d.forEach(function (item) {
      var id = item._id || item.id || db.collection(k).doc().id;
      var docData = JSON.parse(JSON.stringify(item));
      delete docData._id;
      col.doc(id).set(docData, { merge: true }).catch(function (e) { console.log('Save error:', e); });
    });
  } else {
    var id = d._id || d.id || db.collection(k).doc().id;
    var docData = JSON.parse(JSON.stringify(d));
    delete docData._id;
    col.doc(id).set(docData, { merge: true }).catch(function (e) { console.log('Save error:', e); });
  }
}

// ===== FUNCOES AUXILIARES =====
function fmtBRL(v) {
  return parseFloat(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function getClienteByCod(cod) {
  var clientes = loadData('clientes');
  var codStr = String(cod).trim();
  return clientes.find(function (c) { return String(c.cod).trim() === codStr; });
}
function getEstadoFromVenda(v) {
  if (v.estado && v.estado !== '--') { return v.estado; }
  var m = String(v.cliente || '').match(/\/([A-Z]{2})\)/);
  if (m) { return m[1]; }
  return '--';
}
function getSegmentoFromVenda(v) {
  if (v.segmento && v.segmento !== 'Outros') { return v.segmento; }
  var m = String(v.cliente || '').match(/COD\s+(\S+)/);
  if (m) {
    var c = getClienteByCod(m[1]);
    if (c) { return c.segmento || 'Outros'; }
  }
  return 'Outros';
}
function codVenda(v) {
  return v.clienteCod || (String(v.cliente || '').match(/COD\s+(\S+)/) || [])[1] || '';
}
function getMeusClientes() {
  var clientes = loadData('clientes');
  if (!currentUser) { return []; }
  if (currentUser.isM) { return clientes; }
  return clientes.filter(function (c) { return c.vendedorId === currentUser.id; });
}
function getMinhasVendas() {
  var vendas = loadData('vendas');
  if (!currentUser) { return []; }
  if (currentUser.isM) { return vendas; }
  return vendas.filter(function (v) { return v.vendedor === currentUser.id; });
}

// ===== RODIZIO HELPERS =====
function getUltimaCompraCliente(cod) {
  var vendas = loadData('vendas');
  var vCli = vendas.filter(function (v) { return codVenda(v) === String(cod).trim(); });
  if (!vCli.length) { return null; }
  vCli.sort(function (a, b) { return b.data.localeCompare(a.data); });
  return vCli[0].data;
}
function clienteElegivelRodizio(cod) {
  var ultima = getUltimaCompraCliente(cod);
  if (!ultima) { return true; }
  var hoje = new Date();
  var dUlt = new Date(ultima);
  var diff = Math.floor((hoje.getTime() - dUlt.getTime()) / (1000 * 60 * 60 * 24));
  return diff > DIAS_RODIZIO;
}

// ===== TOAST / PROGRESSO / NOTA =====
function toast(msg, type) {
  var t = document.createElement('div');
  t.className = 'tm ' + (type || 'info');
  t.textContent = (type === 'success' ? 'OK: ' : (type === 'error' ? 'ERRO: ' : 'INFO: ')) + msg;
  var container = document.getElementById('toast');
  if (!container) { return; }
  container.appendChild(t);
  setTimeout(function () {
    t.style.opacity = '0';
    t.style.transform = 'translateX(100%)';
    setTimeout(function () { t.remove(); }, 300);
  }, 3500);
}
function progressBar(label, atual, meta, pct) {
  var cls = pct >= 80 ? 'hi' : (pct >= 50 ? 'mi' : 'lo');
  var fa = parseFloat(atual || 0);
  var fm = parseFloat(meta || 0);
  var da = fa > 100 ? 'R$ ' + fmtBRL(fa) : fa;
  var dm = fm > 100 ? 'R$ ' + fmtBRL(fm) : fm;
  return '<div class="pw"><div class="pl"><span>' + label + '</span><span>' + da + ' / ' + dm + ' (' + Math.round(pct) + '%)</span></div><div class="pb"><div class="pf ' + cls + '" style="width:' + Math.max(2, Math.min(100, pct)) + '%"></div></div></div>';
}

  var fIni = document.getElementById(prefix + '-filtro-ini');
  var fFim = document.getElementById(prefix + '-filtro-fim');
  if (fAnual) { fAnual.style.display = (p === 'anual') ? 'block' : 'none'; }
  if (fMensal) { fMensal.style.display = (p === 'mensal') ? 'block' : 'none'; }
  if (fIni) { fIni.style.display = (p === 'semanal' || p === 'periodo') ? 'block' : 'none'; }
  if (fFim) { fFim.style.display = (p === 'semanal' || p === 'periodo') ? 'block' : 'none'; }
}
function aplicarFiltroPeriodo(prefix) {
  var elP = document.getElementById(prefix + '-periodo');
  if (!elP) { return; }
  var p = elP.value;
  var ini = document.getElementById(prefix + '-ini') ? document.getElementById(prefix + '-ini').value : '';
  var fim = document.getElementById(prefix + '-fim') ? document.getElementById(prefix + '-fim').value : '';
  var mes = document.getElementById(prefix + '-mes') ? document.getElementById(prefix + '-mes').value : '';
  var ano = document.getElementById(prefix + '-ano') ? document.getElementById(prefix + '-ano').value : '';
  var fn = window['_filtro_' + prefix];
  if (typeof fn === 'function') { fn(p, ini, fim, mes, ano); }
}
function limparFiltroPeriodo(prefix) {
  var p = document.getElementById(prefix + '-periodo');
  if (p) { p.value = 'todos'; }
  var ini = document.getElementById(prefix + '-ini'); if (ini) { ini.value = ''; }
  var fim = document.getElementById(prefix + '-fim'); if (fim) { fim.value = ''; }
  var mes = document.getElementById(prefix + '-mes'); if (mes) { mes.value = ''; }
  var ano = document.getElementById(prefix + '-ano'); if (ano) { ano.value = ''; }
  onChangePeriodo(prefix);
  aplicarFiltroPeriodo(prefix);
}
function passaFiltroPeriodo(data, p, ini, fim, mes, ano) {
  if (!data) { return false; }
  if (p === 'anual' && ano) {
    var d = new Date(data);
    if (d.getFullYear() !== parseInt(ano)) { return false; }
  }
  if (p === 'mensal' && mes) {
    var d2 = new Date(data);
    var ym = d2.getFullYear() + '-' + String(d2.getMonth() + 1).padStart(2, '0');
    if (ym !== mes) { return false; }
  }
  if ((p === 'semanal' || p === 'periodo') && ini && data < ini) { return false; }
  if ((p === 'semanal' || p === 'periodo') && fim && data > fim) { return false; }
  return true;
}

// ===== MASCARAS =====
function maskTelefone(el) {
  var v = el.value.replace(/\D/g, '').slice(0, 11);
  var r = '';
  if (v.length > 0) { r = '(' + v.slice(0, 2); }
  if (v.length >= 3) { r += ') ' + v.slice(2, 7); }
  if (v.length >= 8) { r += '-' + v.slice(7, 11); } else if (v.length > 7) { r += v.slice(7); }
  el.value = r;
}
function maskCNPJ(el) {
  var v = el.value.replace(/\D/g, '').slice(0, 14);
  var r = v;
  if (v.length > 2) { r = v.slice(0, 2) + '.' + v.slice(2); }
  if (v.length > 5) { r = v.slice(0, 2) + '.' + v.slice(2, 5) + '.' + v.slice(5); }
  if (v.length > 8) { r = v.slice(0, 2) + '.' + v.slice(2, 5) + '.' + v.slice(5, 8) + '/' + v.slice(8); }
  if (v.length > 12) { r = v.slice(0, 2) + '.' + v.slice(2, 5) + '.' + v.slice(5, 8) + '/' + v.slice(8, 12) + '-' + v.slice(12, 14); }
  el.value = r;
}

// ===== BUSCA DE CNPJ VIA BRASILAPI (preenche Razao, Cidade, UF e DDD) =====
function preencherDDDTelefone(campo, d) {
  var el = document.getElementById(campo);
  if (!el) { return; }
  var ddd = String(d.ddd_telefone_1 || d.ddd_telefone_2 || d.ddd_fax || '').replace(/\D/g, '').slice(0, 2);
  if (!ddd) { return; }
  var atual = (el.value || '').trim();
  if (!atual.replace(/\D/g, '') || atual.indexOf('(') !== 0) {
    el.value = '(' + ddd + ') ';
  }
}
function buscarCNPJ(campoId) {
  var el = document.getElementById(campoId);
  if (!el) { return; }
  var cnpj = el.value.replace(/\D/g, '');
  if (cnpj.length !== 14) { toast('Digite o CNPJ completo (14 digitos)', 'error'); return; }
  var btn = document.getElementById('cnpj-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Buscando...'; }
  fetch('https://brasilapi.com.br/api/cnpj/v1/' + cnpj)
    .then(function (res) {
      if (!res.ok) { throw new Error('CNPJ nao encontrado na Receita'); }
      return res.json();
    })
    .then(function (d) {
      var razao = document.getElementById('cl-razao');
      var cidade = document.getElementById('cl-cidade');
      var estado = document.getElementById('cl-estado');
      if (razao) { razao.value = d.razao_social || ''; }
      if (cidade) { cidade.value = d.municipio || ''; }
      if (estado) { estado.value = d.uf || ''; }
      preencherDDDTelefone('cl-celular', d);
      toast('Empresa encontrada: ' + (d.nome_fantasia || d.razao_social), 'success');
    })
    .catch(function (e) { toast('Erro ao buscar CNPJ: ' + e.message, 'error'); })
    .finally(function () {
      if (btn) { btn.disabled = false; btn.textContent = 'Buscar CNPJ'; }
    });
}
function buscarCNPJEdit() {

// ===== EXPORTACOES (PDF bonito) =====
function exportCSV(data, filename) {
  if (!data || !data.length) { return; }
  var headers = Object.keys(data[0]).filter(function (h) { return h !== '_id'; });
  var csv = headers.join(';') + '\n';
  data.forEach(function (row) {
    var vals = headers.map(function (h) {
      var v = row[h];
      if (typeof v === 'object') { v = JSON.stringify(v); }
      if (v === null || v === undefined) { v = ''; }
      return String(v).replace(/;/g, ',');
    });
    csv += vals.join(';') + '\n';
  });
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename || 'export.csv';
  a.click();
}
function exportXLSX(data, filename) {
  if (!data || !data.length) { return; }
  var ws = XLSX.utils.json_to_sheet(data);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Dados');
  XLSX.writeFile(wb, filename || 'export.xlsx');
}
function exportPDF(titulo, htmlContent) {
  var w = window.open('', '', 'width=900,height=700');
  if (!w) { return; }
  w.document.write('<html><head><title>' + titulo + '</title><style>' +
    'body{font-family:-apple-system,"Segoe UI",sans-serif;padding:48px;color:#1D1D1F;line-height:1.5}' +
    '.pdf-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #0071E3;padding-bottom:14px;margin-bottom:24px}' +
    '.pdf-head h1{font-size:22px;font-weight:700;letter-spacing:-.02em;color:#1D1D1F;margin:0}' +

}
function setPrefExcluirSemPerguntar(v) {
  localStorage.setItem('mc_confirm_delete', v ? '1' : '0');
}
function confirmarExclusao(mensagem, callback) {
  if (getPrefExcluirSemPerguntar()) { callback(); return; }
  var old = document.getElementById('confirm-modal');
  if (old) { old.remove(); }
  var div = document.createElement('div');
  div.id = 'confirm-modal';
  div.className = 'modal-bg open';
  div.onclick = function (ev) { if (ev.target === div) { div.remove(); } };
  div.innerHTML =
    '<div class="modal w-sm">' +
    '<h3 style="margin-bottom:6px">Confirmar Exclusao</h3>' +
    '<div class="m-sub">' + mensagem + '</div>' +
    '<label style="display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--txt2);margin-bottom:14px;cursor:pointer;user-select:none">' +
    '<input type="checkbox" id="cf-nunca" class="chk"' + (getPrefExcluirSemPerguntar() ? ' checked' : '') + '> ' +
    'Nao perguntar novamente para exclusoes' +
    '</label>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end">' +
    '<button class="btn btn-a btn-s" onclick="document.getElementById(\'confirm-modal\').remove()">Cancelar</button>' +
    '<button class="btn btn-d btn-s" id="cf-sim">Sim, excluir</button>' +
    '</div>' +
    '</div>';
  document.body.appendChild(div);
  document.getElementById('cf-sim').onclick = function () {
    var c = document.getElementById('cf-nunca');
    if (c && c.checked) { setPrefExcluirSemPerguntar(true); }
    div.remove();
    callback();
  };

function getMetaSemanalAtual() {
  var metas = loadData('metas');
  if (!metas || !metas.length || !currentUser) { return null; }
  var vM = metas.filter(function (m) { return m.vendedor === currentUser.id; });
  if (!vM.length) { return null; }
  var hoje = new Date();
  var dia = hoje.getDate();
  var semana = Math.ceil(dia / 7);
  var mSem = vM.filter(function (m) { return parseInt(m.semana) === semana; });
  if (mSem.length) { return mSem[mSem.length - 1]; }
  var mAno = vM.filter(function (m) { return m.ano == String(hoje.getFullYear()); });
  if (mAno.length) { return mAno[mAno.length - 1]; }
  return vM[vM.length - 1];
}
function renderWeeklyBar() {
  if (!currentUser || currentUser.isM) { return ''; }
  var m = getMetaSemanalAtual();
  if (!m) { return ''; }
  var vendas = loadData('vendas');
  var vV = vendas.filter(function (v) { return v.vendedor === currentUser.id && (v.tipo || 'venda') === 'venda'; });
  var vPr = vV.reduce(function (s, v) { return s + (parseInt(v.qtdProdutos) || 0); }, 0);
  var metaProd = parseInt(m.produtos) || 0;
  var pct = metaProd > 0 ? Math.min(100, (vPr / metaProd) * 100) : 0;
  return '<div class="weekly-bar"><div class="wb-info"><div class="wb-label">Produtos Vendidos</div><div class="wb-value">' + vPr + '</div></div><div class="wb-progress"><div class="wb-progress-fill" style="width:' + Math.max(2, pct) + '%"></div></div><div class="wb-info" style="text-align:right"><div class="wb-label">Meta Semanal</div><div class="wb-value">' + metaProd + '</div></div><div class="wb-pct">' + Math.round(pct) + '%</div></div>';

function renderProdutosDiscriminados() {
  if (!currentUser || currentUser.isM) { return ''; }
  var m = getMetaSemanalAtual();
  if (!m) { return ''; }
  var vendas = loadData('vendas');

      });

  });
  var metaProd = parseInt(m.produtos) || 0;
  var totalVendido = Object.keys(prodCount).reduce(function (s, k) { return s + prodCount[k]; }, 0);
  var pct = metaProd > 0 ? Math.min(100, (totalVendido / metaProd) * 100) : 0;
  var html = '<div class="card"><h3>Produtos Discriminados</h3><div class="tbl-wrap"><table><thead><tr><th>Produto</th><th class="tcc">Qtd Vendida</th><th class="tcc">% da Meta</th></tr></thead><tbody>';
  Object.keys(prodCount).sort(function (a, b) { return prodCount[b] - prodCount[a]; }).forEach(function (p) {

// ===== GRAFICOS / KPI / EVOLUCAO =====
function truncarNome(nome, max) {
  if (!nome) { return '--'; }
  nome = String(nome);
  max = max || 18;
  return nome.length > max ? nome.slice(0, max) + '...' : nome;
}
function agruparPorMes(vendas) {
  var porMes = {};
  vendas.forEach(function (v) {
    var ym = String(v.data || '').slice(0, 7);
    if (!ym) { return; }
    if (!porMes[ym]) { porMes[ym] = 0; }
    porMes[ym] += parseFloat(v.total) || 0;
  });
  var labels = Object.keys(porMes).sort();
  return { labels: labels, data: labels.map(function (k) { return porMes[k]; }) };
}
function desenharEvolucao(canvasId, vendas) {
  var ctx = document.getElementById(canvasId);
  if (!ctx) { return; }
  if (charts[canvasId]) { charts[canvasId].destroy(); }
  var g = agruparPorMes(vendas);
  charts[canvasId] = new Chart(ctx, {
    type: 'line',
    data: { labels: g.labels, datasets: [{ label: 'Faturamento', data: g.data, borderColor: '#0071E3', backgroundColor: 'rgba(0,113,227,.08)', fill: true, tension: .35, pointRadius: 3, borderWidth: 2 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,.05)' } }, x: { grid: { display: false } } } }
  });
}
function kpiCard(label, ico, valor, sub) {
  return '<div class="kpi"><div class="kpi-ico">' + ico + '</div><div class="kpi-label">' + label + '</div><div class="kpi-value">' + valor + '</div><div class="kpi-sub">' + sub + '</div></div>';
}
function diffEvoHTML(ult, ant) {
  if (ult === null || ult === undefined || ant === null || ant === undefined) { return '<span style="color:var(--txt3)">—</span>'; }
  if (ant > 0) {
    var d = ((ult - ant) / ant) * 100;
    var cls = d >= 0 ? 'up' : 'down';
    var seta = d >= 0 ? '▲' : '▼';
    return '<span class="kpi-evo ' + cls + '">' + seta + ' ' + Math.abs(d).toFixed(1) + '%</span>';
  }
  return ult > 0 ? '<span class="kpi-evo up">▲ novo</span>' : '<span style="color:var(--txt3)">—</span>';
}

function addMetaMarca() {
  var div = document.createElement('div');
  div.className = 'mp-row';
  div.innerHTML = '<select class="mp-prod" onchange="somaProdMeta()">' +
    MARCAS.map(function (m) { return '<option value="' + m.nome + '">' + m.nome + '</option>'; }).join('') +
    '</select><input type="number" class="mp-qtd" placeholder="Qtd" oninput="somaProdMeta()" min="1" value="1">' +
    '<button class="rb" onclick="this.parentElement.remove();somaProdMeta()">x</button>';
  document.getElementById('m-prods-list').appendChild(div);
  somaProdMeta();
}
function addMetaMarcaPre(nome, qtd) {
  var div = document.createElement('div');
  div.className = 'mp-row';
  div.innerHTML = '<select class="mp-prod" onchange="somaProdMeta()">' +
    MARCAS.map(function (m) { return '<option value="' + m.nome + '"' + (m.nome === nome ? ' selected' : '') + '>' + m.nome + '</option>'; }).join('') +
    '</select><input type="number" class="mp-qtd" placeholder="Qtd" oninput="somaProdMeta()" min="1" value="' + qtd + '">' +
    '<button class="rb" onclick="this.parentElement.remove();somaProdMeta()">x</button>';
  document.getElementById('m-prods-list').appendChild(div);
}
function somaProdMeta() {
  var soma = 0;
  document.querySelectorAll('.mp-row').forEach(function (row) {
    soma += parseInt(row.querySelector('.mp-qtd').value) || 0;
  });
  var t = document.getElementById('m-prod-total');
  if (t) { t.textContent = document.getElementById('m-prod').value; }
  var s = document.getElementById('m-prod-soma');
  if (s) { s.textContent = soma; }
}
function saveMeta() {
  var m = {
    vendedor: document.getElementById('m-vend').value,
    ano: document.getElementById('m-ano').value,
    mes: document.getElementById('m-mes').value,
    semana: document.getElementById('m-sem').value,
    ligacoes: parseInt(document.getElementById('m-lig').value) || 0,
    prospeccao: parseInt(document.getElementById('m-pros').value) || 0,
    produtos: parseInt(document.getElementById('m-prod').value) || 0,
    valorVenda: parseFloat(document.getElementById('m-val').value) || 0,
    positivacao: parseInt(document.getElementById('m-pos').value) || 0,
    clientesNovos: parseInt(document.getElementById('m-cn').value) || 0,
    marcasDetalhe: []
  };
  document.querySelectorAll('.mp-row').forEach(function (row) {
    var n = row.querySelector('.mp-prod').value;
    var q = parseInt(row.querySelector('.mp-qtd').value) || 0;
    if (n && q) { m.marcasDetalhe.push({ nome: n, qtd: q }); }
  });
  var metas = loadData('metas');
  if (editingMetaIdx >= 0 && metas[editingMetaIdx]) {
    m._id = metas[editingMetaIdx]._id;
    saveData('metas', m);
    toast('Meta atualizada!', 'success');
  } else {
    saveData('metas', m);
    toast('Meta salva para ' + getNome(m.vendedor), 'success');
  }
  editingMetaIdx = -1;
  renderTab('metas');
}
function editMeta(i) { editingMetaIdx = i; renderTab('metas'); }
function cancelEditMeta() { editingMetaIdx = -1; renderTab('metas'); }
function delMeta(i) {
  confirmarExclusao('Tem certeza que deseja excluir esta meta?', function () {
    var metas = loadData('metas'), m = metas[i];
    if (m && m._id) { deleteDoc('metas', m._id); toast('Meta excluida', 'success'); renderTab('metas'); }
  });
}

    '<p style="font-size:.8rem;color:var(--txt2);margin-bottom:12px">Define o percentual de margem da empresa para calcular lucro/prejuizo por cliente e semaforo de rentabilidade.</p>' +
    '<div class="fr"><div class="fg"><label>Margem (%)</label>' +
    '<input type="number" id="margem-input" value="' + (margemAtual !== null ? margemAtual : '') + '" placeholder="Ex: 30" min="0" max="100" onkeydown="if(event.key===\'Enter\')salvarMargem()"></div>' +
    '<div class="fg" style="display:flex;align-items:flex-end"><button class="btn btn-p btn-s" onclick="salvarMargem()">OK</button></div></div></div>' +
    '<div class="card"><h3>Adicionar Novo Perfil</h3><div class="fr">' +
    '<div class="fg"><label>Nome</label><input type="text" id="nv-nome" placeholder="Nome do perfil"></div>' +
    '<div class="fg"><label>Nivel</label><select id="nv-nivel"><option value="Junior">Junior</option><option value="Pleno">Pleno</option></select></div>' +
    '<div class="fg"><label>Permissao</label><select id="nv-perm"><option value="padrao">Padrao (Vendedor)</option><option value="admin">Administrador (Gestor)</option></select></div>' +
    '<div class="fg" style="display:flex;align-items:flex-end"><button class="btn btn-p btn-s" onclick="addVendedor()">+ Adicionar</button></div>' +
    '</div></div>' +
    '<div class="card"><h3>Perfis Criados</h3><div class="tbl-wrap"><table><thead><tr>' +
    '<th>Nome</th><th>Permissao</th><th>Renomear</th><th>Senha</th><th>Acoes</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';

function salvarMargem() {
  var v = document.getElementById('margem-input').value;
  salvarMargemConfig(v);
  toast(v ? 'Margem de lucro salva: ' + v + '%' : 'Margem removida', 'success');
  renderTab('perfis');
}
function addVendedor() {
  if (!currentUser || !currentUser.isM) { toast('Somente a gerente pode criar perfis', 'error'); return; }
  var nome = document.getElementById('nv-nome').value.trim();
  if (!nome) { toast('Digite o nome do perfil', 'error'); return; }
  var novoId = 'v' + Date.now().toString().slice(-5);
  DELETADOS = DELETADOS.filter(function (x) { return x !== novoId; });
  salvarDeletados();
  var novo = { id: novoId, nome: nome, nivel: document.getElementById('nv-nivel').value, isM: false, permissao: document.getElementById('nv-perm').value };
  USU.push(novo);
  db.collection('usuarios').doc(novoId).set({ id: novoId, nome: nome, nivel: novo.nivel, senha: senhaPadrao(), permissao: novo.permissao })
    .then(function () {
      updateLoginNomes();
      toast('Perfil criado: ' + nome, 'success');
      renderTab('perfis');
    })
    .catch(function (e) { toast('Erro: ' + e.message, 'error'); });
}
function saveSenha(id) {
  var val = document.getElementById('sn-' + id).value;
  if (!val) { toast('Digite uma senha', 'error'); return; }
  db.collection('usuarios').doc(id).set({ senha: val }, { merge: true })
    .then(function () { toast('Senha salva: ' + getNome(id), 'success'); })
    .catch(function (e) { toast('Erro: ' + e.message, 'error'); });
}
function saveNome(id) {
  var val = document.getElementById('nm-' + id).value;
  if (!val) { toast('Digite um nome', 'error'); return; }
  db.collection('usuarios').doc(id).set({ nome: val }, { merge: true })
    .then(function () {
      var u = USU.find(function (x) { return x.id === id; });
      if (u) { u.nome = val; }
      updateLoginNomes();
      toast('Nome salvo: ' + val, 'success');
      renderTab('perfis');
    })
    .catch(function (e) { toast('Erro: ' + e.message, 'error'); });
}
function togglePermissao(id) {
  if (!currentUser || !currentUser.isM) { toast('Somente a gerente pode alterar permissoes', 'error'); return; }
  var novo = getPermissao(id) === 'admin' ? 'padrao' : 'admin';
  db.collection('usuarios').doc(id).set({ permissao: novo }, { merge: true })
    .then(function () {
      var u = USU.find(function (x) { return x.id === id; });
      if (u) { u.permissao = novo; }
      toast('Permissao alterada: ' + getNome(id), 'success');
      renderTab('perfis');
    })
    .catch(function (e) { toast('Erro: ' + e.message, 'error'); });
}
function delVendedor(id) {
  if (!currentUser || !currentUser.isM) { toast('Somente a gerente pode excluir perfis', 'error'); return; }
  var v = USU.find(function (x) { return x.id === id; });
  if (!v) { toast('Perfil nao encontrado', 'error'); return; }
  confirmarExclusao('Tem certeza que deseja excluir o perfil ' + getNome(id) + '? Os clientes da carteira serao transferidos.', function () {
    var restantes = getVendedores().filter(function (x) { return x.id !== id; });
    var destino = restantes.length ? restantes[0].id : currentUser.id;
    loadData('clientes').forEach(function (c) {
      if (c.vendedorId === id) { c.vendedorId = destino; saveData('clientes', c); }
    });
    USU = USU.filter(function (x) { return x.id !== id; });
    if (DELETADOS.indexOf(id) === -1) { DELETADOS.push(id); }
    salvarDeletados();
    db.collection('usuarios').doc(id).delete().catch(function () { });
    updateLoginNomes();
    toast('Perfil excluido: ' + getNome(id) + ' (clientes para ' + getNome(destino) + ')', 'success');
    renderTab('perfis');
  });
}

function filtrarClientes(isGerente) {
  var base = isGerente ? loadData('clientes') : getMeusClientes();

  var nvF = document.getElementById('cl-filtro-nivel').value;
  var filtrados = base.filter(function (c) {
    if (nvF) {
      var cn = c.nivel || 'sem';
      if (nvF === 'sem') { if (cn !== 'sem') { return false; } }
      else if (cn !== nvF) { return false; }
    }
    if (termo) {
      return (c.razao || '').toLowerCase().indexOf(termo) >= 0 ||
        (c.cod || '').indexOf(termo) >= 0 ||
        (c.celular || '').indexOf(termo) >= 0 ||
        (c.cnpj || '').indexOf(termo) >= 0;

    return true;

function handleImportFile(event) {
  var file = event.target.files[0];
  if (!file) { return; }
  var reader = new FileReader();
  reader.onload = function (e) {
    try {
      var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
      if (!rows.length) { toast('Planilha vazia', 'error'); return; }
      var novos = 0, atual = 0, ign = 0;
      rows.forEach(function (row) {
        var cod = String(row['Código'] || row['Codigo'] || row['COD'] || row['codigo'] || '').trim();
        var razao = String(row['Razão Social'] || row['Razao Social'] || row['razao'] || '').trim();
        if (!cod || !razao) { ign++; return; }
        var nivelRaw = String(row['Nivel'] || row['Nível'] || row['nivel'] || '').toLowerCase().trim();
        var cli = {
          cod: cod,
          razao: razao,
          contato: String(row['Contato'] || '').trim(),
          telefone: String(row['Telefone'] || '').trim(),
          celular: String(row['Celular'] || '').trim(),
          email: String(row['E-mail'] || row['Email'] || '').trim(),
          cnpj: String(row['CNPJ'] || row['cnpj'] || '').trim(),
          cidade: String(row['Cidade'] || '').trim(),
          estado: String(row['UF'] || row['Estado'] || '').trim(),
          segmento: String(row['Segmento'] || '').trim(),
          nivel: (nivelRaw === 'ouro' || nivelRaw === 'prata' || nivelRaw === 'bronze') ? nivelRaw : '',
          vendedorId: currentUser.isM ? (String(row['Vendedor'] || '').trim() || currentUser.id) : currentUser.id,
          origem: 'importado'
        };
        var exist = loadData('clientes').find(function (c) { return String(c.cod).trim() === cod; });
        if (exist) { cli._id = exist._id; saveData('clientes', cli); atual++; }
        else { saveData('clientes', cli); novos++; }
      });
      toast('Importacao: ' + novos + ' novos, ' + atual + ' atualizados' + (ign ? ', ' + ign + ' ignorados' : ''), 'success');
      renderTab((currentUser.isM || isAdmin(currentUser.id)) ? 'clientes' : 'meuscli');
    } catch (err) { toast('Erro: ' + err.message, 'error'); }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
}

function buscarAnalise() {
  var cod = (document.getElementById('an-cod').value || '').trim();
  var nome = (document.getElementById('an-nome').value || '').trim();
  var clientes = loadData('clientes');
  var achou = null;
  if (cod) {
    achou = clientes.find(function (c) { return String(c.cod).trim() === cod; });
  } else if (nome) {
    var n = nome.toLowerCase();

      return String(c.razao).toLowerCase().indexOf(n) >= 0 || String(c.cod).indexOf(nome) >= 0;
    });

        }).join('');

    }

  }

function montarAnalise(p, ini, fim, mes, ano) {
  var div = document.getElementById('an-resultado');
  if (!div || !_analiseCli) { return; }
  var c = _analiseCli;
  var todas = loadData('vendas').filter(function (v) { return codVenda(v) === String(c.cod).trim(); });
  var vF = todas.filter(function (v) { return passaFiltroPeriodo(v.data, p, ini, fim, mes, ano); });
  var vendasV = vF.filter(function (v) { return (v.tipo || 'venda') === 'venda'; });
  var bonifV = vF.filter(function (v) { return v.tipo === 'bonificacao'; });
  var tot = vendasV.reduce(function (s, x) { return s + (parseFloat(x.total) || 0); }, 0);
  var totB = bonifV.reduce(function (s, x) { return s + (parseFloat(x.total) || 0); }, 0);
  var ticket = vendasV.length ? tot / vendasV.length : 0;
  var caixas = vF.reduce(function (s, x) { return s + (parseInt(x.qtdProdutos) || 0); }, 0);
  var skus = {};
  vF.forEach(function (v) {
    if (v.itens) {
      v.itens.forEach(function (it) {
        var k = it.cod || it.nome;
        if (!skus[k]) { skus[k] = { nome: it.nome || it.cod, qtd: 0 }; }
        skus[k].qtd += parseInt(it.qtd) || 0;
      });
    }
  });
  var ordemDatas = todas.map(function (v) { return v.data; }).filter(Boolean).sort();
  var intervaloMedio = null;
  if (ordemDatas.length >= 2) {
    var somaInt = 0;
    for (var i = 1; i < ordemDatas.length; i++) {
      somaInt += Math.round((new Date(ordemDatas[i]).getTime() - new Date(ordemDatas[i - 1]).getTime()) / 86400000);
    }
    intervaloMedio = Math.round(somaInt / (ordemDatas.length - 1));
  }
  var ultData = ordemDatas.length ? ordemDatas[ordemDatas.length - 1] : null;
  var prev = null;
  if (ultData && intervaloMedio) {
    var dt = new Date(ultData);
    dt.setDate(dt.getDate() + intervaloMedio);
    prev = dt.toISOString().split('T')[0];
  }
  var nv = c.nivel || 'sem';
  var margem = getMargemConfig();
  var pctB = tot > 0 ? (totB / tot) * 100 : 0;
  var situacao = '—';
  if (margem !== null) {
    var resCalc = (tot * margem / 100) - totB;
    situacao = resCalc < 0 ? '<span class="tipo-badge bonificacao">Prejuizo</span>' : '<span class="tipo-badge venda">OK</span>';
  } else if (totB > 0) {
    situacao = '<span style="font-size:.74rem;color:var(--txt3)">Sem margem</span>';
  }
  var h = '<div class="client-info"><div style="display:flex;gap:20px;flex-wrap:wrap">' +
    '<div><div class="ci-label">Razao Social</div><div class="ci-value">' + c.razao + '</div></div>' +
    '<div><div class="ci-label">CNPJ</div><div class="ci-value">' + (c.cnpj || '--') + '</div></div>' +
    '<div><div class="ci-label">Codigo</div><div class="ci-value">' + c.cod + '</div></div>' +
    '<div><div class="ci-label">Cidade/UF</div><div class="ci-value">' + (c.cidade || '--') + '/' + (c.estado || '--') + '</div></div>' +
    '<div><div class="ci-label">Segmento</div><div class="ci-value">' + (c.segmento || '--') + '</div></div>' +
    '<div><div class="ci-label">Nivel</div><div class="ci-value"><span class="nivel-badge ' + nv + '">' + (nv === 'sem' ? 'Sem' : nv.charAt(0).toUpperCase() + nv.slice(1)) + '</span></div></div>' +
    '<div><div class="ci-label">Vendedor</div><div class="ci-value">' + getNome(c.vendedorId || '') + '</div></div>' +
    '</div></div>' +
    '<div class="sg">' +
    '<div class="sc"><div class="lb">Faturamento</div><div class="vl num" style="font-size:1.35rem">R$ ' + fmtBRL(tot) + '</div><div class="sb">' + vendasV.length + ' vendas no periodo</div></div>' +
    '<div class="sc w"><div class="lb">Bonificacoes</div><div class="vl num" style="font-size:1.35rem">R$ ' + fmtBRL(totB) + '</div><div class="sb">' + pctB.toFixed(1) + '% do faturamento</div></div>' +
    '<div class="sc"><div class="lb">Ticket Medio</div><div class="vl num" style="font-size:1.35rem">R$ ' + fmtBRL(ticket) + '</div></div>' +
    '<div class="sc"><div class="lb">Caixas</div><div class="vl num" style="font-size:1.35rem">' + caixas + '</div></div>' +
    '<div class="sc"><div class="lb">SKUs Diferentes</div><div class="vl num" style="font-size:1.35rem">' + Object.keys(skus).length + '</div><div class="sb">Mix no periodo</div></div>' +
    '<div class="sc"><div class="lb">Situacao</div><div style="font-size:1.05rem;font-weight:700;margin-top:6px">' + situacao + '</div></div>' +

    else { rfm.perdido++; }

  var prodCount = {};

function transferirCarteira(origemId) {

    var ticket = vendasV.length ? tot / vendasV.length : 0;

      var skus = {};

          x.itens.forEach(function (it) { skus[it.cod || it.nome] = true; });
        }
      });
      mixSkus += Object.keys(skus).length;
    });
    var mixMedio = Object.keys(cliAtend).length ? mixSkus / Object.keys(cliAtend).length : 0;
    var carteira = clientes.filter(function (c) { return c.vendedorId === v.id; });
    var atendidosCarteira = Object.keys(cliAtend).filter(function (c) {
      return carteira.some(function (cc) { return String(cc.cod).trim() === String(c).trim(); });
    }).length;
    var posit = carteira.length ? (atendidosCarteira / carteira.length) * 100 : 0;
    var riscoCli = carteira.filter(function (c) { return clienteElegivelRodizio(c.cod); });
    var riscoValor = 0;
    riscoCli.forEach(function (c) {
      vendas.forEach(function (vv) {
        if (codVenda(vv) === String(c.cod).trim() && (vv.tipo || 'venda') === 'venda') {
          riscoValor += parseFloat(vv.total) || 0;
        }
      });
    });
    var metasV = loadData('metas').filter(function (m) { return m.vendedor === v.id; });
    var m = metasV.length ? metasV[metasV.length - 1] : null;
    var metaVal = m ? (parseFloat(m.valorVenda) || 0) : 0;
    var pctMeta = metaVal > 0 ? (tot / metaVal) * 100 : 0;
    var g = agruparPorMes(vV);
    var evo = '—';
    if (g.labels.length >= 2) { evo = diffEvoHTML(g.data[g.data.length - 1], g.data[g.data.length - 2]); }
    var rank = rankIds.indexOf(v.id) + 1;
    var part = grandTot > 0 ? (tot / grandTot) * 100 : 0;
    var cardId = 'chEv' + idx;
    mini.push({ id: cardId, labels: g.labels, data: g.data });
    var metaLabel = m ? 'Meta: ' + m.mes + '/' + m.ano + ' (Sem ' + m.semana + ')' : 'Sem meta cadastrada';
    html += '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px">' +
      '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
      '<h3 style="margin:0">' + getNome(v.id) + '</h3>' +
      '<span class="vlv ' + (getNivel(v.id) === 'Pleno' ? 'pleno' : 'junior') + '">' + getNivel(v.id) + '</span>' +
      '<span class="badge">' + rank + 'º lugar</span>' +
      '<span class="badge">' + part.toFixed(1) + '% do total</span></div>' +
      '<span style="font-size:.76rem;color:var(--txt3)">' + metaLabel + '</span></div>';
    html += '<div class="sg" style="grid-template-columns:repeat(auto-fill,minmax(185px,1fr));margin-bottom:16px">' +
      '<div class="sc"><div class="lb">Faturamento</div><div class="vl num" style="font-size:1.3rem">R$ ' + fmtBRL(tot) + '</div><div class="sb">Evolucao: ' + evo + '</div></div>' +
      '<div class="sc w"><div class="lb">Bonificacoes</div><div class="vl num" style="font-size:1.3rem">R$ ' + fmtBRL(totB) + '</div><div class="sb">' + pctBonif.toFixed(1) + '% do faturamento</div></div>' +
      '<div class="sc"><div class="lb">Rentabilidade</div><div style="font-size:.95rem;font-weight:700;margin-bottom:5px">' + semaforo + '</div><div class="sb">' + semaforoMsg + '</div></div>' +
      '<div class="sc"><div class="lb">Ticket Medio</div><div class="vl num" style="font-size:1.3rem">R$ ' + fmtBRL(ticket) + '</div><div class="sb">' + vendasV.length + ' vendas</div></div>' +
      '<div class="sc"><div class="lb">Caixas</div><div class="vl num" style="font-size:1.3rem">' + caixas + '</div><div class="sb">Volume fisico</div></div>' +
      '<div class="sc"><div class="lb">Mix Medio</div><div class="vl num" style="font-size:1.3rem">' + mixMedio.toFixed(1) + '</div><div class="sb">' + Object.keys(cliAtend).length + ' clientes atendidos</div></div>' +
      '<div class="sc s"><div class="lb">Positivacao</div><div class="vl num" style="font-size:1.3rem">' + posit.toFixed(1) + '%</div><div class="sb">' + atendidosCarteira + ' de ' + carteira.length + ' da carteira</div></div>' +
      '<div class="sc ' + (riscoCli.length ? 'w' : 's') + '"><div class="lb">Clientes em Risco</div><div class="vl num" style="font-size:1.3rem">' + riscoCli.length + '</div><div class="sb">R$ ' + fmtBRL(riscoValor) + ' em risco de rodizio</div></div>' +
      '</div>';
    if (metaVal > 0) {
      html += '<h4 style="margin-bottom:10px">Meta vs Realizado</h4>' + progressBar('Meta de Vendas', tot, metaVal, pctMeta);
    }
    if (m) {
      var ativV = loadData('atividades').filter(function (a) { return a.vendedor === v.id; });
      var ligOk = ativV.filter(function (a) { return a.tipo === 'ligacao'; }).length;
      var prosOk = ativV.filter(function (a) { return a.tipo === 'prospeccao'; })
        .reduce(function (s, a) { return s + (parseInt(a.qtd) || 0); }, 0);
      var prodOk = vendasV.reduce(function (s, x) { return s + (parseInt(x.qtdProdutos) || 0); }, 0);
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0">' +
        progressBar('Ligacoes', ligOk, parseInt(m.ligacoes) || 0, (parseInt(m.ligacoes) || 0) ? Math.min(100, (ligOk / (parseInt(m.ligacoes) || 1)) * 100) : 0) +
        progressBar('Prospeccao', prosOk, parseInt(m.prospeccao) || 0, (parseInt(m.prospeccao) || 0) ? Math.min(100, (prosOk / (parseInt(m.prospeccao) || 1)) * 100) : 0) +
        progressBar('Produtos', prodOk, parseInt(m.produtos) || 0, (parseInt(m.produtos) || 0) ? Math.min(100, (prodOk / (parseInt(m.produtos) || 1)) * 100) : 0) +
        '</div>';
    }
    html += '<h4 style="margin:14px 0 8px">Evolucao Mensal do Faturamento</h4>' +
      '<div class="cc2"><canvas id="' + cardId + '"></canvas></div></div>';
    _mv2Export.push({
      Vendedor: getNome(v.id),
      Nivel: getNivel(v.id),
      Faturamento: Math.round(tot * 100) / 100,
      Bonificacoes: Math.round(totB * 100) / 100,
      PercentualBonificacao: Math.round(pctBonif * 100) / 100,
      TicketMedio: Math.round(ticket * 100) / 100,
      Caixas: caixas,
      MixMedioSKUs: Math.round(mixMedio * 100) / 100,
      ClientesAtendidos: Object.keys(cliAtend).length,
      PositivacaoPercent: Math.round(posit * 100) / 100,
      ClientesEmRisco: riscoCli.length,
      MetaVendas: metaVal,
      PercentualMeta: Math.round(pctMeta * 100) / 100,
      Ranking: rank,
      ParticipacaoPercent: Math.round(part * 100) / 100
    });
  });
  var margem2 = getMargemConfig();
  html += '<div class="card"><h3>Lucro / Prejuizo por Cliente</h3>';
  if (margem2 === null) {
    html += '<div class="metrica-dica"><strong>Atencao:</strong> margem de lucro nao configurada. Defina em <strong>Gerenciar Perfis</strong> para calcular lucro/prejuizo real.</div>';
  }
  html += '<div class="tbl-wrap"><table><thead><tr>' +
    '<th>Vendedor</th><th>Cliente</th><th>Cod</th><th class="tcr">Faturamento</th><th class="tcr">Bonificacao</th><th class="tcc">% Bonif</th>' +
    (margem2 !== null ? '<th class="tcr">Margem Disp.</th><th class="tcc">Resultado</th>' : '') +
    '</tr></thead><tbody>';
  var porCli = {};
  vF.forEach(function (x) {
    var c = codVenda(x) || 'sem-cod';
    var key = x.vendedor + '|' + c;
    if (!porCli[key]) {
      porCli[key] = {
        vendedor: x.vendedor,
        cod: c,
        nome: String(x.cliente || '').replace(/\s*\(COD.*/, ''),
        fat: 0,
        bonif: 0
      };
    }
    if ((x.tipo || 'venda') === 'venda') { porCli[key].fat += parseFloat(x.total) || 0; }
    else { porCli[key].bonif += parseFloat(x.total) || 0; }
  });
  var rows = Object.keys(porCli).map(function (k) { return porCli[k]; })
    .sort(function (a, b) { return (b.fat + b.bonif) - (a.fat + a.bonif); });
  if (!rows.length) { html += '<tr><td colspan="8" class="tcc">Nenhum lancamento no filtro.</td></tr>'; }
  rows.forEach(function (r) {
    var pctB = r.fat > 0 ? (r.bonif / r.fat) * 100 : 0;
    if (margem2 !== null) {
      var permitido = r.fat * (margem2 / 100);
      var status = (permitido - r.bonif) < 0
        ? '<span class="tipo-badge bonificacao">Prejuizo</span>'
        : '<span class="tipo-badge venda">OK</span>';
      html += '<tr><td>' + getNome(r.vendedor) + '</td><td>' + truncarNome(r.nome, 30) + '</td><td>' + r.cod + '</td>' +
        '<td class="tcr num">R$ ' + fmtBRL(r.fat) + '</td><td class="tcr num">R$ ' + fmtBRL(r.bonif) + '</td>' +
        '<td class="tcc">' + pctB.toFixed(1) + '%</td>' +
        '<td class="tcr num">R$ ' + fmtBRL(permitido) + '</td><td class="tcc">' + status + '</td></tr>';
    } else {
      html += '<tr><td>' + getNome(r.vendedor) + '</td><td>' + truncarNome(r.nome, 30) + '</td><td>' + r.cod + '</td>' +
        '<td class="tcr num">R$ ' + fmtBRL(r.fat) + '</td><td class="tcr num">R$ ' + fmtBRL(r.bonif) + '</td>' +
        '<td class="tcc">' + pctB.toFixed(1) + '%</td></tr>';
    }
  });
  html += '</tbody></table></div></div>';
  div.innerHTML = html;
  mini.forEach(function (mc) {
    var ctx = document.getElementById(mc.id);
    if (!ctx) { return; }
    if (charts[mc.id]) { charts[mc.id].destroy(); }
    charts[mc.id] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: mc.labels,
        datasets: [{
          label: 'Faturamento',
          data: mc.data,
          borderColor: '#0071E3',
          backgroundColor: 'rgba(0,113,227,.08)',
          fill: true,
          tension: .35,
          pointRadius: 3,
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,.05)' } }, x: { grid: { display: false } } }
      }
    });
  });
};

window['_filtro_vg'] = function (p, ini, fim, mes, ano) {
  var base = loadData('vendas');
  var tipo = document.getElementById('vg-tipo').value;
  var busca = (document.getElementById('vg-busca').value || '').toLowerCase().trim();
  var filtradas = base.filter(function (v) {
    if (tipo === 'venda' && (v.tipo || 'venda') !== 'venda') { return false; }
    if (tipo === 'bonificacao' && v.tipo !== 'bonificacao') { return false; }
    if (busca) {
      if (String(v.cliente || '').toLowerCase().indexOf(busca) < 0 &&
        String(codVenda(v)).indexOf(busca) < 0) { return false; }
    }
    return passaFiltroPeriodo(v.data, p, ini, fim, mes, ano);
  });
  _vgFiltradas = filtradas;
  var vendaT = filtradas.filter(function (v) { return (v.tipo || 'venda') === 'venda'; })
    .reduce(function (s, x) { return s + (parseFloat(x.total) || 0); }, 0);
  var bonifT = filtradas.filter(function (v) { return v.tipo === 'bonificacao'; })
    .reduce(function (s, x) { return s + (parseFloat(x.total) || 0); }, 0);
  var res = document.getElementById('vg-resumo');
  if (res) {
    res.innerHTML = '<div class="sg">' +
      '<div class="sc"><div class="lb">Total Vendido</div><div class="vl num">R$ ' + fmtBRL(vendaT) + '</div></div>' +
      '<div class="sc w"><div class="lb">Bonificacoes</div><div class="vl num">R$ ' + fmtBRL(bonifT) + '</div></div>' +
      '<div class="sc"><div class="lb">Total Geral</div><div class="vl num">R$ ' + fmtBRL(vendaT + bonifT) + '</div></div>' +
      '<div class="sc"><div class="lb">Registros</div><div class="vl num">' + filtradas.length + '</div></div>' +
      '</div>';
  }
  var tab = document.getElementById('vg-tabela');
  if (!tab) { return; }
  tab.innerHTML = filtradas.length
    ? '<div class="tbl-wrap"><table><thead><tr>' +
      '<th>Data</th><th>Cliente</th><th>Cod</th><th>UF</th><th>Segmento</th><th>Vendedor</th><th>Tipo</th>' +
      '<th class="tcc">Qtd</th><th class="tcr">Total</th><th>Acoes</th>' +
      '</tr></thead><tbody>' +
      filtradas.slice().sort(function (a, b) { return b.data.localeCompare(a.data); }).map(function (v) {
        var fullIdx = base.indexOf(v);

          '<td class="tcc">' + (codVenda(v) || '--') + '</td>' +

          '<td>' + getNome(v.vendedor) + '</td>' +
          '<td>' + (v.tipo === 'bonificacao' ? '<span class="tipo-badge bonificacao">Bonif</span>' : '<span class="tipo-badge venda">Venda</span>') + '</td>' +
          '<td class="tcc">' + (v.qtdProdutos || 0) + '</td>' +
          '<td class="tcr num">R$ ' + fmtBRL(v.total) + '</td>' +
          '<td><div class="action-btns">' +
          '<button class="edit-btn" onclick="verItensVenda(' + fullIdx + ')">Conferir Itens</button>' +
          '<button class="edit-btn" onclick="editVenda(' + fullIdx + ')">Editar</button>' +
          '<button class="del-btn" onclick="delVenda(' + fullIdx + ')">Excluir</button>' +
          '</div></td></tr>';
      }).join('') + '</tbody></table></div>'
    : '<div class="es"><div class="ic">💰</div><p>Nenhuma venda no filtro.</p></div>';
};

function addEditVendaItem() {
  var div = document.createElement('div');
  div.className = 'pe';
  div.innerHTML = '<select class="pe-prod">' +
    PROD.map(function (p) { return '<option value="' + p.cod + '">' + p.cod + ' - ' + p.nome + '</option>'; }).join('') +
    '</select>' +
    '<input type="number" class="pe-qtd" value="1" oninput="calcEditVendaTotal()" min="1">' +
    '<input type="text" class="pe-preco" readonly>' +
    '<button class="rb" onclick="this.parentElement.remove();calcEditVendaTotal()">x</button>';
  document.getElementById('ev-itens').appendChild(div);
  calcEditVendaTotal();
}
function calcEditVendaTotal() {
  var total = 0;
  document.querySelectorAll('#ev-itens .pe').forEach(function (row) {
    var cod = row.querySelector('.pe-prod').value;
    var qtd = parseInt(row.querySelector('.pe-qtd').value) || 0;
    var prod = PROD.find(function (p) { return p.cod === cod; });
    if (prod) {
      var preco = prod.preco * qtd;
      total += preco;
      row.querySelector('.pe-preco').value = 'R$ ' + fmtBRL(preco);
    }
  });
  var div = document.getElementById('ev-total');
  if (div) { div.textContent = 'Total: R$ ' + fmtBRL(total); }
}
function salvarEdicaoVenda() {
  if (editingVendaIdx < 0) { toast('Nenhuma venda selecionada', 'error'); return; }
  var vendas = loadData('vendas');
  var v = vendas[editingVendaIdx];
  if (!v) { toast('Venda nao encontrada', 'error'); return; }
  var data = document.getElementById('ev-data').value;
  var cod = document.getElementById('ev-cli').value;
  var cliente = getClienteByCod(cod);
  if (!data || !cliente) { toast('Data e cliente obrigatorios', 'error'); return; }
  var itens = [], total = 0, qtd = 0;
  document.querySelectorAll('#ev-itens .pe').forEach(function (row) {
    var cp = row.querySelector('.pe-prod').value;
    var qt = parseInt(row.querySelector('.pe-qtd').value) || 0;
    var prod = PROD.find(function (p) { return p.cod === cp; });
    if (prod && qt > 0) {
      itens.push({ cod: cp, nome: prod.nome, qtd: qt, preco: prod.preco });
      total += prod.preco * qt;
      qtd += qt;
    }
  });
  if (!itens.length) { toast('Adicione itens', 'error'); return; }
  var upd = {
    _id: v._id,
    data: data,
    cliente: cliente.razao + ' (COD ' + cod + ' / ' + (cliente.estado || '--') + ')',
    clienteCod: cod,
    vendedor: v.vendedor,
    itens: itens,
    qtdProdutos: qtd,
    total: total,
    estado: cliente.estado || '--',
    segmento: cliente.segmento || 'Outros',
    tipo: v.tipo || 'venda',
    editadoPor: getNome(currentUser.id),
    editadoEm: new Date().toISOString()
  };
  saveData('vendas', upd);
  editingVendaIdx = -1;
  toast('Venda atualizada por ' + getNome(currentUser.id), 'success');
  renderTab('vendas');
}
function delVenda(i) {
  confirmarExclusao('Tem certeza que deseja excluir esta venda? Esta acao nao podera ser desfeita.', function () {
    var v = loadData('vendas')[i];
    if (v && v._id) {
      deleteDoc('vendas', v._id);
      toast('Venda excluida', 'success');
      renderTab('vendas');
    }
  });
}

function toggleWeek(s, vid) {
  var w = document.getElementById('cm-week-' + s);

  w.querySelector('.com-week-icon').innerHTML = w.classList.contains('checked') ? '&#9745;' : '&#9744;';
  updateComStats(vid);
}
function updateComStats(vid) {
  var vendas = loadData('vendas').filter(function (v) { return (v.tipo || 'venda') !== 'bonificacao'; });
  var vV = vendas.filter(function (v) { return v.vendedor === vid; });
  var total = vV.reduce(function (s, v) { return s + (parseFloat(v.total) || 0); }, 0);
  var nivel = getNivel(vid);
  var faixas = COM[nivel] || COM['Junior'];
  var taxa = faixas[faixas.length - 1].taxa;
  for (var i = 0; i < faixas.length; i++) {
    if (total >= faixas[i].min && total <= faixas[i].max) { taxa = faixas[i].taxa; break; }
  }
  var sem = 0;
  for (var s = 1; s <= 4; s++) {
    var w = document.getElementById('cm-week-' + s);
    if (w && w.classList.contains('checked')) { sem++; }
  }
  var acc = sem * ACELERADOR_POR_SEMANA;
  var taxaFinal = taxa + acc;
  var com = (total * taxaFinal) / 100;
  var av = document.getElementById('cm-accel-val');
  if (av) { av.textContent = '+' + acc.toFixed(2).replace('.', ','); }
  var wv = document.getElementById('cm-weeks-val');
  if (wv) { wv.textContent = sem + '/4 semanas'; }
  var tf = document.getElementById('cm-taxa-final');
  if (tf) { tf.textContent = taxaFinal.toFixed(2) + '%'; }
  var cv = document.getElementById('cm-comissao-val');
  if (cv) { cv.textContent = 'R$ ' + fmtBRL(com); }
}
